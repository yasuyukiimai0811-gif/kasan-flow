<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>加算フローチャート判定</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A1222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="加算フロー">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F9FB;--sheet:#FFFFFF;--ink:#1D2B3F;--sub:#5A6878;--rule:#D3DAE2;--focus:#2F5D8A;--ok:#23704F;--ng:#A8323F;--chk:#9A6A12;--okbg:#E8F3EC;--ngbg:#F8EAEC;--chkbg:#FBF2E1;--band:#1D2B3F;--bandink:#F7F9FB;--yes:#23704F;--no:#5A6878;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121820;--sheet:#1A222D;--ink:#E3E9F0;--sub:#9AA8B8;--rule:#2F3B4A;--focus:#7FA9D6;--ok:#6FC79C;--ng:#EC8592;--chk:#E2B45C;--okbg:#17302A;--ngbg:#38202A;--chkbg:#352B17;--band:#0C1117;--bandink:#E3E9F0;--yes:#6FC79C;--no:#9AA8B8;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121820;--sheet:#1A222D;--ink:#E3E9F0;--sub:#9AA8B8;--rule:#2F3B4A;--focus:#7FA9D6;--ok:#6FC79C;--ng:#EC8592;--chk:#E2B45C;--okbg:#17302A;--ngbg:#38202A;--chkbg:#352B17;--band:#0C1117;--bandink:#E3E9F0;--yes:#6FC79C;--no:#9AA8B8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;line-height:1.7}
header{background:var(--band);color:var(--bandink);padding:18px 20px 16px}
header .in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:flex-end;justify-content:space-between}
h1{font-size:22px;line-height:1.3;margin:0;letter-spacing:.04em}
header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
#svcTag{font-size:13px;border:1px solid currentColor;border-radius:3px;padding:2px 8px;opacity:.9}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(min-width:900px){main{grid-template-columns:minmax(0,1fr) 320px}#side{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto}}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px}
.kicker{font-size:12.5px;color:var(--sub);margin:0 0 6px;letter-spacing:.06em}
h2{font-size:20px;line-height:1.5;margin:0 0 8px}
.hint{color:var(--sub);font-size:14px;margin:8px 0 0;line-height:1.6}
.choices{display:grid;gap:10px;margin-top:16px}
.svcbtn,.act{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;cursor:pointer}
.svcbtn:hover,.act:hover{border-color:var(--ink)}
.svcbtn b{font-size:18px}
.act b{display:block;font-size:16px;line-height:1.5}
.act small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.yn button{font:inherit;font-size:20px;font-weight:700;padding:16px 8px;border-radius:6px;cursor:pointer;border:2px solid}
.yes{background:var(--yes);border-color:var(--yes);color:var(--sheet)}
.no{background:var(--sheet);border-color:var(--no);color:var(--ink)}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
button.l{font:inherit;font-size:14px;padding:8px 14px;border-radius:4px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
button.l.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* flow trail */
.flow{list-style:none;margin:0;padding:0}
.flow li{position:relative;padding:0 0 18px 28px}
.flow li::before{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--rule)}
.flow li:last-child::before{display:none}
.flow .dot{position:absolute;left:0;top:4px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet)}
.flow .qt{font-size:13.5px;line-height:1.55}
.flow .ans{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:1px 10px;border-radius:10px}
.ans.y{background:var(--okbg);color:var(--ok)}.ans.n{background:var(--paper);color:var(--sub);border:1px solid var(--rule)}
.flow li.now .dot{background:var(--ink)}
.flow li.end .dot{border-radius:3px}
.flow li.end.ok .dot{background:var(--ok);border-color:var(--ok)}.flow li.end.ng .dot{background:var(--ng);border-color:var(--ng)}.flow li.end.chk .dot{background:var(--chk);border-color:var(--chk)}
.grp{font-size:16px;margin:26px 0 4px;padding-top:16px;border-top:1px solid var(--rule)}
#side h3{font-size:14px;margin:0 0 12px;color:var(--sub);font-weight:700}
/* result */
.res{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 16px;align-items:start}
.stamp{width:68px;height:68px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:17px;transform:rotate(-10deg);text-align:center;line-height:1.1}
.res.ok .stamp,.res.safe .stamp{color:var(--ok);background:var(--okbg)}.res.gen .stamp{color:var(--ng);background:var(--ngbg)}.res.gen .stamp,.res.safe .stamp{font-size:14px}
.log .safe b{color:var(--ok);background:var(--okbg)}.log .gen b{color:var(--ng);background:var(--ngbg)}
.flow li.end.safe .dot{background:var(--ok);border-color:var(--ok)}.flow li.end.gen .dot{background:var(--ng);border-color:var(--ng)}
.res.ok .stamp{color:var(--ok);background:var(--okbg)}.res.ng .stamp{color:var(--ng);background:var(--ngbg)}.res.chk .stamp{color:var(--chk);background:var(--chkbg)}
.res h2{margin-top:6px}
.why{grid-column:1/-1;margin:10px 0 0}
.ref{grid-column:1/-1;font-size:12.5px;color:var(--sub)}
.notes{grid-column:1/-1;margin:8px 0 0;padding-left:20px;font-size:14px}
.notes li{margin-bottom:4px}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule)}
.log b{flex:none;font-size:12px;padding:0 6px;border-radius:3px}
.log .ok b{color:var(--ok);background:var(--okbg)}.log .ng b{color:var(--ng);background:var(--ngbg)}.log .chk b{color:var(--chk);background:var(--chkbg)}
.caution{margin-top:20px;border:1px solid var(--rule);border-radius:6px;background:var(--chkbg)}
.caution summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:14px;color:var(--chk)}
.caution ol{margin:0;padding:0 16px 14px 34px;font-size:13px;line-height:1.65}
.caution li{margin-bottom:6px}
.foot{font-size:12px;color:var(--sub);line-height:1.6;margin:16px 0 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:13px;z-index:9}
.free textarea{min-height:84px;font-size:15px;margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fbox{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px}
.fbox h3{font-size:14px;margin:0 0 8px;color:var(--sub)}
.cand{display:flex;flex-wrap:wrap;gap:8px}
.cands{display:grid;gap:8px}
.cand1{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border:1px solid var(--rule);border-radius:6px;padding:10px 14px;background:var(--paper)}
.cand1 p{margin:0;flex:1 1 220px;font-size:15px;line-height:1.5}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-decoration:underline dotted var(--focus);text-decoration-thickness:2px;text-underline-offset:4px}
.term:hover{color:var(--focus)}
.tip{font-size:12.5px;margin-top:6px}
.gsearch{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.gl{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px}
.grow{display:flex;gap:8px}.grow input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:7px 10px}
.gcard{border:1px solid var(--rule);border-left:4px solid var(--focus);border-radius:4px;padding:10px 14px;margin-top:10px;background:var(--paper)}
.gcard .gt{margin:0;font-weight:700;font-size:15px}.gcard .gd{margin:4px 0 0;font-size:14.5px;line-height:1.75}.gcard .gr{margin:4px 0 8px;font-size:12px;color:var(--sub)}
.cmpwrap{overflow-x:auto;margin-top:8px}.cmpt{border-collapse:collapse;width:100%;min-width:480px;font-size:13.5px;line-height:1.6}
.cmpt th,.cmpt td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--rule)}
.cmpt thead th{font-weight:700;color:var(--ink);border-bottom:1px solid var(--a2)}
.cmpt tbody th{font-weight:500;color:var(--sub);width:24%}
@media(max-width:600px){.cmpt{min-width:0}.cmpt thead{display:none}.cmpt,.cmpt tbody,.cmpt tr,.cmpt th,.cmpt td{display:block;width:auto}.cmpt tr{padding:10px 0;border-bottom:1px solid var(--rule)}.cmpt th,.cmpt td{border:0;padding:3px 0}.cmpt tbody th{width:auto;font-weight:700;color:var(--ink)}.cmpt td::before{content:attr(data-h);display:block;font-size:12px;color:var(--a2);font-weight:700;margin-top:4px}}
#svcTag.hide{display:none}
.tabs{max-width:980px;margin:16px auto 0;display:flex;gap:6px;padding:4px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);backdrop-filter:blur(10px);width:max-content}
.tabs button{font:inherit;font-size:14px;font-weight:500;color:var(--sub);background:transparent;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
.tabs button[aria-selected="true"]{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 18px -8px var(--glow)}
@media(max-width:480px){.tabs{width:auto;margin:14px 0 0}.tabs button{flex:1;padding:8px 6px;font-size:13.5px}}
.wordsWrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.wh{font-size:15px;font-weight:700;margin:26px 0 6px}
.gitem{border-bottom:1px solid var(--rule);padding:8px 0}.gitem summary{cursor:pointer;font-weight:700;font-size:15px}
mark{background:var(--chkbg);color:inherit;padding:0 1px;border-radius:2px;font-weight:700}
.doc{border:1px solid var(--rule);border-radius:6px;padding:10px 14px;margin:10px 0;background:var(--paper)}
.doc .src{margin:0;font-size:12.5px;color:var(--sub)}.doc .src b{color:var(--ink);font-weight:700}
.doc .dh{margin:4px 0 0;font-size:13px;font-weight:700}
.doc .dt{margin:6px 0 0;font-size:14px;line-height:1.75}.doc.top{border:2px solid var(--a1);margin-top:4px}.kwarn{border:2px dashed #c9861a;border-radius:14px;padding:10px 14px;margin:4px 0 10px}.kwarn .kt{margin:0;font-weight:700;font-size:14.5px;color:#b8730f}.kwarn .kd{margin:6px 0 0;font-size:14px;line-height:1.7}@media (prefers-color-scheme:dark){.kwarn .kt{color:#f0b24a}}.kaisu{border:2px solid var(--a2);border-radius:14px;padding:10px 14px;margin:4px 0 10px}.kaisu .kt{margin:0;font-weight:700;font-size:15px}.kaisu .kd{margin:6px 0 0;font-size:15px;line-height:1.75}.kaisu .kr{margin:6px 0 0;font-size:12.5px;color:var(--sub)}.doc.top .dt{font-size:15px}
.tag{display:inline-block;margin-left:8px;font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-bottom:4px}
.chip{display:flex;gap:4px;align-items:center;cursor:pointer}
a.l{color:var(--ink);background:var(--sheet)}
.l.sm{font-size:12.5px;padding:4px 10px;text-decoration:none;display:inline-block}
.aians{border:1px solid var(--rule);border-left:4px solid var(--chk);border-radius:4px;padding:12px 14px;background:var(--paper)}
.aians.ok{border-left-color:var(--ok)}.aians.ng{border-left-color:var(--ng)}
.aians .vd{font-weight:700;font-size:15px}
.aians ul{margin:6px 0 0;padding-left:20px;font-size:14px}
.aians .disc{font-size:12px;color:var(--sub);margin:10px 0 0}
textarea{width:100%;min-height:140px;font:12px/1.5 inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:8px;margin-top:10px}

/* ===== 近未来デザイン（上書き） ===== */
:root{--paper:#EDF2F7;--sheet:rgba(255,255,255,.86);--ink:#0E1A2B;--sub:#56657A;--rule:rgba(14,26,43,.10);--focus:#3E63F0;--ok:#0E8A84;--ng:#C2415D;--chk:#B07614;--okbg:rgba(14,138,132,.10);--ngbg:rgba(194,65,93,.09);--chkbg:rgba(176,118,20,.10);--band:transparent;--bandink:#0E1A2B;--yes:#0E8A84;--no:#56657A;--a1:#14B8C4;--a2:#4F5DFF;--glow:rgba(79,93,255,.22);--bg2:#E3EAF4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0A1222;--sheet:rgba(255,255,255,.045);--ink:#E7EEF8;--sub:#93A3BA;--rule:rgba(150,180,255,.14);--focus:#8C9BFF;--ok:#3FD6C9;--ng:#FF7A95;--chk:#F2B84B;--okbg:rgba(63,214,201,.12);--ngbg:rgba(255,122,149,.12);--chkbg:rgba(242,184,75,.12);--bandink:#E7EEF8;--yes:#3FD6C9;--no:#93A3BA;--a1:#3FD6E0;--a2:#7C8BFF;--glow:rgba(124,139,255,.35);--bg2:#0E1830;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0A1222;--sheet:rgba(255,255,255,.045);--ink:#E7EEF8;--sub:#93A3BA;--rule:rgba(150,180,255,.14);--focus:#8C9BFF;--ok:#3FD6C9;--ng:#FF7A95;--chk:#F2B84B;--okbg:rgba(63,214,201,.12);--ngbg:rgba(255,122,149,.12);--chkbg:rgba(242,184,75,.12);--bandink:#E7EEF8;--yes:#3FD6C9;--no:#93A3BA;--a1:#3FD6E0;--a2:#7C8BFF;--glow:rgba(124,139,255,.35);--bg2:#0E1830;color-scheme:dark}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-weight:400;letter-spacing:.02em;background:radial-gradient(1200px 600px at 85% -10%,var(--bg2),transparent 70%),var(--paper);background-attachment:fixed;min-height:100%}
header{background:transparent;color:var(--ink);padding:22px 20px 6px}
header .in{align-items:center}
header h1{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700;letter-spacing:.06em}
header h1 .mark{flex:none;width:34px;height:34px}
header p{opacity:1;color:var(--sub);font-size:12.5px;margin-top:6px}
#svcTag{border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:12.5px;opacity:1;background:var(--sheet);backdrop-filter:blur(8px)}
main{padding-top:16px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.kicker{color:var(--sub);font-size:12.5px;letter-spacing:.04em}
h2{font-weight:700;letter-spacing:.03em;line-height:1.55}
.svcbtn,.act{background:transparent;border:1px solid var(--rule);border-radius:14px;transition:border-color .15s,background .15s}
.svcbtn:hover,.act:hover{border-color:var(--focus);background:var(--okbg)}
.act b{font-weight:500}
.grp{border-top:1px solid var(--rule);font-weight:500;color:var(--sub);font-size:14px}
.yn{gap:14px}
.yn button{border-radius:16px;font-weight:700;letter-spacing:.1em;border-width:1px;transition:transform .08s,box-shadow .15s}
.yn button:active{transform:scale(.98)}
.yes{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff;box-shadow:0 8px 28px -8px var(--glow)}
.no{background:transparent;border-color:var(--rule);color:var(--ink)}
.no:hover{border-color:var(--focus)}
button.l{border-radius:999px;border:1px solid var(--rule);background:transparent;padding:8px 16px}
button.l:hover,a.l:hover{border-color:var(--focus)}
button.l.pri{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;box-shadow:0 6px 20px -8px var(--glow)}
a.l{border-radius:999px;border:1px solid var(--rule);background:transparent}
#side h3{font-weight:500;letter-spacing:.04em}
.flow li::before{left:9px;width:2px;background:linear-gradient(var(--a1),var(--a2));opacity:.55}
.flow .dot{border:2px solid var(--a2);background:var(--paper);box-shadow:0 0 0 4px var(--okbg)}
.flow li.now .dot{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;box-shadow:0 0 14px var(--glow)}
.flow .ans{border-radius:999px;font-weight:500}
.ans.y{background:var(--okbg);color:var(--ok)}
.stamp{transform:none;border-width:1.5px;box-shadow:0 0 0 6px var(--paper),0 0 24px -4px currentColor;font-weight:700;letter-spacing:.04em}
.res.ok .stamp,.res.safe .stamp{background:var(--okbg)}
.doc,.cand1,.gcard,.aians{border-radius:14px;background:transparent}
.gcard{border-left:1px solid var(--rule);box-shadow:inset 3px 0 0 var(--a2)}
.term{text-decoration-color:var(--a1)}
.caution{border-radius:14px;background:var(--chkbg);border-color:transparent}
.free textarea,.grow input,textarea,input[type=search]{border-radius:12px;background:transparent;border:1px solid var(--rule)}
.free textarea:focus,.grow input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px var(--glow)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.toast{border-radius:999px;background:var(--ink);color:var(--paper)}
mark{background:linear-gradient(transparent 55%,var(--okbg) 55%)}
@media(prefers-reduced-motion:no-preference){.res .stamp{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}}

/* ===== 2026-10-26 アプリ風デザイン（上書き） ===== */
:root{--paper:#F2F4F7;--sheet:#FFFFFF;--ink:#172131;--sub:#5F6B7A;--rule:#E2E6EC;--focus:#1F5FBF;--acc:#1F5FBF;--accbg:#E9F0FB;--ok:#12805F;--ng:#C03A4E;--chk:#A2650A;--okbg:#E6F4EE;--ngbg:#FBECEE;--chkbg:#FBF1E1;--yes:#1F5FBF;--no:#5F6B7A;--a1:#1F5FBF;--a2:#1F5FBF;--glow:transparent;--bg2:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F141B;--sheet:#171E28;--ink:#E6EBF2;--sub:#97A3B3;--rule:#263142;--focus:#7FA8F0;--acc:#7FA8F0;--accbg:#1C2A40;--ok:#5CC9A0;--ng:#F08597;--chk:#E0AE55;--okbg:#15291F;--ngbg:#331C22;--chkbg:#2E2414;--yes:#7FA8F0;--no:#97A3B3;--a1:#7FA8F0;--a2:#7FA8F0;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F141B;--sheet:#171E28;--ink:#E6EBF2;--sub:#97A3B3;--rule:#263142;--focus:#7FA8F0;--acc:#7FA8F0;--accbg:#1C2A40;--ok:#5CC9A0;--ng:#F08597;--chk:#E0AE55;--okbg:#15291F;--ngbg:#331C22;--chkbg:#2E2414;--yes:#7FA8F0;--no:#97A3B3;--a1:#7FA8F0;--a2:#7FA8F0;color-scheme:dark}
body{background:var(--paper);letter-spacing:.01em}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule);padding:10px 16px 10px}

const GLOSS=[
{k:["障害児通所支援"],t:"障害児通所支援",d:"児童発達支援、放課後等デイサービス、保育所等訪問支援、居宅訪問型児童発達支援をまとめた呼び方です。障害のある児童や発達に心配のある児童に療育を提供する事業で、障害児相談支援はこれらを使う児童の計画を作ります。",ref:"横浜市HP「障害児通所支援事業について」",u:"https://www.city.yokohama.lg.jp/kosodate-kyoiku/oyakokenko/shogaihoken/shien/tuushosien.html"},
{k:["児童発達支援"],t:"児童発達支援",d:"未就学の障害児（学籍のない18歳未満の障害児を含む）に、日常生活の基本的な動作の習得や、集団生活に適応するための訓練などを、個別支援計画に基づいて行うサービスです。",ref:"横浜市HP「障害児通所支援事業について」",u:"https://www.city.yokohama.lg.jp/kosodate-kyoiku/oyakokenko/shogaihoken/shien/tuushosien.html"},
{k:["放課後等デイサービス","放デイ"],t:"放課後等デイサービス",d:"学校（幼稚園と大学を除く）に通う障害児に、授業の終了後や休業日に、生活能力の向上に必要な支援や余暇の提供などを、個別支援計画に基づいて行うサービスです。",ref:"横浜市HP「障害児通所支援事業について」",u:"https://www.city.yokohama.lg.jp/kosodate-kyoiku/oyakokenko/shogaihoken/shien/tuushosien.html"},
{k:["保育所等訪問支援"],t:"保育所等訪問支援",d:"保育所、幼稚園、小学校などを訪問し、障害児がほかの児童との集団生活に適応できるよう、専門的な支援などを行うサービスです。",ref:"横浜市HP「障害児通所支援事業について」",u:"https://www.city.yokohama.lg.jp/kosodate-kyoiku/oyakokenko/shogaihoken/shien/tuushosien.html"},
{k:["居宅訪問型児童発達支援"],t:"居宅訪問型児童発達支援",d:"重度の障害などで、通所支援を使うための外出が著しく難しい障害児の自宅を訪問して、発達支援を行うサービスです。横浜市では、相談支援専門員が作る障害児支援利用計画案が必ず必要です。",ref:"横浜市HP「障害児通所支援事業について」",u:"https://www.city.yokohama.lg.jp/kosodate-kyoiku/oyakokenko/shogaihoken/shien/tuushosien.html"},
{k:["通所受給者証","障害児通所受給者証"],t:"障害児通所受給者証",d:"障害児通所支援を使うために必要な証明書です。横浜市では、区のこども家庭支援課に申請し、面接調査で利用要件や支給量を確認したうえで発行されます。発行までおよそ2週間から1か月かかります。",ref:"横浜市HP「障害児通所支援事業について」",u:"https://www.city.yokohama.lg.jp/kosodate-kyoiku/oyakokenko/shogaihoken/shien/tuushosien.html"},
{k:["こどもサポートプラン"],t:"横浜市こどもサポートプラン",d:"障害児通所支援を申請するときに、相談支援専門員が作る障害児支援利用計画案の代わりに、保護者が作って提出できる計画です。申請書と一緒に区へ提出します。",ref:"横浜市HP「障害児通所支援事業について」",u:"https://www.city.yokohama.lg.jp/kosodate-kyoiku/oyakokenko/shogaihoken/shien/tuushosien.html"},
{k:["5領域20項目","５領域20項目"],t:"5領域20項目調査票",d:"横浜市が令和8年7月から障害児通所支援の申請時に提出を求めている、こどもの状況を確認する調査票です。主に新規申請の人が出す「状況確認シート」とあわせて導入されました。",ref:"横浜市HP「障害児通所支援事業について」",u:"https://www.city.yokohama.lg.jp/kosodate-kyoiku/oyakokenko/shogaihoken/shien/tuushosien.html"},
{k:["障害児のモニタリング期間"],t:"モニタリング期間（障害児相談支援）",d:"障害児支援利用計画を見直す間隔で、市町村が支給決定のときに決めます（横浜市では変更の手続きは区役所の窓口）。国の標準は原則6か月ごとです。施設からの退所などで集中的な支援が必要な児童や、家族の障害・病気などで事業所との連絡調整が難しい児童は毎月です。サービスの種類や量が大きく変わった場合も、利用開始から3か月間は毎月です。",ref:"児童福祉法施行規則 第1条の2の7／横浜市HP「障害児通所支援事業について」",u:"https://www.mhlw.go.jp/web/t_doc?dataId=82062000&dataType=0&pageNo=1"},
{k:["基本報酬"],t:"基本報酬",d:"計画作成の月に請求するサービス利用支援費（障害児は障害児支援利用援助費）と、モニタリングの月に請求する継続サービス利用支援費（障害児は継続障害児支援利用援助費）のこと。体制加算などは、この基本報酬に上乗せして算定します。",ref:"GL P.107〜110"},
{k:["計画作成","サービス利用支援","障害児支援利用援助"],t:"計画作成（サービス利用支援・障害児支援利用援助）",d:"サービス等利用計画（障害児は障害児支援利用計画）の案を作り、支給決定の後にサービス担当者会議を開いて計画を確定させるまでの支援です。",ref:"GL P.14"},
{k:["モニタリング","継続サービス利用支援","継続障害児支援利用援助"],t:"モニタリング（継続サービス利用支援・継続障害児支援利用援助）",d:"決められた期間ごとに、計画どおりにサービスが使えているか、生活の状況はどうかを確認し、必要に応じて計画を見直す支援です。",ref:"GL P.14"},
{k:["支給決定","通所給付決定"],t:"支給決定（障害児は通所給付決定）",d:"区役所が、障害福祉サービスなどの利用を認めて決めることです。支給決定期間は、その決定が有効な期間です。",ref:"GL P.14／児通知 第四の1"},
{k:["居宅等"],t:"居宅等",d:"利用者の自宅のほか、加算によっては障害者支援施設等や病院も含みます（居宅介護支援事業所等連携加算では「居宅、障害者支援施設等、病院」）。サービスを提供している事業所での面談は、居宅等への訪問には当たりません。",ref:"GL P.143／R8集団指導資料 スライド141"},
{k:["福祉サービス等提供機関","関係機関"],t:"福祉サービス等提供機関",d:"計画に位置付けられている（位置付けが見込まれる）機関のことで、障害福祉サービス事業者、一般相談支援事業者、病院等、訪問看護事業所、企業、自治体などが当たります。医療・保育・教育機関等連携加算の面談・会議では、障害福祉サービス等の事業者は除かれます。",ref:"GL P.138・P.147"},
{k:["計画に位置付けられて"],t:"計画に位置付けられている機関",d:"サービス等利用計画（障害児支援利用計画）の中に、支援を担う機関として書かれている機関です。新たに位置付ける予定の機関や、急な状況の変化で面談が必要になった機関も対象になります。",ref:"GL P.139（国QA R6 VOL.1 問67）"},
{k:["病院等"],t:"病院等",d:"病院などの医療機関のことです。医療・保育・教育機関等連携加算の情報提供では、訪問看護事業所と同じ区分として扱われます。",ref:"GL P.139"},
{k:["居宅介護支援事業所","ケアマネジャー","介護支援専門員"],t:"居宅介護支援事業所（ケアマネジャー）",d:"介護保険のサービス計画（ケアプラン）を作る事業所で、そこで働く介護支援専門員がケアマネジャーです。障害福祉の居宅介護事業所（いわゆるヘルパー）とは別のものです。",ref:"GL P.142〜144"},
{k:["障害者就業・生活支援センター"],t:"障害者就業・生活支援センター",d:"一般の会社などで働く障害者の、仕事と生活の両面を支える機関です。利用者が一般就労するときに、居宅介護支援事業所等連携加算の連携先になります。",ref:"GL P.142〜143"},
{k:["サービス担当者会議"],t:"サービス担当者会議",d:"利用者・家族と、サービスを提供する事業所などの担当者が集まり、計画の内容や実施状況を確認・検討する会議です。関係者へメールで報告するだけでは会議になりません。",ref:"GL P.35・P.140"},
{k:["通院に同行","通院同行"],t:"通院同行",d:"利用者の通院に付き添うことです。加算になるのは、同行先の病院等の職員に、利用者の必要な情報を提供した場合だけです。",ref:"GL P.138〜139"},
{k:["入院時情報提供書"],t:"入院時情報提供書",d:"利用者が入院するときに、医療機関へ伝える情報をまとめた書類です。他の事業所が代表して作った提供書を渡すだけでは、入院時情報連携加算は算定できません。",ref:"GL P.141"},
{k:["重度訪問介護"],t:"重度訪問介護",d:"重い障害のある人に、自宅などで長時間にわたって介護などを行う障害福祉サービスです。入院時には、この事業所と連携して医療機関と情報をやり取りすることが求められます。",ref:"GL P.141"},
{k:["退院・退所"],t:"退院・退所",d:"病院、障害者支援施設、児童福祉施設、刑事施設などを出て、地域での生活に移ることです。",ref:"GL P.137"},
{k:["特別地域"],t:"特別地域",d:"国が告示で定めた地域です。業務ガイドラインに載っている神奈川県内の対象地域に、横浜市内は含まれていません。",ref:"GL P.124"},
{k:["地域生活支援拠点等","地域生活支援拠点"],t:"地域生活支援拠点等",d:"市町村が位置付ける、緊急時の対応などを担う地域の支援体制です。相談支援事業所が拠点として加算を算定するには、運営規程への記載と届出が必要です。",ref:"GL P.83・P.148"},
{k:["拠点コーディネーター"],t:"拠点コーディネーター",d:"地域生活支援拠点等で、関係機関どうしの連携や調整の業務に従事する人です。地域生活支援拠点等機能強化加算では、常勤で1人以上の配置が必要です。",ref:"GL P.150／児通知 第四の3"},
{k:["協議会"],t:"協議会（障害者自立支援協議会）",d:"地域の関係機関が集まって、個別の支援だけでは解決できない地域の課題を話し合う場です。横浜市では区の障害者自立支援協議会などがあります。",ref:"GL P.8"},
{k:["基幹相談支援センター"],t:"基幹相談支援センター",d:"地域の相談支援の中核となる機関で、事業所への訪問や研修などを通じて相談支援の質の向上に取り組みます。横浜市では各区にあります。",ref:"GL P.56・P.150"},
{k:["相談支援専門員"],t:"相談支援専門員",d:"計画作成やモニタリングを担う職員です。なるには、実務経験（相談支援業務で通算5年、直接支援業務で通算10年など）と、相談支援従事者初任者研修の修了が必要です。修了の翌年度から5年ごとに現任研修を受けないと、資格が失効します。居宅等を訪問してのアセスメントとモニタリング、計画案の作成と説明、サービス担当者会議での意見の聴取は、相談支援専門員が自ら行わなければなりません。",ref:"GL P.78〜79"},
{k:["相談支援員"],t:"相談支援員",d:"社会福祉士または精神保健福祉士の資格を持ち、その事業所の仕事に専ら従事する職員です。事業所が機能強化型の基本報酬の算定要件を満たし、主任相談支援専門員が指導・助言する体制がある場合に置くことができます。計画の原案の作成（アセスメントを含む）とモニタリングを担えますが、計画の作成者は相談支援専門員になります。",ref:"GL P.79〜80"},
{k:["相談支援専門員と相談支援員","相談支援員と相談支援専門員","専門員と支援員"],t:"相談支援専門員と相談支援員の違い",d:"【資格】相談支援専門員は実務経験と初任者研修の修了（5年ごとに現任研修）、相談支援員は社会福祉士か精神保健福祉士の資格が必要です。【置ける事業所】相談支援員は、機能強化型の算定要件を満たし、主任相談支援専門員の指導・助言の体制がある事業所だけが置けます。【できる業務】相談支援員は計画の原案作成（アセスメントを含む）とモニタリングまで。計画の作成者は相談支援専門員です。【加算】初回加算、集中支援加算のうち会議の開催、サービス担当者会議実施加算は、相談支援員による支援だけでは算定できません。体制加算の研修修了者は相談支援専門員である必要があり、相談支援員が研修を修了しても体制加算は算定できません。サービス提供時モニタリング加算の上限は、相談支援専門員が1人月39件、相談支援員が月19件です。",ref:"GL P.78〜81・P.145"},
{k:["主任相談支援専門員"],t:"主任相談支援専門員",d:"相談支援従事者主任研修を修了した相談支援専門員です。事業所内外の相談支援専門員への指導・助言などを担います。",ref:"GL P.132〜133"},
{k:["研修修了者"],t:"研修修了者",d:"体制加算の場合、それぞれの加算で定められた研修（強度行動障害支援者養成研修など）を修了した常勤の相談支援専門員のことです。修了証明書で確認します。",ref:"GL P.125〜130"},
{k:["体制届"],t:"体制届",d:"「介護給付費等算定に係る体制等に関する届出書」のことです。加算・減算を始める、やめる、種類が変わるときに出します。毎月15日までの届出は翌月から、16日以降は翌々月からの適用です（減算は15日以降でも翌月から）。",ref:"GL P.168"},
{k:["掲示し","掲示・公表","公表して"],t:"掲示・公表",d:"体制加算などの体制があることを、事業所に掲示するとともに、公表することです。",ref:"GL P.125〜131"},
{k:["常勤換算"],t:"常勤換算",d:"職員の勤務時間を合計し、常勤の職員の勤務時間で割って、常勤何人分に当たるかを表す方法です。ピアサポート体制加算では、併設事業所との兼務時間を合計して0.5以上でも構いません。",ref:"GL P.131"},
{k:["兼務"],t:"兼務",d:"1人の職員が、複数の職務や事業所の仕事を受け持つことです。サービス提供時モニタリング加算では、兼務先の事業所の提供場面だけを確認しても算定できません。",ref:"GL P.76〜77・P.145"},
{k:["一体的に運営","一体的に"],t:"一体的に運営・一体的に実施",d:"同じ事業者が、複数の事業を一つのまとまりとして運営すること、または同じ職員が複数の支援を一度に行うことです。たとえば居宅介護支援事業所等連携加算は、一体的に運営している居宅介護支援事業所等との連携では算定できません。",ref:"GL P.110・P.143"},
{k:["地域生活支援事業"],t:"地域生活支援事業",d:"市町村が行う事業で、移動支援、日中一時支援、地域活動支援センターなどがあります。計画相談支援の対象外のため、サービス提供時モニタリング加算の確認先にもなりません。",ref:"GL P.14・P.145"},
{k:["市の単独事業","市単事業"],t:"市単事業（市の単独事業）",d:"横浜市が独自に行う事業です。サービス提供時モニタリング加算では、この提供場面を確認しても算定できません。",ref:"R8集団指導資料 スライド140"},
{k:["上限額管理"],t:"利用者負担の上限額管理",d:"複数の事業所のサービスを使う人が、負担上限月額を超えて利用者負担を払わないように、事業所間で負担額を調整することです。区役所から上限額管理事業所として決定を受けた事業所が行います。",ref:"GL P.135"},
{k:["情報公表システム","WAM NET"],t:"障害福祉サービス等情報公表システム（WAM NET）",d:"事業所の情報を報告し、一般に公表するための国の仕組みです。報告していないと情報公表未報告減算の対象になります。",ref:"GL P.123"},
{k:["業務継続計画"],t:"業務継続計画（BCP）",d:"感染症や災害が起きても、必要な支援を続けたり早く再開したりするための計画です。感染症と災害の両方について作り、研修・訓練と見直しを行います。",ref:"GL P.86〜87"},
{k:["虐待防止委員会"],t:"虐待防止委員会",d:"事業所で虐待を防ぐための取組を話し合う委員会で、年1回以上開きます。法人単位で開いたり、オンラインで開いたりすることもできます。",ref:"GL P.97〜98"},
{k:["経過的サービス利用支援費","経過的継続サービス利用支援費"],t:"経過的サービス利用支援費・経過的継続サービス利用支援費",d:"業務ガイドラインで、重複減算の取扱いが通常と異なるとされている報酬区分です。該当する場合は横浜市へ確認してください。",ref:"GL P.122"},
{k:["機能強化型"],t:"機能強化型",d:"相談支援専門員の配置など、決められた体制の要件を満たす事業所が算定できる、通常より高い区分の基本報酬（Ⅰ〜Ⅳ）です。",ref:"GL P.107〜"},
{k:["テレビ電話"],t:"テレビ電話装置等",d:"オンラインでの面談に使う機器やアプリのことです。加算によっては面接の一部をオンラインで行えますが、月1回以上は居宅等への訪問が必要なものが多くあります。",ref:"GL P.143・P.146"},
{k:["行動関連項目"],t:"行動関連項目",d:"障害支援区分の認定調査のうち、行動に関する項目です。行動障害支援体制加算の対象者は、障害支援区分3以上で、この項目の合計が10点以上の人です。",ref:"GL P.126"},
{k:["スコア表"],t:"スコア表",d:"医療的ケアの必要性を判定するための表です。要医療児者支援体制加算は、この表の医療行為を必要とする人が対象です。",ref:"GL P.126〜127"},

const DOCS=[{"s":"gl","p":1,"h":"","t":"はじめに｜本ガイドラインの目的と位置づけ本ガイドラインは、障害者の日常生活及び社会生活を総合的に支援するための法律に基づく計画相談支援について、厚生労働省が定める「障害者の日常生活及び社会生活を総合的に支援するための法律に基づく計画相談支援の事業の人員及び運営に関する基準」等を基に、横浜市が指定特定相談支援事業者（相談支援専門員）に求める「障害のある人本人を中心とした相談支援を実践するための基本ルール」を定めたものです。本市で活動する指定特定相談支援事業者（相談支援専門員）は、本ガイドラインに則した適切な事業の運営を行うことを前提とし、その向上に努めてください。■根拠資料※必ず根拠資料原本を確認してください。障害者の日常生活及び社会生活を総合的に支援するための法律（以下、「法」と記載）障害者の日常生活及び社会生活を総合的に支援するための法律施行規則（以下、「施行規則」と記載）"},{"s":"gl","p":1,"h":"","t":"障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定計画相談支援の事業の人員及び運営に関する基準（平成 24 年３月 13 日厚生労働省令第 28 号）（以下、「基準」と記載）障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定計画相談支援の事業の人員及び運営に関する基準について（平成 24 年３月 30 日障発 0330 第 22 号厚生労働省社会・援護局障害保健福祉部長通知）（以下、「解釈通知」と記載）障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定障害福祉サービスの事業等の人員、設備及び運営に関する基準について（平成 18 年 12 月６日障発第 1206001 号厚生労働省社会・援護局障害保健福祉部長通知）（以下、「障福解釈通知」と記載）障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定計画相談支援に要する費用の額の算定に関する基準(平成 24 年３月 14 日厚生労働省告示第 125 号)（以下、「報酬告示」と記載）"},{"s":"gl","p":1,"h":"","t":"障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定計画相談支援に要する費用の額の算定に関する基準の規定に基づき厚生労働大臣が定める基準（平成 27 年厚生労働省告示第 180 号）（以下、「厚生労働大臣が定める基準」と記載）障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定計画相談支援に要する費用の額の算定に関する基準等の規定に基づき、厚生労働大臣が定める一単位の単価（平成 18 年厚生労働省告示第 539 号）（以下、「単価告示」と記載）障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定障害福祉サービス等及び基準該当障害福祉サービスに要する費用の額の算定に関する基準等の制定に伴う実施上の留意事項について（平成 18 年 10月 31 日障発第 1031001 号厚生労働省社会・援護局障害保健福祉部長通知）（以下、「留意事項通知」記載）"},{"s":"gl","p":1,"h":"","t":"介護給付費等に係る支給決定事務等について（最終改正令和３年４月）（以下、「事務処理要領」と記載）相談支援に関するＱ＆Ａ（令和６年４月５日）（以下、「国 QA」と記載）平成 30 年度障害福祉サービス等報酬改定等に関する Q&A VOL1-4（平成 30 年）（以下、「国 QA(H30)」と記載）令和３年度障害福祉サービス等報酬改定等に関する Q&A VOL1-4（令和３年）（以下、「国 QA(R3)」と記載）令和６年度障害福祉サービス等報酬改定等に関する Q&A VOL1-3（令和６年）（以下、「国 QA(R6)」と記載）障害福祉サービス等及び障害児通所支援等の円滑な実施を確保するための基本的な指針（平成十八年厚生労働省告示第三百九十五号）（最終改正令和二年厚生労働省告示第二百十三号）"},{"s":"gl","p":2,"h":"","t":"※根拠資料取得厚生労働省法令等データベースサービス及び障害福祉情報サービスかながわホームページ等からダウンロードできます。■注意本ガイドラインに掲載しているのは、令和６年６月時点の情報です。本ガイドラインは、上記の根拠資料を基に作成していますが、記載を省略している内容もあります。必ず最新の基準等を自ら定期的に確認した上で、本ガイドラインを活用してください。本ガイドラインは、横浜市が指定特定相談支援事業者（相談支援専門員）に求める「障害のある人本人を中心とした相談支援を実践するための基本ルール」を定めたものです。相談支援専門員としてのスキルアップのためには、本ガイドラインの他、横浜市が作成している「横浜市相談支援従事者人材育成ビジョン」や「障害福祉サービス及び関連事業の概要」、日本相談支援専門員協会が作成している「サービス等利用計画作成サポートブック」や「サービス等利用計画評価サポートブック」、ソーシャルワークに関する専門書籍等の熟読による自己学習、さらに各区障害者自立支援協議会相談支援部会への参画、横浜市相談支援主催研修等への参加により、継続的な自己研鑽を図ることが必要です。"},{"s":"gl","p":2,"h":"","t":"各種様式やお知らせ等は、「横浜市」または「障害福祉情報サービスかながわ」のホームページから確認できます。定期的に確認してください。■参考文献障害者相談支援従事者初任者研修テキスト編集委員会（2014）『三訂障害者相談支援従事者初任者研修テキスト』中央法規社会福祉法人南高愛隣会東京事務所（2013）『障がい者地域生活支援計画サポートブック』社会福祉法人南高愛隣会副田あけみ・小嶋章吾（2012）『ソーシャルワーク記録－理論と技法』誠信書房特定非営利活動法人日本相談支援専門員協会（2012）『サービス等利用計画作成サポートブック』特定非営利活動法人日本相談支援専門員協会東美奈子・大久保薫・島村聡（2015）『障がい者ケアマネジメントの基本-差がつく相談支援専門員の仕事 33 のルール』中央法規横浜市相談支援補足｜指定特定相談支援事業者の責務※法第 51 条の 22第 51 条の 22 指定一般相談支援事業者及び指定特定相談支援事業者（以下、「指定相談支援事業者」という。）は、障害者等が自立した日常生活又は社会生活を営むことができるよう、障害者等の意思決定の支援に配慮するとともに、市町村、公共職業安定所その他の職業リハビリテーションの措置を実施する機関、教育機関その他の関係機関との緊密な連携を図りつつ、相談支援を当該障害者等の意向、適正、障害の特性その他の事情に応じ、常に障害者等の立場に立って効果的に行うように努めなければならない。"},{"s":"gl","p":2,"h":"","t":"２指定相談支援事業者は、その提供する相談支援の質の評価を行うことその他の措置を講ずることにより、相談支援の質の向上に努めなければならない。３指定特定相談支援事業者は、障害者等の人格を尊重するとともに、この法律またはこの法律に基づく命令を遵守し、障害者等のため忠実にその職務を遂行しなければならない。"},{"s":"gl","p":3,"h":"","t":"目次第１章横浜市が目指すものと相談支援専門員の役割・軸心...............................................................６"},{"s":"gl","p":3,"h":"1-3 相談支援専門員としての軸心","t":"第２章特定相談支援事業の概要...........................................................................................................11"},{"s":"gl","p":3,"h":"2-4 特定相談支援事業のメリット","t":"第３章相談支援専門員による相談支援プロセスとポイント.............................................................16"},{"s":"gl","p":4,"h":"3-18 サービス終了月（更新月）におけるモニタリングの実施","t":"第４章サービス等利用計画等の作成ポイント....................................................................................49"},{"s":"gl","p":4,"h":"4-8 モデルプラン","t":"第５章指定特定相談支援事業者の基準及び留意点............................................................................74"},{"s":"gl","p":5,"h":"5-31 報酬基準｜計画相談支援給付費の請求のタイミング","t":"第６章横浜市の指定特定相談支援事業者としてのその他の対応...................................................161"},{"s":"gl","p":6,"h":"6-6 各種届出の対応","t":"第１章横浜市が目指すものと相談支援専門員の役割・軸心【本章の目的】★相談支援専門員に求められている全体像を確認し、意識的に実践する"},{"s":"gl","p":7,"h":"1-1 横浜市が目指すもの","t":"■横浜市第４期障害者プランにおける基本目標障害のある人もない人も、誰もが人格と個性を尊重し合いながら、地域共生社会の一員として、自らの意思により自分らしく生きることができるまちヨコハマを目指す。■横浜市が目指す相談支援体制・本市では、障害のある人やその家族が地域で安心して暮らせる社会の実現を目指し、障害のある人やその家族がどこに相談しても適切に課題解決が図れる相談支援体制の構築を目指します。・指定特定相談支援事業者（相談支援専門員）は、この体制を踏まえた地域ネットワークの構築に努め、利用者本人を中心に、質の高い相談支援を提供することが求められます。横浜市相談支援体制イメージサポート福祉サービスの利用の有無に関わらず障害によって生活のしづらさや困難を抱えている方への支援の中心を担うとともに、相談支援専門員等のサポートをします。"},{"s":"gl","p":7,"h":"1-1 横浜市が目指すもの","t":"計画相談支援を使う方の支援の中心を担います。指定特定相談支援事業者一次相談支援機関基幹区福両輪生活支援日頃の関わりから悩みや困りごとを受け止め、支援機関につなげます。など身近な相談者学校医療機関近隣住民施設 GHサービス提供事業所障害のある人や家族からの相談を受けるとともに、機関の専門性を生かして、基幹、区福、生活支援 C をはじめとした支援者のサポートをします。サポート連携本人・家族・地域連携連携連携二次相談支援機関※区福：区役所福祉保健センター生活支援：精神障害者生活支援センター"},{"s":"gl","p":8,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより","t":"■相談支援専門員はソーシャルワーカー・本市における全ての相談支援従事者は、「障害者の権利に関する条約」の目的である「すべての障害者によるあらゆる人権及び基本的自由の完全かつ平等な享有を促進し、保護し、及び確保すること並びに障害者の固有の尊厳の尊重を促進」を、目の前の利用者（対象者）を通して実現するための存在です。そして、その役割を果たすために、ソーシャルワークの「価値・倫理」、「知識」、「技術」の基盤となる力に基づき、本人を中心とした支援を実践します。・相談支援専門員もソーシャルワークを担う“ソーシャルワーカー”であることを自覚し、障害福祉サービス及び地域相談支援の利用者を対象に、その人が置かれている環境や家族状況を受け止め、ケアマネジメントの手法を用い、障害のある人本人（家族）の希望と意思決定を尊重し、地域での生活を実現・継続していきます。"},{"s":"gl","p":8,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより","t":"・さらに、個別の働きかけだけでは解決できない地域課題については、区障害者自立支援協議会等での取組へとつなげ、地域全体を発展・創造し、障害のある人の安心できる生活の向上・実現を促進していきます。補足｜用語説明相談支援とは障害のある人だけではなく、その人がおかれている環境や家族状況を受け止め、ケアマネジメントの手法を用いて本人（家族）の希望と意思決定を尊重し、地域での生活を実現・継続していくための支援です。本人を中心とした支援とは支援を必要とする障害のある人（及び家族）の思いや意向、その人が望む暮らし方を最大限尊重することを基本として、障害のある人の生活に合わせたオーダーメイドの支援のことです。補足｜横浜市が求めるソーシャルワーカー像"},{"s":"gl","p":8,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより／①ソーシャルワーカーとしての「価値・倫理」、「知識」、「技術」の基盤となる力に","t":"①ソーシャルワーカーとしての「価値・倫理」、「知識」、「技術」の基盤となる力に基づく「本人を中心とした支援」を通じて、障害のある人が地域で安心して暮らせる共生社会の実現に取り組むことができる"},{"s":"gl","p":8,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより／②自己の成長だけではなく、他のソーシャルワーカーの育成、地域や組織への働きかけ","t":"②自己の成長だけではなく、他のソーシャルワーカーの育成、地域や組織への働きかけを通じて、社会全体の推進力の向上を図ることができる"},{"s":"gl","p":9,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより／②自己の成長だけではなく、他のソーシャルワーカーの育成、地域や組織への働きかけ","t":"補足｜自立支援協議会とは※法第 89 条の３本市では、障害者総合支援法において努力義務とされている協議会の設置について、自立支援協議会と称して、区、ブロック、市域の３層で実施しています。それぞれの強みを生かし、連携しながら、地域の課題解決に向けた取組等を進めています。"},{"s":"gl","p":9,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより／①区自立支援協議会：全 18 区にて実施。各区の状況に応じた部会を設置（相談支","t":"①区自立支援協議会：全 18 区にて実施。各区の状況に応じた部会を設置（相談支援部会は必置）し、地域づくりに関わる取組を実施"},{"s":"gl","p":9,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより／②ブロック連絡会：市内 4 ブロックごとに、各区自立支援協議会の事務局が集まり","t":"②ブロック連絡会：市内 4 ブロックごとに、各区自立支援協議会の事務局が集まり、情報の共有等を実施"},{"s":"gl","p":9,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより／③市自立支援協議会：健康福祉局障害施策推進課が事務局となり、市域の課題の検討等","t":"③市自立支援協議会：健康福祉局障害施策推進課が事務局となり、市域の課題の検討等を実施【参考：障害者総合支援法第 89 条の３】１地方公共団体は、単独で又は共同して、障害者等への支援の体制の整備を図るため、関係機関、関係団体並びに障害者等及びその家族並びに障害者等の福祉、医療、教育又は雇用に関連する職務に従事する者その他の関係者により構成される協議会を置くように努めなければならない。２前項の協議会は、関係機関等が相互の連絡を図ることにより、地域における障害者等への支援体制に関する課題について情報を共有し、関係機関等の連携の緊密化を図るとともに、地域の実情に応じた体制の整備について協議を行うものとする。補足｜特定相談支援事業の基本方針※基準第２条１障害のある人（家族）の意思及び人格を尊重し、常に当該利用者等の立場に立って行われるものでなければなりません。"},{"s":"gl","p":9,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより／③市自立支援協議会：健康福祉局障害施策推進課が事務局となり、市域の課題の検討等","t":"２利用者が自立した日常生活又は社会生活を営むことができるように配慮して行われるものでなければなりません。３利用者の心身の状況、その置かれている環境等に応じて、利用者等の選択に基づき、適切な保健、医療、福祉、就労支援、教育等のサービス（以下、「福祉サービス等」という。）が、多様な事業者から、総合的かつ効率的に提供されるよう配慮して行われるものでなければなりません。４利用者等に提供される福祉サービス等が特定の種類又は特定の障害福祉サービス事業を行う者に不当に偏ることのないよう、公正中立に行われるものでなければなりません。５市町村、障害福祉サービス事業を行う者、指定居宅介護支援事業者、指定介護予防支援事業者その他の関係者との連携を図り、地域において必要な社会資源の改善及び開発に努めなければなりません。６指定特定相談支援事業者は、自らその提供する計画相談支援の評価を行い、常にその改善を図らなければなりません。"},{"s":"gl","p":9,"h":"1-2 相談支援専門員の役割※横浜市相談支援従事者人材育成ビジョンより／③市自立支援協議会：健康福祉局障害施策推進課が事務局となり、市域の課題の検討等","t":"７指定特定相談支援事業者は、利用者の人権の擁護、虐待の防止等のため、必要な体制の整備を行うとともに、その従業者に対し、研修を実施する等の措置を講じなければなりません。８指定特定相談支援事業者は、指定計画相談支援の提供の終了に際しては、利用者又はその家族に対して適切な援助を行うとともに、福祉サービス等を提供する者との密接な連携に努めなければなりません。"},{"s":"gl","p":10,"h":"1-3 相談支援専門員としての軸心※横浜市相談支援従事者人材育成ビジョンより","t":"■基本姿勢自身の関わりが相談者の未来に繋がることを念頭に、相談者の人格を尊重し、思いやりをもって関わること■心構え・支援は一進一退を繰り返すこともあるが、その時々の相談者の歩幅に合わせた相談支援が求められていることを念頭に置いておくこと・自身の物事の捉え方の傾向を理解し、自身の感情に左右されるのではなく中立性・公平性を保持した相談支援を行うこと・一人で抱え込まないよう、他の相談支援従事者と意見交換等が行えるような関係性を構築しておくこと■基盤となる力ソーシャルワーカーとしての「価値・倫理」、「知識」、「技術」の 3 つの要素が基盤になります。確固たる「価値・倫理」に支えられ、幅広い範囲の「知識」を応用しながら、具体的な「技術」によって実践します。具体的な内容については、横浜市相談支援従事者人材育成ビジョン（令和 5 年7 月改訂版）にて確認してください。"},{"s":"gl","p":10,"h":"1-3 相談支援専門員としての軸心※横浜市相談支援従事者人材育成ビジョンより","t":"位置づけ具体例価値・倫理相談支援従事者だけではなく、社会福祉従事者としての基盤となるものであり、知識及び技術を駆使した支援を方向付けるものである。○本人を中心とした価値○人としての尊厳○エンパワメント○中立性、公平性の保持○プライバシーの尊重と保護知識支援力の土台となるものである。最新かつ幅広い知識を有することが求められる。○対象者の理解○法律や制度、福祉サービス等○地域情報○専門職としての知識技術実践するために必要となるものである。相談支援技術に留まらず、職業人として普遍的に求められる技術も欠かすことができない。○相談援助技術○コミュニケーション技術○情報収集、分析"},{"s":"gl","p":11,"h":"1-3 相談支援専門員としての軸心※横浜市相談支援従事者人材育成ビジョンより","t":"第２章特定相談支援事業の概要【本章の目的】★相談支援専門員が担う特定相談支援事業の大枠を確認し、利用者・家族、関係機関等に対して正しく説明できる"},{"s":"gl","p":12,"h":"2-1 特定相談支援事業とは","t":"■基本相談支援と計画相談支援で構成される特定相談支援事業は、“計画相談支援”と呼称されますが、基本相談支援と計画相談支援のいずれも行う事業です。相談支援専門員は、基本相談支援を土台とし、計画相談支援と併せながら相談支援を展開します。相談支援のプロセスにおける基本相談支援と計画相談支援のすみわけ※「基本」＝「基本相談支援」、「計画」＝「計画相談支援」相談受付個別支援会議サービス等利用計画案作成サービス担当者会議サービス等利用計画作成モニタリングの実施モニタリング報告書作成随時︑サービス利用状況や生活状況等を把握し︑支援を実施基本計画（指定サービス利用支援）基本計画（指定継続サービス利用支援）基本随時︑サービス利用状況や生活状況等を把握し︑支援を実施"},{"s":"gl","p":13,"h":"2-2 基本相談支援とは※法第５条第 17 項","t":"■基本相談支援が土台基本相談支援とは、相談支援の土台となるものです。相談支援専門員は、公的サービスである「障害福祉サービス」の利用希望者はもちろんのこと、それらを希望しない、あるいは必要としない人にも適切な相談支援を行う必要があります（個別給付の対象外）。また、計画相談支援として関わっている利用者に対しても、計画相談支援の対象とならない部分については、基本相談支援の中で対応します。補足｜法における基本相談支援※法第５条第 17 項地域の障害者等の福祉に関する各般の問題につき、障害児者等からの相談に応じ、必要な情報の提供及び助言を行い、併せてこれらの者と市町村及び障害福祉サービス事業者等との連絡調整その他の厚生労働省令で定める便宜を総合的に供与する。【参考：厚生労働省令で定める便宜とは】訪問等の方法による障害児者等に係る状況の把握、必要な情報の提供及び助言並びに相談及び指導、障害者等、障害児の保護者又は介護者と市町村、障害福祉サービス事業者等、医療機関等との連絡調整その他の障害児者等に必要な支援。"},{"s":"gl","p":13,"h":"2-2 基本相談支援とは※法第５条第 17 項／②障害のある本人、家族、その他介護を行う人等の状況を把握して","t":"②障害のある本人、家族、その他介護を行う人等の状況を把握して"},{"s":"gl","p":13,"h":"2-2 基本相談支援とは※法第５条第 17 項／⑤市町村やサービス提供事業所、医療機関等と連絡調整を行ったり","t":"⑤市町村やサービス提供事業所、医療機関等と連絡調整を行ったり"},{"s":"gl","p":13,"h":"2-2 基本相談支援とは※法第５条第 17 項／⑦総合的に相談に応じる","t":"⑦総合的に相談に応じる※障害者相談支援従事者初任者研修テキスト編集委員会（2014）『三訂障害者相談支援従事者初任者研修テキスト』中央法規より引用"},{"s":"gl","p":14,"h":"2-3 計画相談支援とは※法第５条第 20・21 項","t":"■計画相談支援の中で、指定サービス利用支援と指定継続サービス利用支援を実施障害福祉サービス及び地域相談支援を利用する場合には、計画相談支援の対象となります。この場合には、区役所で「計画相談支援」の支給決定を行い、個別給付の対象となります。計画相談支援には、サービス等利用計画を作成する「指定サービス利用支援」とモニタリングを実施する「指定継続サービス利用支援（以下、「モニタリング」と記載）」の２つで構成されます。■指定サービス利用支援・障害福祉サービスや地域相談支援の申請のため、障害のある人の心身の状況や環境、利用に関する意向、その他の事情を勘案し、利用する障害福祉サービスまたは地域相談支援の種類及びその内容等を定めた計画（サービス等利用計画案）を作成します。・障害福祉サービスの支給決定やその変更の決定、地域相談支援給付決定やその変更の決定が行われた後、関係者との連絡調整その他の便宜を供与するとともに、障害福祉サービスまたは地域相談支援の種類や内容、担当者等を記載した計画（サービス等利用計画）を作成します。"},{"s":"gl","p":14,"h":"2-3 計画相談支援とは※法第５条第 20・21 項","t":"■指定継続サービス利用支援（通称「モニタリング」）・支給決定の有効期間内において、これらのサービスが適切に利用できるよう、サービス等利用計画が適切であるかどうかを省令で定める期間ごと（モニタリング実施月）に利用状況を検証し、その結果や心身の状況、環境、利用に関する意向、その他の事情を勘案し、サービス等利用計画の見直しを行います。・サービス等利用計画の見直しの有無に関わらず、モニタリング報告書にモニタリングの結果をまとめます。必要に応じて、関係者との連絡調整その他の便宜を供与するとともに、新たな支給決定等が必要であると認められる場合には支給決定等に係る申請の勧奨を行います。補足｜計画相談支援の対象となるサービス"},{"s":"gl","p":14,"h":"2-3 計画相談支援とは※法第５条第 20・21 項／①介護給付","t":"①介護給付居宅介護(身体介護,家事援助,通院等介助,乗降介助) ,重度訪問介護,重度障害者等包括支援,同行援護,行動援護,生活介護,短期入所,施設入所支援,療養介護"},{"s":"gl","p":14,"h":"2-3 計画相談支援とは※法第５条第 20・21 項／②訓練等給付","t":"②訓練等給付自立訓練(機能訓練),自立訓練(生活訓練),就労移行支援,就労移行支援(養成施設),就労継続支援(A 型),就労継続支援(B 型),自立生活援助,就労定着支援,共同生活援助(グループホーム),宿泊型自立訓練"},{"s":"gl","p":14,"h":"2-3 計画相談支援とは※法第５条第 20・21 項／③地域相談支援","t":"③地域相談支援地域移行支援,地域定着支援【参考：地域生活支援事業】※計画相談支援の対象外移動支援(移動介護、通学通所支援),重度障害者入浴サービス,地域活動支援センターデイ型,地域活動支援センター作業所型,日中一時支援等"},{"s":"gl","p":15,"h":"2-4 特定相談支援事業のメリット","t":"■利用者にとってのメリット（一例）困ったときに誰に相談してよいのかが明確になる利用者の希望に基づく計画が作成される幅広い情報や専門的な知識等を基に、利用者のニーズに則したサービス等の提案・支給決定を受けることができるサービス等利用計画を利用者と関係者が共有することで、一体的な支援を受けることができる相談支援専門員により、利用者が表出しにくい希望や要望等を踏まえ、サービス提供事業所等と具体的な調整を行ってもらえる■支援者にとってのメリット（一例）今まで連携できていなかった関係者同士がサービス等利用計画によってつながることができるサービス等利用計画があることで、直接支援をしているサービス提供事業所同士が共通の目標に向かって支援を行うことができる障害のある方の希望する生活の実現に向けたチームができる個別の支援では解決することが難しい「地域の課題」を捉えることができるサービス等利用計画イメージ図●個別支援計画●まずはパン作りの班で、販売の体験をしてもらおう。"},{"s":"gl","p":15,"h":"2-4 特定相談支援事業のメリット","t":"●個別支援計画●簡単な物から一緒に作って、料理の楽しみを感じてもらおう。●個別支援計画●他の日に頑張るエネルギーが出るように、おしゃれや歌を楽しんでもらいたい。【余暇】おしゃれが好き！歌も好き！もっと楽しみたいな【仕事】何かを作って売ってみたいな【家事】掃除は少しできるけど、料理が苦手だな自分でいろんなことができるようになりたい。●サービス等利用計画●（生活全体を網羅した計画）【仕事】まずは毎日どこかに通って「作る」作業の体験が必要だ。【家事】自分でできるようになりたいようなので、料理はヘルパーと一緒に作ってみよう。【余暇】買い物やカラオケに出かける時間が作れたらいいな。通所先ヘルパー事業所移動支援事業所全ての支援者が共有する相談支援専門員利用者"},{"s":"gl","p":16,"h":"2-4 特定相談支援事業のメリット","t":"第３章相談支援専門員による相談支援プロセスとポイント【本章の目的】★相談支援プロセスに沿った特定相談支援事業の活動内容を確認し、適切な対応を行う"},{"s":"gl","p":17,"h":"3-1 相談支援プロセスの大枠","t":"■障害福祉サービス等を利用する前から、相談支援を開始！下記の図は、相談支援事業者とサービス事業者の動きを分けて示しています。この相談支援事業者とは、相談支援専門員を示しており、サービスの利用が始まる前から、相談支援を開始します。相談支援事業者とサービス事業者の連動イメージ図■相談支援プロセスの自覚が必須上記の図の空白になっている部分は、基本相談支援としての対応です。相談支援専門員は、指定サービス利用支援や指定継続サービス利用支援に留まらず、基本相談支援を含む“相談支援”として、そのプロセスを自覚し、各場面における役割を果たしていくことが必要です。相談支援のプロセスと上記の図を合わせると下記のようになります。相談支援プロセスに基づく計画相談支援の位置イメージ図インテーク（受理面接）アセスメント（事前評価）プランニング（目標設定・計画作成）"},{"s":"gl","p":17,"h":"3-1 相談支援プロセスの大枠","t":"モニタリング（状況確認）エバリュエーション（事後評価）ターミネーション（終結）指定サービス利用支援インターベンション（介入）指定継続サービス利用支援計画相談支援のうち、指定サービス利用支援計画相談支援のうち、指定継続サービス利用支援"},{"s":"gl","p":18,"h":"3-2 相談支援プロセスの詳細","t":"■相談支援プロセスの随所に活動ポイントがたくさん下記のフローで示している通り、相談支援プロセスの随所に活動のポイントがあります。各ステージで押さえておくべきことを次節で説明します。なお、後半のステージについては、前半のステージと重複するため、記載を省略しています。利用者相談支援専門員サービス提供事業所区役所相談・申請相談・申請受付"},{"s":"gl","p":18,"h":"3-2 相談支援プロセスの詳細／①相談受付（3‐3）","t":"①相談受付（3‐3）サービス等利用計画案の提出依頼"},{"s":"gl","p":18,"h":"3-2 相談支援プロセスの詳細／③個別支援会議の開催等によるアセスメントの実施（3-6）","t":"③個別支援会議の開催等によるアセスメントの実施（3-6）※サービス提供事業者及び区役所は状況に応じて参加障害支援区分の認定手続き内容確認・同意書類受理支給決定受給者証等の書類送付受給者証受理"},{"s":"gl","p":18,"h":"3-2 相談支援プロセスの詳細／⑥サービス等利用計画を確定させるためのサービス担当者会議の開催（3-9）","t":"⑥サービス等利用計画を確定させるためのサービス担当者会議の開催（3-9）内容確認・同意書類受理契約締結個別支援計画作成契約締結個別支援計画の内容確認・同意サービス利用開始サービス提供開始書類受理書類受理利用者からの依頼があった場合は、「計画相談支援依頼（変更）届出書」も併せて提出"},{"s":"gl","p":18,"h":"3-2 相談支援プロセスの詳細／②計画相談支援の利用契約締結及び契約内容報告書※提出","t":"②計画相談支援の利用契約締結及び契約内容報告書※提出※サービス等利用計画案の送付と同時でも可（3‐4、3-5）"},{"s":"gl","p":18,"h":"3-2 相談支援プロセスの詳細／④サービス等利用計画案","t":"④サービス等利用計画案の作成と交付・提出（3-7）"},{"s":"gl","p":18,"h":"3-2 相談支援プロセスの詳細／⑦サービス等利用計画等","t":"⑦サービス等利用計画等の作成と交付・提出（3-10）"},{"s":"gl","p":19,"h":"3-2 相談支援プロセスの詳細／⑧計画相談支援給付費の","t":"⑧計画相談支援給付費の請求（3-11）※基本報酬はサービス利用支援費を算定代理受領通知受理サービス利用開始サービス提供開始支払※神奈川県国民健康保険団体連合会の「電子請求受付システム」を介して市役所が対応"},{"s":"gl","p":19,"h":"3-2 相談支援プロセスの詳細／⑪サービス担当者会議の開催等によるモニタリングの実施（3-14）","t":"⑪サービス担当者会議の開催等によるモニタリングの実施（3-14）内容確認・同意書類受理変更申請変更申請書の提出依頼※依頼書等の発行はしません。"},{"s":"gl","p":19,"h":"3-2 相談支援プロセスの詳細／⑬変更申請の案内","t":"⑬変更申請の案内変更申請受理支給決定受給者証等の書類送付受給者証受理旧受給者証返還⑭受給者証の内容確認（3-8）⑮サービス等利用計画を確定させるためのサービス担当者会議の開催（3-9）内容確認・同意"},{"s":"gl","p":19,"h":"3-2 相談支援プロセスの詳細／⑨代理受領通知等の発行","t":"⑨代理受領通知等の発行（3-12）サービス利用状況報告書類受理書類受理（契約締結）"},{"s":"gl","p":19,"h":"3-2 相談支援プロセスの詳細／⑫モニタリング報告書等","t":"⑫モニタリング報告書等の作成と交付・提出（3-15）⑯サービス等利用計画等の作成と交付・提出（3-10）モニタリング実施月サービス内容やモニタリング実施月等の支給決定内容に変更がある場合のみ⑬と⑭を対応（3-15）※何も変更がなければ、⑰へ進むサービス等利用計画の内容の変更も伴う場合は、⑬と⑭に続いて、⑮と⑯にも対応（3-16）※⑫で計画案を提出した場合のみ対応"},{"s":"gl","p":20,"h":"3-2 相談支援プロセスの詳細／⑫モニタリング報告書等","t":"⑰計画相談支援給付費の請求（3-11）※手続きの内容によって、基本報酬はサービス利用支援費もしくは継続サービス利用支援費を算定⑱代理受領通知等の発行（3-12）代理受領通知受理⑳サービス担当者会議の開催等によるモニタリングの実施（3-14、3-17）内容確認・同意書類受理以降は、「⑤受給者証の内容確認（3－8）」に戻り、継続して相談支援を展開していきます。書類受理（契約締結）個別支援計画作成（契約締結）個別支援計画の内容確認・同意新サービス利用開始新サービス提供開始⑲基本相談支援の実施（3-13）サービス利用状況報告支払※神奈川県国民健康保険団体連合会の「電子請求受付システム」を介して市役所が対応㉑モニタリング報告書等の作成と交付・提出（3-17）以下は全部に共通で対応モニタリング実施月（サービス終了月）（3-17）"},{"s":"gl","p":21,"h":"3-3 相談受付","t":"■相談支援は相談受付時点から開始！・区役所に障害福祉サービス等の利用を申請した場合、区役所は申請者に「サービス等利用計画案・障害児支援利用計画案提出依頼書」を交付し、サービス等利用計画案の提出を求めます。それを受けて、申請者は指定特定相談支援事業者にサービス等利用計画案の作成を依頼することになります。・区役所への申請後に指定特定相談支援事業者を探すことが基本ですが、場合によっては、区役所への相談前に相談支援専門員につながり、サービス利用に限らない生活の相談をする人もいます。そのような場合も含め、相談支援専門員は相談者の状況を確認し、希望や課題等を整理すると共に、利用できるサービスなどの情報提供を行います。・相談支援専門員は、相談を受け付けた時点から相談支援が始まっていることを自覚し、相談者のニーズに則した適切な支援を行えるように、丁寧に話を聴きます。"},{"s":"gl","p":21,"h":"3-3 相談受付","t":"補足｜事業者の責務※基準第 17 条、解釈通知第二の２（14）指定特定相談支援事業者は、計画相談支援を受けている対象者等が偽りその他不正な行為によって計画相談支援給付費の支給を受け、又は受けようとしたときは、遅滞なく、意見を付してその旨を市町村に通知しなければなりません。補足｜受給資格の確認※基準第９条、解釈通知第二の２（５）・指定特定相談支援事業者は、現に支給決定又は地域相談支援給付決定を受けている相談者から計画相談支援の提供を求められた場合は、相談者の提示する受給者証又は地域相談支援受給者証によって、計画相談支援の支給対象者であることを確認するとともに、サービス等利用計画の作成やモニタリングの実施に当たり必要な事項を確かめなければなりません。・また、支給決定又は地域相談支援給付決定を受けていない相談者について、サービス等利用計画案を作成するときは、当該相談者等の提示する市町村が通知した「サービス等利用計画案・障害児支援利用計画案提出依頼書」によって、市町村からサービス等利用計画案の提出の依頼を受けた者であることを確かめます。"},{"s":"gl","p":21,"h":"3-3 相談受付","t":"補足｜支給決定又は地域相談支援給付決定の申請に係る援助※基準第 10 条、解釈通知第二の２（６）指定特定相談支援事業者は、支給決定に通常要すべき標準的な期間を考慮し、支給決定の有効期間の終了に伴う支給決定の申請について、必要な援助を行わなければなりません。"},{"s":"gl","p":22,"h":"3-4 利用契約締結※基準第５条、解釈通知第二の２（１）","t":"■契約書、重要事項説明書、個人情報同意書等の交付計画相談支援を利用する場合、利用者に対して、当該事業の契約書及び重要事項説明書等の内容説明を行い、利用者の同意を得た後に契約を交わします。補足｜内容及び手続の説明及び同意※基準第５条、解釈通知第二の２（１）・指定特定相談支援事業者は、利用者に対し適切な計画相談支援を提供するため、その提供の開始に際し、あらかじめ、利用申込者に対し、当該指定特定相談支援事業所の運営規程の概要、従業者の勤務体制、事故発生時の対応、苦情処理の体制等の利用申込者がサービスを選択するために必要な重要事項について、利用者の障害の特性に応じ、適切に配慮されたわかりやすい説明書やパンフレット等の文書を交付して懇切丁寧に説明を行い、当該事業所から計画相談支援の提供を受けることにつき、当該利用申込者の同意を得なければなりません。"},{"s":"gl","p":22,"h":"3-4 利用契約締結※基準第５条、解釈通知第二の２（１）","t":"・なお、利用者との間で計画相談支援の提供に係る契約が成立したときは、利用者の障害の特性に応じた適切な配慮をもって、社会福祉法（昭和 26 年法律第 45 号）第 77 条第１項の規定に基づき、以下の内容を記載した記載した書面を交付しなければなりません。"},{"s":"gl","p":22,"h":"3-4 利用契約締結※基準第５条、解釈通知第二の２（１）／①当該事業の経営者の名称及び主たる事務所の所在地、②当該事業の経営者が提供する計","t":"①当該事業の経営者の名称及び主たる事務所の所在地、②当該事業の経営者が提供する計画相談支援の内容、③当該計画相談支援の提供につき利用者が支払うべき額に関する事項、④計画相談支援の提供開始年月日、⑤計画相談支援に係る苦情を受け付けるための窓口補足｜重要事項説明書に記載すべき事項重要事項説明書には、運営規定の概要その他利用申込者のサービスの選択に資すると認められる重要事項を記載します。なお、重要事項説明書の内容と運営規程の内容に齟齬がないように注意してください。"},{"s":"gl","p":22,"h":"3-4 利用契約締結※基準第５条、解釈通知第二の２（１）／①法人、事業所の概要（法人名、事業所名、事業所番号、併設サービス等）","t":"①法人、事業所の概要（法人名、事業所名、事業所番号、併設サービス等）"},{"s":"gl","p":22,"h":"3-4 利用契約締結※基準第５条、解釈通知第二の２（１）／②営業日、営業時間、サービス提供日、サービス提供時間","t":"②営業日、営業時間、サービス提供日、サービス提供時間"},{"s":"gl","p":22,"h":"3-4 利用契約締結※基準第５条、解釈通知第二の２（１）／④従業者の勤務体制（従業者の職種、員数及び職務の内容）","t":"④従業者の勤務体制（従業者の職種、員数及び職務の内容）"},{"s":"gl","p":22,"h":"3-4 利用契約締結※基準第５条、解釈通知第二の２（１）／⑦苦情処理の体制（事業所担当、市、区などの相談・苦情の窓口も記載）","t":"⑦苦情処理の体制（事業所担当、市、区などの相談・苦情の窓口も記載）"},{"s":"gl","p":22,"h":"3-4 利用契約締結※基準第５条、解釈通知第二の２（１）／⑨その他利用申込者のサービスの選択に資すると認められる重要事項（従業者の研修機","t":"⑨その他利用申込者のサービスの選択に資すると認められる重要事項（従業者の研修機会の確保、衛生管理、秘密の保持、事故発生時の対応等）補足｜基本的留意点※基準第 15 条第１項第３号、解釈通知第二の２（11）②指定計画相談支援は、利用者等の主体的な参加及び自らの課題の解決に向けての意欲の醸成と相まって行われることが重要です。このためには、指定計画相談支援について利用者等の十分な理解が求められるものであり、相談支援専門員は、指定計画相談支援を懇切丁寧に行うことを旨とし、サービスの提供方法等について理解しやすいように説明を行うことが肝要です。また、必要に応じて、同じ障害を有する者による支援等適切な手法を通じて行います。"},{"s":"gl","p":23,"h":"3-5 区役所への契約内容の報告※基準第６条、解釈通知第二の２（２）","t":"■区役所に契約内容報告書を提出特定相談支援事業者は、計画相談支援の利用に係る契約をしたときは、その旨を「計画相談支援・障害児相談支援契約内容報告書」に記載し、区役所に報告しなければなりません。なお、この報告書の提出は、サービス等利用計画案の送付時に同封していただいて構いません。様式は横浜市のホームページに掲載しています。利用者より、「計画相談支援依頼（変更）届出書」の提出を依頼された場合は、「契約内容報告書」と併せて区役所に提出します。なお、「計画相談支援依頼（変更）届出書」は、利用者に対して区役所から発行されます。契約を変更または終了した際にも、区役所へ「契約内容報告書」の提出をお願いします。"},{"s":"gl","p":24,"h":"３-6 サービス等利用計画作成の基本理念※基準第 15 条第２項第１号、解釈通知第二の２（11）③","t":"■利用者の意思決定の支援への配慮サービス等利用計画の作成にあたっては、利用者の自己決定の尊重及び意思決定の支援の配慮しつつ、利用者の希望等を踏まえて作成することを基本とします。その際、「障害福祉サービスの利用等にあたっての意思決定支援ガイドラインについて」（平成 29年３月 31 日付け障発 0331 第 15 号。以下「意思決定支援ガイドライン」という。）を踏まえて、利用者が自立した日常生活又は社会生活を営むことができるよう、意思決定支援ガイドラインに掲げる次の基本原則に十分に留意しつつ、利用者の意思決定の支援に配慮します。ア本人への支援は、自己決定の尊重に基づき行う。イ職員等の価値観においては不合理と思われる決定でも、他者への権利を侵害しないのであれば、その選択を尊重するように努める姿勢が求められる。ウ本人の自己決定や意思確認がどうしても困難な場合は、本人をよく知る関係者が集まって、様々な情報を把握し、根拠を明確にしながら意思及び選好を推定する。"},{"s":"gl","p":24,"h":"３-6 サービス等利用計画作成の基本理念※基準第 15 条第２項第１号、解釈通知第二の２（11）③","t":"なお、相談支援専門員については、利用者の意思決定支援を適切に行うため、都道府県が実施する相談支援専門員を対象にした専門コース別研修の意思決定支援コースを受講することが望ましいとされています。"},{"s":"gl","p":24,"h":"３-6 サービス等利用計画作成の基本理念※基準第 15 条第２項第１号、解釈通知第二の２（11）③／ Q＆A コーナー｜意思決定の支援の定義","t":"Q＆A コーナー｜意思決定の支援の定義Q 指定基準において、「自己決定の尊重」と「意思決定の支援の配慮」とそれぞれ規定されているが、これはそれぞれどのように違うのか。（国 QA(R6)問 83）A 利用者本人が自己決定ができる場合は、その決定を尊重することが支援の原則である。一方、自ら意思を決定することに困難を抱える利用者については、「障害福祉 35 サービスの利用等にあたっての意思決定支援ガイドライン」を踏まえて、利用者が自立した日常生活又は社会生活を営むことができるよう、利用者の意思決定の支援に配慮することとしている。"},{"s":"gl","p":25,"h":"3-7 個別支援会議の開催等によるアセスメントの実施","t":"※基準第 15 条第２項第５・６・７号、解釈通知第二の２（11）⑦・⑧・⑨■本人の希望する生活の実現に向けて、まずは丁寧なアセスメントから始める・相談支援専門員は、アセスメントの実施に当たって、利用者が居所において日頃生活している様子や生活環境等を実地で確認することが必要です。そのため、必ず利用者の居宅、障害者支援施設等、精神科病院（現に日々の生活拠点としている場所）を訪問し、利用者及びその家族に面接して行わなければなりません。・この場面において、利用者やその家族との間の信頼関係や協働関係の構築が重要であり、相談支援専門員は、面接の趣旨を利用者及びその家族に対して十分に説明し、理解を得なければなりません。このため、相談支援専門員は面接技法等の研鑽に努めることが重要です。・本市では、利用者のニーズに基づくサービス等利用計画案を作成するため、個別支援会議の開催を推奨しており、新規で計画相談支援を利用する場合には開催を必須としています。個別支援会議の開催形態は定めていませんが、利用者及びその家族とともに、今まで関わっていた関係者等を集め、利用者や家族の希望、これまでの生活状況等の必要な情報を収集し、アセスメントを実施します。"},{"s":"gl","p":25,"h":"3-7 個別支援会議の開催等によるアセスメントの実施","t":"・相談支援において、「アセスメントは命」であると言われるぐらいに、その後の支援を左右するものです。なぜなら、アセスメントは、利用者本人の夢や希望する生活を明確にし、その実現に向けて必要なことを確認していくプロセスであり、支援の軸となる部分だからです。アセスメントは、相談を受けた時点から始まっているものですが、改めて利用者の全体像を把握できるように、個別支援会議を開催するなどして、丁寧に実施しましょう。補足｜アセスメントの実施※基準第 15 条第２項第５号、解釈通知第二の２（11）⑦・サービス等利用計画は、個々の利用者の特性に応じて作成されることが重要です。このため、相談支援専門員は、サービス等利用計画の作成に当たって、適切な方法により、利用者について、その心身の状況、その置かれている環境及び日常生活全般の状況等の評価を通じて利用者の希望する生活や利用者が自立した日常生活を営むことができるよう支援する上で解決すべき課題等の把握(アセスメント)を行わなければなりません。なお、当該アセスメントは、相談支援専門員の個人的な考え方や手法のみによって行われてはならず、その者の課題を客観的に抽出するための手法として合理的なものと認められる適切な方法を用いなければなりません。"},{"s":"gl","p":25,"h":"3-7 個別支援会議の開催等によるアセスメントの実施","t":"・必要に応じ、自らが行うアセスメントに加え、専門機関が行うアセスメントや障害支援区分認定における医師意見書等を本人同意のもと活用することも重要です。・アセスメントの記録は、５年間保存しなければなりません。"},{"s":"gl","p":26,"h":"3-7 個別支援会議の開催等によるアセスメントの実施","t":"補足｜身分を証する書類の携行※基準第 11 条、解釈通知第二の２（７）・利用者等が安心して計画相談支援の提供を受けられるよう、相談支援専門員は身分を明らかにする証書や名札等を携行し、初回訪問時及び利用者等から求められたときは、これを提示しなければなりません。・この証書等には、当該指定特定相談支援事業所の名称、当該従業者の氏名を記載するものとし、当該従業者の写真の貼付や職能の記載を行うことが望ましいです。補足｜適切な意思決定支援の実施※基準第 15 条第２項第６号、解釈通知第二の２（11）⑧・相談支援専門員は、アセスメントの実施に当たっては、利用者が自ら意思を決定することに困難を抱える場合には、適切に意思決定の支援を行うため、当該利用者の意思及び選好並びに判断能力等について丁寧に把握しなければなりません。"},{"s":"gl","p":26,"h":"3-7 個別支援会議の開催等によるアセスメントの実施／ Q＆A コーナー｜個別支援会議の開催方法","t":"Q＆A コーナー｜個別支援会議の開催方法Q 個別支援会議の開催について、サービス管理責任者及び本人が参加する会議と、サービス管理責任者及び事業所職員が参加する会議を別々に行うという運用は認められるか。（国 QA(R6)問81）A 本人を含めた各関係者が参加する個別支援会議を行った上で、追加的にサービス管理責任者及び事業所職員が参加する会議を行うことは可能である。"},{"s":"gl","p":27,"h":"3-7 個別支援会議の開催等によるアセスメントの実施／ Q＆A コーナー｜個別支援会議の開催方法","t":"補足｜基礎調査資料の活用※詳細は第４章にて要確認・基礎調査資料に記載する情報は、利用者を総合的に理解し、アセスメントするために必要な項目であり、最低限把握しておくべきものです。アセスメントの過程で収集した情報は、基礎調査資料に記載していきます。・なお、この項目を全て埋めることが大切なのではありません。また、全ての情報を最初から把握することは困難です。不要な情報や利用者との関係構築等から現段階では確認できない部分等については空欄で構いません。その後の支援経過の中で随時追記・修正をしてください。補足｜情報提供申込書の活用と留意点※5‐8 も参照・アセスメントに必要な情報について、区役所に情報提供を依頼することができます。・しかし、利用者や家族等から直接必要な情報を収集することが基本です。安易に情報提供申込書を使用するのではなく、「なぜその情報を区役所から得ることが必要なのか」という理由を明確にしたうえで、情報提供申込書を活用してください。"},{"s":"gl","p":27,"h":"3-7 個別支援会議の開催等によるアセスメントの実施／ Q＆A コーナー｜個別支援会議の開催方法","t":"・また、情報提供申込書を利用する場合には、利用者から事前に書面による同意を得ていることが必要です。・申込の手続きについては、「障害福祉情報サービスかながわ」に掲載している案内文等を確認してください。※トップページ＞書式ライブラリ＞２．横浜市からのお知らせ＞「①横浜市からのお知らせ」＞「障害福祉サービス等支給決定等に係る情報の提供について（登録日付：2018年10月２日）」"},{"s":"gl","p":27,"h":"3-7 個別支援会議の開催等によるアセスメントの実施／ Q＆A コーナー｜障害児におけるアセスメントの考え方","t":"Q＆A コーナー｜障害児におけるアセスメントの考え方アセスメントQ 児童福祉法に基づく障害児相談支援の事業の人員及び運営に関する基準において、障害児支援利用計画を作成する際の留意点として「相談支援専門員は、アセスメントの実施に当たっては、必ず障害児の居宅を訪問し、障害児及びその家族に面接して行わなければならない。」と規定されているが、次の場合についてはどうか。（国 QA 問 5）"},{"s":"gl","p":27,"h":"3-7 個別支援会議の開催等によるアセスメントの実施／①自宅訪問よりも効果的なアセスメントができる場合や自宅訪問が難しい場合は、事前","t":"①自宅訪問よりも効果的なアセスメントができる場合や自宅訪問が難しい場合は、事前に行われる面接は、相談支援事業所や日中通っている保育園等で行ってもかまわないか。"},{"s":"gl","p":27,"h":"3-7 個別支援会議の開催等によるアセスメントの実施／②作成時は、上記①の理由で自宅訪問しないことがあっても、モニタリング等を通じて","t":"②作成時は、上記①の理由で自宅訪問しないことがあっても、モニタリング等を通じていつかは自宅訪問することでよいか。A 障害児支援利用計画は、障害児の日常生活全般を支援する観点に立って作成されることが重要であることから、生活状況を十分把握する必要があり、その把握については、障害児及びその家族からの聞き取りだけでなく、自宅訪問により生活環境を見ることが重要である。よって、①～②とも障害児支援利用計画の作成に先立ち自宅訪問が必要である。"},{"s":"gl","p":28,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"※基準第６条第２項・15 条第２項、解釈通知第二の２（11）③～⑭■本人を中心としたサービス等利用計画案の作成※詳細は第４章にて要確認・アセスメントの結果を踏まえ、利用者本人を中心としたサービス等利用計画案を作成します。・相談支援専門員は、サービス等利用計画が利用者の生活の質に直接的な影響を与える重要なものであることを十分に認識し、サービス等利用計画案を作成しなければなりません。したがって、サービス等利用計画案は、利用者及びその家族の希望並びに利用者について把握された解決すべき課題をまず明らかにした上で、当該地域における障害福祉サービス又は地域相談支援が提供される体制を勘案し、課題等に対応するための最も適切な福祉サービス等の組合せについて検討して、作成する必要があります。■適切なモニタリング実施月の設定（モニタリング設定の基本的考え方）"},{"s":"gl","p":28,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"・サービス等利用計画案には、モニタリング実施月についても記載します。・モニタリング実施月の設定にあたっては、利用者の状況等に応じ、必要な頻度を柔軟に設定します。なお、本市では、生活の場所や障害像に関わらず、利用者本人と相談支援専門員が良好な関係を築きながら、目標実現に向けた取組や支援を可能とするために、モニタリングは原則として３か月に１回実施することが望ましいものとして推奨しています。さらに、計画相談支援の新規利用時においては、利用者との関係構築の観点から当初３か月は連続でモニタリングを実施することを推奨しています。・また、本市では、相談支援専門員による相談支援（相談支援プロセスにおけるインターベンション（介入）の部分）の効果の確認及び評価についても、その支援内容がサービス等利用計画に含まれている場合には、モニタリングとして設定することを可能とします。"},{"s":"gl","p":28,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"・サービス等利用計画案には、当初必要とされるモニタリング実施月を提案しますが、利用者の状況はその後も変化していく可能性があります。モニタリング実施月でないときであっても、基本相談支援の中で継続的に状況を把握し、適宜必要な支援を行います。その中で、モニタリング実施月の見直しの必要性についても、併せて確認してください。補足｜モニタリング設定の基準本市では、利用者との関係性構築・維持等も踏まえ、３か月に１回のモニタリング実施を推奨しています。３か月に１回よりも頻回なモニタリング回数が想定されるのは、関係性の構築に時間を要する人、利用者や環境が不安定で１、２か月のペースで状況の変化が見込まれる人などです。反対に、３か月に１回よりも少ないモニタリング回数が想定されるのは、利用者と相談支援専門員との関係性も構築され、生活やサービスの利用状況も安定しており、大きな変化が見込まれない人です。"},{"s":"gl","p":28,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"いずれの場合においても、サービス等利用計画案にその内容や理由が記載されることで、モニタリングの設定が可能です。"},{"s":"gl","p":29,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"【参考】国が示すモニタリング実施標準期間施行規則第６条の16に規定するモニタリングの実施標準期間対象者期間新規サービス利用者１か月毎※利用開始から３か月のみ在宅の障害福祉サービス集中的に支援が必要な者１か月毎就労定着支援、自立生活援助、日中サービス支援型共同生活援助３か月毎居宅介護、行動援護、同行援護、重度訪問介護、短期入所、就労移行支援、自立訓練３か月毎生活介護、就労継続支援、共同生活援助（日中支援型を除く）、地域移行支援、地域定着支援６か月毎※65 歳以上でケアマネを利用していない者は３か月毎障害者支援施設、のぞみの園、療養介護入所者、重度障害者等包括支援６か月毎実施標準期間は、相談支援事業者としての必要な関わりの標準的な頻度について示したものですが、利用者の心身の状況や生活環境等により丁寧な関わりが必要と判断すべき状況にある利用者については、実施標準期間より高い頻度のモニタリング期間を提案することとします。その上で、当該達成時期にはモニタリングの実施によりサービス等利用計画及び各指定障害福祉サービス等又は指定地域相談支援の評価を行い得るようにすることが重要です。"},{"s":"gl","p":30,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"補足｜サービス等利用計画案へのモニタリング設定理由の記載サービス等利用計画には原則、【その他留意事項】にモニタリング設定理由の記載が必要です。ただし、本市が、推奨する計画相談支援の新規利用時における当初３か月の毎月モニタリング設定時並びに３か月に１回のモニタリングの設定においては、モニタリング設定理由の記載を省略できるものとして整理します。※該当する場合には□に✔を入れ「案」を二重線で消す年月日"},{"s":"gl","p":2,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"利用者氏名（児童氏名）保護者（児童)または後見人相談支援事業者名利用者及びその家族の生活に対する意向（希望する生活）家族受給者証番号利用者負担上限額本人１，２，３，４，５，６，７，８，９， 10 ， 11 ， 12障害支援区分計画作成担当者利用者同意署名欄提供事業者名（担当者名・電話）評価時期（モニタリグ実施月）課題解決のための本人の役割その他留意事項及び評価時期の設定理由短期目標（３か月後の状態）優先順位解決すべき課題（めざす生活を実現するための本人のニーズ「～したい」）支援目標（達成目標「～する」）達成時期種類・内容・量（頻度・時間）課題解決のための関係者の役割（福祉サービス等）総合的な援助の方針（本人がめざす生活に沿った支援の方針）長期目標（半年～１年後の状態）"},{"s":"gl","p":2,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"平成30年４月改訂版モニタリング実施月※実施月に○計画案作成日※面談日又は同意署名日を記載サービス等利用計画案・障害児支援利用計画案（□本案を確定させた計画とする）平成本人との続柄電話番号上記以外の頻度でモニタリングを設定する場合は、サービス等利用計画案の【その他留意事項】に設定理由を必ず記載してください。補足｜計画相談支援の支給決定期間計画相談支援全体の支給決定期間・通常、「サービスの申請→相談支援専門員による個別支援会議の開催→サービス等利用計画案の作成・交付・提出→サービスの支給決定→サービス等利用計画の作成・交付・提出→サービスの利用開始」という流れになります。そのため、計画相談支援はサービス利用開始月よりもひと月前を目安に決定されることが必要であり、本市では新規の計画相談支援の決定の際には原則前月１日づけで決定しています。なお、計画相談支援を更新する場合は、利用するサービスの支給決定期間開始日が更新後の計画相談支援の開始日になります。"},{"s":"gl","p":2,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"・計画相談支援の終了月は、障害福祉サービスの支給決定または地域相談支援給付決定の有効期間のうち最長の有効期間の終了月に合わせて設定します。（事務処理要領第３Ⅲ１（２））指定継続サービス利用支援（モニタリング）の支給決定期間計画相談支援の支給開始月の翌月から支給決定終了月までの期間で決定します。このうち、モニタリングを実施する月は、確定させた形で実施月として決定され、その月にモニタリングを実施します。【支給決定例（１年決定のサービス利用で、新規及び更新時）】2021.3 2021.4 2022.4 2023.4計画相談支援（1 年１か月）計画相談支援（1 年）指定継続サービス利用支援（1 年）指定継続サービス利用支援（1 年）"},{"s":"gl","p":31,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"■モニタリング設定上の留意点・モニタリングは対象者に合わせて柔軟に設定できますが、【毎月】のモニタリング設定の場合には、全てのサービスで最長１年以内での支給決定期間となります。（事務処理要領第３Ⅲ２（２））。・福祉サービスで１年更新のものと３年更新のサービスを併用している場合には、１年更新のサービスの終了月を必ずモニタリング実施月として設定する必要があります（地域生活支援事業は対象外）。■利用者のサービス選択に係る支援※基準第 15 条第２項第４号、解釈通知第二の２（11）⑥・サービス等利用計画案に位置付ける障害福祉サービス等の選択は、利用者等が行うことが基本であり、当該計画案は利用者の希望を尊重して作成されなければなりません。・このため、相談支援専門員は、利用者が居住する地域のサービス提供事業所等に関するサービスの内容や利用料等の情報を適正に利用者等に対して提供すること、また実際の見学等により、利用者がサービスを選択できるように支援することが必要です。"},{"s":"gl","p":31,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"・特定のサービス提供事業所に不当に偏した情報を提供するようなことや、利用者等の選択を求めることなく同一の事業主体の福祉サービスのみによるサービス等利用計画案を最初から提示することがあってはなりません。また、日中サービス支援型指定共同生活援助については、当該事業者と指定特定相談支援事業者は別であることが望ましいとされています（解釈通知第二の２（11）⑫）。■短期入所のサービス等利用計画案への位置付け※基準第 15 条第２項第 9 号,解釈通知第二の２（11）⑪・利用者の心身の状況等を勘案して特に必要と認められる場合を除き、短期入所の年間利用日数を１年の半分（180 日以内）を目安にすることが計画相談支援の指定基準として位置づけられています。・短期入所は、利用者の居宅における自立した日常生活又は社会生活の維持のために利用されるものです。相談支援専門員は、短期入所を位置付けるサービス等利用計画案の作成に当たって、利用者にとって短期入所が在宅生活の維持につながるよう十分に留意しなければなりません。"},{"s":"gl","p":31,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"2021.3 2022.4 2023.4（2021 年４月に新規に利用開始する場合）2021.4 2024.4生活介護（３年）３月モニタ３月モニタ３月モニタ（例）３年間の支給決定の生活介護と１年間の支給決定の居宅介護を利用する場合＊居宅介護の終了月は必ずモニタリング実施月として設定します。＊なお、居宅介護の次の１年決定のために併せてサービス等利用計画の作成が必要です。居宅介護（１年）居宅介護（１年）計画相談支援（３年１か月）居宅介護（１年）"},{"s":"gl","p":32,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"・年間利用日数（180 日）については、サービス等利用計画案の作成過程における個々の利用者の心身の状況やその置かれている環境等の適切な評価に基づき、在宅生活の維持のための必要性に応じて弾力的に運用することが可能であり、年間 180 日以内であるかについて機械的な適用を求めるものではありません。利用者の心身の状況及び本人、家族等の意向に照らし、この目安を越えて短期入所の利用が特に必要と認められる場合においては、自治体の判断に応じて、例外的にこれを上回る日数の短期入所をサービス等利用計画案に位置付けることも可能です。そのような場合には、事前に区役所に相談してください。■利用者への説明・同意・交付※基準第 15 条第２項第 10・11 号,解釈通知第二の２（11）⑬・⑭・作成されたサービス等利用計画案は、その内容について利用者等に説明を行った上で、文書によって利用者等の同意を得ることが必要です。このことにより、利用者等によるサービスの選択やサービス内容等への利用者等の意向の反映の機会を保障します。また、相談支援員がサービス等利用計画案の原案の作成までの業務を担う場合には、提供する相談支援の連続性や利用者との関係性の醸成の観点から、担当する相談支援専門員又は主任相談支援専門員の指導の下、当該相談支援員が利用者への説明に同席することが望ましいです。"},{"s":"gl","p":32,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"・利用者から同意署名を得たサービス等利用計画案については、その写しを遅延なく利用者等に交付しなければなりません。なお、署名は利用者本人による自筆が原則です（18 歳未満の場合には保護者が保護者の氏名で署名）。自筆が難しい場合には、利用者本人の氏名を代筆の上で、代筆者の氏名と続柄や関係性、代筆理由を記載します。（５年間保存）補足｜各サービスの支給決定の有効期間サービスの種類支給量の単位支給決定の有効期間最短最長介護給付居宅介護※、重度訪問介護、同行援護、行動援護時間（30 分単位）/月１か月重度障害者等包括支援単位 / 月１年短期入所日 / 月療養介護、生活介護、施設入所支援日 / 月３年訓練等給付共同生活援助、就労継続支援 A 型日 / 月就労継続支援 B 型日 / 月 50 歳未満１年50 歳以上３年就労移行支援、就労定着支援、自立生活援助、自立訓練（機能訓練、生活訓練）、宿泊型自立訓練日 / 月地１年域生活支援事業移動支援時間（30 分単位）/月日中一時支援、訪問入浴・施設入浴サービス回 / 月地域活動支援センター（デイ型）日 / 月地域相談支援地域移行支援日 / 月６か月地域定着支援１年※通院等乗降介助の支給量の単位は、「回 / 月」"},{"s":"gl","p":33,"h":"3-8 サービス等利用計画案の作成と交付・提出","t":"■区役所への提出※別紙の「訪問・計画等交付・サービス担当者会議等実施確認表」使用・利用者からの同意署名を得た後、速やかに下記の書類を区役所に提出します。・なお、その時点で利用者が「計画相談支援依頼（変更）届出書」を区役所に提出していない場合には、利用者への確認及び同意を得たうえで、サービス等利用計画案等と併せて区役所に提出します。補足｜区役所への書類提出時期"},{"s":"gl","p":33,"h":"3-8 サービス等利用計画案の作成と交付・提出／①サービス等利用計画案：サービスの利用希望開始月の前月 20 日まで","t":"①サービス等利用計画案：サービスの利用希望開始月の前月 20 日まで（区役所閉庁日はその前の開庁日まで）"},{"s":"gl","p":33,"h":"3-8 サービス等利用計画案の作成と交付・提出／②確定させたサービス等利用計画：支給決定を受けてサービス担当者会議を開催した後","t":"②確定させたサービス等利用計画：支給決定を受けてサービス担当者会議を開催した後（目安としてはサービス利用が始まって半月以内）"},{"s":"gl","p":33,"h":"3-8 サービス等利用計画案の作成と交付・提出／③モニタリング報告書：モニタリング実施月中","t":"③モニタリング報告書：モニタリング実施月中※更新月の場合には、モニタリング実施月の 20 日まで（区役所閉庁日はその前の開庁日まで）区役所への提出書類"},{"s":"gl","p":33,"h":"3-8 サービス等利用計画案の作成と交付・提出／③様式１－２サービス等利用計画案（週間計画表）（原本）","t":"③様式１－２サービス等利用計画案（週間計画表）（原本）"},{"s":"gl","p":33,"h":"3-8 サービス等利用計画案の作成と交付・提出／④【居宅介護等を利用する場合】居宅介護等利用計画表（原本）","t":"④【居宅介護等を利用する場合】居宅介護等利用計画表（原本）"},{"s":"gl","p":33,"h":"3-8 サービス等利用計画案の作成と交付・提出／⑤【移動支援等を利用する場合】移動支援等利用計画表（原本）","t":"⑤【移動支援等を利用する場合】移動支援等利用計画表（原本）※利用者には、②及び③の写しを渡します。その他の書類は利用者からの希望に応じて渡します。※提出時期：サービスの利用希望開始月の前月20日までに全ての書類の提出が必要です。補足｜訪問・計画等交付・サービス担当者会議等実施確認表対応状況を把握するために、本表を利用者ごとに作成し、適宜記入してください。※区役所等に提出するものではありません。事業所での報酬算定に関する対応状況の管理記録として柔軟に活用してください。"},{"s":"gl","p":34,"h":"3-9 受給者証の内容確認※基準第９条、解釈通知第二の２（５）","t":"■支給決定の内容の確認・受給者証は区役所から利用者あてに郵送されます。・相談支援専門員は、受給者証に印字してある事業所の名称、サービス内容及び支給量、計画相談支援の支給決定期間、モニタリング実施月を必ず確認し、記録します。（必要に応じて写しを保管。）"},{"s":"gl","p":35,"h":"3-10 サービス等利用計画を確定させるためのサービス担当者会議の開催","t":"※基準第 15 条第２項第 12 号、解釈通知第二の２（11）⑮■全員で役割と全体の方向性を確認・支給決定を受けて、サービス等利用計画案を具体的な計画にしていきます。・そのために、サービス提供事業所等との連絡調整等を行うとともに、サービス担当者会議の開催等により、利用者の望む生活やサービスへの希望等を改めて参加者全員で共有した上で当該サービス等利用計画案の内容について説明を行うとともに、担当者から専門的な見地からの意見を求めなければなりません。併せて、利用者の意向の再確認やサービス提供事業所による支援内容の確認を行います。・会議等の記録は、５年間保存しなければなりません。・サービス担当者会議については、テレビ電話装置その他の情報通信機器を活用して行うことができます。補足｜サービス担当者会議の出席者・サービス担当者会議については、原則として利用者等が同席した上で行わなければならない。ただし、例えば当該利用者の病状により、会議への同席自体が極めて困難な場合等、やむを得ない場合については、例外的にテレビ電話装置（リアルタイムでの画像を介したコミュニケーションが可能な機器をいう。以下同じ。）の活用等、同席以外の方法により希望する生活及びサービスに対する意向等を改めて確認することで差し支えない。"},{"s":"gl","p":35,"h":"3-10 サービス等利用計画を確定させるためのサービス担当者会議の開催","t":"・様々な専門的見地からの意見等を踏まえてサービス等利用計画を作成するため、サービス担当者会議には担当者のみならず、必要な本人の生活に関係する者や支援関係者が参加するよう、調整に努めること。・また、相談支援員がサービス等利用計画案の原案の作成までの業務を担う場合には、提供する相談支援の連続性や利用者との関係性の醸成の観点から、担当する相談支援専門員又は主任相談支援専門員の指導の下、当該相談支援員がサービス担当者会議に出席することが望ましい。"},{"s":"gl","p":36,"h":"3-10 サービス等利用計画を確定させるためのサービス担当者会議の開催","t":"補足｜サービス提供事業者等の協力サービス等利用計画と個別支援計画の関係指定障害福祉サービス基準第 12 条、「障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定障害福祉サービスの事業等の人員、設備及び運営に関する基準」(平成１８年厚生労働省令第 172 号。）第 10 条及び「障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定地域相談支援の事業の人員及び運営に関する基準」（平成２４年厚生労働省令第２７号。）第８条において、指定障害福祉サービス事業者、指定障害者支援施設等及び指定一般相談支援事業者は、市町村又は一般相談支援事業を行う者又は特定相談支援事業を行う者が行う連絡調整に協力しなければならない旨の規定を置いています。"},{"s":"gl","p":36,"h":"3-10 サービス等利用計画を確定させるためのサービス担当者会議の開催／ Q＆A コーナー｜サービス担当者会議、個別支援会議への本人参加","t":"Q＆A コーナー｜サービス担当者会議、個別支援会議への本人参加Q サービス担当者会議、個別支援会議については、原則として利用者等が同席した上で行わなければならないものであるが、本人参加ができないやむを得ない場合については、具体的にどのようなものが考えられるか。（国 QA(R6)問 80）A 当該会議への本人参加を求める趣旨としては、本人の支援を検討するにあたっては、本人が希望する生活及びサービスに対する意向等を改めて確認することが重要であるためであり、仮に本人による発言が困難な状態である場合であっても、本人の状態を直接確認することで、意思と選好の推定を行うべきものである。そのため、本人の参加ができないやむを得ない場合については、本人の病状が悪化しており、面会謝絶の状態にある、本人の参加を求めることで、本人の状態が悪化することが見込まれる等、限定的な場合を想定している。"},{"s":"gl","p":37,"h":"3-11 サービス等利用計画等の作成と交付・提出","t":"※基準第 15 条第２項第 13・14 号、解釈通知第二の２（11）⑯・⑰■計画を確定させる・サービス担当者会議の結果を踏まえてサービス等利用計画を確定させます。・確定させた計画について、利用者等に対して説明し、文書により利用者の同意を得なければなりません。■利用者、サービス提供事業所への説明・同意・交付※別紙の「訪問・計画等交付・サービス担当者会議等実施確認表」使用・利用者からの同意署名を得て確定できたサービス等利用計画については、利用者及びサービス提供事業所に写しを遅延なく交付しなければなりません。（５年間保存）・相談支援専門員は、サービス提供事業所に対してサービス等利用計画を交付する際に、当該計画の趣旨及び内容等について十分に説明し、共有、連携を図った上で、サービス提供事業所が自ら提供する福祉サービス等の当該計画における位置付けを理解できるように配慮することが必要です。"},{"s":"gl","p":37,"h":"3-11 サービス等利用計画等の作成と交付・提出","t":"・なお、指定障害福祉サービス事業者、指定障害者支援施設等及び指定一般相談支援事業者は、指定特定相談支援事業者に対し個別支援計画を交付しなければならないこととしており、福祉サービス等の提供事業所と相互に計画書及びモニタリング結果を交換すること並びに相互の会議に出席する等により連携を一層促進することが重要です。■区役所への提出※別紙の「訪問・計画等交付・サービス担当者会議等実施確認表」使用・利用者からの同意署名を得て確定させたサービス等利用計画については、区役所にもその写しを提出します。・ただし、サービス等利用計画案から変更がない場合には、その旨を区役所に電話等により報告することで、提出することを省略することが可能です。この場合は、区役所に連絡した日にちを記録に残してください。区役所への提出書類※計画案から変更がない場合には省略可能"},{"s":"gl","p":37,"h":"3-11 サービス等利用計画等の作成と交付・提出／②様式２－２サービス等利用計画（週間計画表）（写し）","t":"②様式２－２サービス等利用計画（週間計画表）（写し）※提出時期：支給決定を受けてサービス担当者会議を開催した後（目安としてはサービス利用が始まって半月以内）"},{"s":"gl","p":38,"h":"3-11 サービス等利用計画等の作成と交付・提出／②様式２－２サービス等利用計画（週間計画表）（写し）","t":"補足｜サービス等利用計画と個別支援計画の関係サービス等利用計画とは、人生の設計図となるものであり、本人の夢や希望を大切にします。一方、個別支援計画とは、夢や希望を実現するためのサービス等を具体的にどのように提供するのかを示した道標になるものです。サービス等利用計画は、引いて全体を見渡す「鳥の目」、個別支援計画は近くで丁寧にきめ細かくみる「虫の目」が必要です。※社会福祉法人南高愛隣会東京事務所（2013）『障がい者地域生活支援計画サポートブック』社会福祉法人南高愛隣会より引用"},{"s":"gl","p":38,"h":"3-11 サービス等利用計画等の作成と交付・提出／ Q＆A コーナー｜個別支援計画の作成・共有","t":"Q＆A コーナー｜個別支援計画の作成・共有Q ①サービス利用開始当初の個別支援計画の作成については、どのようなタイミングで行われるべきか。（国 QA(R6) 問 82）"},{"s":"gl","p":38,"h":"3-11 サービス等利用計画等の作成と交付・提出／②個別支援計画については、利用者等及び指定計画（障害児）相談支援事業所に交付す","t":"②個別支援計画については、利用者等及び指定計画（障害児）相談支援事業所に交付することとされているが、どのようなタイミングで行われるべきか。"},{"s":"gl","p":38,"h":"3-11 サービス等利用計画等の作成と交付・提出／③利用者がセルフプランの場合、個別支援計画の共有については、どのように対応すべ","t":"③利用者がセルフプランの場合、個別支援計画の共有については、どのように対応すべきか。A ①障害福祉サービス等は個別支援計画に基づいてサービスを提供する必要があり、契約締結後、遅滞なく個別支援計画を作成する必要がある。また、サービス提供場面等でのアセスメントを基にする必要があることから、当初の個別支援計画は契約締結後１か月以内に作成することを基本とする。"},{"s":"gl","p":38,"h":"3-11 サービス等利用計画等の作成と交付・提出／②個別支援計画を作成、見直し（見直しの結果、変更がない場合も含む。）した後、速","t":"②個別支援計画を作成、見直し（見直しの結果、変更がない場合も含む。）した後、速やかに利用者等及び相談支援事業所に交付すべきである。"},{"s":"gl","p":38,"h":"3-11 サービス等利用計画等の作成と交付・提出／③セルフプランで、利用者に担当の相談支援事業所がない場合は、相談支援事業所に個","t":"③セルフプランで、利用者に担当の相談支援事業所がない場合は、相談支援事業所に個別支援計画を交付しないことをもって指定基準に違反するものではない。"},{"s":"gl","p":39,"h":"3-11 サービス等利用計画等の作成と交付・提出／③セルフプランで、利用者に担当の相談支援事業所がない場合は、相談支援事業所に個","t":"補足｜請求に関する問い合わせ・請求システムや請求方法等に関する問合せは、神奈川県国民健康保険団体連合会電話番号：045－329－3416・請求エラーが出た場合で、請求情報を再確認してもなお原因が分からない場合の問合せは、横浜市健康福祉局障害施策推進課電話番号： 045－671－4133"},{"s":"gl","p":39,"h":"3-12 計画相談支援給付費の請求","t":"■神奈川県国民健康保険団体連合会が管理する電子請求受付システムで対応※報酬算定の考え方は第５章にて要確認３－６～10 の対応が全て完了した後に、インターネット上の「電子請求受付システム」を通じて行います。請求期間は、毎月１～10 日です。支払日は、請求月の翌月 15 日です。例えば、令和４年５月にサービス等利用計画を作成した場合は、５月サービス提供分として、令和４年６月に請求を行います。ただし、サービス等利用計画を確定させてから請求作業を行います。確定したのが、６月の請求期間を過ぎていた場合は、７月に５月サービス提供分として遡って請求を行います。補足｜モニタリングと計画作成を同月に両方実施した場合の請求原則として、同一月に計画作成とモニタリングの両方を実施した場合であっても、両方の請求をすることはできません。計画作成費のみの請求になります。※詳細は、「５-21 報酬基準」にて要確認。"},{"s":"gl","p":39,"h":"3-12 計画相談支援給付費の請求","t":"補足｜請求の取り下げ請求後、支払われたものを取り下げる場合には、横浜市電子申請システムを通じて申請します。初回申請時に申請者 ID を取得し、各月最終開庁日前日までに電子申請フォームより過誤申立の申請を行ってください。計画相談支援の過誤申立は【全国システム】フォームを使用してください。※詳細は、横浜市ホームページに掲載されています。横浜市トップページ＞「暮らし・総合」＞電子申請＞「過誤申立」で検索補足｜ 18 歳の誕生日を迎えた翌月の対応18 歳の誕生日を迎えた翌月から新しい受給者証が発行されますが、誕生日を迎えた翌月分以降の報酬については、新しい受給者証に印字されている新しい受給者証番号で請求することが必要です。ただし、児童福祉法のサービスを引き続き利用する場合で障害児相談支援も支給決定されている場合は障害児相談支援で請求を行います。"},{"s":"gl","p":40,"h":"3-13 代理受領通知等の発行※基準第 14 条、解釈通知第二の２（10）","t":"■利用者への通知と交付・指定特定相談支援事業者は、法定代理受領により計画相談支援に係る計画相談支援給付費の支給を受けた場合には、利用者に対し、当該利用者に係る計画相談支援給付費の額を通知しなければなりません。・指定特定相談支援事業者は、法定代理受領を行わない計画相談支援に係る費用の額の支払を受けた場合は、その提供した計画相談支援の内容、費用の額その他必要と認められる事項を記載したサービス提供証明書を利用者に対して交付しなければなりません。補足｜代理受領通知への記載内容様式は定めていませんが、①利用者氏名、②指定特定相談支援事業者名、③サービス提供年月、"},{"s":"gl","p":40,"h":"3-13 代理受領通知等の発行※基準第 14 条、解釈通知第二の２（10）／④サービス内容、⑤受領日、⑥代理受領金額については最低限記載が必要です。","t":"④サービス内容、⑤受領日、⑥代理受領金額については最低限記載が必要です。補足｜計画相談支援給付費の額等の受領※基準第 12 条、解釈通知第二の２（８）法定代理受領を行わない場合指定特定相談支援事業者は、法定代理受領を行わない計画相談支援を提供した際は、利用者等から法第 51条の 17 第２項に規定する厚生労働大臣が定める基準により算定した費用の額の支払を受けます。実施地域以外の利用者に対応した場合の交通費の受領利用者等の選定により通常の事業の実施地域以外の地域の居宅等を訪問して計画相談支援を行う場合は、それに要した交通費の額（移動に要する実費）の支払を利用者等から受けることができます。※指定特定相談支援事業者は、これらの費用の額の支払を受けた場合は、当該費用に係る領収証を当該費用の額を支払った利用者等に対し交付しなければなりません。"},{"s":"gl","p":40,"h":"3-13 代理受領通知等の発行※基準第 14 条、解釈通知第二の２（10）／④サービス内容、⑤受領日、⑥代理受領金額については最低限記載が必要です。","t":"※指定特定相談支援事業者は、交通費の受領が生じるサービスの提供に当たっては、あらかじめ、利用者等に対し、当該サービスの内容及び費用についての説明を行い、利用者等の同意を得なければなりません。"},{"s":"gl","p":41,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱","t":"■相談支援のプロセスとして、インターベンション（介入）を実施・相談支援専門員は、計画相談支援に留まらず、基本相談支援を含む“相談支援”として、インターベンション（介入）時における役割を果たしていくことが必要です。ここからは、サービス等利用計画に基づき、相談支援専門員自らも利用者等と継続して連絡を取り、サービス等利用計画の実施状況や利用者についての解決すべき課題の把握を行い、必要に応じてサービス等利用計画及びモニタリング期間の変更、各担当者等との連絡調整その他の便宜の提供を行います。また、新たな支給決定又は地域相談支援給付決定が必要であると認められる場合には、利用者等に対し、支給決定又は地域相談支援給付決定に係る申請の勧奨も行います。・なお、利用者の解決すべき課題の変化は、利用者に直接サービスを提供する各担当者等により把握されることも多いことから、相談支援専門員は、当該各担当者と緊密な連携を図り、利用者の解決すべき課題の変化が認められる場合には、円滑に連絡が行われるよう体制の整備に努めなければなりません。（連絡調整に関する記録は５年間保存）"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱","t":"補足｜モニタリング追加の考え方とモニタリング追加依頼書の取扱・モニタリング実施月以外にモニタリングが必要となった場合には、モニタリング追加依頼書で手続きを行います。ただし、緊急対応等による、当月内のモニタリングの追加は認められません。日ごろの状況等の変化への対応については、基本相談支援の中で対応することが原則です。その中でも、次月以降、追加でモニタリングが必要となる場合は、事前に区役所に連絡した上で、モニタリング追加依頼書を提出します。・モニタリング追加依頼書の対象となるのは、下記のいずれかのパターンに当てはまる状況が生じた場合のみです。パターン１サービス等利用計画に関わる変化があり、かつ翌月以降にモニタリングとして確認・評価を行うことが必要だと判断される場合パターン２サービス等利用計画の援助の方針等の中心軸に関わる変化があり、サービス等利用計画の再作成が必要だと判断される場合※サービス等利用計画の中心軸とは、「総合的な援助の方針」「長期目標」「短期目標」が大きく変わる場合に該当します。"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱","t":"※サービス等利用計画の援助の方針等の中心軸に関わる変化ではなく、かつサービス等利用計画にも記載されていなかった新たな「解決すべき課題」に対し、モニタリングとして関わる必要性が生じた場合には、パターン１と同様の対応をとってください。※モニタリング実施時にモニタリングの追加のみが必要と認められた場合においても、モニタリング追加依頼書の提出が必要です。※様式は、横浜市のホームページに掲載しています。利用者相談支援専門員区役所【パターン２】サービス等利用計画の支援方針等の中心軸に関わる変化があり、サービス等利用計画の再作成が必要だと判断される場合状況等の変化①変化を確認し、基本相談支援の中で対応"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／③サービス等利用計画の再作成","t":"③サービス等利用計画の再作成の必要性を判断。その必要性が認められる場合には、モニタリング追加依頼書の提出を依頼。④利用者にサービス等利用計画の再作成及びモニタリング追加について同意を得る"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／⑤サービス等利用計画の再作成","t":"⑤サービス等利用計画の再作成を行う月内に区役所にモニタリング追加依頼書を提出"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／⑥モニタリング追加依頼書を受理","t":"⑥モニタリング追加依頼書を受理次第、モニタリングの追加決定"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／⑦個別支援会議を開催する等に","t":"⑦個別支援会議を開催する等により、サービス等利用計画案を再作成し、区役所に提出"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／⑨受給者証を再発行し、利用者","t":"⑨受給者証を再発行し、利用者へ送付随時対応報告説明・同意依頼提出提出送付"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／②サービス等利用計画の支援方","t":"②サービス等利用計画の支援方針等の中心軸に関わる変化があり、サービス等利用計画の再作成が必要だと判断。区役所に利用者の状況及びサービス等利用計画の再作成の必要性を報告。"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／⑧サービス等利用計画案の内容","t":"⑧サービス等利用計画案の内容を確認。さらなるモニタリング追加の提案がなされている場合には、その必要性を判断。必要性が認められる場合には、モニタリングの追加決定。利用者相談支援専門員区役所【パターン１】サービス等利用計画に関わる変化があり、かつ翌月以降にモニタリングとして確認・評価を行うことが必要だと判断される場合状況等の変化①変化を確認し、基本相談支援の中で対応"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／③モニタリング追加の必要性を判","t":"③モニタリング追加の必要性を判断。その必要性が認められる場合には、モニタリング追加依頼書の提出を依頼。"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／⑤モニタリング追加月の前月まで","t":"⑤モニタリング追加月の前月までに区役所にモニタリング追加依頼書を提出"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／⑥モニタリング追加依頼書を受理","t":"⑥モニタリング追加依頼書を受理次第、モニタリングの追加決定"},{"s":"gl","p":42,"h":"3-14 基本相談支援の実施※基準第 15 条第３項第１号、解釈通知第二の２（11）⑱／②サービス等利用計画に関わる","t":"②サービス等利用計画に関わる変化であり、かつ翌月以降にモニタリングとして確認・評価を行うことが必要だと判断。区役所に利用者の状況及びモニタリング追加の必要性を報告。報告依頼提出送付説明・同意随時対応"},{"s":"gl","p":43,"h":"3-15 サービス担当者会議の開催等によるモニタリングの実施","t":"※基準第 15 条第３項第２号、解釈通知第二の２（11）⑲、留意事項通知第四の１の（４）■サービス等利用計画に基づく支援状況の確認※詳細は第 4 章にて要確認・相談支援専門員は、モニタリング実施月に、利用者の居宅、障害者支援施設や入院先の医療機関等で面接を行い、また必要に応じてサービス担当者会議を開催し、サービス等利用計画に則した支援が行われているか、新たな希望や課題が生じていないか等を利用者等とともに確認します。そして、必要に応じてサービス等利用計画の変更、サービス提供事業所等との連絡調整その他の便宜の提供を行うとともに、新たな支給決定等が必要であると認められる場合には、利用者等に対し、支給決定等に係る申請の勧奨を行います。・相談支援とは、常に変化する利用者本人や環境等に対応していく動的プロセスです。修正や変更がない完璧なサービス等利用計画はありません。それを前提に、モニタリングでは、利用者や関係者等とともに、そのプロセスを確認していくことで、アセスメントを深め、計画や希望の修正等を行うことができ、本人の希望する生活の実現に向けた支援が可能になります。つまり、モニタリングとは、利用者及び関係者等とともに確認・共有するものであり、電話のみでの聞き取りや本人不在の中での関係者との話し合いなどは、モニタリングとは言えません。"},{"s":"gl","p":43,"h":"3-15 サービス担当者会議の開催等によるモニタリングの実施","t":"・なお、利用者が不在である等のやむを得ない事由でモニタリング実施月にモニタリングができないことが判明した際には、速やかに区役所に連絡してください。補足｜モニタリングの視点や効果（一例）視点結果を踏まえた対応利用者本人の役割や、自身の取組が実施されているか利用者のニーズに合わせたきめ細かい目標設定により、課題解決に向けた利用者自身の取組状況を確認。実施されていない場合は、目標の再設定を行う。計画に沿ったサービスが提供されているか計画通りにサービスが提供されていない、または利用者に不利な形でのサービス提供が行われていることが分かった場合は、利用者の立場に立ちながら仲介・調整を行う。計画に基づいたサービスを提供することで課題はないか（利用者のニーズ解決に向けた内容になっているか）利用者に新たなニーズが生じていたり、または不必要なサービスが提供されていないかを確認する。必要があれば再度アセスメントを行い、サービス等利用計画を再作成するとともに、より効果的なサービス提供となるよう、サービス提供事業者とサービスの内容や提供方法について再検討する。"},{"s":"gl","p":43,"h":"3-15 サービス担当者会議の開催等によるモニタリングの実施","t":"補足｜入院中のモニタリング実施の考え方・利用者が入院した場合に、モニタリングを実施するか否かは、サービス等利用計画に基づく確認や評価ができるかどうかで判断します。つまり、入院中によりサービス等利用計画の確認・評価ができないようでしたら、モニタリングは実施できません。その場合には、利用者及び区役所にその旨を報告してください。・ただし、入院中であっても、基本相談支援の中で支援を継続することが原則です。"},{"s":"gl","p":44,"h":"3-15 サービス担当者会議の開催等によるモニタリングの実施／ Q＆A コーナー｜モニタリングの実施","t":"Q＆A コーナー｜モニタリングの実施モニタリングの実施➀Q アセスメント又はモニタリングに係る訪問については、必ず利用者の居宅、障害者支援施設等、精神科病院（障害児の場合は居宅）を訪問しなければならないこととされているが、利用者の通所先の障害福祉サービス事業所等を訪問して面接を行う場合、アセスメント又はモニタリングとして認められるか。（国 QA 問５）A 利用者が居所において日頃生活している様子や生活環境等を実地で確認する必要があるため、障害福祉サービス事業所等の一時的な滞在場所のみを訪問して面接を行う場合、適切にアセスメント又はモニタリングが行われたものとは認められない。なお、居宅の訪問による面接に加えて、障害福祉サービス事業所等における面接を行った上でアセスメント又はモニタリングを行うことは問題ないため申し添える。"},{"s":"gl","p":44,"h":"3-15 サービス担当者会議の開催等によるモニタリングの実施／ Q＆A コーナー｜モニタリングの実施","t":"モニタリングの実施➁Q 障害福祉サービス等の支給決定は受けたものの、実際の障害福祉サービス等の利用がなかった場合でも、モニタリング月に継続サービス利用支援を行うのか。（国 QA 問 42）A 障害福祉サービス等の利用がない場合でも、モニタリング月には継続サービス利用支援を行い、状況を把握した上でサービス内容の変更等が必要かを判断することとなる。"},{"s":"gl","p":45,"h":"3-16 モニタリング報告書等の作成と交付・提出","t":"※基準第 15 条第３項第２・３号、解釈通知第二の２（11）⑱・⑳■モニタリング報告書の作成とサービス等利用計画の見直し・モニタリングで確認した結果をモニタリング報告書としてまとめます。なお、計画の中心軸（「総合的な援助の方針」「長期目標」「短期目標」）が変わる場合には、事前に必ず区役所に確認した上で、サービス等利用計画案の再作成を行います。（５年間保存）・サービス等利用計画の変更の有無に関わらず、新たに調整等が必要になった場合には、その支援を行うとともに、新たな支給決定もしくは地域相談支援給付決定または変更の決定が必要であると認められる場合には、利用者等に対して支給決定等に係る申請の勧奨を行います。■利用者、サービス提供事業所への説明・同意・交付※別紙の「訪問・計画等交付・サービス担当者会議等実施確認表」使用・作成したモニタリング報告書は、利用者からの同意署名を得て、利用者に写しを遅延なく交付しなければなりません。なお、サービス等利用計画案の再作成を行った場合には、計画案も同様に対応します。"},{"s":"gl","p":45,"h":"3-16 モニタリング報告書等の作成と交付・提出","t":"・サービス提供事業所等からモニタリング報告書の交付を求められた場合には、利用者の同意を得たうえで、その写しを交付します。■区役所への提出※別紙の「訪問・計画等交付・サービス担当者会議等実施確認表」使用・利用者からの同意を得たモニタリング報告書の原本は、区役所に提出します。なお、サービス等利用計画案の再作成を行った場合には、計画案も同様に対応します。区役所への提出書類"},{"s":"gl","p":45,"h":"3-16 モニタリング報告書等の作成と交付・提出／②様式３－２継続サービス等利用計画（週間計画表）（原本）","t":"②様式３－２継続サービス等利用計画（週間計画表）（原本）※②は変更がある場合のみ対応。なお、④を提出する場合は必要に応じて提出。【サービス等利用計画の内容に変更がある場合（支援方針などの中心軸が変わる場合）】※区役所担当者に確認を行った上で下記の対応を実施。"},{"s":"gl","p":45,"h":"3-16 モニタリング報告書等の作成と交付・提出／④様式１－２サービス等利用計画案（週間計画表）（原本）","t":"④様式１－２サービス等利用計画案（週間計画表）（原本）"},{"s":"gl","p":45,"h":"3-16 モニタリング報告書等の作成と交付・提出／⑤【居宅介護等を利用する場合】居宅介護等利用計画表（原本）","t":"⑤【居宅介護等を利用する場合】居宅介護等利用計画表（原本）"},{"s":"gl","p":45,"h":"3-16 モニタリング報告書等の作成と交付・提出／⑥【移動支援等を利用する場合】移動支援等利用計画表（原本）","t":"⑥【移動支援等を利用する場合】移動支援等利用計画表（原本）※利用者には、①～④の写しを渡します。※提出時期：支給決定を受けてサービス担当者会議を開催した後（目安としてはサービス利用が始まって半月以内）"},{"s":"gl","p":46,"h":"3-16 モニタリング報告書等の作成と交付・提出／⑥【移動支援等を利用する場合】移動支援等利用計画表（原本）","t":"補足｜サービス等利用計画の中心軸の変更と軽微な変更・サービス等利用計画の中心軸とは、「総合的な援助の方針」「長期目標」「短期目標」が大きく変わる場合に該当します。・軽微な変更とは、それ以外の部分です。例えば、サービス提供の曜日、回数・量、サービス内容やサービス提供事業所の変更、達成時期の延長などは軽微な変更であり、サービス等利用計画の再作成は不要です。この場合に、サービス等利用計画を再作成しても、計画作成費の請求はできません。"},{"s":"gl","p":47,"h":"3-17 モニタリングの結果、サービス等利用計画案を再作成した後の対応","t":"※基準第 15 条第３項第３号、解釈通知第二の２（11）⑳■受給者証の内容確認利用者に届いた受給者証にて、支給決定されたサービス内容を確認します。併せて、受給者証の写しを保管します。■サービス担当者会議の開催とサービス等利用計画等の作成・変更の支給決定を受けた後に、その変更内容を踏まえて、サービス等利用計画案を具体的な計画にしていきます。そのために、改めてサービス担当者会議を開催し、利用者やサービス提供事業所等とともに、今後の方針や役割等を確認し、サービス等利用計画を確定させます。・確定させた計画について、利用者等に対して説明し、文書により利用者からの同意を得なければなりません。■利用者、サービス提供事業所への説明・同意・交付※別紙の「訪問・計画等交付・サービス担当者会議等実施確認表」使用・利用者からの同意署名を得て確定できたサービス等利用計画については、利用者及びサービス提供事業所に写しを遅延なく交付しなければなりません。"},{"s":"gl","p":47,"h":"3-17 モニタリングの結果、サービス等利用計画案を再作成した後の対応","t":"・相談支援専門員は、サービス提供事業所に対してサービス等利用計画を交付する際に、当該計画の趣旨及び内容等について十分に説明し、共有、連携を図った上で、サービス提供事業所が自ら提供する福祉サービス等の位置付けを理解できるように配慮することが必要です。■区役所への提出※別紙の「訪問・計画等交付・サービス担当者会議等実施確認表」使用・利用者からの同意署名を得て確定させたサービス等利用計画については、区役所にもその写しを提出します。・ただし、サービス等利用計画案から変更がない場合には、その旨を区役所に電話等により報告することで、提出することを省略することが可能です。この対応をした場合には、区役所に連絡した日にちを記録に残してください。区役所への提出書類※計画案から変更がない場合には省略可能"},{"s":"gl","p":47,"h":"3-17 モニタリングの結果、サービス等利用計画案を再作成した後の対応／②様式２－２サービス等利用計画（週間計画表）（写し）","t":"②様式２－２サービス等利用計画（週間計画表）（写し）※提出時期：支給決定を受けてサービス担当者会議を開催した後（目安としてはサービス利用が始まって半月以内）"},{"s":"gl","p":48,"h":"3-18 サービス終了月（更新月）におけるモニタリングの実施","t":"■サービス等利用計画の見直しとモニタリング報告書の作成サービス終了月（更新月）におけるモニタリングでは、モニタリング報告書とともに、モニタリングの結果を踏まえた新しいサービス等利用計画案を区役所に提出することが必要です。それにあたって、支援目標の達成度やサービスの更新の必要性などについて、利用者とサービス提供事業所等とともに、サービス担当者会議の場等を活用し、全体の振り返りを行います。■利用者への説明・同意・交付※別紙の「訪問・計画等交付・サービス担当者会議等実施確認表」使用作成したモニタリング報告書及びサービス等利用計画案は、利用者からの同意署名を得て、利用者に写しを遅延なく交付しなければなりません。■区役所への提出※別紙の「訪問・計画等交付・サービス担当者会議等実施確認表」使用利用者からの同意署名を得たモニタリング報告書及びサービス等利用計画案の原本は、区役所に提出します。"},{"s":"gl","p":48,"h":"3-18 サービス終了月（更新月）におけるモニタリングの実施／②様式３－２継続サービス等利用計画（週間計画表）（原本）※必要に応じて提出","t":"②様式３－２継続サービス等利用計画（週間計画表）（原本）※必要に応じて提出"},{"s":"gl","p":48,"h":"3-18 サービス終了月（更新月）におけるモニタリングの実施／⑤様式１－２サービス等利用計画案（週間計画表）（原本）","t":"⑤様式１－２サービス等利用計画案（週間計画表）（原本）"},{"s":"gl","p":48,"h":"3-18 サービス終了月（更新月）におけるモニタリングの実施／⑥【居宅介護等を利用する場合】居宅介護等利用計画表（原本）","t":"⑥【居宅介護等を利用する場合】居宅介護等利用計画表（原本）"},{"s":"gl","p":48,"h":"3-18 サービス終了月（更新月）におけるモニタリングの実施／⑦【移動支援等を利用する場合】移動等利用計画表（原本）","t":"⑦【移動支援等を利用する場合】移動等利用計画表（原本）※利用者には、①、②、④、⑤の写しを渡します。※提出時期：モニタリング実施月（サービス終了月）の 20 日まで（区役所閉庁日はその前の開庁日まで）補足｜サービス終了月（更新月）におけるモニタリングの実施期間・サービス終了月は、更新手続きが必要であるため、モニタリング報告書及びサービス等利用計画案の提出をモニタリング実施月（サービス終了月）の 20 日まで（区役所閉庁日はその前の開庁日まで）とします。・提出期限の繰り上げに伴い、サービス終了月のモニタリング時のみ、モニタリング実施月の前月 20 日以降のモニタリングを可能とします。・計画相談の利用が終了する場合にも、最後にモニタリングを実施し支援を終結させます。モニタリング実施予定月ではない場合も実施が必要です。（この場合はモニタリング追加依頼書の提出は不要です。）"},{"s":"gl","p":49,"h":"3-18 サービス終了月（更新月）におけるモニタリングの実施／⑦【移動支援等を利用する場合】移動等利用計画表（原本）","t":"第 4 章サービス等利用計画等の作成ポイント【本章の目的】★各書類の目的及び留意事項等を理解し、相談支援の道具として適切に活用する"},{"s":"gl","p":50,"h":"4-1 各書類作成にあたっての基本","t":"■各書類は、相談支援の道具（手段）・相談支援専門員はソーシャルワーカーとして、障害のある人本人（家族）の希望と意思決定を尊重し、地域での生活を実現・継続を支援するとともに、地域全体を発展・創造し、障害のある人の安心できる生活の向上・実現を促進させること（本人と環境のエンパワメント）が役割です。・各書類は、その役割を果たすための相談支援の道具（手段）であり、作成することが目的ではありません。相談支援専門員は、それらの書類を道具（手段）として活用できるようにすることが必要です。■各書類作成過程も、利用者主体のエンパワメントのプロセスであると自覚する・相談支援プロセスは、利用者との共同作業で実施され、全てが本人のエンパワメントの過程です。・このエンパワメントの達成のために、アセスメント、プランニング、モニタリング等の場面においても、本人の状態・ペースに合わせて、共同作業の濃淡を変えながら、利用者と相談支援専門員が一緒に取り組むことが不可欠です。各書類作成過程も同様です。"},{"s":"gl","p":50,"h":"4-1 各書類作成にあたっての基本","t":"■各書類の作成の目的相談支援専門員が作成する支援に関する各書類には、下記のような目的があります。■相談支援専門員が作成する支援に関する各書類の種類・相談支援専門員が作成する書類は、相談支援プロセスに応じて下記の通り存在します。・区役所に提出するものは、下線が引かれている書類のみですが、相談支援の実践にあたっては他の書類も作成されていることが前提です。"},{"s":"gl","p":50,"h":"4-1 各書類作成にあたっての基本／①相談支援の過程を点検し、より適切な相談支援を実施する","t":"①相談支援の過程を点検し、より適切な相談支援を実施する"},{"s":"gl","p":50,"h":"4-1 各書類作成にあたっての基本／③支援者の不在及び変更時であっても、適切な相談支援の継続を保証する","t":"③支援者の不在及び変更時であっても、適切な相談支援の継続を保証する"},{"s":"gl","p":50,"h":"4-1 各書類作成にあたっての基本／④利用者との情報を共有し、コミュニケーションを促進する","t":"④利用者との情報を共有し、コミュニケーションを促進する"},{"s":"gl","p":50,"h":"4-1 各書類作成にあたっての基本／⑥支援活動の内容と結果（影響・成果）を資料として蓄積する","t":"⑥支援活動の内容と結果（影響・成果）を資料として蓄積する※副田あけみ・小嶋章吾（2012）『ソーシャルワーク記録－理論と技法』（第１章ソーシャルワーク記録とは何か）誠信書房より引用"},{"s":"gl","p":51,"h":"4-1 各書類作成にあたっての基本／⑥支援活動の内容と結果（影響・成果）を資料として蓄積する","t":"相談支援プロセス作成する書類記入する内容ポイント（一例）インテーク（受理面接）相談受付票インテーク面接によって得られた情報（基本的属性や状況等）をまとめる・面接を通して、利用者から言語的・非言語的情報を収集し、利用者のイメージを描くとともに、利用者との関係を作ることが大きな目的になる。・インテークにおけるやり取りを通して、利用者のイメージが描けなくてはならない。アセスメント（事前評価）・基礎調査資料・ニーズ整理票利用者の生活の様々な側面や環境、ニーズ等を記入し、どのような支援が必要なのかを事前に評価するためにまとめる・情報収集とアセスメントは、表裏一体の関係にある。・相談支援専門員が把握できている情報を整理し、不足している場合は個別支援会議等により関係者から収集する。・アセスメントでは、国際生活機能分類（ICF）"},{"s":"gl","p":51,"h":"4-1 各書類作成にあたっての基本／⑥支援活動の内容と結果（影響・成果）を資料として蓄積する","t":"の視点で整理した情報を活用し、主訴（表出されている希望）を基に、その背景にある様々な想いを利用者とともに確認し、利用者の気づきを促しながら、ニーズの整理とめざす生活を共有していく。プランニング（目標設定・計画作成）・サービス等利用計画・週間計画表アセスメント結果をもとに、長期目標・短期目標からなる支援計画をまとめる・明らかになったニーズの解決やめざす生活の実現に向けて、取り組む課題と援助の方針等を整理する。・計画は、利用者と一緒に作成するものであり、まずは利用者のストレングスを軸に、利用者自身ができること（役割）を考え、それを補うために関係者ができることを明らかにし、利用者のエンパワメントを図れる計画を作成する。インターベンション（介入）経過記録支援過程における利用者と相談支援専門員の相互の関わりをまとめる・利用者の変化の有無に関わらず、先述した書類作成の目的を踏まえ、支援の経過を残すことが大切である。"},{"s":"gl","p":51,"h":"4-1 各書類作成にあたっての基本／⑥支援活動の内容と結果（影響・成果）を資料として蓄積する","t":"モニタリング（状況確認）モニタリング報告書アセスメントやプランニングの項目ごとの変化をまとめる・計画の達成状況を確認する場面であり、利用者とともに利用者自身の取組の成果や関係者の関わりの効果等を共有することが必要である。・その結果を踏まえて、計画の修正の協議を行い、適宜計画の修正へとつなげていく。エバリュエーション（事後評価）評価シート支援の終結にあたり、支援（過程・効果）全体を振り返り、評価をまとめる・エバリュエーションは、最終的な評価であり、ターミネーションとセットで実施される。・目標達成状況（効果）及び次の見通しを明確にした上で、支援の終結を迎えるにあたっての利用者との合意形成を図ったこと等を記録する。・これらは、経過記録の中でまとめて記載されることもある。ターミネーション（終結）終結シート支援過程全体と終結理由をまとめるその他サービス担当者会議記録等会議等で共有した情報、検討した結果等をまとめる・本人及び関係者がお互いを理解し合い、同じ方向を向いて歩めるように、会議を開催するのと併せて、その記録を残し、欠席者との共有や迷ったときに立ち戻れるものとすることが大切である。"},{"s":"gl","p":52,"h":"4-1 各書類作成にあたっての基本／⑥支援活動の内容と結果（影響・成果）を資料として蓄積する","t":"■作成上の留意点・前提として、相談支援専門員は、根拠に基づく実践をすることが不可欠です。そのために、各書類を整備し、なぜそのような支援を行ったのかという説明責任をいつでも果たせるようにすることが求められます。したがって、自らの備忘録としてではなく、ケースファイル等に残す記録（メモ書きや付箋含む）は、全て公的な文書として扱われる可能性があり、利用者等から文書の提示を求められた場合は、開示対象となることを意識し、第三者（上司、同僚等の職員間、関係機関等）に理解してもらうことを前提として作成しなければなりません。・記録をとること、その活用方法については、利用者の承諾を得ることが不可欠です。・各書類の作成にあたっては、下記のポイントをおさえる必要があります。"},{"s":"gl","p":52,"h":"4-1 各書類作成にあたっての基本／②信頼性","t":"②信頼性内容が客観的な事実に基づいたものか（可能な限り出来事があった直後に記録し正確な内容を担保する）ボールペンなど消えないペンで記載されているか（修正液は使用しない）記録を後に書き換えていないか（記録された内容を書き換える必要がある場合には、追記として別途記載）"},{"s":"gl","p":52,"h":"4-1 各書類作成にあたっての基本／③易読性","t":"③易読性一文を端的に、かつ表現は簡潔明瞭か（流行語や略語は使用しない） 5W1H（いつ、どこで、誰が、何を、どのように、なぜ行ったのか）を活用しながら主観的情報と客観的情報について書き分けているか"},{"s":"gl","p":52,"h":"4-1 各書類作成にあたっての基本／④倫理性","t":"④倫理性利用者の承諾をとっているか表現が独断的・差別的ではないか"},{"s":"gl","p":52,"h":"4-1 各書類作成にあたっての基本／⑥継続性","t":"⑥継続性定期的に記録する（「特変なし」も重要な判断材料）"},{"s":"gl","p":53,"h":"4-2 基礎調査資料","t":"■アセスメントするために必要な情報・相談支援において、「アセスメントは命」であると言われるぐらいに、その後の支援を左右します。なぜなら、アセスメントは、利用者本人の夢や希望する生活を明確にし、その実現に向けて必要なことを確認していくプロセスであり、支援の軸となる部分だからです。・そのプロセスの中で、基礎調査資料は、利用者を総合的に理解するために必要な項目であり、最低限把握しておくべき情報です。国際生活機能分類（ICF）の視点を意識し、情報を整理します。・しかし、この項目を埋めることが大切なのではありません。また、全ての情報を最初から把握することはできません。利用者と関係を構築していく中で、時間をかけて情報を集めていくという気持ちを持つことが大切であり、随時追記・修正をしてください。・また、基礎調査資料には、ニーズを整理する欄が含まれていません。相談支援専門員は、基礎調査資料を基にしながら支援者として捉えたニーズを整理します。そのうえで、面接でのやりとりを通じて、利用者が感じているニーズとのすり合わせをし、利用者と相談支援専門員で取り組むニーズの合意を行うこと（リアルニーズを捉えること）が必要です。"},{"s":"gl","p":53,"h":"4-2 基礎調査資料","t":"ニーズの構造主訴背景にある想い背景にある想い背景にある想い利用者が感じているニーズ（フェルトニーズ）ソーシャルワーカーが捉えたニーズ（ノーマティブニーズ）夢必要なこと希望解決すべき課題面接でのやりとり利用者がめざす生活利用者がめざす生活のために必要なこと（解決すべき課題）背景にある想い利用者と相談支援従事者で捉えたリアルニーズ"},{"s":"gl","p":54,"h":"4-2 基礎調査資料","t":"■作成する基礎調査資料（障害種別に応じて、○がついている書類を作成）帳票名身体障害知的障害精神障害障害児発達障害基礎調査資料１（対象者概要や家族概況等）○○○○○基礎調査資料２（成育歴等）○○○基礎調査資料３（ADL やコミュニケ－ションスキル等）○3-a○3-b○3-c○3-abc から選択○3-abc から選択基礎調査資料４（病歴や社会的活動等）○○○○○■各書類の記載ポイント帳票名ポイント基礎調査資料１・対象者概要：利用者が今までどのような暮らしを営み、今後どのような生活を望んでいるのか、そのためにどのような支援が必要なのか等を簡潔に記載し、利用者を知らない人とも利用者のイメージを共有できるように記載してください。・家族概況：世帯状況を踏まえ、より詳しい家族状況や利用者と家族の関係等を記載してください。"},{"s":"gl","p":54,"h":"4-2 基礎調査資料","t":"基礎調査資料２各ライフステージでのエピソード等を把握していくことで、現状の理解を深めることにつながります。先天性の障害では特に重要ですが、それ以外の障害の場合でも、利用者の理解を深めるために、可能な範囲で把握することが求められます。基礎調査資料３利用者の夢や希望する生活の実現に向けて、今の状況を把握します。ただし、「できる・できない」だけで終わらせずに、利用者のもつ力（ストレングス）を活用したらどうなるか等も意識して、アセスメントの材料になる情報を記載します。基礎調査資料４利用者本人がわくわくする（モチベーションが高まる）計画を作成するにあたり、「趣味や生きがい、楽しみ」といった要素は非常に大切です。障害や病気の状態にだけ着目するのではなく、一人の生活者として捉え、希望する生活を実現できるように、「社会的活動等」の欄も十分に把握してください。"},{"s":"gl","p":55,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬","t":"■サービス等利用計画（案）とはサービス等利用計画（案）とは、生活全体を通した利用者の希望や目標、希望を実現するための課題や必要なサービス等を記載するものであり、利用者のめざす生活の実現に向けた本人及び本人に関わる関係者の共通指針となるものです。■サービス等利用計画（案）作成にあたっての基本姿勢"},{"s":"gl","p":55,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／①特別なことが求められているわけではありません","t":"①特別なことが求められているわけではありません障害の有無に関わらず、一人の人として、自分の力を発揮しながら、いきいきと暮らしていきたいと誰もが願うことです。あえて紙面にまとめることは少ないかも知れませんが、私たちは何かしらの夢や希望をもっており、無意識的にセルフマネジメントしています。サービス等利用計画は、それを紙面に記載したものであり、利用者の夢や希望に向けた利用者と関係者の共通指針となるものです。つまり、その内容は、利用者本人がわくわくする（モチベーションが高まる）内容になっているはずです。"},{"s":"gl","p":55,"h":"4-3 サービス
