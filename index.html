等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／②利用者の人生は、利用者本人が決めて、自ら歩んでいきます","t":"②利用者の人生は、利用者本人が決めて、自ら歩んでいきますサービス等利用計画は、利用者の夢や希望に向けた本人自身による計画です。実現が難しそうな夢や希望であっても、それを目指すかどうかは利用者が決めることであり、相談支援専門員はその実現にいかに近づけるのかを考える立場であって、可否を判断する立場ではありません。そのため、最も重要なのは、利用者本人の役割であり、そこを基本にして関係者が不足している部分を支援していきます。相談支援専門員は、【利用者と一緒に】、本人自身のことや環境のことを確認（アセスメント）し、利用者の気持ちを土台において、本人や環境の強み（ストレングス）を活用したサービス等利用計画を作成していくことが重要です。"},{"s":"gl","p":55,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／③一人一人の計画には個性があります","t":"③一人一人の計画には個性があります当たり前のことですが、人それぞれ異なる夢や希望を抱いており、また個々人がもつ力や取り囲む環境も異なります。だからこそ、サービス等利用計画の内容は、多種多様であり、オリジナリティのある、利用者の個性が見えるものになります。しかしながら、サービス等利用計画の内容を振り返ったときどうでしょうか？利用者の夢や希望が、いつの間にか支援者の視点で現実味をおびた画一的な内容に変わっていませんか？自分事として振り返ってみたとき、そのような計画でわくわくできるでしょうか？"},{"s":"gl","p":55,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／④サービス等利用計画はブラッシュアップされていきます","t":"④サービス等利用計画はブラッシュアップされていきますサービス等利用計画は、本人と長い時間をかけ信頼関係を構築し、アセスメントとモニタリングを繰り返しながら修正していくことが前提です。相談支援専門員は、本人が自分の人生を自ら描"},{"s":"gl","p":56,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／④サービス等利用計画はブラッシュアップされていきます","t":"き、自ら取り組んでみよう！と思えるように働きかけていくことが必要です。そして、いずれはセルフプランに移行していけるよう、利用者のエンパワメントの過程や段階に応じて、徐々に本人の役割を大きく、関係者の役割を小さくしていくことを意識しながら、サービス等利用計画を利用者と一緒に作成していきます。"},{"s":"gl","p":56,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑤計画が本人のものになるように表現を工夫します","t":"⑤計画が本人のものになるように表現を工夫しますいくら利用者本人の気持ちを土台においた計画になっていたとしても、本人が理解できる内容になっていなければ意味がありません。また、利用者の気持ちにぴったりくる言葉で表現できることも大切です。利用者にとって理解しやすく、わかりやすいものになるように、言葉づかいや文字の種類、文字数や大きさなどを変えるとともに、図や絵、写真などを用いていくことも必要です。そして、利用者が積極的に取り組もうと思えるように、本人とともに、本人の強みを生かしたポジティブな内容が求められます。"},{"s":"gl","p":56,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑥定期的に第三者の目を借りて、相談支援専門員自身の振り返りをしま","t":"⑥定期的に第三者の目を借りて、相談支援専門員自身の振り返りをします支援者目線の“独りよがり”な計画になっていないか、定期的に振り返りましょう。相談支援専門員は一人職場が多く、また複数職場であっても個々人の動きに任されてしまいがちな傾向があります。そこで、所内のミーティングで確認するとともに、各区障害者自立支援協議会の相談支援部会や基幹相談支援センターによる定期訪問等を活用し、本人中心の支援及び計画ができているかどうかを振り返り、さらなる向上を目指します。■サービス等利用計画の備えるべき特徴特徴内容"},{"s":"gl","p":56,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／①自立支援計画であること","t":"①自立支援計画であること・地域での自立的な生活を可能とするための計画・自分で自分の生活や生き方を決めていく（自律）計画（意思決定支援）"},{"s":"gl","p":56,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／②総合支援計画であること・多くの領域の社会資源を含んだトータ","t":"②総合支援計画であること・多くの領域の社会資源を含んだトータル（総合的）な計画"},{"s":"gl","p":56,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／③将来計画であること","t":"③将来計画であること・ライフステージを見通した計画・今は実現していない将来実現したい生活、あるいは望む生き方に対する社会参加の視点を含んだ将来計画"},{"s":"gl","p":56,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／④ライフステージを通した一","t":"④ライフステージを通した一貫した支援計画であること・ライフステージ移行時も切れ目のない支援をつなぐ計画"},{"s":"gl","p":56,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑤不足するサービス・資源を","t":"⑤不足するサービス・資源を考える契機であること・地域の弱みを強みに変え、地域に必要な制度やサービスの改善・開発につながる計画"},{"s":"gl","p":56,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑥ネットワークによる協働で","t":"⑥ネットワークによる協働であること・人と人を結ぶネットワークの構築の働きをもつ計画"},{"s":"gl","p":57,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑥ネットワークによる協働で","t":"■記載ポイント本人中心の計画作成であることを意識するために、あえて下記の①～⑩の順番に各項目のポイントを示します。"},{"s":"gl","p":2,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑥ネットワークによる協働で","t":"６５４７８このチェック欄は区役所で記載します。確定させた計画が計画案から変更がない場合には、区に連絡することで確定させた計画の区役所への提出を省略することができます。モニタリング実施月をマルで囲みます。面談日又は同意署名日を記載します。評価時期（モニタリング実施月）の設定理由を記載します。このチェック欄は区役所で記載します。"},{"s":"gl","p":58,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／①利用者及びその家族の生活に対する意向（希望する生活）","t":"①利用者及びその家族の生活に対する意向（希望する生活）・利用者から希望する生活を具体的に確認した上で、表出されている希望（主訴）を書きます。このとき、本人の計画であることを意識し、本人の言葉や表現を使い、前向きな表現で記載します。・家族の意向がある場合には、利用者の意向と分けて記載し、家族の意向に偏らないようにします。相談支援専門員は、利用者の生活の中心が利用者本人であることを自覚し続けることが重要です。"},{"s":"gl","p":58,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／②総合的な援助の方針（本人がめざす生活に沿った支援の方針）","t":"②総合的な援助の方針（本人がめざす生活に沿った支援の方針）・アセスメントによって明らかになった利用者がめざす生活に対して支援者の立場からどのように取り組んでいくのかを明らかにしたものであり、サービス等利用計画の全体的な方針かつ関係者が共通に持つべき共通の方針です。・①表出されている希望（主訴）、②背景にある様々な想い（フェルトニーズ）、③相談支援専門員の気づき（ノーマティブニーズ）から、利用者がめざす生活をイメージできていることが前提です。そのうえで、めざす生活に沿って、どのように支援していくのかという方針を記載します。・めざす生活を導き出すには、面接でのやりとりを通じて、①～③を利用者と相談支援専門員ですり合わせていくことが必要です（4-2 の「ニーズの構造」を参照）。・このとき、安直なゴール設定をせず、具体性のあるものにすることが重要です。使用を避けたい抽象的な言葉としては、安心、安全、安定、維持、管理、継続、健康、自立などが挙げられます。"},{"s":"gl","p":58,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／②総合的な援助の方針（本人がめざす生活に沿った支援の方針）","t":"このような抽象的な言葉で具体的な生活をイメージすることはできません。"},{"s":"gl","p":58,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／③解決すべき課題・優先順位（めざす生活を実現するための本人のニー","t":"③解決すべき課題・優先順位（めざす生活を実現するための本人のニーズ「～したい」）・解決すべき課題は、利用者がめざす生活を実現するために必要なものでなくてはなりません。・利用者が意欲をもって取り組める表現とするために、本人のストレングスの活用やリフレーミング手法による表現を用い、「～したい」などのプラスの表現でわかりやすく記載します。・利用者本人に対する働きかけだけではなく、本人を取り囲む環境に働きかけることも想定して、課題を整理することが必要です。・繰り返しになりますが、利用者本人の計画です。したがって、ここに記載される課題は、利用者と相談支援専門員で合意された内容（合意されたニーズ）が記載されます。・緊急な課題、利用者の動機づけになる課題、すぐに効果が見込まれる課題などを考慮し、本人の希望をもとに、優先順位を設定します。"},{"s":"gl","p":58,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／④課題解決のための本人の役割","t":"④課題解決のための本人の役割・サービス等利用計画は、利用者自身のものであるため、最も重要なのは、本人が役割を果たすことです。そこを基本にして、関係者が不足している部分を支援していきます。・利用者のもつ力（ストレングス）を活かした本人の役割を考えます。その際に、利用者自身が自らその力に気づけるように支援することが必要です。・本人が得意と思えることを中心にすることで、取り組みやすく、さらに成功体験を重ねることで"},{"s":"gl","p":59,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑤課題解決のための関係者の役割（福祉サービス等）","t":"⑤課題解決のための関係者の役割（福祉サービス等）・本人のニーズを満たすために、本人の役割を基本としたうえで、関係者が不足している部分を支援していきます。・そのために、関係者が何をするのか、どのように支援するのかを記載するとともに、福祉サービス等の種類・内容・量（頻度・時間）も記載します。なお、サービス提供事業所がすでに決まっている場合には、それも併せて記載します。"},{"s":"gl","p":59,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑥支援目標・達成時期（達成目標「～する」）","t":"⑥支援目標・達成時期（達成目標「～する」）・支援目標とありますが、サービス等利用計画は本人のものであるため、本人が達成する目標として捉えてください。・解決すべき課題に対して、利用者と関係者で取り組んだことで達成される内容と見通しを記載します。ここでは、達成の可否が明確にわかる具体的な表現（「いつまでに、どうなっているか」など）をすることが必要です。・支援目標の達成を通じ、利用者が自信をつけ、エンパワメントが図られていくことを意識し、達成目標と達成時期を設定してください。"},{"s":"gl","p":59,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑦評価時期","t":"⑦評価時期・支援目標・達成時期を踏まえ、支援の進捗状況を評価すべき時期（より重点的に見直しを図る期間）を検討し、設定してください。"},{"s":"gl","p":59,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑧その他の留意事項及び評価時期の設定理由","t":"⑧その他の留意事項及び評価時期の設定理由・各項目で記載できないこと（その他の取組、役割分担、サービス提供にあたっての留意事項等）を記載します。・この項目も利用者が確認する内容であることを意識し、支援者間での留意事項であったとしても、利用者が了解できる表現を用いることが必要です。・本市では、推奨している３か月に１回のモニタリングの設定及び計画相談支援の新規利用時における当初３か月の毎月モニタリング設定時においてのみ、モニタリング設定理由の記載を省略できるものとして整理します。それ以外の設定期間の場合には、サービス等利用計画案の【その他留意事項】にモニタリングの設定理由を記載してください。"},{"s":"gl","p":59,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑨長期目標・短期目標","t":"⑨長期目標・短期目標・長期目標と短期目標は、解決すべき課題の達成時期との関係を考慮して、設定します。・長期目標は、利用者がめざす生活の具体的なイメージであり、半年～１年で達成可能な目標を設定します。・短期目標は、長期目標の実現のために、３か月程度で達成可能な、利用者がめざす生活への第一歩の目標を設定します。この短期目標を達成することによって、次の目標へのモチベーションの向上につながるため、達成可能な目標を利用者と一緒にたてることが大切です。"},{"s":"gl","p":60,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑨長期目標・短期目標","t":"・ここまでのプロセスを通し、当初に想定した総合的な援助の方針に修正が必要になることもあります。その際には、柔軟に再検討していきます。"},{"s":"gl","p":60,"h":"4-3 サービス等利用計画（案）※基準第 15 条第２項、解釈通知第二の２（11）③～⑬／⑩その他","t":"⑩その他・サービス等利用計画（案）の作成日は、利用者と面談をした日もしくはサービス等利用計画（案）に同意署名をもらった日を記載してください。・モニタリング実施月は、評価時期と連動させて該当月にマルをしてください。複数年にわたる支給決定の場合で、該当年によってモニタリング実施月が異なる場合には、わかるように記載してください。・利用者同意署名欄は、利用者本人による自筆が原則です（18 歳未満の場合には保護者が保護者の氏名で署名）。自筆が難しい場合には、利用者本人の氏名を代筆の上で、さらに代筆者の氏名、続柄や関係性、代筆理由を記載します。"},{"s":"gl","p":61,"h":"4-4 週間計画表","t":"■週間計画表とは週間計画表とは、サービス等利用計画で示された具体的支援内容を週単位で表したスケジュール表です。サービス等利用計画と週間計画表は対の関係になります。■週間計画表の意味利用者がめざす生活の実現のために、本人及び関係者がどのように行動するのかが一目で分かるものであるとともに、本人の生活がどのように変化するのかを共有するものです。週間計画表によって、本人や関係者がより具体的に本人の生活や支援を共有するため、サービスの羅列だけではなく、生活全体がわかるように具体的に記載（誰が・いつ・何をしているのかも含む）することが必要です。１週間を通して見る中で、支援の不足がないか、無理のない生活になっていないかを俯瞰し、適宜修正します。■記載ポイント※以下、神奈川県相談支援従事者初任者研修（横浜市）の資料を基に記載。"},{"s":"gl","p":62,"h":"4-4 週間計画表／①タイムスケジュール","t":"①タイムスケジュール・一週間の生活実態全体を把握できるように、インフォーマルな社会資源も含めて、本人及び関係者がいつ何をするのか、サービスが入らない時間に本人が何をしているのか等を記載します。"},{"s":"gl","p":62,"h":"4-4 週間計画表／②主な日常生活上の活動","t":"②主な日常生活上の活動・週間計画表に書ききれなかった情報や一日の生活の中で習慣化していること、楽しみや趣味など生活の豊かさに関わる内容も記載します。"},{"s":"gl","p":62,"h":"4-4 週間計画表／③週単位以外のサービス","t":"③週単位以外のサービス・隔週、不定期または一時的に利用しているサービス（フォーマル、インフォーマルなサービス全て）とともに、医療機関への受診状況等を記載します。"},{"s":"gl","p":62,"h":"4-4 週間計画表／④サービス提供によって実現する生活の全体像","t":"④サービス提供によって実現する生活の全体像・障害福祉サービス等の利用が利用者にとっての生活にどのような効果をもたらすのかを含め、相談支援専門員としての総合的な判断を記載します。"},{"s":"gl","p":63,"h":"4-5 モニタリング報告書","t":"■モニタリングとはモニタリングとは、サービス等利用計画通りにサービスが提供されているか、利用者のめざす生活の実現に向けて解決すべき課題が解消されているか、利用者が満足しているか、新たなニーズが発生していないか等を確認し、必要であれば計画を修正し、利用者本人を含めたチームとしての取組を継続・更新していくためのものです。■モニタリングの基本的な視点・大切なのは、利用者本人が自分で自分をモニタリングすることです。・繰り返しになりますが、利用者の人生は、利用者本人が決めて、自ら歩んでいきます。そのため、モニタリングも相談支援専門員が一方的に行うのではなく、本人が今の生活に満足できているかどうかを自己点検することが大切です。そのため、本人との面談は必須であるとともに、より客観的に状況を把握し、かつチームとしての方向性を共有していくためにも、利用者と関係者が一同に会して状況を確認することが重要です。"},{"s":"gl","p":63,"h":"4-5 モニタリング報告書","t":"・サービス等利用計画は、本人と長い時間をかけ信頼関係を構築し、アセスメントとモニタリングを繰り返しながら修正していくことが前提です。当初のサービス等利用計画は、利用者と相談支援専門員の信頼関係が十分に作られていない中で作成されていますので、初期のモニタリングではほとんどの場合で修正が必要になります。支援目標（達成目標）の達成状況や新たなニーズ、生活の変化、心身の状況の変化等を踏まえて、本人のめざす生活や目標を見直していきます。・計画の中で達成されている目標があれば終了し、新たに対応すべき内容があれば、モニタリング報告書の中に追加記載します。その変化の内容が総合的な援助の方針に関わる場合には、区役所に確認の上で、サービス等利用計画も新たに作成します。【モニタリング報告書への新たな目標の記載例】支援目標（達成目標）支援目標（達成目標）の達成度今後の課題・解決方法●●できるようになる。"},{"s":"gl","p":63,"h":"4-5 モニタリング報告書","t":"●●はできるようになり、支援目標が達成された。支援目標の達成に伴い、新たな支援目標として「▲▲できるようになる」を設定。本人は■■、関係者は◆◆の役割を担って取り組む。"},{"s":"gl","p":64,"h":"4-5 モニタリング報告書","t":"■記載ポイント※以下、神奈川県相談支援従事者初任者研修（横浜市）の資料を基に記載各項目のポイントを示します。"},{"s":"gl","p":64,"h":"4-5 モニタリング報告書／①全体の状況","t":"①全体の状況・総合的な援助の方針に対する取り組み過程、その結果としての評価、現在の生活実態・支援による利用者の自立度・生活環境の変化等を踏まえた今後の取組の方向性について記載します。"},{"s":"gl","p":64,"h":"4-5 モニタリング報告書／②サービス等提供状況","t":"②サービス等提供状況・サービス提供の内容、頻度、事業者としての意見等について、サービス提供事業所から聞き取り記載します。聞き取りにあたっては、「いつ」「誰に」「どのように」確認したのかも併せて記載します。"},{"s":"gl","p":65,"h":"4-5 モニタリング報告書／③本人の感想・満足度","t":"・利用者の感想・満足度は、できるだけ利用者の言葉や表現で記載します。・言葉でのコミュニケーションが難しい場合は、サービス提供を受けた利用者の様子や状態などから推測していくこともあります。その場合には、「いつ」「誰に」「どのように」確認したのかも併せて記載します。"},{"s":"gl","p":65,"h":"4-5 モニタリング報告書／④支援目標（達成目標）の達成度（ニーズの充足度）、今後の課題・解決方法（いつ誰","t":"④支援目標（達成目標）の達成度（ニーズの充足度）、今後の課題・解決方法（いつ誰が何をするか）・利用者、サービス提供事業所からの聞き取りや相談支援専門員としての見立てを踏まえ、個別支援会議等で支援目標の達成度について関係者全員で評価した結果を記載します。・未達成の支援目標については今後達成するための具体的な方策を検討し、達成した支援目標については新たな支援目標を設定し、今後の課題・解決方法に「いつ誰が何をするか」と具体的に記載します。"},{"s":"gl","p":65,"h":"4-5 モニタリング報告書／⑤計画変更の必要性とその他留意事項","t":"⑤計画変更の必要性とその他留意事項・評価を踏まえた計画変更の必要性について記載します。・計画変更の必要がある場合には、サービス種類・量、週間計画の何を変更するのかを確認し、留意事項に具体的な変更内容・理由を記載します。・新たな目標を設定した場合には、その追加理由やそれに伴う変更事項等を記載してください。"},{"s":"gl","p":65,"h":"4-5 モニタリング報告書／⑥その他","t":"⑥その他・モニタリング実施方法は、【①個別支援会議開催、②その他】に、それぞれの詳細を記載してください。①個別支援会議開催には、会議実施日、場所、開始・終了時刻、出席者（氏名、所属、職種）を記載し、②その他には、その対応内容を具体的に記載します。例えば、利用者等の居宅に訪問し面談を実施した場合は、実施日と場所、時間、本人含め面談者を記載します。居宅での面談以外にも対応した場合は、対応内容となぜその方法を選択したのかという理由も明記してください。・モニタリング報告書のモニタリング実施日は、利用者と面談をした日もしくはモニタリング報告書に同意署名をもらった日を記載してください。・次回モニタリング実施月欄は、利用者及び関係者で再確認するために、記載してください。・利用者同意署名欄は、利用者本人による自筆が原則です（18 歳未満の場合には保護者が保護者の氏名で署名）。自筆が難しい場合には、利用者本人の氏名を代筆の上で、さらに代筆者の氏名、続柄や関係性、代筆理由を記載します。"},{"s":"gl","p":66,"h":"4-6 アセスメントやサービス担当者会議、連絡調整等に関する経過記録","t":"■経過記録に係る基本姿勢・相談支援専門員が作成するサービス等利用計画及びモニタリング報告書は、支援の一場面でのみ作成され、日頃の基本相談支援での関わりは経過記録に記載されます。繰り返しになりますが、相談支援専門員は、根拠に基づく実践をすることが不可欠です。そのために、各書類を整備し、なぜそのような支援を行ったのかという説明責任をいつでも果たせるようにすることが求められます。・経過記録は、他の人が読んでも分かるよう客観的に、利用者の言動や相談支援専門員の対応などの事実と相談支援専門員の所見等を分けて記載します。最後に記入者の署名を行います。"},{"s":"gl","p":67,"h":"4-7 区役所への提出資料一覧表","t":"※●は必須、〇は必要に応じて提出「サービス等利用計画」の様式その他様式 1-1 様式 1-2 様式 2-1 様式 2-2 様式 3-1 様式 3-2サービス等利用計画案週間計画表基礎調査資料サービス等利用計画週間計画表モニタリング報告書週間計画表"},{"s":"gl","p":67,"h":"4-7 区役所への提出資料一覧表／①支給決定前●（原本）●（原本）●（写し）●（計画相談支援","t":"①支給決定前●（原本）●（原本）●（写し）●（計画相談支援依頼（変更）届出書、居宅介護等利用計画表等）"},{"s":"gl","p":67,"h":"4-7 区役所への提出資料一覧表／③","t":"③モニタリング特に変更なし●（原本）サービス提供の曜日や時間帯等の軽微な変更○（写し）●（原本）●（原本）サービスの種類や量等の軽微な変更かつ支給決定の変更手続きが必要○（写し）●（原本）●（原本）●（変更申請書、居宅介護等利用計画表等）援助方針や長期・短期目標等の計画の中心軸の変更●（原本）●（原本）○（写し）〇（写し）※支給変更決定後に提出〇（写し）※支給変更決定後に提出●（原本）○（原本）●（変更申請書、居宅介護等利用計画表等）※支給決定に変更がある場合のみ申請書を提出"},{"s":"gl","p":67,"h":"4-7 区役所への提出資料一覧表／④サービス終","t":"④サービス終了月（サービスの更新）●（原本）●（原本）○（写し）●（原本）○（原本）●（申請書、居宅介護等利用計画表等）"},{"s":"gl","p":68,"h":"4-8 モデルプラン","t":"■基礎調査資料、サービス等利用計画の完成イメージの共有・ここでは、先述した内容を踏まえながら、モデル事例に基づく基礎調査資料及びサービス等利用計画の記入例を提示します。・基礎調査資料については、各項目のポイントについて吹き出しで示しています。・サービス等利用計画については、主訴に基づくサービス等利用計画（もうひと頑張りのプラン）とアセスメントに基づくサービス等利用計画（目指すプラン）の両方を提示しています。両者を比較して違いを認識することで、【アセスメントに基づくサービス等利用計画（目指すプラン）】のイメージを具体的にし、実践に生かしてください。・なお、繰り返しになりますが、基礎調査資料は利用者を総合的に理解するために必要な項目であり、最低限把握しておくべき情報です。しかし、ニーズを整理する欄が含まれていません。本来は、基礎調査資料とサービス等利用計画の間のプロセスとして、「利用者が感じているニーズ」と「相談支援専門員が捉えたニーズ」を整理し、面接でのやりとりを通じて利用者がめざす生活及びそのために必要なこと（解決すべき課題）を明らかにすることが必要です。"},{"s":"gl","p":68,"h":"4-8 モデルプラン／②相談経過","t":"②相談経過Ｙさん（32 歳）女性生活状況：市内 M 区にアパートで単身生活、同区内に両親が生活している（父 66 歳・母 63歳）、兄 38 歳は結婚し、他県で生活している（妻と息子２人）手帳、収入：精神保健福祉手帳（２級）、障害厚生年金２級（110,000 円程度）、パート就労の賃金(月 30,000＋α円程度)就労の状況：3 回/W 3～5 時間家電の部品組み立て工場に勤務しているその他：アパートの家賃 75,000 円の内 30,000 円を親が負担している「働く時間を増やしてより自立した生活が送れるようになりたい」と本人からの相談が入りました。相談支援専門員としては、現在就労中であり、現在の生活を維持していくことで十分ではないかと考えました。しかし、相談に来たＹさんの疲れた様子から現在の生活を見直す必要があるのではないかと感じました。"},{"s":"gl","p":69,"h":"4-8 モデルプラン／②相談経過","t":"基礎調査資料１(共通）事業者名：作成日(相談経過・現状と課題等)父66才母63歳区内徒歩10分38才他県に居住※公的支援(障害福祉サービス、地域相談支援、介護保険等）及びその他の支援状況について記載その他、○区の生活支援センターに不定期で通っている。パート就労の勤務先には、自身の病気や障害者手帳のことは隠して勤務している。ＢＭＴＳＨ年月日計画相談支援担当者5 単親世帯（） 6 その他（）年金生活主な収入：給与年金（障害厚生年金２級約11万円）労災生活保護その他（パート就労 3～40,000円程度）世帯形態○○○○パート就労現況生年月日 M T S H 年月日生（ 32 歳）障害者情報：発達障害・高次脳機能障害・その他（）判定（診断)機関：性別転々としながら、２～３か月の入退院を繰りかえしていた。この頃から区福祉保健センターＭＳＷが関わり始める。"},{"s":"gl","p":69,"h":"4-8 モデルプラン／②相談経過","t":"28歳でＧ病院のデイケアに通うもすぐに中断。Ｈ病院に転院し、精神保健福祉手帳２級を取得。その後、作業所通所を開始し、しばらく安定して通所していた。31歳の時、親の進めてアパートでの単身生活開始。今年から、家電の部品手帳等情報等要介護度：認定有効期限：年月日まで被保険者番号：未申請・非該当・申請中障害支援区分：区分２認定有効期限：年月日まで受給者証番号：未申請・非該当・申請中健康保険：国保（本人・家族）社保（本人・家族）医療扶助（生活保護）ＣＭＴＳＨＭＴＳＨ単身生活対象者概要有無申請中身障手帳：障害名種級県・市（No ）年月日交付ＹＡＭＴＳＨ氏名続柄氏名 Y 様住所職業○○区○○℡（）"},{"s":"gl","p":69,"h":"4-8 モデルプラン／②相談経過","t":"女1 単身 2 夫婦のみ 3 子ども世帯と同居（ａ同一世帯ｂ二世帯） 4 親族と同居（親兄弟姉妹その他）備考（連絡先、職業、健康状態等）在宅介護者同別居組み立てのパート就労を開始し、３か月が経過。働く時間を増やして自立したいとのことで相談に繋がる。精神保健福祉手帳：２級交付日年月日診断名（統合失調症）愛の手帳：県・市（No ）年月日交付程度（）次回判定年月：年月判定機関：短大卒業後、20歳でスーパーマーケットの経理の仕事に就くも、24歳頃から体調不良、感情の不安定さ、幻聴が出現しＥ病院で統合失調症と診断され、２か月入院し退職。退院後は在宅での引きこもり状態となり、Ｅ、Ｆ、Ｇの病院を家族概況同・別世帯状況生年月日母本人同・別同・別◎同・別兄同・別父○名称備考"},{"s":"gl","p":69,"h":"4-8 モデルプラン／②　家事援助","t":"②家事援助支援の状況※提供機関・提供者支援内容頻度ＭＴＳＨ主婦兄は結婚し、他県で生活（妻、息子二人）備考家族構成両親は健在で、区内に在住。徒歩10分の距離に居住兄は結婚し、他県で生活している。ふりがな（主◎従○)対象者の全体像が捉えられるような記載に努めます。これまでの経過、相談に繋がった経過などを記載します。基礎調査資料は、面接等で把握した内容を基礎情報として整理し、記録するツールです。当初からすべての項目を埋める必要はありません。面接やモニタリングを繰りかえすことで必要な情報を追記してください。現在、提供されている支援内容を記載します。頻度等についても記載しますその他の項目注意すべき内容など、備考欄を活用してくださいR区生活支援センター◎ジェノグラムを記入します。（対象者に関わる家族関係で分かる範囲について記入）"},{"s":"gl","p":69,"h":"4-8 モデルプラン／②　家事援助","t":"男を□、女を〇で表示し、本人は二重線（例：◎）で表示します。きょうだいは左から出生順に書きます。死亡者は塗りつぶすか、×をつけます。（例：■）離別は斜線（／）をつけます。同居者を線で囲みます。"},{"s":"gl","p":72,"h":"4-8 モデルプラン／②　家事援助","t":"基礎調査資料４（共通）氏名：Ｙ様平成年月日記入者：○○○○24歳統合失調症Ｅ病院体調不良、感情の不安定さ、幻聴等の症状が出現し、入院。統合失調症の診断24歳～28歳Ｆ病院病院を転々、体調が悪くなると２～３か月の入院を繰りかえすＧ病院 28歳時に、Ｇ病院のデイケアに通う。29歳頃Ｈ病院～現在精神保健福祉手帳２級を取得現在、２週間に１回の通院。自立一部介助全介助朝、昼、眠前に服薬あり1 有ＭＲＳＡ疥癬結核緑膿菌その他2 無不調時には意欲が低下する、会話が成立しない機能障害の程度・皮膚の状態不定愁訴も多くなる（麻痺・関節の状態・発赤・浮腫・褥創等）義歯：有（合う合わない痛む）・無歯痛（有・無）しみる（有・無）"},{"s":"gl","p":72,"h":"4-8 モデルプラン／②　家事援助","t":"動揺痛（有・無）歯肉の炎症（有・無）口臭（有・無）食物残査（有・無）1 普通 2 まあまあ眠れる 3 あまり眠れない（※児童・知的障害・発達障害については省略可（基礎調査資料2作成による））市内Ｍ区で出生。県立高校卒業後、短大に進学。□飲む■飲まない短大卒学生時代は音楽が好きで音楽サークルに所属※一日の酒量等短大卒業後、スーパーマーケットに就職し、経理の仕事に就くも、体調を崩し入院、退職。28歳時に、Ｇ病院のデイケアに通うが、６か月で中断となる。31歳で地域作業所に通所し、32歳からパート就労開始。□吸う■吸わない※一日の喫煙量等1 ない 2 ときどきある 3 ある起床朝食夕食就寝月・水・金パート就労夕食後は音楽を聴いて過ごす昼食パート就労日以外は、家事をしたり買い物に出たりして過ごす。"},{"s":"gl","p":72,"h":"4-8 モデルプラン／②　家事援助","t":"パート就労と通院以外の社会参加はない単身生活を送っているが、何かと理由をつけて実家に戻ることが多い。アパートの隣人の生活音がうるさいと感じている。以前の作業所には気に入っている職員がいた。音楽が好き。親から離れて生活できていることが社会で生活するうえで重要であると親から言われている楽しみ知人・近所との交流集団への不適応役割・日課既往・現病歴服薬状況身体状況18:00内服一般状態栄養状態睡眠時間その他睡眠病名医療機関時期現在の主治医はTEL・往診の有無内容（受診状況など）口腔状態感染症嗜好飲酒喫煙社会的活動等生活歴趣味生きがい外出頻度外出先相談相手12 241日の過ごし方家庭内での0 7:30 8:30 10:00 16:00 22:00既往・現病歴は細かい記載が必要です。（障害像によって）"},{"s":"gl","p":72,"h":"4-8 モデルプラン／②　家事援助","t":"主治医氏名、連絡先も分かる範囲で記載します。生活歴については、細かく把握した場合は「基礎調査資料２（成育歴等）」に記載していただいても構いません。社会的活動には、本人のストレングスにつながるキーワードや、趣味、楽しみ等について記載をしてください。支援計画のポイントとなる場合があります。"},{"s":"gl","p":73,"h":"4-8 モデルプラン／②　家事援助","t":"主訴に基づくサービス等利用計画（もうひと頑張りのプラン）アセスメントに基づくサービス等利用計画（目指すプラン）"},{"s":"gl","p":74,"h":"4-8 モデルプラン／②　家事援助","t":"第５章指定特定相談支援事業者の基準及び留意点【本章の目的】★指定特定相談支援事業者の基準の順守による相談支援の提供体制を整備する"},{"s":"gl","p":75,"h":"5-1 基準の性格※解釈通知第一","t":"■基準は必要最低限度の内容・基準は、計画相談支援の事業がその目的を達成するため、必要な最低限度の基準を定めたものであり、指定特定相談支援事業者は、常にその事業の運営の向上に努めなければなりません。・指定特定相談支援事業者が満たすべき基準を満たさない場合には、指定特定相談支援事業者の指定を受けられず、また、運営開始後、基準に違反することが明らかになった場合は、市町村長の指導等の対象となり、この指導等に従わない場合には、当該指定を取り消すことができます。・指定特定相談支援事業者が運営に関する基準に従って事業の運営をすることができなくなったことを理由として指定が取り消され、法に定める期間の経過後に再度当該事業者から指定特定相談支援事業所についての指定の申請がなされた場合には、当該事業者が運営に関する基準を遵守することを確保することに特段の注意が必要であり、その改善状況等が確認されない限り指定を行いません。"},{"s":"gl","p":75,"h":"5-1 基準の性格※解釈通知第一","t":"※本章に掲載している内容以外の基準事項等は、その内容に合わせて、第３章をはじめとした各章に記載しています。本章のみならず、本ガイドライン全体を確認し、基準等の把握と遵守をお願いします。"},{"s":"gl","p":76,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）","t":"■管理者・指定特定相談支援事業者は、指定特定相談支援事業所ごとに専らその職務に従事する管理者を置かなければなりません。・ただし、当該事業所の管理業務上支障がない場合は、当該指定特定相談支援事業所の他の職務に従事させ、又は他の事業所、施設等の職務に従事させることができます。また、指定障害児相談支援事業所の業務と兼務する場合については、管理業務に支障がない場合として認めます。・ただし、以下の場合であって、当該事業所の管理業務に支障がないときは、当該指定特定相談支援事業所の他の業務や、併設する事業所の業務等を兼ねることができるものとします。ア当該指定特定相談支援事業所の従業者としての業務に従事する場合イ当該指定特定相談支援事業所以外の他の事業所の管理者又は従業者としての業務に従事する場合であって、当該他の事業所の管理者又は従業者としての業務に従事する時間帯も、当該指定特定相談支援事業所の利用者へのサービス提供の場面等で生じる事象を適時かつ適切に把握し、職員及び業務の一元的な管理・指揮命令を支障なく行うことができ、また、事故発生時等の緊急時の対応について、あらかじめ対応の流れを定め、必要に応じて管理者自身が速やかに出勤できる場合また、当該指定特定相談支援事業所に併設され、一体的に管理運営する事業所における管理者又は指定障害児相談支援事業所、指定自立生活援助事業所若しくは指定一般相談支援事業所の業務と兼務する場合については、管理業務に支障がない場合として認めるものとします。"},{"s":"gl","p":76,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）","t":"・なお、管理者は、相談支援専門員である必要はありません。補足｜管理者の責務※基準第 15 条第１項第１号・18 条、解釈通知第二の２（15）・法の基本理念を踏まえた利用者本位のサービス提供を行うため、利用者へのサービス提供の場面等で生じる事象を適時かつ適切に把握しながら、当該指定特定相談支援事業所の相談支援専門員その他の従業者の管理、計画相談支援の利用の申込みに係る調整、業務の実施状況の把握その他の管理を一元的に行わなければなりません。・当該指定特定相談支援事業所の相談支援専門員その他の従業者に運営基準を順守させるため必要な指揮命令を行います。・相談支援専門員に基本相談支援に関する業務及びサービス等利用計画の作成に関する業務を担当させなければなりません。"},{"s":"gl","p":77,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）","t":"■相談支援専門員【配置基準】・指定特定相談支援事業者は、当該指定に係る特定相談支援事業所ごとに専らその職務に従事する相談支援専門員を必ず１人以上置かなければなりません。相談支援専門員は、原則として、サービス提供時間帯を通じて当該サービス以外の職務に従事させてはいけません。この場合のサービス提供時間帯とは、相談支援専門員の当該事業所における勤務時間をいうものであり、当該相談支援専門員の常勤・非常勤の別を問いません。【兼務】・当該業務に支障がない場合は、相談支援専門員を当該指定特定相談支援事業所の他の業務又は他の事業所、施設等の業務に従事させることができます。・なお、指定障害児相談支援事業所、指定一般相談支援事業所、指定自立生活援助事業所、障害者相談支援事業等の業務と兼務する場合については、業務に支障がない場合として認めるものとします。"},{"s":"gl","p":77,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）","t":"【兼務にかかる留意点】・計画相談支援の実施に当たっては、中立公正性を担保することが重要です。・相談支援専門員が担当する利用者が利用するサービス提供事業所等の職員と兼務する場合（指定自立生活援助事業所を除く）については、サービス提供事業所等との中立性の確保や、サービス提供事業所等と異なる視点での検討が欠如しかねないことから、当該利用者が利用するサービス提供事業所の業務と兼務しない相談支援専門員が継続サービス利用支援を実施することを基本とします。（支給決定の更新又は支給決定の変更に係るサービス利用支援について同じです。）ただし、下記に掲げる場合を除きます。"},{"s":"gl","p":77,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／②支給決定又は支給決定の変更によりサービス内容に著しく変動があった","t":"②支給決定又は支給決定の変更によりサービス内容に著しく変動があった者のうち、当該支給決定等から概ね３か月以内の場合（指定サービス利用支援とその直後の指定継続サービス利用支援は一体的な業務であること、また、指定特定相談支援事業者の変更に当たっては利用者が別の事業者と契約を締結し直すことが必要となるため、一定期間を猶予する。）"},{"s":"gl","p":77,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／③その他市町村がやむを得ないと認める場合","t":"③その他市町村がやむを得ないと認める場合※本市においては、指定特定相談支援事業者が不足している状況を受け、相談支援専門員が担当する利用者が利用するサービス提供事業所の職員との兼務を認めています。ただし、当該利用者の【直接支援】に携わる場合には、【兼務不可】とし、モニタリング等を行うことは認めておらず、管理者等で直接支援に携わらない場合においてのみ特例的に可能としています。相談支援専門員としての中立公平な立場を確保することを基本とした上で、兼務での対応が必要な場合にはご注意ください。直接支援に携わらない場合とは、直接支援の実態のみで判断するのではなく、職員の配置上においても直接支援を担当する職員として計上されていないことをいいます。ただし、訪問系サービスで利用者の担当が固定されている場合や、日中系サービスで勤務日が交わらない場合など、直接支援に携わらないことが明確な場合はモニタリング等を行うことは可能としています。"},{"s":"gl","p":78,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／③その他市町村がやむを得ないと認める場合","t":"しえｎ補足｜相談支援専門員の資格・相談支援専門員になるには、①実務経験要件を満たしていること、②相談支援従事者初任者研修を修了していることの２つの条件を満たしていることが必要です。※実務経験要件：施設等において、相談支援業務で通算５年または直接支援業務で通算 10 年（特定の有資格者である場合は３年または５年）の実務経験があること。・この２つの条件を満たした方が指定特定相談支援事業所で計画相談支援を担うことができます。つまり、条件を満たさない方は、相談支援専門員の業務を行うことができません。・なお、相談支援従事者初任者研修を修了した後も、研修を修了した翌年度から起算して５年ごとに相談支援従事者現任研修を受講し続けないと、資格が失効します。補足｜人員の変更や増員に伴う対応管理者や相談支援専門員が変更・増員する場合には、必ず変更の日から 10 日以内に横浜市に変更届を提出する必要があります。登録されていない状況では、活動することはできません。"},{"s":"gl","p":78,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／③その他市町村がやむを得ないと認める場合","t":"※変更届は、障害福祉情報サービスかながわのホームページに掲載しています。トップページ＞書式ライブラリ＞２．横浜市からのお知らせ＞③変更等に関する届出等様式（障害者総合支援法）補足｜相談支援専門員の標準数※基準第３条第２・３項、解釈通知第二の１（１）②相談支援専門員の配置は、１か月平均の利用者の数が 35 件に対して１人を標準とし、利用者の数が 35 件又はその端数を増すごとに増員することが望ましいです。ここでいう「１か月平均」とは、当該月の前６月間の平均値であり、「利用者の数」とは、指定サービス利用支援又は指定継続サービス利用支援を提供した計画相談支援対象障害者等の数を指し、指定特定相談支援事業所が指定障害児相談支援事業所も一体的に運営している場合には、障害児支援利用援助又は継続障害児支援利用援助を提供した障害児相談支援対象保護者の数も含みます。ただし、新規に指定を受ける場合は、推定数とします。"},{"s":"gl","p":78,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／③その他市町村がやむを得ないと認める場合","t":"現任研修を受講する際は「２年以上の相談支援への従事」していることが要件です。適用については、①または②のどちらかに該当しますので、確認してください。"},{"s":"gl","p":78,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／①令和２年度以降に初任者研修を受けた方は、その後受講する現任研修か","t":"①令和２年度以降に初任者研修を受けた方は、その後受講する現任研修から適用。"},{"s":"gl","p":78,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／②令和元年度までに相談支援専門員の資格を取得しており、令和２年度以","t":"②令和元年度までに相談支援専門員の資格を取得しており、令和２年度以降に１回目に受講する研修では適用なし。２回目以降から適用。"},{"s":"gl","p":79,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／ Q＆A コーナー｜相談支援専門員の業務 / 兼務によるモニタリン","t":"Q＆A コーナー｜相談支援専門員の業務 / 兼務によるモニタリングの制限相談支援専門員の業務Q 相談支援専門員の資格を有しておらず、相談支援員でもない補助職員が計画を作成し、相談支援専門員が管理監督した計画を利用者に交付することは可能か。可能であれば、計画作成担当者は、補助職員となるのか、相談支援専門員となるのか。（国 QA 問４）A サービス等利用計画を作成するのは、相談支援専門員である。補助職員は相談支援専門員の指示の下に補助的業務を行うものである。なお、必ず相談支援専門員が自ら行わなければならない業務は、以下のとおりである。・居宅等への訪問による利用者等に対するアセスメント及びモニタリングの実施・サービス等利用計画（案）の作成・利用者等へのサービス等利用計画（案）等の説明・サービス担当者会議における利用者等及びサービス担当者への質問・意見の聴取なお、相談支援員については、以下の業務を行うことを可能としている。（指定基準第 15 条第２項第１号から第９号及び第３項（第３条第５号による読み替え）参照）"},{"s":"gl","p":79,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／ Q＆A コーナー｜相談支援専門員の業務 / 兼務によるモニタリン","t":"・サービス等利用計画の原案の作成（利用者へのアセスメントを含む）・モニタリングこの場合、サービス等利用計画の作成者は相談支援専門員となり、モニタリングの担当者は相談支援員となる。兼務によるモニタリングの制限①Q 「相談支援専門員がサービス提供事業所の職員と兼務する場合のモニタリング等の取扱い」については、相談支援専門員が担当する障害者等に直接サービス提供を行うか否かに関わらず、当該相談支援専門員が、担当する障害者等が利用するサービス提供事業所の職員と兼務する場合は、当該相談支援専門員がモニタリング等を行うことは望ましくないとの考えか。（国 QA 問 43）A お見込みのとおり。兼務によるモニタリングの制限②Q 「相談支援専門員がサービス提供事業所の職員と兼務する場合のモニタリング等の取扱い」については、障害者等が当該相談支援専門員を希望する場合は、「市町村がやむを得ないと認める場合」として、引き続き当該相談支援専門員によるモニタリング等を認めてよいか。（国 QA 問 44）"},{"s":"gl","p":79,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／ Q＆A コーナー｜相談支援専門員の業務 / 兼務によるモニタリン","t":"A 障害者等が希望する場合であっても、サービス提供事業所との中立性の確保やサービス提供事業所の職員と異なる視点での検討が欠如しかねず望ましくないため、当該障害者等に制度の趣旨を説明し理解を求めること。"},{"s":"gl","p":80,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／ Q＆A コーナー｜相談支援専門員の業務 / 兼務によるモニタリン","t":"■相談支援員【事業者要件】・指定特定相談支援事業者は、次に掲げる要件をいずれも満たす場合には、相談支援員を置くことができます。なお、相談支援員を配置している期間において継続的に満たすことを要するが、やむを得ない理由により一時的に要件を満たさない場合であって、かつ、今後速やかに要件を満たすことが見込まれる場合には、この限りではありません。ａ当該指定特定相談支援事業所が機能強化型サービス利用支援費の算定要件を満たしている。ｂ当該指定特定相談支援事業所に配置される主任相談支援専門員により、相談支援員に対して指導及び助言が行われる体制が確保されている。具体的には、次に掲げるいずれの要件も満たす体制が整備されていることとします。(a) 利用者に関する情報又はサービス提供に当たっての留意事項に係る伝達等を目的とした会議の開催(b) 全ての相談支援員に対する主任相談支援専門員の同行による研修の継続的な実施(c) 当該相談支援事業所の全ての相談支援員に対する、地域づくり、人材育成、困難事例への対応などサービスの総合的かつ適切な利用支援等の援助技術の向上等を目的とした指導、助言【相談支援員の要件】・専ら当該指定特定相談支援事業所の職務に従事する者である者であって、社会福祉士又は精神保健福祉士の資格を有するものであることが必要です。"},{"s":"gl","p":80,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／ Q＆A コーナー｜相談支援専門員の業務 / 兼務によるモニタリン","t":"【相談支援員の兼務】・原則として、サービス提供時間帯を通じて当該サービス以外の業務に従事させてはなりません。・ただし、一体的に管理運営される指定障害児相談支援事業所、指定一般相談支援事業所、指定自立生活援助事業所に従事させることはできるものとしています。相談支援員の兼務に係る留意は、相談支援専門員の兼務規定と同様である。兼務によるモニタリングの制限③Q 相談支援専門員がサービス提供事業所の職員と兼務する場合は、兼務する事業所の利用者のモニタリングを実施することができないこととされているが、同一法人の他の事業所を利用する利用者のモニタリングは実施できるということでよいか。（国 QA 問 45）A お見込みのとおり。"},{"s":"gl","p":81,"h":"5-2 人員基準｜従業者・管理者※基準第３・４条、解釈通知第二の１（１）・（２）／ Q＆A コーナー｜相談支援員の兼務による加算の算定","t":"Q＆A コーナー｜相談支援員の兼務による加算の算定Q 相談支援員が各種加算に係る所定の業務を行った場合、各種加算を算定することは可能か。（国 QA(R6) 問 79）A 原則として算定可能である。もっとも、サービス利用支援の実施に付随するもの、指定基準上相談支援員が行うことが認められていない業務が要件となっているもの、告示上相談支援専門員のみが規定されている以下加算については、相談支援員による支援のみでは算定不可である。・初回加算・集中支援加算のうち、会議の開催・サービス担当者会議実施加算また、行動障害支援体制加算、要医療児者支援体制加算、精神障害者支援体制加算、高次脳機能障害者支援体制加算等の質の高い相談支援体制を評価する加算については、相談支援専門員が研修修了することが必要であり、研修を修了した常勤の相談支援員をもって加算を算定することはできない。"},{"s":"gl","p":82,"h":"5-3 人員基準｜従たる事業所を設置する場合※基準第４条の二、解釈通知第二の１（３）","t":"■従たる事業所を設置する場合における特例指定特定相談支援事業者の指定は、原則として指定計画相談支援の提供を行う事業所ごとに行うものですが、次の①及び②の要件を満たす場合については、「主たる事業所」のほか、一体的かつ独立したサービス提供の場として、一又は複数の「従たる事業所」を設置することが可能であり、これらを一の事業所として指定することができます。"},{"s":"gl","p":82,"h":"5-3 人員基準｜従たる事業所を設置する場合※基準第４条の二、解釈通知第二の１（３）／①人員及び設備に関する要件","t":"①人員及び設備に関する要件ア「従たる事業所」において専従の従業者が１人以上確保されていること。イ「主たる事業所」と「従たる事業所」との間の距離がおおむね 30 分以内で移動可能な距離であって、相談支援専門員の業務の遂行上支障がないこと。ウ利用者の支援に支障がない場合には、基準に定める設備の全部又は一部を設けないこととしても差し支えないこと。"},{"s":"gl","p":82,"h":"5-3 人員基準｜従たる事業所を設置する場合※基準第４条の二、解釈通知第二の１（３）／②運営に関する要件","t":"②運営に関する要件ア利用申込みに係る調整、職員に対する技術指導等が一体的に行われること。イ職員の勤務体制、勤務内容等が一元的に管理されていること、必要な場合には随時、主たる事業所と従たる事業所との間で相互支援が行える体制（例えば、当該従たる事業所の従業者が急病の場合等に、主たる事業所から急遽代替要員を派遣できるような体制）にあること。ウ苦情処理や損害賠償等に際して、一体的な対応ができる体制にあること。エ事業の目的や運営方針、営業日や営業時間、利用料等を定める同一の運営規程が定められていること。オ人事・給与・福利厚生等の勤務条件等による職員管理が一元的に行われるとともに、主たる事業所と当該従たる事業所間の会計が一元的に管理されていること。"},{"s":"gl","p":83,"h":"5-4 運営基準｜運営規程※基準第 19 条、解釈通知第二の２（16）","t":"■事業所ごとに重要事項に関する運営規程を定める指定特定相談支援事業者は、指定特定相談支援事業所ごとに、下記に掲げる事業の運営（①～⑧）についての重要事項に関する運営規程を定めておかなければなりません。補足｜運営規程の内容変更に伴う対応人員の変更と同様に、運営規程の内容が生じた場合には、必ず変更の日から 10 日以内に横浜市に変更届を提出する必要があります。"},{"s":"gl","p":83,"h":"5-4 運営基準｜運営規程※基準第 19 条、解釈通知第二の２（16）／②従業者の職種、員数及び職務の内容","t":"②従業者の職種、員数及び職務の内容従業者については、相談支援専門員、相談支援員、その他の従業者に区分し、各々の員数及び職務の内容を記載します。（員数については基準を満たす範囲において「○人以上」と記載可能）"},{"s":"gl","p":83,"h":"5-4 運営基準｜運営規程※基準第 19 条、解釈通知第二の２（16）／④計画相談支援の提供方法及び内容並びに計画相談支援対象障害者等から受領する費","t":"④計画相談支援の提供方法及び内容並びに計画相談支援対象障害者等から受領する費用及びその額計画相談支援の提供方法及び内容については、サービスの内容及び計画相談支援対象障害者等から相談を受ける場所、課題分析の手順等を記載します。計画相談支援対象障害者等から受領する費用及びその額については、計画相談支援給付費（法定代理受領を行わない場合に限る。）のほかに、基準第12条第２項に規定する額を指しています。"},{"s":"gl","p":83,"h":"5-4 運営基準｜運営規程※基準第 19 条、解釈通知第二の２（16）／⑤通常の事業の実施地域","t":"⑤通常の事業の実施地域客観的にその区域が特定されるものとします。なお、通常の事業の実施地域は、利用申込みに係る調整等の観点からの目安であり、当該地域を越えてサービスが行われることを妨げるものではありません。"},{"s":"gl","p":83,"h":"5-4 運営基準｜運営規程※基準第 19 条、解釈通知第二の２（16）／⑥事業の主たる対象とする障害の種類を定めた場合には当該障害の種類","t":"⑥事業の主たる対象とする障害の種類を定めた場合には当該障害の種類障害の種類にかかわらず利用者を受け入れることを基本としますが、サービスの専門性を確保するためやむを得ないと認められる場合においては、事業の主たる対象とする障害の種類を特定して事業を実施することも可能です。"},{"s":"gl","p":83,"h":"5-4 運営基準｜運営規程※基準第 19 条、解釈通知第二の２（16）／⑦虐待の防止のための措置に関する事項","t":"⑦虐待の防止のための措置に関する事項利用者に対する虐待を早期に発見して迅速かつ適切な対応が図られるための必要な措置について、①虐待の防止に関する担当者の選定、②成年後見制度の利用支援、③苦情解決体制の整備、④従業者に対する虐待の防止を啓発・普及するための研修の実施（研修方法や研修計画など）、⑤基準第28条の２第１項の虐待の防止のための対策を検討する委員会の設置等に関すること等についてあらかじめ定めます。"},{"s":"gl","p":83,"h":"5-4 運営基準｜運営規程※基準第 19 条、解釈通知第二の２（16）／⑧その他運営に関する重要事項","t":"⑧その他運営に関する重要事項地域生活支援拠点等である場合は、その旨を規定し、「地域生活支援拠点等の整備促進について」（平成29年7月7日付け障障発第0707第1号厚生労働省社会・援護局障害保健福祉部障害福祉課長通知）の２の（１）で定める拠点等の必要な機能のうち、満たす機能を明記します。"},{"s":"gl","p":84,"h":"5-5 運営基準｜勤務体制の確保等※基準第 20 条第１項～４項、解釈通知第二の２（16）","t":"■適切な勤務体制の確保・利用者等に対し、適切な計画相談支援を提供できるよう、指定特定相談支援事業所ごとに、相談支援専門員その他の従業者の勤務の体制を定めておかなければなりません。指定特定相談支援事業者ごとに、原則として月ごとの勤務表を作成し、従業者については、日々の勤務時間、職務の内容、常勤・非常勤の別、管理者との兼務関係等を明確にしなければなりません。・指定特定相談支援事業者は、指定特定相談支援事業所ごとに、当該指定特定相談支援事業所の相談支援専門員に計画相談支援の業務を担当させなければなりません。ただし、相談支援専門員の補助の業務については、この限りでありません。■相談支援専門員の資質の向上・相談支援専門員の資質の向上のために、研修機関が実施する研修や当該事業所内の研修への参加の機会を計画的に確保しなければなりません。"},{"s":"gl","p":84,"h":"5-5 運営基準｜勤務体制の確保等※基準第 20 条第１項～４項、解釈通知第二の２（16）","t":"■職場におけるハラスメントの防止・適切な計画相談支援の提供を確保する観点から、職場において行われる性的な言動（以下、「セクシュアルハラスメント」という。）又は優越的な関係を背景とした言動（パワーハラスメント）であって業務上必要かつ相当な範囲を超えたものにより従業者の就業環境が害されることを防止するための方針の明確化等の必要な措置を講じなければなりません。なお、セクシュアルハラスメントについては、上司や同僚に限らず、利用者やその家族等から受けるものも含まれます。事業主が講ずべき措置の具体的内容職場におけるハラスメントの内容及び職場におけるハラスメントを行ってはならない旨の方針を明確化し、従業者に周知・啓発することや相談（苦情を含む）に対応する担当者をあらかじめ定めること等により、相談への対応のための窓口をあらかじめ定め、労働者に周知することが求められます。"},{"s":"gl","p":84,"h":"5-5 運営基準｜勤務体制の確保等※基準第 20 条第１項～４項、解釈通知第二の２（16）","t":"事業主が講じることが望ましい取組顧客等からの著しい迷惑行為（カスタマーハラスメント）の防止のために、事業主が管理上の配慮として行うことが望ましい取組の例として、①相談に応じ、適切に対応するために必要な体制の整備、②被害者への配慮のための取組（メンタルヘルス不調への相談対応、行為者に対して１人で対応させない等）、③被害防止のための取組（マニュアル作成や研修の実施等、業種・業態等の状況に応じた取組）を行うことが望ましいです。"},{"s":"gl","p":85,"h":"5-5 運営基準｜勤務体制の確保等※基準第 20 条第１項～４項、解釈通知第二の２（16）","t":"補足｜横浜市相談支援従事者人材育成ビジョン（令和５年７月改訂版）・本市では、障害のある人の支援に関わる相談支援従事者の育成・確保を目的として、「横浜市相談支援従事者人材育成ビジョン」を策定しています。・本ビジョンでは、相談支援従事者として「価値・倫理」、「知識」、「技術」の基盤となる力や、その人材育成を支える取組等について記載しています。相談支援従事者は、本ビジョンを基に、日々の相談支援業務を充実させられるよう、自己研鑽に努めることが必要です。・本ビジョンには、本市における相談支援従事者研修体系等も記載しています。必ず内容の確認をしていただき、相談支援専門員の資質向上に向けて、取り組んでください。※本ビジョンは、本市ホームページ「横浜市相談系サービス」に掲載しています。"},{"s":"gl","p":86,"h":"5-6 運営基準｜業務継続計画の策定等※基準第 20 条の２、解釈通知第二の２（18）","t":"■業務継続計画の策定・指定特定相談支援事業者は、感染症や非常災害の発生時において、利用者に対する指定計画相談支援の提供を継続的に実施するための、及び非常時の体制で早期の業務再開を図るための計画（以下、「業務継続計画」という。）を策定し、当該業務継続計画に従い必要な措置を講じなければなりません。業務継続計画には以下の項目等を記載します。・従業者に対し、業務継続計画について周知するとともに、必要な研修及び訓練を定期的（年１回以上）に実施しなければなりません。研修の内容について感染症及び災害に係る業務継続計画の具体的内容を職員間に共有するとともに、平常時の対応の必要性や緊急時の対応にかかる理解の励行を行います。職員教育を組織的に浸透させていくために、定期的（年１回以上）な教育を開催するとともに、新規採用時には別に研修を実施することが望ましいです。また、研修の実施内容については記録が必要です。"},{"s":"gl","p":86,"h":"5-6 運営基準｜業務継続計画の策定等※基準第 20 条の２、解釈通知第二の２（18）","t":"訓練（シミュレーション）について感染症や災害が発生した場合において迅速に行動できるよう、業務継続計画に基づき、指定特定相談支援事業所内の役割分担の確認、感染症や災害が発生した場合に実践する支援の演習等を定期的（年１回以上）に実施しなければなりません。訓練の実施は、机上を含めその実施手法は問わないものの、机上及び実地で実施するものを適切に組み合わせながら実施することが適切です。ア感染症に係る業務継続計画ａ平時からの備え（体制構築・整備、感染症防止に向けた取組の実施、備蓄品の確保等）ｂ初動対応ｃ感染拡大防止体制の確立（保健所との連携、濃厚接触者への対応、関係者との情報共有等）イ災害に係る業務継続計画ａ平常時の対応（建物・設備の安全対策、電気・水道等のライフラインが停止した場合の対策、必要品の備蓄等）"},{"s":"gl","p":86,"h":"5-6 運営基準｜業務継続計画の策定等※基準第 20 条の２、解釈通知第二の２（18）","t":"ｂ緊急時の対応（業務継続計画発動基準、対応体制等）ｃ他施設及び地域との連携※各項目の記載内容については、「障害福祉サービス事業所等における新型コロナウイルス感染症発生時の業務継続ガイドライン」及び「障害福祉サービス事業所等における自然災害発生時の業務継続ガイドライン」を参照してください。"},{"s":"gl","p":87,"h":"5-6 運営基準｜業務継続計画の策定等※基準第 20 条の２、解釈通知第二の２（18）","t":"・業務継続計画については、定期的に見直しを行い、必要に応じて変更を行わなければなりません。・業務継続計画の策定等の取組が適切に行われていない場合に所定単位数の減算があります。ただし、計画相談支援については、「非常災害に関する具体的計画」の策定が求められていないことを踏まえ、経過措置として、令和７年３月 31 日までの間、当該減算は適用しません。"},{"s":"gl","p":88,"h":"5-7 運営基準｜設備及び備品等※基準第 21 条、解釈通知第二の２（19）","t":"■事業運営のためにハード面の整備をする事業を行うために必要な広さの区画を有するとともに、計画相談支援の提供に必要な設備及び備品等を備えなければなりません。なお、事務室又は区画、設備及び備品等については、必ずしも事業者が所有している必要はなく、貸与を受けているものであっても差し支えありません。事務室：事業の運営を行うために必要な面積を有する専用の事務室を設けることが望ましいですが、間仕切りする等他の事業の用に供するものと明確に区分される場合は、他の事業と同一の事務室であっても差し支えありません。なお、この場合に、区分がされていなくても業務に支障がないときは、計画相談支援の事業を行うための区画が明確に特定されていれば足りるものとします。もっとも、事務室が区分されていない場合は特に、利用者等の個人情報の管理に細心の注意を図るとともに、利用者等に関する情報が漏れることのないよう厳重に対応します。"},{"s":"gl","p":88,"h":"5-7 運営基準｜設備及び備品等※基準第 21 条、解釈通知第二の２（19）","t":"受付等のスペースの確保：利用申込みの受付、相談、サービス担当者会議等に対応するのに適切なスペースを確保するとともに、相談のためのスペース等は利用者等が直接出入りできるとともに、相談内容が周囲に聞こえにくいようにするなど、利用者等が利用しやすく相談しやすい構造とします。設備及び備品等：計画相談支援に必要な設備及び備品等を確保します。ただし、他の事業所、施設等と同一敷地内にある場合であって、計画相談支援の事業又は当該他の事業所、施設等の運営に支障がない場合は、当該他の事業所、施設等に備え付けられた設備及び備品等を使用することができます。"},{"s":"gl","p":89,"h":"5-8 運営基準｜衛生管理等※基準第 22 条、解釈通知第二の２（20）","t":"■従業者と事業所の衛生管理・指定特定相談支援事業者は、従業者の清潔の保持及び健康状態について、必要な管理を行わなければなりません。・指定特定相談支援事業所の設備及び備品等について、衛生的な管理に努めなければなりません。・指定特定相談支援事業者は、当該指定特定相談支援事業所（以下、「事業所」という。）において感染症が発生し、又はまん延しないように、下記の措置を講じなければなりません。措置については、他のサービス事業者との連携等により行うことも差し支えありません。"},{"s":"gl","p":89,"h":"5-8 運営基準｜衛生管理等※基準第 22 条、解釈通知第二の２（20）／①事業所における感染症の予防及びまん延の防止のための対策を検討する委員会（","t":"①事業所における感染症の予防及びまん延の防止のための対策を検討する委員会（テレビ電話装置等を活用して行うことができるものとする。）（以下、「感染対策委員会」という。）を定期的（概ね６月に１回以上、感染症が流行する時期等を勘案し必要に応じ随時）に開催するとともに、その結果について、従事者に周知徹底を図ること。感染対策委員会は感染対策の知識を有する者を含む、幅広い職種により構成することが望ましく、外部の者も含め積極的に参画することが望ましいです。構成メンバーの責任及び役割分担を明確にするとともに、専任の感染対策を担当する者を決めておくことが必要です。"},{"s":"gl","p":89,"h":"5-8 運営基準｜衛生管理等※基準第 22 条、解釈通知第二の２（20）／②事業所における感染症の予防及びまん延の防止のための指針（平常時の対策及び","t":"②事業所における感染症の予防及びまん延の防止のための指針（平常時の対策及び発生時の対応を規定したもの）を整備すること。平常時の対策として、事業所内の衛生管理（環境の整備等）、支援にかかる感染対策（手洗い、標準的な予防策）等を記載します。発生時の対応として、発生状況の把握、感染拡大の防止、医療機関や保健所、市町村における事業所関係課等の関係機関との連携、行政等への報告や事業所内の連絡体制や関係機関への連絡体制を整備し明記してください。"},{"s":"gl","p":89,"h":"5-8 運営基準｜衛生管理等※基準第 22 条、解釈通知第二の２（20）／③事業所において、従業者に対し、感染症の予防及びまん延の防止のための研修及","t":"③事業所において、従業者に対し、感染症の予防及びまん延の防止のための研修及び訓練を定期的（年１回以上）に実施すること。研修の内容について感染対策の基礎的内容等の適切な知識を普及・啓発するとともに、事業所における指針に基づいた衛生管理の徹底や衛生的な支援の励行を行ってください。職員教育を組織的に浸透させていくためには、当該指定特定相談支援事業所が定期的な教育（年１回以上）を開催するとともに、新規採用時には感染対策研修を実施することが望ましいです。また、研修の実施内容について記録が必要です。"},{"s":"gl","p":90,"h":"5-8 運営基準｜衛生管理等※基準第 22 条、解釈通知第二の２（20）／③事業所において、従業者に対し、感染症の予防及びまん延の防止のための研修及","t":"訓練（シミュレーション）について平時から、実際に感染症が発生した場合を想定し、発生時の対応について、訓練（シミュレーション）を定期的（年１回以上）に行うことが必要です。訓練においては、感染症発生時において迅速に行動できるよう、発生時の対応を定めた指針及び研修内容に基づき、事業所内の役割分担の確認や、感染対策をした上での支援の演習などを実施します。訓練の実施は、机上を含めその実施手法は問わないものの、机上及び実地で実施するものを適切に組み合わせながら実施することが適切です。※各措置については「障害福祉サービス施設・事業所職員のための感染対策マニュアル」を参照してください。"},{"s":"gl","p":91,"h":"5-9 運営基準｜掲示等※基準第 23 条、解釈通知第二の２（21）","t":"■重要事項を掲示・指定特定相談支援事業所の見やすい場所に、運営規程の概要、基本相談支援及び計画相談支援の実施状況、相談支援専門員の有する資格、経験年数及び勤務の体制（職種及び常勤・非常勤別の人数）（※1）その他の利用申込者のサービスの選択に資すると認められる重要事項を掲示しなければなりません。なお、掲示については、重要事項を記載したファイル等を事業所内に備え付け、かつ、これをいつでも利用者又はその家族等に自由に閲覧させることで代えることができます。※1：職種ごと、常勤・非常勤ごと等の人数を掲示する趣旨であり、従業者の氏名まで掲示することを求めるものではない。・併せて、利用申し込み者のサービスの選択に資することから、その重要事項の公表に努めなければなりません。なお、その公表の方法については、ホームページによる掲載等、適宜工夫をして行います。"},{"s":"gl","p":91,"h":"5-9 運営基準｜掲示等※基準第 23 条、解釈通知第二の２（21）","t":"・なお、「主任相談支援専門員配置加算、行動障害支援体制加算、要医療児者支援体制加算、精神障害者支援体制加算、ピアサポート体制加算、高次脳機能障害支援体制加算」を算定する場合については、各加算を算定するための要件となる研修を修了した相談支援専門員を配置している旨が分かるよう、併せて掲示及び公表することが必要です。補足｜掲示の工夫・「掲示」はサービス開始時の重要事項説明書の交付に加え、継続的にサービスが行われている段階においても、利用者の保護を図る趣旨で規定されていますので、利用者の見やすい場所に掲示してください。・掲示すべき内容は重要事項説明書に網羅されていますので、重要事項説明書を掲示用に加工して掲示することもできます。"},{"s":"gl","p":92,"h":"5-10 運営基準｜秘密保持等（個人情報保護）※基準第 24 条、解釈通知第二の２（22）","t":"■個人情報を保護する・指定特定相談支援事業所の従業者及び管理者は、正当な理由がなく、その業務上知り得た利用者又はその家族の秘密を漏らしてはいけません。・併せて、過去に当該事業所の従業者及び管理者であった者が、正当な理由がなく、その業務上知り得た利用者又はその家族の秘密を漏らすことがないよう、必要な措置を講じなければなりません。例えば、秘密を保持すべき旨を、従業者の雇用時等に取り決めるなどの措置を講ずる必要があります。■事前に同意を得る指定特定相談支援事業者は、サービス担当者会議等において、利用者又はその家族の個人情報を用いる場合は、あらかじめ文書により当該利用者又はその家族の同意を得ておかなければなりません。■個人情報漏洩時の、国への報告書類誤送付などの個人情報漏洩があった時は、事故報告書を市及び区に提出してもらうとともに、利用者情報は「要配慮個人情報」にあたるため、事業所から国への報告義務があります。報告は個人情報保護委員会に関する以下のホームページ内の「報告フォーム」を参照ください。"},{"s":"gl","p":92,"h":"5-10 運営基準｜秘密保持等（個人情報保護）※基準第 24 条、解釈通知第二の２（22）","t":"〇漏えい等の対応とお役立ち資料https://www.ppc.go.jp/personalinfo/legal/leakAction/補足｜個人情報保護法・平成 29 年５月 30 日の改正個人情報保護法の全面施行により、中小企業をはじめとするすべての事業者が個人情報保護法の適用対象となりました。・個人情報とは、生存する個人に関する情報で、特定の個人を識別することができるものです。・事業所が守るべき４つのルールとして、①取得・利用（勝手に使わない）、②保管（なくさない、漏らさない）、③提供（勝手に人に渡さない）、④開示請求等への対応（お問い合わせに対応）があります。・詳細は、「個人情報保護委員会」のホームページで必ず確認してください。（https://www.ppc.go.jp/personalinfo/）"},{"s":"gl","p":93,"h":"5-11 運営基準｜広告※基準第 25 条","t":"■適切な広告指定特定相談支援事業者は、当該指定特定相談支援事業者について広告をする場合においては、その内容を虚偽のもの又は誇大なものとしてはいけません。"},{"s":"gl","p":94,"h":"5-12 運営基準｜障害福祉サービス事業者等からの利益収受等の禁止","t":"※基準第 26 条、解釈通知第二の２（23）■特定のサービス提供事業者への誘導は禁止・指定特定相談支援事業者及び指定特定相談支援事業所の管理者は、サービス等利用計画の作成又は変更に関し、当該指定特定相談支援事業所の相談支援専門員及び相談支援員に対して特定の福祉サービス事業者等によるサービスを位置付けるべき旨の指示等を行ってはいけません。・相談支援専門員は、サービス等利用計画の作成又は変更に関し、利用者等に対して特定の福祉サービス事業者によるサービスを利用すべき旨の指示等を行ってはいけません。■利益収受等の禁止・指定特定相談支援事業者及びその従業者は、サービス等利用計画の作成又は変更に関し、利用者に対して特定のサービス提供事業所によるサービスを利用させることの対償として、当該サービス提供事業所等から金品その他の財産上の利益を収受してはいけません。"},{"s":"gl","p":94,"h":"5-12 運営基準｜障害福祉サービス事業者等からの利益収受等の禁止","t":"・例えば、同一法人系列の福祉サービス事業者による福祉サービスのみを位置付けるように指示することをしてはいけません。また、金品その他財産上の利益の収受は、指定の取消等を直ちに検討すべきとされる重大な基準違反です。"},{"s":"gl","p":95,"h":"5-13 運営基準｜苦情解決※基準第 27 条、解釈通知第二の２（24）","t":"■苦情受付体制の整備と周知・提供した計画相談支援又はサービス等利用計画に位置付けた福祉サービス等に関する利用者又はその家族からの苦情に迅速かつ適切に対応するために、苦情を受け付けるための窓口を設置する等の必要な措置を講じなければなりません。・また、当該事業所における苦情を処理するために講ずる措置の概要について明らかにし、相談窓口の連絡先、苦情処理の体制及び手順等を利用申込者にサービスの内容を説明する文書（重要事項説明書等）に記載するとともに、事業所に掲示することが望まれます。■記録の整備とサービスの質の向上に向けた取組・苦情を受け付けた場合、指定特定相談支援事業者が組織として迅速かつ適切に対応するため、当該苦情の受付日、内容等を記録しなければなりません。（５年間保存）・指定特定相談支援事業者は、苦情がサービスの質の向上を図る上での重要な情報であるとの認識に立ち、苦情の内容を踏まえ、サービスの質の向上に向けた取り組みを自ら行うべきです。"},{"s":"gl","p":95,"h":"5-13 運営基準｜苦情解決※基準第 27 条、解釈通知第二の２（24）","t":"■調査等への協力・市町村等が行う報告若しくは文書その他の物件の提出若しくは提示の命令又は当該職員からの質問若しくは指定特定相談支援事業者の設備若しくは帳簿書類その他の物件の検査に応じ、及び利用者又はその家族からの苦情に関して市町村が行う調査に協力するとともに、市町村から指導又は助言を受けた場合は、当該指導又は助言に従って必要な改善を行わなければなりません。また、指定特定相談支援事業者は、市町村等から求めがあった場合には、その改善の内容の報告をしなければなりません。・また、指定特定相談支援事業者は、社会福祉法第 83 条に規定する運営適正化委員会が同法第 85条の規定により行う調査又はあっせんにできる限り協力しなければなりません。"},{"s":"gl","p":96,"h":"5-14 運営基準｜事故発生時の対応※基準第 28 条、解釈通知第二の２（25）","t":"■必要な措置の実施・利用者等に対する計画相談支援の提供により事故が発生した場合は、都道府県、市町村、当該利用者の家族等に連絡を行うとともに、必要な措置を講じなければなりません。・利用者等に対する計画相談支援の提供により賠償すべき事故が発生した場合は、損害賠償を速やかに行わなければなりません。・指定特定相談支援事業者は、事故が生じた際にはその原因を解明し、再発生を防ぐための対策を講じることが求められます。■記録の整備その事故の状況及び事故に際して採った処置については、記録しなければなりません。（５年間保存）補足｜事故対応に係るその他留意事項※解釈通知第二の２（25）・利用者等に対する計画相談支援の提供により事故が発生した場合の対応方法については、あらかじめ指定特定相談支援事業者が定めておくことが望ましいです。また、事業所に自動体外式除細動器（AED）を設置することや救命講習等を受講することが望まれます。なお、事業所の近隣に AED が設置されており、緊急時に使用できるよう、地域においてその体制や連携を構築することでも差し支えありません。"},{"s":"gl","p":96,"h":"5-14 運営基準｜事故発生時の対応※基準第 28 条、解釈通知第二の２（25）","t":"・指定特定相談支援事業者は、賠償すべき事態において速やかに賠償を行うため、損害賠償保険に加入しておくことが望ましいです。・指定特定相談支援事業者は、事故が生じた際にはその原因を解明し、再発生を防ぐための対策を講じます。なお、「福祉サービスにおける危機管理（リスクマネジメント）に関する取り組み指針」（平成 14 年３月 28 日福祉サービスにおける危機管理に関する検討会）が示されているので、参考にしてください。補足｜横浜市への事故報告"},{"s":"gl","p":96,"h":"5-14 運営基準｜事故発生時の対応※基準第 28 条、解釈通知第二の２（25）／①死亡、②骨折、③誤嚥、④食中毒、⑤感染症、⑥所在不明、⑦利用者の不","t":"①死亡、②骨折、③誤嚥、④食中毒、⑤感染症、⑥所在不明、⑦利用者の不利益につながる職員による犯罪行為等、⑧その他、利用者の身体に重大な影響を及ぼす事故が生じた場合には、速やかに電話にて第一報を入れた上で、事故報告書により本市に報告します。なお、利用者の個人情報漏えいや書類の紛失なども報告対象となります。※障害福祉情報サービスかながわに掲載している、2019/09/17「事故報告の取扱いについて」を参照してください。（トップページ＞書式ライブラリ＞１．神奈川県からのお知らせ＞7-4 事故報告に関するお知らせ）"},{"s":"gl","p":97,"h":"5-15 運営基準｜虐待の防止※基準第 28 条の二、解釈通知第二の２（26）","t":"■虐待の発生又は再発を防止するための措置・当該指定特定相談支援事業所（以下、「事業所」という。）における虐待の防止のための対策を検討する委員会（テレビ電話装置等を活用して行うことができるものとする。）（以下、「虐待防止委員会」という。）を定期的に開催するとともに、その結果について、従業者に周知徹底を図らなければなりません。委員会の役割及び設置については下記のとおりです。"},{"s":"gl","p":97,"h":"5-15 運営基準｜虐待の防止※基準第 28 条の二、解釈通知第二の２（26）／①虐待防止委員会の役割","t":"①虐待防止委員会の役割虐待防止のための計画づくり（虐待防止の研修、労働環境・条件を確認・改善するための実施計画づくり、指針の作成）虐待防止のチェックとモニタリング（虐待が起こりやすい職場環境の確認等）虐待発生後の検証と再発防止策の検討（虐待やその疑いが生じた場合、事案検証の上、再発防止策を検討、実行）"},{"s":"gl","p":97,"h":"5-15 運営基準｜虐待の防止※基準第 28 条の二、解釈通知第二の２（26）／②虐待防止員会の設置","t":"②虐待防止員会の設置虐待防止委員会の設置に向けては、構成員の責務及び役割分担を明確にするとともに、専任の虐待防止担当者（必置）を決めておくことが必要です。また、構成員には、利用者やその家族、専門的な知見のある外部の第三者等も加えるよう努めるものとします。なお、事業所単位でなく、法人単位での委員会設置も可であるため、事業所の規模に応じた対応を検討します。虐待防止委員会の開催に必要となる人数については事業所の管理者や虐待防止担当者（必置）が参画していれば最低人数は問いませんが、委員会での検討結果を従業者に周知徹底することは必要です。"},{"s":"gl","p":97,"h":"5-15 運営基準｜虐待の防止※基準第 28 条の二、解釈通知第二の２（26）／③周知徹底する目的","t":"③周知徹底する目的虐待の防止のための対策について、事業所全体で情報共有し、今後の未然防止、再発防止につなげるためのものであり、決して従業者の懲罰を目的としたものではないことに留意する必要があります。具体的には下記のような対応を想定しています。なお、虐待防止委員会における対応状況については、適切に記録の上、5 年間保存します。ア虐待（不適切な対応事例も含む）が発生した場合、当該事案について報告するための様式を整備すること。イ従業者は虐待の発生ごとにその状況、背景等を記録するとともに、アの様式に従い、虐待について報告すること。ウ虐待防止委員会において、イにより報告された事例を集計し、分析すること。エ事例の分析に当たっては、虐待の発生時の状況等を分析し、虐待の発生原因、結果等をとりまとめ、当該事例の再発防止策を検討すること。"},{"s":"gl","p":98,"h":"5-15 運営基準｜虐待の防止※基準第 28 条の二、解釈通知第二の２（26）／③周知徹底する目的","t":"・事業所において、従業者に対し、虐待の防止のための研修を定期的（年１回以上）に実施し、内容について適切に記録の上、5 年間保存します。なお、研修の実施は、施設内で行う職員研修及び協議会又は基幹相談支援センター等が実施する研修に事業所が参加した場合でも差し支えありません。・上記の措置を適切に実施するための担当者については、相談支援専門員を配置します。なお、当該担当者及び管理者は、「地域生活支援事業の実施について」（平成 18 年 8 月 1 日障発第0801002 号）の別紙 2「地域生活支援促進事業実施要綱」の別記 2－4 の 3(3)の都道府県が行う研修に参加することが望ましいです。・次に掲げる虐待の防止のための取組が適切に行われていない場合に所定単位数の減算があります。➀虐待防止委員会を定期的に開催する。具体的には、１年に１回以上の開催とする。"},{"s":"gl","p":98,"h":"5-15 運営基準｜虐待の防止※基準第 28 条の二、解釈通知第二の２（26）／③周知徹底する目的","t":"➁虐待の防止のための研修を定期的に実施する。具体的には、研修を１年に１回以上を実施する。➂上記➀、➁を適切に実施するための担当者を配置する。オ労働環境・条件について確認するための様式を整備するとともに、当該様式に従い作成された内容を集計、報告し、分析すること。カ報告された事例及び分析結果を従業者に周知徹底すること。キ再発防止策を講じた後に、その効果について検証すること。"},{"s":"gl","p":98,"h":"5-15 運営基準｜虐待の防止※基準第 28 条の二、解釈通知第二の２（26）／④虐待防止のための指針","t":"④虐待防止のための指針事業所は次のような項目を定めた「虐待防止のための指針」を作成することが望ましいです。ア事業所における虐待防止に関する基本的な考え方イ虐待防止委員会その他施設内の組織に関する事項ウ虐待防止のための職員研修に関する基本方針エ施設内で発生した虐待の報告方法等の方策に関する基本方針オ虐待発生時の対応に関する基本方針カ利用者等に対する当該指針の閲覧に関する基本方針キその他虐待防止の適正化の推進のために必要な基本方針"},{"s":"gl","p":99,"h":"5-15 運営基準｜虐待の防止※基準第 28 条の二、解釈通知第二の２（26）／ Q＆A コーナー｜虐待防止に関する実施計画及び研修について","t":"Q＆A コーナー｜虐待防止に関する実施計画及び研修について虐待防止に関する実施計画Q 虐待防止の研修、労働環境・条件を確認・改善するための実施計画とはどのようなものか。（国QA(R3)VOL.2 問１）A 例えば、「障害者福祉施設等における障害者虐待の防止と対応の手引き」に掲載している「労働環境・条件メンタルヘルスチェックリスト」を活用した労働環境等の計画的確認などが考えられる。虐待防止のための研修Q 身体拘束等の適正化のための研修及び虐待防止のための研修の関係如何。（国 QA(R3)VOL.2 問２）A 虐待防止のための研修については、「虐待防止の基礎的内容等適切な知識を普及・啓発する」こととされているため、身体拘束等の適正化の内容に限定しないことが求められる。例えば、厚生労働省の作成した「障害者虐待防止の理解と対応」を活用することなどが考えられる。"},{"s":"gl","p":100,"h":"5-16 運営基準｜会計の区分※基準第 29 条、解釈通知第二の２（27）","t":"■他事業の会計と区分する指定特定相談支援事業者は、指定特定相談支援事業所ごとに経理を区分するとともに、計画相談支援の事業の会計とその他の事業の会計を区分しなければなりません。"},{"s":"gl","p":101,"h":"5-17 運営基準｜記録の整備※基準第 30 条、解釈通知第二の２（28）","t":"※第４章も併せて要確認■事業所としての記録と支援記録の整備・指定特定相談支援事業者は、従業者、設備、備品及び会計等に関する諸記録を文書により整備しておかなければなりません。・利用者等に対する計画相談支援の提供に関する下記に掲げる記録を最低限整備し、当該計画相談支援を提供した日から少なくとも５年以上保存しなければなりません。■書類の管理文書の保管について、特に個人情報の記載されているものについては、鍵のかかる書棚に適正に保管し、持ち出しの制限を行うなどによる適切な管理を行います。また、パソコンやサーバ、ＵＳＢメモリ等の記録媒体についても、盗難・紛失防止及びウィルス感染等による個人情報の漏えいを防ぐための措置を行うことが必要です。"},{"s":"gl","p":101,"h":"5-17 運営基準｜記録の整備※基準第 30 条、解釈通知第二の２（28）／①福祉サービス等の事業を行う者等との連絡調整に関する記録","t":"①福祉サービス等の事業を行う者等との連絡調整に関する記録"},{"s":"gl","p":101,"h":"5-17 運営基準｜記録の整備※基準第 30 条、解釈通知第二の２（28）／②個々の利用者ごとに次に掲げる事項を記載した相談支援台帳","t":"②個々の利用者ごとに次に掲げる事項を記載した相談支援台帳・サービス等利用計画案及びサービス等利用計画・アセスメントの記録・サービス担当者会議等の記録・モニタリングの結果の記録"},{"s":"gl","p":101,"h":"5-17 運営基準｜記録の整備※基準第 30 条、解釈通知第二の２（28）／③基準第17条の規定による市町村への通知に係る記録","t":"③基準第17条の規定による市町村への通知に係る記録"},{"s":"gl","p":101,"h":"5-17 運営基準｜記録の整備※基準第 30 条、解釈通知第二の２（28）／④基準第27条第２項に規定する苦情の内容等の記録","t":"④基準第27条第２項に規定する苦情の内容等の記録"},{"s":"gl","p":101,"h":"5-17 運営基準｜記録の整備※基準第 30 条、解釈通知第二の２（28）／⑤基準第28条第２項に規定する事故の状況及び事故に際して採った処置につい","t":"⑤基準第28条第２項に規定する事故の状況及び事故に際して採った処置についての記録"},{"s":"gl","p":102,"h":"5-17 運営基準｜記録の整備※基準第 30 条、解釈通知第二の２（28）／⑤基準第28条第２項に規定する事故の状況及び事故に際して採った処置につい","t":"補足｜利用者の同意署名の郵送対応利用者等に対して、すでにサービス等利用計画等の内容の説明を終え、口頭での同意が確認できており、利用者の同意署名をもらうのみの場合には、郵送で対応することも可能です。補足｜利用者の同意署名の必要性サービス等利用計画案、確定させたサービス等利用計画、モニタリング報告書には、必ず利用者の同意署名を求めています。それは、いずれも利用者のものとなる書類であり、利用者の同意のないものはあり得ないからです。したがって、各書類への署名は、相談支援専門員の説明により、利用者がその内容に同意したことを証明するものであり、指定特定相談支援事業者の活動の根拠となるものです。補足｜利用者の同意署名の取り扱い原則は、18 歳以上の利用者は利用者本人による自筆の署名をします。18 歳未満の児童の場合は保護者が保護者の氏名で署名をします。障害等の理由で利用者の自筆署名が困難な場合には、代筆者が本人の氏名、さらに代筆者の署名、利用者との関係性及び代筆理由を記載します。なお、後見人による代行も代筆と同様に取り扱います。"},{"s":"gl","p":103,"h":"5-18 運営基準｜提供拒否の禁止※基準第７条、解釈通知第二の２（３）","t":"■原則、利用申込に応じる・指定特定相談支援事業者は、原則として、利用申込みに対して応じなければなりません。特に、障害支援区分や所得の多寡を理由にサービスの提供を拒否することを禁止されています。・提供を拒むことのできる正当な理由として、下記が挙げられます。"},{"s":"gl","p":103,"h":"5-18 運営基準｜提供拒否の禁止※基準第７条、解釈通知第二の２（３）／①当該事業所の現員からは利用申込に応じきれない場合","t":"①当該事業所の現員からは利用申込に応じきれない場合"},{"s":"gl","p":103,"h":"5-18 運営基準｜提供拒否の禁止※基準第７条、解釈通知第二の２（３）／②利用申込者の居住地が当該事業所の通常の事業の実施地域外である場合","t":"②利用申込者の居住地が当該事業所の通常の事業の実施地域外である場合"},{"s":"gl","p":103,"h":"5-18 運営基準｜提供拒否の禁止※基準第７条、解釈通知第二の２（３）／③当該事業所の運営規程において主たる対象とする障害の種類を定めている場合であ","t":"③当該事業所の運営規程において主たる対象とする障害の種類を定めている場合であって、これに該当しない者から利用申込があった場合"},{"s":"gl","p":103,"h":"5-18 運営基準｜提供拒否の禁止※基準第７条、解釈通知第二の２（３）／④その他、利用申込者に対し自ら適切な計画相談支援を提供することが困難な場合 ","t":"④その他、利用申込者に対し自ら適切な計画相談支援を提供することが困難な場合等・なお、行動障害支援体制加算、要医療児者支援体制加算、精神障害者支援体制加算又は高次脳機能障害支援体制加算を算定している指定特定相談支援事業者は、算定している各加算に対応した強度行動障害を有する障害児者、医療的ケアが必要な障害児者、精神障害を有する障害児者又は高次脳機能障害を有する障害児者からの利用申込みがあった場合に、利用者の障害特性に対応できないことを理由にサービスの提供を拒むことは認められません。"},{"s":"gl","p":104,"h":"5-19 運営基準｜サービス提供困難時の対応※基準第８条、解釈通知第二の２（４）","t":"■他の事業所の紹介その他の必要な措置を講じる指定特定相談支援事業者は、指定特定相談支援事業所の通常の事業の実施地域等を勘案し、利用申込者に対し自ら適切な計画相談支援を提供することが困難であると認めた場合は、適当な他の指定特定相談支援事業者の紹介その他の必要な措置を速やかに講じなければなりません。"},{"s":"gl","p":105,"h":"5-20 運営基準｜電磁的記録等について※基準第 31 条、解釈通知第三","t":"■電磁的記録について・指定特定相談支援事業者及びその従事者は、書面の保存等に係る負担軽減を図るため、作成、保存その他これらに類するもののうち、書面で行うことが規定されている又は想定されるものについては、書面に代えて、当該書面に係る電磁的記録（デジタルデータ：パソコンで作成したファイルや、スキャナ等で読み取ったＰＤＦ等のファイルなど）により行うことができます。・電磁的記録を取り扱うにあたっては、データへのアクセス権限の管理、アクセス記録の保存等の措置を講ずる必要があり、「個人情報の保護に関する法律についてのガイドライン」を遵守して取り組んでいく必要があります。■電磁的方法について・指定特定相談支援事業者及びその従事者は、利用者及びその家族等の利便性向上並びに事業者等の業務負担軽減等の観点から、交付、説明、同意その他これらに類するもの（以下、「交付等」という。）のうち、書面で行うことが規定されている又は想定されるものについては、当該交付等の相手方の承諾を得て、電磁的方法（インターネット回線を通じたファイル送信やＣＤ－ＲＯＭ等の記録媒体の受け渡し等利用者がファイルへの出力し、文書を作成できるもの）により行うことができます。"},{"s":"gl","p":105,"h":"5-20 運営基準｜電磁的記録等について※基準第 31 条、解釈通知第三","t":"・当該交付等の相手方が利用者である場合には、当該利用者の障害の特性に応じた適切な配慮をしつつ、「個人情報の保護に関する法律についてのガイドライン」を遵守して取り組んでいく必要があります。補足｜障害の特定に応じた適切な配慮について「個人情報の保護に関する法律についてのガイドライン」及び「個人データの漏えい等の事案が発生した場合等の対応について」に関するＱ＆Ａ（平成 28 年 11 月 30 日公表・個人情報保護委員会）Q １－32（要配慮個人情報）障害福祉サービス事業者等において個人情報を取り扱う際に、留意すべきことはありますか。Ａ１－32障害福祉サービス事業者等においては、個人情報の取得や第三者提供、保有個人データに関する事項の公表等の段階に応じて、手話、点字等の方法により本人に対し、その利用目的を明示することや、ホームページへの音声データの掲載を行うこと、知的障害者等に対してあらかじめ必要な情報が本人の知り得る状態にあることを平易な表現を用いて説明すること等、その障害の特性に応じた適切な配慮を行うことが望ましいと考えられます。"},{"s":"gl","p":105,"h":"5-20 運営基準｜電磁的記録等について※基準第 31 条、解釈通知第三","t":"なお、障害福祉サービス事業者等以外の個人情報取扱事業者においても、これに準じた適切な配慮を行うことが望ましいと考えられます。"},{"s":"gl","p":106,"h":"5-21 報酬基準｜計画相談支援費算定の基本的な取扱い","t":"※基準第 15 条第２・３項、報酬告示１、留意事項通知第四の１（１）■計画相談支援費の基本報酬は下記の２種類。指定サービス利用支援※いわゆる計画作成"},{"s":"gl","p":106,"h":"5-21 報酬基準｜計画相談支援費算定の基本的な取扱い／①サービス等利用計画の作成に当たってのアセスメントに係る利用者の居宅等への訪問","t":"①サービス等利用計画の作成に当たってのアセスメントに係る利用者の居宅等への訪問による利用者及びその家族への面接等（基準第 15 条第２項第７号）"},{"s":"gl","p":106,"h":"5-21 報酬基準｜計画相談支援費算定の基本的な取扱い／②サービス等利用計画案及びサービス等利用計画の利用者又はその家族への説明並びに","t":"②サービス等利用計画案及びサービス等利用計画の利用者又はその家族への説明並びに利用者又は障害児の保護者の文書による同意（同項第 10 号及び第 13 号）"},{"s":"gl","p":106,"h":"5-21 報酬基準｜計画相談支援費算定の基本的な取扱い／③サービス等利用計画案及びサービス等利用計画の利用者又は障害児の保護者及び担当","t":"③サービス等利用計画案及びサービス等利用計画の利用者又は障害児の保護者及び担当者への交付（同項第 11 号及び第 14 号）"},{"s":"gl","p":106,"h":"5-21 報酬基準｜計画相談支援費算定の基本的な取扱い／④サービス担当者会議の開催等による担当者への説明及び専門的な意見の聴取（同項第","t":"④サービス担当者会議の開催等による担当者への説明及び専門的な意見の聴取（同項第 12 号）指定継続サービス利用支援※いわゆるモニタリング"},{"s":"gl","p":106,"h":"5-21 報酬基準｜計画相談支援費算定の基本的な取扱い／①利用者の居宅等への訪問による利用者又は障害児の保護者への面接等（同条第３項第","t":"①利用者の居宅等への訪問による利用者又は障害児の保護者への面接等（同条第３項第２号）"},{"s":"gl","p":106,"h":"5-21 報酬基準｜計画相談支援費算定の基本的な取扱い／②サービス等利用計画の変更についての指定サービス利用支援に準じた手続の実施（同","t":"②サービス等利用計画の変更についての指定サービス利用支援に準じた手続の実施（同条第 3 項第 3 号により準用する同条第 2 項第 7 号、第 12 号から第 14 号まで）補足｜本市の計画相談支援に係る地域区分※単価告示本市の地域区分は、２級地（単価×10.96 円）です。地域区分は事業所所在地のものが適用されるため、横浜市内の事業所は全て２級地単価となります。"},{"s":"gl","p":106,"h":"5-21 報酬基準｜計画相談支援費算定の基本的な取扱い／ Q＆A コーナー｜計画相談支援給付費の発生時点","t":"Q＆A コーナー｜計画相談支援給付費の発生時点計画相談支援給付費の発生時点Q 計画相談支援給付費が発生する時点は、いつか。（国 QA 問 52）A 計画相談支援給付費が発生するのは、市町村から障害福祉サービス等の支給決定を受けた後に、サービス担当者会議を踏まえたサービス等利用計画を作成し、利用者から文書により同意を得た時点である。"},{"s":"gl","p":107,"h":"5-22 報酬基準｜計画相談支援及び障害児相談支援の報酬算定構造","t":"■「①基本報酬＋②基本報酬への減加算＋③加算」の報酬算定構造 (1)機能強化型サービス利用支援費（Ⅰ） 2,014 単位 -582 単位 -894 単位 (2)機能強化型サービス利用支援費（Ⅱ） 1,914 単位 -582 単位 -894 単位 (3)機能強化型サービス利用支援費（Ⅲ） 1,822 単位 -582 単位 -894 単位 (4)機能強化型サービス利用支援費（Ⅳ） 1,672 単位 -582 単位 -894 単位 (5)サービス利用支援費（Ⅰ） 1,572 単位 -582 単位 -894 単位 (6)サービス利用支援費（Ⅱ） 732 単位 -54 単位 (1)機能強化型継続サービス利用支援費(Ⅰ) 1,761 単位 -633 単位 -945 単位 -20 単位 (2)機能強化型継続サービス利用支援費(Ⅱ) 1,661 単位 -633 単位 -945 単位 -20 単位 (3)機能強化型継続サービス利用支援費(Ⅲ) 1,558 単位 -633 単位 -945 単位 -20 単位 (4)機能強化型継続サービス利用支援費(Ⅳ) 1,408 単位 -633 単位 -945 単位 -20 単位 (5)継続サービス利用支援費（Ⅰ） 1,308 単位 -633 単位 -945 単位 -20 単位 (6)継続サービス利用支援費（Ⅱ） 606 単位 -243 単位 (1)障害児支援利用援助費（Ⅰ） 1,766 単位(2)障害児支援利用援助費（Ⅱ） 815 単位(3)継続障害児支援利用援助費（Ⅰ） 1,448 単位(4)継続障害児支援利用援助費（Ⅱ） 662 単位※機能強化型サービス利用支援費及び機能強化型継続サービス利用支援費を算定する場合は本市への届出が必要です。"},{"s":"gl","p":107,"h":"5-22 報酬基準｜計画相談支援及び障害児相談支援の報酬算定構造／②基本報酬への減加算※該当するものを選択","t":"②基本報酬への減加算※該当するものを選択特別地域加算居宅介護支援費重複減算Ⅰ居宅介護支援費重複減算Ⅱ介護予防支援費重複減算情報公表未報告減算業務継続計画未策定減算虐待防止措置未実施減算計画相談支援サービス利用支援費１月につき- 5/100 - 1/100※基本単価のみ記載障害児相談支援障害児支援利用援助費１月につき継続障害児支援利用援助費+ 15/100継続サービス利用支援費- 1/100"},{"s":"gl","p":108,"h":"5-22 報酬基準｜計画相談支援及び障害児相談支援の報酬算定構造／②基本報酬への減加算※該当するものを選択","t":"行動障害支援体制加算（Ⅰ） 60 単位行動障害支援体制加算（Ⅱ） 30 単位要医療児者支援体制加算（Ⅰ） 60 単位要医療児者支援体制加算（Ⅱ） 30 単位精神障害者支援体制加算（Ⅰ） 60 単位精神障害者支援体制加算（Ⅱ） 30 単位高次脳機能障害支援体制加算（Ⅰ） 60 単位高次脳機能障害支援体制加算（Ⅱ） 30 単位100 単位主任相談支援専門員配置加算（Ⅰ） 300 単位主任相談支援専門員配置加算（Ⅱ） 100 単位１回につき 150 単位計画相談支援の初回加算 300 単位障害児相談支援の初回加算 500 単位１回につき 300 単位面談又は会議を行い、指定サービス利用支援を行った場合 200 単位面談又は会議を行い、指定継続サービス利用支援を行った場合 300 単位通院するに当たり、情報提供をした場合 300 単位福祉サービス等提供機関からの求めに応じて、情報提供をした場合 150 単位１月につき 100 単位入院時情報連携加算（Ⅰ） 300 単位入院時情報連携加算（Ⅱ） 150 単位訪問による面接・会議参加 300 単位情報提供 150 単位１月につき 100 単位・利用者等への訪問による面接・サービス担当者会議の開催・関係機関が開催する会議への参加・利用者への通院同行300 単位福祉サービス等提供機関への情報提供 150 単位１回につき 700 単位１回につき 2,000 単位１回につき 500 単位300 単位遠隔地訪問加算●●●・特別地域加算に所在し、指定特定相談支援事業所との間に一定の距離がある利用者の居宅その他機関を訪問して、対象となる加算を算定する場合に、これらの加算の算定回数に応じて算定地域体制強化共同支援加算（月１回を限度）●●●※※単独請求可能サービス提供時モニタリング加算●●●※※単独請求可能※単独請求可能・会議参加については入院時情報連携加算（Ⅰ）又は退院・退所加算と選択することとし、併給不可地域生活支援拠点等相談強化加算（月４回を限度）●●●※※単独請求可能集中支援加算１月につき●※・初回加算又は退院・退所加算を算定し、かつ、退院又は退所する施設の職員のみから情報の提供を受けている場合は本加算の算定不可入院時情報連携加算１月につき●●●※※単独請求可能・入院時情報連携加算又は退院・退所加算との併給不可●●●※・モニタリング時であっても、サービス利用支援費を算定する場合は算定不可・医療・保育・教育機関等連携加算の面談又は会議を行い、指定継続サービス利用支援を行った場合は算定不可※単独請求可能居宅介護支援事業所等連携加算１月につき●※●●●●●初回加算１月につき●・新規に計画作成を行った場合であって、サービス等利用計画案の作成に一定の期間を要するなどの条件を満たす月について、その月数分の初回加算を重ねて算定対応時に算定可能利用者負担上限額管理加算（月１回を限度）●●●退院・退所加算（３回を限度）●サービス担当者会議実施加算●医療・保育・教育機関等連携加算（１月に複数算定可）１月につき・初回加算とどちらかを選択することとし、併給不可●地域生活支援拠点等機能強化加算（月100回を限度）●●●・本市では当該加算を算定する事業所を想定していません。"},{"s":"gl","p":108,"h":"5-22 報酬基準｜計画相談支援及び障害児相談支援の報酬算定構造／③加算※併給不可のものを除き、該当加算を選択","t":"③加算※併給不可のものを除き、該当加算を選択算定月※可能なものは●で示しているサービス利用支援(計画作成)継続サービス利用支援(モニタリング)その他の月留意事項基本報酬算定時に毎回算定可能行動障害支援体制加算１月につき●●・いずれの加算も本市への届出が必要要医療児者支援体制加算精神障害者支援体制加算高次脳機能障害支援体制加算ピアサポート体制加算主任相談支援専門員配置加算・モニタリングが毎月決定されている場合にのみ、上限管理者になる場合あり"},{"s":"gl","p":109,"h":"5-23 報酬基準｜報酬①基本報酬","t":"※報酬告示１、留意事項通知第四の１、厚生労働大臣が定める基準１、国 QA 問 52、国 QA(H30)VOL.1 問 77・78■機能強化型(継続)サービス利用支援費について・機能強化型(継続)サービス利用支援は、支援困難ケースへの積極的な対応を行うほか、専門性の高い人材を確保し、質の高いマネジメントを実施している事業所を評価し、地域全体のマネジメントの質の向上に資することを目的とするものです。・当該報酬の対象となる事業所は、公正中立性を確保し、サービス提供主体からも実質的に独立した事業所であり、常勤かつ専従の相談支援専門員が配置され、どのような支援困難ケースでも適切に支援できる体制が整備されており、市町村や基幹相談支援センター等との連携体制が確保されているほか、協議会との連携や参画が強く望まれるものです。"},{"s":"gl","p":109,"h":"5-23 報酬基準｜報酬①基本報酬","t":"・算定にあたっては、本市に手続きを行うことが必要です。※様式は、障害福祉情報サービスかながわホームページに掲載されています。トップページ＞書式ライブラリ＞２．横浜市からのお知らせ＞➄体制届に関するお知らせ（障害者総合支援法）機能強化型(継続)サービス利用支援費（Ⅰ）～（Ⅳ）共通事項＜算定要件＞（１）共通（単独の指定特定相談支援事業所で算定する場合、複数事業所が協働により体制を確保して算定する場合）ア兼務の取り扱い配置される相談支援専門員については、原則専従であることが要件であるが、同一敷地内にある事業所における指定障害児相談支援事業所、指定一般相談支援事業所若しくは指定自立生活援助事業所の業務と兼務しても差し支えないこととしている。イ留意事項伝達会議「利用者に関する情報又はサービス提供に当たっての留意事項に係る伝達等を目的とした会議」は、次のａからｃまでに掲げる要件をいずれも満たすものでなければならないこと。なお、会議については、テレビ電話装置等を活用して行うことができるものである。"},{"s":"gl","p":109,"h":"5-23 報酬基準｜報酬①基本報酬","t":"ａ議題については、少なくとも次のような議事を含めること。⒜現に抱える処遇困難ケースについての具体的な処遇方針⒝過去に取り扱ったケースについての問題点及びその改善方策⒞地域における事業者や活用できる社会資源の状況⒟保健医療及び福祉に関する諸制度⒠アセスメント及びサービス等利用計画の作成に関する技術⒡利用者からの苦情があった場合は、その内容及び改善方針"},{"s":"gl","p":110,"h":"5-23 報酬基準｜報酬①基本報酬","t":"⒢その他必要な事項ｂ議事については、記録を作成し、5 年間保存しなければならないこと。ｃ会議の開催については定期的（概ね週１回以上）であること。ウ現任研修修了者同行による研修現任研修修了者の同行による研修については、当該現任研修修了者が、新規に採用した従業者に対し、適切な指導を行うこと。なお、テレビ電話装置等を活用して行われる研修についても、当該現任研修修了者による適切な指導等が可能な体制が確保されている場合は対象に含めて差し支えない。※一体的に管理運営を行う事業所の場合、現任研修修了者が配置されていない事業所に新規に採用した従業者がいる場合、他の一体的に管理運営を行う事業所に配置された現任研修修了者により適切な指導を行う必要があるエ支援困難ケースの受入自ら積極的に支援困難ケースを受け入れなければならず、そのため、常に基幹相談支援センター又は協議会との連携を図らなければならないこと。"},{"s":"gl","p":110,"h":"5-23 報酬基準｜報酬①基本報酬","t":"オ事例検討会への参加基幹相談支援センター又は協議会が実施する事例検討会等に参加していること。カ取扱件数取扱件数については、当該指定特定相談支援事業所及び一体的に管理運営を行う指定特定相談支援事業所においてそれぞれ 40 件未満であること。また、取扱件数は、1 月の当該指定特定相談支援事業所全体の計画相談支援対象障害者等の数の前 6 月の平均値（以下「計画相談支援対象障害者等の平均数」という。）を、当該指定特定相談支援事業所の相談支援専門員（相談支援員については、１人につき相談支援専門員 0.5人とみなして算定する。）の員数の前 6 月の平均値（以下「相談支援専門員の平均員数」という。）で除して得た数とする。※当該指定特定相談支援事業所が指定障害児相談支援事業所も一体的に運営している場合は、指定障害児支援利用援助又は指定継続障害児支援利用援助を行った障害児相談支援対象保護者の数も取扱件数に含むものとする。"},{"s":"gl","p":111,"h":"5-23 報酬基準｜報酬①基本報酬","t":"（２）複数事業所が協働により体制を確保して算定する場合（協働体制）単独の事業所で機能強化型サービス利用支援費の算定要件を満たすことが困難であっても、複数の指定特定相談支援事業所間で一体的に管理運営を行うための必要な体制を構築した上で、当該事業所全体をもって人員配置及び 24 時間の連絡体制が確保されていることにより、要件を満たすことを可能とします。なお、機能強化型(継続)サービス利用支援費（Ⅳ）については、複数事業所の協働体制による算定はできません。ア体制要件次の(ｱ)から(ｳ)までに掲げる要件をいずれも満たしていること。(ｱ) 協働体制を確保する事業所間において、協定を締結していること。(ｲ) 機能強化型サービス利用支援費に係る各要件を満たしているかについて、協定を締結した事業所間において定期的（月 1 回）に確認が実施されていること。"},{"s":"gl","p":111,"h":"5-23 報酬基準｜報酬①基本報酬","t":"(ｳ) 原則、全職員が参加するケース共有会議、事例検討会等を月 2 回以上共同して実施していること。なお、会議等については、テレビ電話装置等を活用して行うことができるものである。※ここに定める会議を開催した週については、当該会議をもって留意事項伝達会議を開催したこととして差し支えない。イ事業所要件次の(ｱ)又は(ｲ)に掲げる要件のいずれかを満たしていること。なお、一体的に管理運営を行う事業所の範囲は、原則として同一市町村又は同一圏域内の地域生活支援拠点等を構成している場合に限る。(ｱ) 一体的に管理運営を行う事業所それぞれが、計画相談支援基準第 19 条に規定する運営規程において、地域生活支援拠点等であることを市町村により位置付けられていることを定めていること。(ｲ) 地域生活支援拠点等の拠点関係機関との連携体制を確保するとともに、協議会に定期的に参画していること。なお、拠点関係機関との連携体制を確保することについては、支援が必要な者への対応について協議する体制及び緊急時に連絡をとれる体制を確保していることとする。"},{"s":"gl","p":111,"h":"5-23 報酬基準｜報酬①基本報酬","t":"また、協議会に定期的に参画していることについては、協議会の構成員として定期的に専門部会等に参加し、個別事例の報告等を行っていることとする。ウ人員配置要件（各事業所）当該指定特定相談支援事業所及び一体的に管理運営を行う指定特定相談支援事業所において、常勤専従の相談支援専門員をそれぞれ 1 名以上配置していること。"},{"s":"gl","p":112,"h":"5-23 報酬基準｜報酬①基本報酬","t":"機能強化型(継続)サービス利用支援費（Ⅰ）（2,014 単位/月、(継続)1,761 単位/月）＜算定要件＞※下記に加え、共通事項にある算定要件を満たしていること。（１）人員配置要件常勤かつ専従の相談支援専門員を 4 名以上配置し、そのうち 1 名以上が現任研修修了者であること。ただし、3 名（現任研修修了者 1 名を含む。）を除いた相談支援専門員については、当該定特定相談支援事業所の業務に支障がない場合は、同一敷地内にある他の事業所の業務を兼務しても差し支えないものとする。（２） 24 時間の連絡体制24 時間連絡可能な体制とは、営業時間と同様の体制をとることを求めるものではなく、営業時間外においては、利用者が緊急事態に際しても担当者と携帯電話等により連絡を取ることができ、必要に応じて相談に応じることが可能な体制をとる必要があることをいうものである。営業時間外の体制は当該事業所の相談支援専門員の輪番制による対応等によることも可能であること。"},{"s":"gl","p":112,"h":"5-23 報酬基準｜報酬①基本報酬","t":"（３）協議会への参画協議会に構成員として定期的に参画し、他の構成員である関係機関等との連携の緊密化を図るために必要な取組を実施していること。具体的には、定期的に専門部会等に参加し、個別事例の報告等、地域づくりに向けた検討及びそれに伴い必要な取組を当該関係機関等と連携して行うこととする。（４）基幹相談支援センターによる取組への参画基幹相談支援センターが行う地域の相談支援体制の強化の取組に参画していること。補足｜基幹相談支援センター等による地域の相談支援体制の強化の取組（地域生活支援事業通知別紙 1 地域生活支援事業実施要綱別記 1-3 相談支援事業実施要領 3 の（１）のイの(イ)）・地域の相談支援事業者に対する訪問等による専門的な指導、助言・地域の相談支援事業者の人材育成の支援（研修会の企画・運営、日常的な事例検討会の開催、サービス等利用計画の点検・評価等）"},{"s":"gl","p":112,"h":"5-23 報酬基準｜報酬①基本報酬","t":"・地域の相談機関（相談支援事業者、身体障害者相談員、知的障害者相談員、民生委員、高齢者、児童、保健・医療、教育・就労等に関する各種の相談機関等）との連携強化の取組（連携会議の開催等）・学校や企業等に赴き、各種情報の収集・提供や事前相談・助言・地域の相談支援事業者が実施したモニタリング結果及び地域においてセルフプランにより支給決定されている事例の検証"},{"s":"gl","p":113,"h":"5-23 報酬基準｜報酬①基本報酬","t":"（２）機能強化型(継続)サービス利用支援費（Ⅱ）（1,914 単位/月、(継続)1,661 単位/月）＜算定要件＞※下記に加え、共通事項にある算定要件を満たしていること。（１）人員配置要件常勤かつ専従の相談支援専門員を 3 名以上配置し、そのうち 1 名以上が現任研修修了者であること。ただし、2 名（現任研修修了者 1 名を含む。）を除いた相談支援専門員については、当該指定特定相談支援事業所の業務に支障がない場合は、同一敷地内にある他の事業所の業務を兼務しても差し支えないものとする。（２）24 時間の連絡体制機能強化型(継続)サービス利用支援費（Ⅰ）の（２）の規定を準用する。（３）協議会への参画機能強化型(継続)サービス利用支援費（Ⅰ）の（３）の規定を準用する。（４）基幹相談支援センターによる取組への参画機能強化型(継続)サービス利用支援費（Ⅰ）の（４）の規定を準用する。"},{"s":"gl","p":113,"h":"5-23 報酬基準｜報酬①基本報酬","t":"（３）機能強化型(継続)サービス利用支援費（Ⅲ）（1,822 単位/月、(継続)1,558 単位/月）＜算定要件＞※下記に加え、共通事項にある算定要件を満たしていること。（１）人員配置要件常勤かつ専従の相談支援専門員を２名以上配置し、そのうち 1 名以上が現任研修修了者であること。ただし、現任研修修了者 1 名を除いた相談支援専門員については、指定特定相談支援事業所の業務に支障がない場合においては、同一敷地内にあるそれ以外の他の事業所の業務を兼務しても差し支えないものとする。（２）協議会への参画機能強化型(継続)サービス利用支援費（Ⅰ）の（３）の規定を準用する。（３）基幹相談支援センターによる取組への参画機能強化型(継続)サービス利用支援費（Ⅰ）の（４）の規定を準用する。（４）機能強化型(継続)サービス利用支援費（Ⅳ）（1,672 単位/月、(継続)1,408 単位/月）"},{"s":"gl","p":113,"h":"5-23 報酬基準｜報酬①基本報酬","t":"＜算定要件＞※下記に加え、共通事項にある算定要件を満たしていること。（１）人員配置要件専従の相談支援専門員を 2 名以上配置し、かつ、そのうち 1 名以上が常勤の現任研修修了者であること。なお、本区分については、指定障害児相談支援事業所、指定一般相談支援事業所若しくは指定自立生活援助事業所の業務を除き、同一敷地内にあるそれ以外の他の事業所の職務を兼務することはできません。"},{"s":"gl","p":114,"h":"5-23 報酬基準｜報酬①基本報酬","t":"■機能強化型の基本報酬の算定要件※相談支援専門員については、同一敷地内にある指定一般相談支援、指定障害児相談支援、指定自立生活援助の各業務を兼務した場合でも常勤専従とみなす。※機能強化型Ⅰ～Ⅲにおける常勤専従者の内１名（現任研修修了者１名を除く）は、業務に支障がない場合については同一敷地内における他事業の兼務を可とする※現任研修修了者とある箇所については、主任相談支援専門員であっても可である。機能強化型基本報酬算定要件ⅠⅡⅢⅣ常勤かつ専従の相談支援専門員を４名以上配置し、そのうち1 名以上が現任研修修了者であること。○ーーー常勤かつ専従の相談支援専門員を３名以上配置し、そのうち1 名以上が現任研修修了者であること。ー○ーー常勤かつ専従の相談支援専門員を２名以上配置し、そのうち1 名以上が現任研修修了者であることーー○ー専従の相談支援専門員を 2 名以上配置し、かつ、そのうち 1名以上が常勤の現任研修修了者であること。ーーー○24時間連絡体制を確保し、かつ、必要に応じて利用者等の相談に対応する体制を確保していること。○○ーー協議会に構成員として定期的に参画し、他の構成員である関係機関等との連携の緊密化を図るために必要な取組を実施していること。○○○ー基幹相談支援センターが行う地域の相談支援体制の強化の取組に参画していること。○○○ー利用者に関する情報又はサービス提供に当たっての留意事項に係る伝達等を目的とした会議を定期的に開催すること。○○○○新規に採用した全ての相談支援専門員に対し、現任研修修了者の同行による研修を実施していること。○○○○積極的に支援困難ケースを受け入れなければならず、そのため、常に基幹相談支援センター等との連携を図らなければならないこと。○○○○基幹相談支援センター等が実施する事例検討会等に参加していること。○○○○計画相談支援と障害児相談支援の一月当たりの取扱件数が４０件未満であること。○○○○（７）支援困難ケースの受入（８）事例検討会への参加（９）取扱件数（１）人員配置要件（２）24時間の連絡体制（３）協議会への参画（４）基幹相談支援センターによる取組への参画（５）留意事項伝達会議（６）現任研修修了者同行による研修"},{"s":"gl","p":115,"h":"5-23 報酬基準｜報酬①基本報酬","t":"■サービス利用支援費及び継続サービス利用支援費について・サービス利用支援費及び継続サービス利用支援費も（Ⅰ）と（Ⅱ）に区分されます。・（Ⅰ）は、取扱件数（相談支援専門員１人当たりの前６月間における計画相談支援対象障害者等の数（指定障害児相談支援事業者の指定を併せて受け、一体的に運営されている場合は、指定障害児相談支援の事業における障害児相談支援対象保護者を含む。）の平均値をいう。以下同じ。）が 40 未満である場合又は 40 以上である場合において、40 未満の部分について算定します。・（Ⅱ）は、取扱件数が 40 以上である場合において、40 以上の部分について算定します。■機能強化型(継続)サービス利用支援費と(継続)サービス利用支援費（Ⅱ）について・機能強化型(継続)サービス利用支援費（Ⅰ）～（Ⅳ）を算定する場合も、取扱件数が 40 以上である場合においては、40 以上の部分について、（継続）サービス利用支援費（Ⅱ）を算定します。"},{"s":"gl","p":115,"h":"5-23 報酬基準｜報酬①基本報酬","t":"・機能強化型(継続)サービス利用支援費（Ⅰ）～（Ⅳ）のいずれかの機能強化型(継続)サービス利用支援費を算定している場合においては機能強化型(継続)サービス利用支援費（Ⅰ）～（Ⅳ）までのその他の機能強化型(継続)サービス利用支援費は算定しません。"},{"s":"gl","p":115,"h":"5-23 報酬基準｜報酬①基本報酬／①取扱件数の取扱い※留意事項通知第四の１の（３）の①","t":"①取扱件数の取扱い※留意事項通知第四の１の（３）の①※本市ホームページに掲載している「計画相談支援等の報酬減算額確認表」で要確認・１月の当該指定特定相談支援事業所全体の計画相談支援対象障害者等の数の前６月の平均値（以下、「計画相談支援対象障害者等の平均数」という。）を、当該指定特定相談支援事業所の相談支援専門員の員数の前６月の平均値（以下、「相談支援専門員の平均員数」という。）で除して得た数とします。・なお、当該指定特定相談支援事業所が指定障害児相談支援事業所も一体的に運営している場合は、指定障害児支援利用援助又は指定継続障害児支援利用援助を提供した障害児相談支援対象保護者の数も取扱件数に含みます。・上記方法により算定した取扱件数が 40 件を超えている場合は、当該超えた部分に相当する件数が、算定月におけるサービス利用支援費(Ⅱ)又は継続サービス利用支援費(Ⅱ)を適用する件数となります。"},{"s":"gl","p":115,"h":"5-23 報酬基準｜報酬①基本報酬／②割り当てについて※留意事項通知第四の１の（３）の②","t":"②割り当てについて※留意事項通知第四の１の（３）の②・サービス利用支援費（Ⅱ）及び継続サービス利用支援費（Ⅱ）の利用者ごとの割り当てに当たっては、利用者の契約日が新しいものから順に、40 件目（相談支援専門員の平均員数が１を超える場合にあっては、40 に相談支援専門員の平均員数を乗じた件数（小数点以下の端数は切り捨てる。））以降の件数分について、サービス利用支援費（Ⅱ）又は継続サービス利用支援費（Ⅱ）を割り当てます。"},{"s":"gl","p":116,"h":"5-23 報酬基準｜報酬①基本報酬／②割り当てについて※留意事項通知第四の１の（３）の②","t":"・なお、当該指定特定相談支援事業所が指定障害児相談支援事業所も一体的に運営している場合は、指定特定相談支援事業所における利用者の契約日が新しいものから順に割り当て、その後に指定障害児相談支援事業所の利用者の契約日が新しいものから順に割り当てます。"},{"s":"gl","p":116,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜複数事業所による協働体制","t":"Q＆A コーナー｜複数事業所による協働体制地域生活支援拠点等を構成する事業所による協働体制Q 地域生活支援拠点等を構成する複数の指定特定相談支援事業所による協働体制が確保されている場合、機能強化型（継続）サービス利用支援費を算定できるとされているが、具体的にどのような場合に算定できるのか。（国 QA(R3)VOL.2 問 31）A 留意事項通知で示しているとおり、協働体制を確保する事業所間において協定を締結していること、協働体制を維持できているかについて協定を締結した事業所間において定期的（月１回）に確認が実施されていること等の体制が確保されていることが必要になる。なお、協働体制を確保する事業所間においては、人員配置要件や 24 時間の連絡体制確保要件について、複数の事業所で要件を満たすことを可能としているが、特定の事業所に対して過重な負担とならないようあらかじめ事業所間で十分協議を行い、役割分担を明示した協定を締結し、かつ、具体的な業務内容の分担を行っておくことが重要である。（※障害児相談支援についても同様）"},{"s":"gl","p":116,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜複数事業所による協働体制","t":"協働体制を確保する事業所間で締結する協定Q 協働体制を確保すべき事業所間で締結すべき協定の事項は何か。（国 QA(R3)VOL.2 問 32）A 少なくとも以下に示す事項を含む協定を締結することが必要である。協定の締結年月日、協定を締結する事業所名、協定の目的、協働により確保する体制の内容、協働体制が維持されていることの確認方法、協働する事業所の義務、協定が無効や解除となる場合の事由や措置、秘密保持、協定の有効期間。補足｜協働体制における地域生活支援拠点について横浜市では、地域生活支援拠点について、区ごとで面的に整備を行っています。そのため、協働体制を確保する事業所については、原則、同一所在区内の事業所同士としています。各区の自立支援協議会の場などを活用しながら、事業所探しを行ってください。また、地域生活支援拠点として運営規程に規定した際は、「横浜市地域生活支援拠点機能構築のための連携ガイドライン」を必ず確認し、事業所が担う役割等をしっかりと確認・理解し、自立支援協議会へ参画し役割等を担うことを報告してください。その上で、自立支援協議会への継続的な参画、地域の体制づくり、人材育成に積極的に取り組んでいただきます。"},{"s":"gl","p":117,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜機能強化型の兼務が可能な範囲","t":"Q＆A コーナー｜機能強化型の兼務が可能な範囲機能強化型（継続）サービス利用支援費における兼務が可能な職員Q 機能強化型（継続）サービス利用支援費の算定要件について、常勤かつ専従の相談支援専門員を一定以上配置することとされているが、例外として、一部の職員については、兼務が認められている。兼務が可能な職員の範囲等について、どのようになっているか。（国 QA 問 73）A 以下の図を参照されたい。ただし、機能強化型基本報酬の趣旨を十分踏まえ、兼務により当該指定特定（障害児）相談支援事業所の業務に支障が生じないことを必ず担保するよう留意されたい。※横浜市では➁については、➀と同様の取扱いとしています。"},{"s":"gl","p":118,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜機能強化型の兼務が可能な範囲","t":"■計画相談支援と障害児相談支援の一体的支援の場合は、障害児相談支援のみの報酬※報酬告示注４、留意事項通知第四の１の（５）・障害福祉サービス（障害者総合支援法に基づく）と障害児通所支援（児童福祉法に基づく）の両方のサービスを利用する障害児については、計画相談支援と障害児相談支援の両方を一体的に実施することとなります。しかし、この場合の報酬については、障害児相談支援のみの報酬が算定され、計画相談支援の報酬の請求はできません。・なお、18 歳以上の障害者が放課後等デイサービスを利用する場合も、その者を障害児とみなして障害児支援利用計画を作成し、障害児相談支援のみの報酬が算定されます。・また、このような報酬体系になっていることからも、障害福祉サービスと障害児通所支援の両方のサービスを利用する障害児については、同一の相談支援事業所が支援を実施します。"},{"s":"gl","p":118,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜障害児相談支援対象者の対応","t":"Q＆A コーナー｜障害児相談支援対象者の対応障害児相談支援対象者に計画相談支援を行う場合Q 障害福祉サービスと障害児通所支援の両方のサービスを利用する障害児については、計画相談支援と障害児相談支援の両方を一体的に実施することとなるが、報酬については、障害児相談支援のみの報酬が算定されるという理解でよいか。（国 QA 問 53）A お見込みのとおり。なお、18 歳以上の障害者が放課後等デイサービスを利用する場合も、その者を障害児とみなして障害児支援利用計画を作成し、障害児相談支援のみの報酬が算定される。障害児から障害者へ切り替わる際の取扱いQ 障害児通所支援から障害福祉サービス等に利用するサービス等が切り替わる際に、障害児相談支援の支給期間の終期月に指定障害児相談支援事業者が障害児相談支援対象保護者に対して継続障害児支援利用援助を行い、同一の月に、指定特定相談支援事業者が計画相談支援対象障害者に対してサービス利用支援を行った場合、指定障害児相談支援事業者が継続障害児支援利用援助費を、指定特定相談支援事業者がサービス利用支援費を算定することは可能か。（国 QA 問 69）"},{"s":"gl","p":118,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜障害児相談支援対象者の対応","t":"A 報酬告示において「障害児相談支援対象保護者に対して、指定計画相談支援を行った場合には、所定単位数を算定しない。」とされているため、同一月に指定特定相談支援事業者がサービス利用支援費を算定することはできない。（報酬告示１の注４参照）したがって、サービス等利用計画を作成し、利用者から文書による同意を得る日を、障害児相談支援の支給期間の終期月の翌月に属する日とすること。なお、この取扱いについては、指定障害児相談支援事業者から指定特定相談支援事業者へケースを引き継ぐ場合も、指定障害児相談支援事業者と指定特定相談支援事業者の両方の指定を受けている事業者がケースを受け持つ場合も同じである。"},{"s":"gl","p":119,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜障害児相談支援対象者の対応","t":"■サービス利用支援費と継続サービス利用支援費の請求はどちらか一方※報酬告示注 5、留意事項通知第四の１の（６）、国 QA 問 59・62・サービス利用支援費及び継続サービス利用支援費は、同一の対象者に対して、同一の月に複数回行ったとしてもサービス利用支援費もしくは継続サービス利用支援費のどちらか一方のみの算定になります。つまり、同一の月に指定継続サービス利用支援を行った後に、指定サービス利用支援を行った場合は、継続サービス利用支援費は算定せず、サービス利用支援費のみを算定します。したがって、継続サービス利用支援を行った結果サービス等利用計画を作成するという一連の流れで行っている場合は、計画作成のアセスメントのプロセスをモニタリング（継続サービス利用支援）で行えているため、月をまたいだ場合も同様に継続サービス利用支援費は算定せず、サービス利用支援費のみを算定します。"},{"s":"gl","p":119,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜障害児相談支援対象者の対応","t":"・なお、サービス利用支援費及び継続サービス利用支援費は、月額報酬のため同一の月に複数回行ったとしても１回分しか算定することはできません。・機能強化型（継続）サービス利用支援費も同様です。■例外的に両方請求するケース※国 QA 問 59・指定サービス利用支援を行った後、同一の月に指定継続サービス利用支援を行った場合は、サービス利用支援費及び継続サービス利用支援費の両方を算定できます。・ただし、この取り扱いは、障害福祉サービスの体験利用（短期間）を行うための支給決定に係る指定サービス利用支援を行った後、同一の月に当該支給決定等に係るサービスの利用状況を検証するための指定継続サービス利用支援を行う等のケースが該当します。通常は、別の月で指定サービス利用支援と指定継続サービス利用支援を行いますので、例外的な対応として考えてください。"},{"s":"gl","p":119,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜取扱い件数の考え方","t":"Q＆A コーナー｜取扱い件数の考え方取扱い件数の考え方Q 相談支援専門員 1 人当たりの取扱件数には、基本報酬以外の加算の件数も含むのか。また、計画相談支援を行う事業所が地域相談支援の事業の指定も併せて受けており、相談支援専門員が地域相談支援における対応も実施している場合、当該件数も含まれるのか。（国 QA(H30)VOL.1 問 77）A 取扱件数は、１月間に実施したサービス利用支援、継続サービス利用支援、障害児支援利用援助、継続障害児支援利用援助の合計数であり、基本報酬以外の加算や地域相談支援の事業として対応した件数は含めない。"},{"s":"gl","p":120,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜常勤の考え方 / 体制整備","t":"Q＆A コーナー｜常勤の考え方 / 体制整備常勤の考え方Q 機能強化型（継続）サービス利用支援費及び各種加算の算定要件にある「常勤」の考え方如何。（国QA 問 70）A 「障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定障害福祉サービスの事業等の人員、設備及び運営に関する基準について」（平成 18 年 12 月 6 日障発 1206001）第二の２の（３）の規定に準じた取扱いとする。体制整備Q 機能強化型（継続）サービス利用支援費の要件として、24 時間連絡体制の確保があるが、24 時間開所しておく必要はなく、24 時間連絡が取れる体制を確保しておくことで足りるのか。また利用者等とあるので、利用者の家族や利用しているサービス提供事業所も対象になるのか。（国 QA 問 76）A お見込みのとおり。"},{"s":"gl","p":120,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜常勤の考え方 / 体制整備","t":"また、複数の事業所が協働して体制を確保する場合においては、地域生活支援拠点等を構成する複数の指定特定相談支援事業所全体で連絡体制が確保されていることをもって要件を満たすこととする。補足｜常勤・専従の考え方※障福解釈通知第二の２（３）・（４）・常勤とは、指定障害福祉サービス事業所等における勤務時間が、当該指定障害福祉サービス事業所等において定められている常勤の従業者が勤務すべき時間数（１週間に勤務すべき時間数が 32 時間を下回る場合は 32 時間を基本とする。）に達していることをいうものである。ただし、母性健康管理措置又は育児、介護及び治療のための所定労働時間の短縮等の措置が講じられている者については、利用者の処遇に支障がない体制が事業所として整っている場合は、例外的に常勤の従業者が勤務すべき時間数を 30 時間として取り扱うことを可能とする。"},{"s":"gl","p":120,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜常勤の考え方 / 体制整備","t":"当該指定障害福祉サービス事業所等に併設される事業所（同一敷地内に所在する又は道路を隔てて隣接する事業所をいう。ただし、管理者について、管理上支障がない場合は、その他の事業所を含む。）の職務であって、当該指定障害福祉サービス事業所等の職務と同時並行的に行われることが差し支えないと考えられるものについては、それぞれに係る勤務時間の合計が常勤の従業者が勤務すべき時間に達していれば、常勤の要件を満たすものであることとする。例えば、一の指定障害福祉サービス事業者によって行われる指定生活介護事業所と指定就労継続支援Ｂ型事業所が併設されている場合、当該指定生活介護事業所の管理者と当該指定就労継続支援Ｂ型事業所の管理者とを兼務している者は、これらの勤務時間の合計が所定の時間に達していれば、常勤要件を満たすこととなる。また、人員基準において常勤要件が設けられている場合、従業者が産前産後休業、母性健康管理措置、育児休業、介護休業、育児休業に準ずる休業を取得中の期間において、当該人員基準において求められる資質を有する複数の非常勤の従業者の員数に換算することにより、人員基準を満たすことが可能であることとする。"},{"s":"gl","p":120,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜常勤の考え方 / 体制整備","t":"・専従とは、原則として、サービス提供時間帯を通じて指定障害福祉サービス等以外の職務に従事しないことをいうものである。この場合のサービス提供時間帯とは、従業者の指定障害福祉サービス事業所等における勤務時間（療養介護及び生活介護については、サービスの単位ごとの提供時間）をいうものであり、当該従業者の常勤・非常勤の別を問わない。"},{"s":"gl","p":121,"h":"5-23 報酬基準｜報酬①基本報酬／ Q＆A コーナー｜管理者との兼務","t":"Q＆A コーナー｜管理者との兼務管理者との兼務についてQ 機能強化型基本報酬及び主任相談支援専門員配置加算では、原則として常勤専従が求められているところ、常勤専従が求められている相談支援専門員又は主任相談支援専門員について、管理者を兼務することは可能か。（国 QA 問 74）A 当該指定特定（障害児）相談支援事業所及び同一敷地内にある指定一般相談支援事業及び指定自立生活援助の事業所における管理者を兼務することは差し支えない。もっとも、主任相談支援専門員配置加算については、主任相談支援専門員による地域の相談支援事業所の従事者に対する助言指導を実施することが要件とされていることを踏まえ、上記管理者の兼務については、主任相談支援専門員としての上記助言指導の実施に支障が生じないと認められる場合に限ることとする。"},{"s":"gl","p":122,"h":"5-24 報酬基準｜報酬②基本報酬への減加算：介護保険制度","t":"※報酬告示１注６～８、留意事項通知第四の１（７）、国 QA 問 33・54■介護保険制度が優先・介護保険の対象者は、原則介護保険の介護支援専門員（ケアマネジャー）が対応し、計画相談支援の支給を決定することはありません。・しかし、介護支援専門員だけで計画を作成するのが困難な場合（例えば、障害福祉サービス固有のサービス：行動援護、同行援護、自立訓練（生活訓練）、就労移行支援、就労継続支援等の利用を希望する場合）で、区役所がサービス等利用計画案の作成が必要と認める場合には計画相談支援の支給決定を行うことができます。・併給の必要性がある場合には、必ず区役所に相談してください。■同一人物が介護支援専門員と相談支援専門員として同一利用者に支援する場合は減算同一人物が介護支援専門員と相談支援専門員として、同一利用者に支援を行う場合には、下記の通り減算の対象となります。なお、経過的サービス利用支援費及び経過的継続サービス利用支援費の算定時は取り扱いが異なりますので、ご注意ください。"},{"s":"gl","p":122,"h":"5-24 報酬基準｜報酬②基本報酬への減加算：介護保険制度／①居宅介護支援費重複減算(Ⅰ)","t":"①居宅介護支援費重複減算(Ⅰ)相談支援専門員又は相談支援員が、計画相談支援対象障害者等であって、介護保険法に規定する要介護状態区分が要介護１又は要介護２の方に対して、指定居宅介護支援と一体的に指定サービス利用支援又は指定継続サービス利用支援を行った場合に、１月につき 5-22 に掲げる単位を所定単位数から減算します。"},{"s":"gl","p":122,"h":"5-24 報酬基準｜報酬②基本報酬への減加算：介護保険制度／②居宅介護支援費重複減算(Ⅱ)","t":"②居宅介護支援費重複減算(Ⅱ)相談支援専門員又は相談支援員が、計画相談支援対象障害者等であって、同法に規定する要介護状態区分が要介護３、要介護４又は要介護５の方に対して、指定居宅介護支援と一体的に指定サービス利用支援又は指定継続サービス利用支援を行った場合に、１月につき 5-22 に掲げる単位を所定単位数から減算します。"},{"s":"gl","p":122,"h":"5-24 報酬基準｜報酬②基本報酬への減加算：介護保険制度／③介護予防支援費重複減算","t":"③介護予防支援費重複減算相談支援専門員又は相談支援員が、計画相談支援対象障害者等であって、同法に規定する要支援状態区分が要支援１又は要支援２の方に対して、指定介護予防支援と一体的に指定継続サービス利用支援を行い、継続サービス利支援費(Ⅰ)を算定した場合に、介護予防支援費重複減算として、１月につき 16 単位を所定単位数から減算します。"},{"s":"gl","p":123,"h":"5-25 報酬基準｜報酬②基本報酬への減加算：情報公表未報告等","t":"※報酬告示１注９～11、留意事項通知第二の１（12）（13）（15）"},{"s":"gl","p":123,"h":"5-25 報酬基準｜報酬②基本報酬への減加算：情報公表未報告等／①情報公表未報告減算","t":"①情報公表未報告減算・情報公表対象サービス等情報に係る報告を行っていない場合は、所定単位数の 100 分の５に相当する単位数を所定単位数から減算します。・情報公表対象サービス等情報に係る報告を行っていない事実が生じた場合に、その翌月から報告を行っていない状況が解消されるに至った月まで、当該事業所の利用者全員について、所定単位数から減算することとします。・障害福祉サービス等情報公表システムに事業所の正しい情報が公表されているか御確認ください。障害福祉サービス等情報公表システム WAM NEThttps://www.wam.go.jp/content/wamnet/pcpub/top/"},{"s":"gl","p":123,"h":"5-25 報酬基準｜報酬②基本報酬への減加算：情報公表未報告等／②業務継続計画未策定減算（経過措置期間あり）※5-６も参照ください。","t":"②業務継続計画未策定減算（経過措置期間あり）※5-６も参照ください。・感染症や非常災害の発生時において、利用者に対する指定計画相談支援の提供を継続的に実施するための、及び非常時の体制で早期の業務再開を図るための計画を策定し、当該業務継続計画に従い必要な措置を講じていない場合は、所定単位数の 100 分の１に相当する単位数を所定単位数から減算します。・必要な措置を講じていない事実が生じた場合に、その翌月から基準に満たない状況が解消されるに至った月まで、当該事業所の利用者全員について、所定単位数から減算することとします。・計画相談支援については、「非常災害に関する具体的計画」の策定が求められていないことを踏まえ、経過措置として、令和７年３月 31 日までの間、当該減算は適用しません。"},{"s":"gl","p":123,"h":"5-25 報酬基準｜報酬②基本報酬への減加算：情報公表未報告等／③虐待防止措置未実施減算※5-15 も参照ください。","t":"③虐待防止措置未実施減算※5-15 も参照ください。・虐待の発生又はその再発を防止するための措置を講じていない場合は、所定単位数の 100 分の１に相当する単位数を所定単位数から減算します。・措置を講じていない事実が生じた場合であって、速やかに改善計画を市に提出した後、事実が生じた月から 3 月後に改善計画に基づく改善状況を都道府県知事等に報告することとし、事実が生じた月の翌月から改善が認められた月までの間について、利用者全員について所定単位数から減算することとします。これは、適正なサービスの提供を確保するための規定であり、指定障害福祉サービス事業所等は、虐待の防止を図らなければならないものとします。なお、「事実が生じた」とは、運営基準を満たしていない状況が確認されたことを指すものです。"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算","t":"※報酬告示１の注 12、留意事項通知第四の２・第二の２（１）⑮■特定の地域に居住している利用者に対応した場合の報酬加算・厚生労働大臣が定める地域に居住している利用者に対して、計画相談支援を行った場合に、特別地域加算として、1 回につき所定単位数の 100 分の 15 に相当する単位数を所定単位数に加えて算定します。・対象となる場合には、区役所に申し出てください。申し出を受け付けた時点から、特別地域加算の決定を行います。・特別地域加算を算定する利用者に対して、指定障害福祉サービス基準第 31 条第５号に規定する通常の事業の実施地域を越えてサービス提供した場合、指定障害福祉サービス基準第 21 条第３項に規定する交通費の支払いを受けることはできません。【厚生労働大臣が定める地域】※厚生労働省告示第176号"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／①離島振興法(昭和二十八年法律第七十二号)第二条第一項の規定により指定された離","t":"①離島振興法(昭和二十八年法律第七十二号)第二条第一項の規定により指定された離島振興対策実施地域"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／②奄美群島振興開発特別措置法(昭和二十九年法律第百八十九号)第一条に規定する奄","t":"②奄美群島振興開発特別措置法(昭和二十九年法律第百八十九号)第一条に規定する奄美群島"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／③豪雪地帯対策特別措置法(昭和三十七年法律第七十三号)第二条第二項の規定により","t":"③豪雪地帯対策特別措置法(昭和三十七年法律第七十三号)第二条第二項の規定により指定された特別豪雪地帯"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／④辺地に係る公共的施設の総合整備のための財政上の特別措置等に関する法律(昭和三","t":"④辺地に係る公共的施設の総合整備のための財政上の特別措置等に関する法律(昭和三十七年法律第八十八号)第二条第一項に規定する辺地"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／⑤山村振興法(昭和四十年法律第六十四号)第七条第一項の規定により指定された振興","t":"⑤山村振興法(昭和四十年法律第六十四号)第七条第一項の規定により指定された振興山村"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／⑥小笠原諸島振興開発特別措置法(昭和四十四年法律第七十九号)第四条第一項に規定","t":"⑥小笠原諸島振興開発特別措置法(昭和四十四年法律第七十九号)第四条第一項に規定する小笠原諸島"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／⑦半島振興法(昭和六十年法律第六十三号)第二条第一項の規定により指定された半島","t":"⑦半島振興法(昭和六十年法律第六十三号)第二条第一項の規定により指定された半島振興対策実施地域"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／⑧特定農山村地域における農林業等の活性化のための基盤整備の促進に関する法律(平","t":"⑧特定農山村地域における農林業等の活性化のための基盤整備の促進に関する法律(平成五年法律第七十二号)第二条第一項に規定する特定農山村地域"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／⑨過疎地域自立促進特別措置法(平成十二年法律第十五号)第二条第一項に規定する過","t":"⑨過疎地域自立促進特別措置法(平成十二年法律第十五号)第二条第一項に規定する過疎地域"},{"s":"gl","p":124,"h":"5-26 報酬基準｜報酬②基本報酬への減加算：特別地域加算／⑩沖縄振興特別措置法(平成十四年法律第十四号)第三条第三号に規定する離島","t":"⑩沖縄振興特別措置法(平成十四年法律第十四号)第三条第三号に規定する離島【県内の対象地域】清川村全域、相模原市津久井町、相模原市藤野町（旧藤野町エリア）、山北町、湯河原町、松田町、南足柄市の旧北足柄村（内山、矢倉沢）、大井町の旧相和村（赤田、高尾、柳、篠窪）"},{"s":"gl","p":125,"h":"5-27 報酬基準｜報酬③加算：体制加算","t":"※報酬告示４、12～15、厚生労働大臣が定める基準４、６～10、留意事項通知第四の６・14～18■専門性の高い相談支援体制を評価する加算・専門性の高い支援を実施できる体制を整えている場合に、その体制整備を適切に評価するための加算です。・体制加算の算定には、本市に手続きを行うことが必要です。※様式は、障害福祉情報サービスかながわホームページに掲載されています。トップページ＞書式ライブラリ＞２．横浜市からのお知らせ＞"},{"s":"gl","p":125,"h":"5-27 報酬基準｜報酬③加算：体制加算／⑤体制届に関するお知らせ（障害者総合支援法）","t":"⑤体制届に関するお知らせ（障害者総合支援法）■各加算の内容"},{"s":"gl","p":125,"h":"5-27 報酬基準｜報酬③加算：体制加算／①行動障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"①行動障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）※報酬告示 12、厚生労働大臣が定める基準６、留意事項通知第四の 14＜算定要件＞※次の要件を全て満たす場合に算定可能ア行動障害のある知的障害者や精神障害者に対して適切な計画相談支援を実施するために、各都道府県が実施する強度行動障害支援者養成研修（実践研修）又は行動援護従業者養成研修を修了した常勤の相談支援専門員を１名以上配置し、行動障害のある障害者へ適切に対応できる体制が整備されていることイ研修を修了した相談支援専門員を配置している旨を市町村へ届け出ることウ体制が整備されている旨を事業所に掲示するとともに公表すること＜算定に当たっての留意事項＞ア共通事項・強度行動障害を有する者から利用申込があった場合に、利用者の障害特性に対応できないことを理由にサービスの提供を拒むことは認められません（国による利用者名簿様式あり）。"},{"s":"gl","p":125,"h":"5-27 報酬基準｜報酬③加算：体制加算／①行動障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"・当該研修の事業を行った者から当該研修の課程を修了した旨の証明書の交付を受けていることが必要です。・行動障害のある知的障害者や精神障害者に対して適切な計画相談支援を実施するための体制を整備することを評価するものであることから、強度行動障害を有する利用者のみならず、当該指定特定相談支援事業所における全ての利用者に対して指定サービス利用支援又は指定継続サービス利用支援を実施する場合に加算することができるものです。・Ⅰについては、対象となる障害者に対して現に指定計画相談支援を行っている場合に算定"},{"s":"gl","p":126,"h":"5-27 報酬基準｜報酬③加算：体制加算／①行動障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"できるものであり、現に支援を行っていない場合には、Ⅱを算定します。イ行動障害支援体制加算（Ⅰ）[対象となる障害者]・当該区分は、支援対象者に障害支援区分 3 以上に該当しており、かつ、行動関連項目合計点数が 10 点以上である者（以下「強度行動障害者」という。）がいる場合に、全ての利用者に対して加算できることとしています。なお、利用者が強度行動障害児者に該当するかについて、一定期間毎に確認すること。・また、当該確認にあたって、受給者証の記載（障害支援区分、利用サービス、加算対象等）により確認が可能な場合は、これによって確認することも考えられます。[対象者への支援]・当該区分は、研修を修了した相談支援専門員により、強度行動障害児者に対して現に指定計画相談支援を行っていることを要件としているが、「現に指定計画相談支援を行っている」とは、前 6 月に、強度行動障害児者に対して指定計画相談支援を行っていることとします。"},{"s":"gl","p":126,"h":"5-27 報酬基準｜報酬③加算：体制加算／①行動障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"そのため、強度行動障害児者に対する指定計画相談支援の実施状況について管理してください。・なお、研修を修了した相談支援専門員が同一敷地内に所在する指定障害児相談支援事業所の職務を兼務する場合であって、強度行動障害児（児童福祉法に基づく指定障害児相談支援に要する費用の額の算定に関する基準に基づきこども家庭庁長官が定める基準（平成 27 年厚生労働省告示第 181 号）第 6 号のイの⑶に規定する表（児基準の合計点数が 20 点以上である児童）の保護者に対して指定障害児相談支援を行っている場合も当該区分に該当するものです。"},{"s":"gl","p":126,"h":"5-27 報酬基準｜報酬③加算：体制加算／②要医療児者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"②要医療児者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）※報酬告示 13、厚生労働大臣が定める基準７、留意事項通知第四の 15＜算定要件＞※次の要件を全て満たす場合に算定可能ア人工呼吸器を装着している障害児者その他の日常生活を営むために医療を要する状態にある障害児者等（以下、「医療的ケア児等」という。）に対して適切な計画相談支援等を実施するために、医療的ケア児等の障害特性及びこれに応じた支援技法等に関する研修※１を修了した常勤の相談支援専門員を１名以上配置し、医療的ケア児等へ適切に対応できる体制が整備されていることイ研修を修了した相談支援専門員を配置している旨を市町村へ届け出ることウ体制が整備されている旨を事業所に掲示するとともに公表すること※１「医療的ケア児等の障害特性及びこれに応じた支援技法等に関する研修」とは、地域生活支"},{"s":"gl","p":127,"h":"5-27 報酬基準｜報酬③加算：体制加算／②要医療児者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"援事業の実施について（平成 18 年 8 月 1 日障発第 0801002 号厚生労働省社会・援護局障害保健福祉部長通知。以下、「地域生活支援事業通知」という。）の別紙２地域生活支援促進事業実施要綱別記２－10 に定める医療的ケア児等総合支援事業により行われる医療的ケア児等コーディネーター養成研修（人工呼吸器を装着している障害児その他の日常生活を営むために医療を要する状態にある障害児等の障害特性及びこれに応じた支援技法等に関する研修に限る。）その他これに準ずるものとして都道府県知事が認める研修をいいます。＜算定に当たっての留意事項＞ア共通事項・医療的ケア児等から利用申込があった場合に、利用者の障害特性に対応できないことを理由にサービスの提供を拒むことは認められません（国による利用者名簿様式あり）。・当該研修の事業を行った者から当該研修の課程を修了した旨の証明書の交付を受けていることが必要です。"},{"s":"gl","p":127,"h":"5-27 報酬基準｜報酬③加算：体制加算／②要医療児者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"・医療的ケア児等に対して適切な計画相談支援を実施するための体制を整備することを評価するものであることから、医療的ケア児等である利用者のみならず、当該指定特定相談支援事業所における全ての利用者に対して指定サービス利用支援又は指定継続サービス利用支援を実施する場合に加算することができるものです。・Ⅰについては、対象となる障害者に対して現に指定計画相談支援を行っている場合に算定できるものであり、現に支援を行っていない場合には、Ⅱを算定します。イ要医療児者支援体制加算（Ⅰ）[対象となる障害者]・当該区分は、支援対象者にスコア表の項目の欄に掲げるいずれかの医療行為を必要とする状態である者（以下「対象医療的ケア児者」という。）がいる場合に、全ての利用者に対して加算できることとしています。なお、利用者が対象医療的ケア児等に該当するかについて、一定期間毎に確認してください。また、当該確認にあたって、受給者証の記載（加算対象等）により確認が可能な場合は、これによって確認することも考えられます。"},{"s":"gl","p":127,"h":"5-27 報酬基準｜報酬③加算：体制加算／②要医療児者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"[対象者への支援]・当該区分は、研修を修了した相談支援専門員により、対象医療的ケア児者に対して現に指定計画相談支援を行っていることを要件としていますが、「現に指定計画相談支援を行っている」とは、前 6 月に、対象医療的ケア児者に対して指定計画相談支援を行っていることとします。そのため、対象医療的ケア児者に対する指定計画相談支援の実施状況について管理してください。なお、研修を修了した相談支援専門員が同一敷地内に所在する指定障害児相談支援事業所の職務を兼務する場合であって、対象医療的ケア児者（18 歳未満の者に限る。）の保護者に対して指定障害児相談支援を行っている場合も当該区分に該当するものです。"},{"s":"gl","p":128,"h":"5-27 報酬基準｜報酬③加算：体制加算／③精神障害者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"③精神障害者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）※報酬告示 14、厚生労働大臣が定める基準８、留意事項通知第四の 16＜算定要件＞※次の要件を全て満たす場合に算定可能ア精神科病院等に入院する障害者等及び地域において単身生活等をする精神障害者等に対して、地域移行支援や地域定着支援のマネジメントを含めた適切な計画相談支援を実施するために、精神障害者の障害特性及びこれに応じた支援技法等に関する研修※１を修了した常勤の相談支援専門員を１名以上配置し、精神障害者等へ適切に対応できる体制が整備されていることイ研修を修了した相談支援専門員を配置している旨を市町村へ届け出ることウ体制が整備されている旨を事業所に掲示するとともに公表すること※１「精神障害者の障害特性及びこれに応じた支援技法等に関する研修」とは、地域生活支援事業通知の別紙１地域生活支援事業実施要綱別記１－17 に定める精神障害関係従事者養成研修事業若しくは精神障害者支援の障害特性と支援技法を学ぶ研修事業又は同通知の別紙２地域生活支援促進事業実施要綱別記２－18 に定める精神障害にも対応した地域包括ケアシステムの構築推進事業において行われる精神障害者の地域移行関係職員に対する研修（精神障害者の障害特性及びこれに応じた支援技法等に関する研修に限る。）その他これに準ずるものとして都道府県知事が認める研修をいいます。"},{"s":"gl","p":128,"h":"5-27 報酬基準｜報酬③加算：体制加算／③精神障害者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"＜算定に当たっての留意事項＞ア共通事項・精神障害者等から利用申込があった場合に、利用者の障害特性に対応できないことを理由にサービスの提供を拒むことは認められません（国による利用者名簿様式あり）。・当該研修の事業を行った者から当該研修の課程を修了した旨の証明書の交付を受けていることが必要です。・精神障害者等に対して適切な計画相談支援を実施するための体制を整備することを評価するものであることから、精神障害者等である利用者のみならず、当該指定特定相談支援事業所における全ての利用者に対して指定サービス利用支援又は指定継続サービス利用支援を実施する場合に加算することができるものです。・Ⅰについては、対象となる障害者に対して現に指定計画相談支援を行っている場合に算定できるものであり、現に支援を行っていない場合には、Ⅱを算定します。"},{"s":"gl","p":128,"h":"5-27 報酬基準｜報酬③加算：体制加算／③精神障害者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"イ精神障害者支援体制加算（Ⅰ）[対象となる障害者]・当該区分は、支援対象者に法第 4 条第 1 項に規定する精神障害者（以下「精神障害者」という。）がいる場合に、全ての利用者に対して加算できることとしています。なお、当該確認にあ"},{"s":"gl","p":129,"h":"5-27 報酬基準｜報酬③加算：体制加算／③精神障害者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"たって、精神障害者保健福祉手帳、自立支援医療（精神通院医療）の受給者証、診断書、医療機関からの診療情報提供書等によって確認することも考えられます。[対象者への支援]・当該区分は、研修を修了した相談支援専門員により、精神障害者に対して現に指定計画相談支援を行っていることを要件としているが、「現に指定計画相談支援を行っている」とは、前 6月に、精神障害者に対して指定計画相談支援を行っていることとします。そのため、精神障害者に対する指定計画相談支援の実施状況について管理しておくこととします。・なお、研修を修了した相談支援専門員が同一敷地内に所在する指定障害児相談支援事業所の職務を兼務する場合であって、児童福祉法第 4 条第 2 項に規定する精神に障害のある児童の保護者に対して指定障害児相談支援を行っている場合も当該区分に該当するものです。"},{"s":"gl","p":129,"h":"5-27 報酬基準｜報酬③加算：体制加算／③精神障害者支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"[病院等における保健師、看護師又は精神保健福祉士との連携体制]・当該区分は、精神疾患を有する患者であって重点的な支援を要するものに対して支援を行う病院等又は訪問看護事業所であって、利用者が通院又は利用するものの保健師、看護師又は精神保健福祉士と連携する体制が構築されていることを要件としています。・保健師、看護師又は精神保健福祉士と連携する体制が構築されていることとは、少なくとも 1年に 1 回以上、研修を修了した相談支援専門員と保健師、看護師又は精神保健福祉士との間で面談又は会議を行い、精神障害者に対する支援に関して検討を行っていることとします。・また、精神疾患を有する患者であって重点的な支援を要するものに対して支援を行う病院等又は訪問看護事業所とは、療養生活継続支援加算を算定している病院等又は精神科重症患者支援管理連携加算の届出をしている訪問看護事業所をいうものであり、利用者が通院又は利用するとは、利用者が前 1 年以内に通院又は利用していることとします。"},{"s":"gl","p":129,"h":"5-27 報酬基準｜報酬③加算：体制加算／④高次脳機能障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"④高次脳機能障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）※報酬告示 14 の２、厚生労働大臣が定める基準９、留意事項通知第四の 17＜算定要件＞※次の要件を全て満たす場合に算定可能ア脳の器質的病変の原因となる事故による受傷や疾病の発症の事実が確認され、かつ、日常生活又は社会生活に制約があり、その主たる原因が記憶障害、注意障害、遂行機能障害、社会的行動障害等の認知障害である障害者等以下「高次脳機能障害者」という。に対して適切な計画相談支援を実施するために、高次脳機能障害支援者養成に関する研修※１を修了した常勤の相談支援専門員を 1 名以上配置し、高次脳機能障害者へ適切に対応できる体制が整備されていることイ研修を修了した相談支援専門員を配置している旨を市町村へ届け出ることウ体制が整備されている旨を事業所に掲示するとともに公表すること"},{"s":"gl","p":130,"h":"5-27 報酬基準｜報酬③加算：体制加算／④高次脳機能障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"※１地域生活支援事業として行われる高次脳機能障害する研修とは、「高次脳機能障害支援養成研修の実施について」に基づき都道府県が実施する研修をいい、「これに準ずるものとして都道府県知事が認める研修」については、当該研修と同等の内容のものであること。＜算定に当たっての留意事項＞ア共通事項・高次脳機能障害者から利用申込みがあった場合に、利用者のから利用申込があった場合に、利用者の障害特性に対応できないことを理由にサービスの提供を拒むことは認められません。・当該研修の事業を行った者から当該研修の課程を修了した旨の証明書の交付を受けていることが必要です。・高次脳機能障害者に対して適切な計画相談支援を実施するための体制を整備することを評価するものであることから、高次脳機能障害者である利用者のみならず、当該指定特定相談支援事業所における全ての利用者に対して指定サービス利用支援又は指定継続サービス利用支援を実施する場合に加算することができるものです。"},{"s":"gl","p":130,"h":"5-27 報酬基準｜報酬③加算：体制加算／④高次脳機能障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"・Ⅰについては、対象となる障害者に対して現に指定計画相談支援を行っている場合に算定できるものであり、現に支援を行っていない場合には、Ⅱを算定します。イ高次脳機能障害支援体制加算（Ⅰ）[対象となる障害者]・当該区分は、支援対象者に高次脳機能障害者がいる場合に、全ての利用者に対して加算できることとしています。なお、利用者が高次脳機能障害者に該当するかについて、一定期間毎に確認してください。また、当該確認にあたっては、以下のいずれかの書類において高次脳機能障害の診断の記載があることを確認してください。➀障害福祉サービス等の支給決定における医師の意見書➁精神障害者保健福祉手帳の申請における医師の診断書➂その他医師の診断書等（原則として主治医が記載したものであること。）[対象者への支援]・当該区分は、研修を修了した相談支援専門員により、高次脳機能障害者に対して現に指定計画相談支援を行っていることを要件としているが、「現に指定計画相談支援を行っている」とは、前 6 月に、高次脳機能障害者に対して指定計画相談支援を行っていることとします。"},{"s":"gl","p":130,"h":"5-27 報酬基準｜報酬③加算：体制加算／④高次脳機能障害支援体制加算（Ⅰ：60 単位/月Ⅱ：30 単位/月）","t":"そのため、高次脳機能障害者に対する指定計画相談支援の実施状況について管理しておくこと。なお、研修を修了した相談支援専門員が同一敷地内に所在する指定障害児相談支援事業所の職務を兼務する場合であって、対象高次脳機能障害者（18 歳未満の者に限る。）の保護者に対して指定障害児相談支援を行っている場合も当該区分に該当します。"},{"s":"gl","p":131,"h":"5-27 報酬基準｜報酬③加算：体制加算／⑤ピアサポート体制加算（100 単位/月）","t":"⑤ピアサポート体制加算（100 単位/月）※報酬告示 15、厚生労働大臣が定める基準 10、留意事項通知第四の 18＜算定要件＞※次の要件を全て満たす場合に算定可能ア都道府県又は指定都市が実施する障害者ピアサポート研修※１の基礎研修及び専門研修を修了した次の者をそれぞれ常勤換算方法で 0.5 以上※２配置する事業所であって、当該者によりその他の従業者に対して障害者に対する配慮等に関する研修が年１回以上行われている場合に算定することができる。(ｱ) 障害者又は障害者であったと市町村長が認める者（以下、「障害者等」※３という。）であって、相談支援専門員又はその他指定計画相談支援に従事する者(ｲ) 管理者、相談支援専門員、相談支援員又はその他指定計画相談支援に従事する者イ研修を修了し従業者を配置している旨を市町村へ届け出ることウ体制が整備されている旨を事業所に掲示するとともに公表すること※１「障害者ピアサポート研修」とは、地域生活支援事業通知の別紙１地域生活支援事業実施要項別記１－17 に定める障害者ピアサポート研修事業をいう。"},{"s":"gl","p":131,"h":"5-27 報酬基準｜報酬③加算：体制加算／⑤ピアサポート体制加算（100 単位/月）","t":"※２併設する事業所（指定自立生活援助事業所、指定地域移行支援事業所、指定地域定着支援事業所又は指定障害児相談支援事業所に限る）の職員を兼務する場合は当該兼務先を含む業務時間の合計が常勤換算方法で 0.5 以上になる場合を含む。※３「障害者等」については、以下の書類又は方法により確認する。(ｱ) 身体障害者身体障害者手帳(ｲ) 知的障害者"},{"s":"gl","p":131,"h":"5-27 報酬基準｜報酬③加算：体制加算／②療育手帳を有しない場合は、市町村が必要に応じて知的障害者更生相談所に意見を求め","t":"②療育手帳を有しない場合は、市町村が必要に応じて知的障害者更生相談所に意見を求めて確認する。(ｳ) 精神障害者"},{"s":"gl","p":131,"h":"5-27 報酬基準｜報酬③加算：体制加算／②精神障害を事由とする年金を現に受けていること又は受けていたことを証明する書類","t":"②精神障害を事由とする年金を現に受けていること又は受けていたことを証明する書類（国民年金、厚生年金などの年金証書等）"},{"s":"gl","p":131,"h":"5-27 報酬基準｜報酬③加算：体制加算／③精神障害を事由とする特別障害給付金を現に受けている又は受けていたことを証明する","t":"③精神障害を事由とする特別障害給付金を現に受けている又は受けていたことを証明する書類"},{"s":"gl","p":131,"h":"5-27 報酬基準｜報酬③加算：体制加算／⑤医師の診断書（原則として主治医が記載し、国際疾病分類 ICD-10 コードを記","t":"⑤医師の診断書（原則として主治医が記載し、国際疾病分類 ICD-10 コードを記載するなど精神障害者であることが確認できる内容であること）"},{"s":"gl","p":132,"h":"5-27 報酬基準｜報酬③加算：体制加算／⑤医師の診断書（原則として主治医が記載し、国際疾病分類 ICD-10 コードを記","t":"(ｴ) 難病等対象者医師の診断書、特定医療費（指定難病）受給者証、指定難病に罹患していることが記載されている難病医療費助成の却下通知等(ｵ) その他市町村が認める書類又は確認方法＜算定に当たっての留意事項＞・当該研修の事業を行った者から当該研修の課程を修了した旨の証明書の交付を受けていることが必要です。"},{"s":"gl","p":132,"h":"5-27 報酬基準｜報酬③加算：体制加算／⑥主任相談支援専門員配置加算（Ⅰ：300 単位/月Ⅱ：100 単位/月）","t":"⑥主任相談支援専門員配置加算（Ⅰ：300 単位/月Ⅱ：100 単位/月）※報酬告示４、厚生労働大臣が定める基準４、留意事項通知第四の６＜算定要件＞ア相談支援従事者主任研修を修了した常勤かつ専従※１の主任相談支援専門員を１名以上配置し、当該主任相談支援専門員が適切な助言・指導を行うことができる体制が整備されていること。イ研修を修了し従業者を配置している旨を市町村へ届け出ることウ体制が整備されている旨を事業所に掲示するとともに公表すること※１同一敷地内にある事業所における障害児相談、地域相談、自立生活援助、の兼務は可能＜算定に当たっての留意事項＞ア主任相談支援専門員配置加算（Ⅰ）※（Ⅰ）を算定する場合は、本市ホームページに掲載の「主任相談支援専門員配置加算の取扱いについて（通知）」を参照し、届出前に障害施策推進課相談支援推進係にご相談ください。"},{"s":"gl","p":132,"h":"5-27 報酬基準｜報酬③加算：体制加算／⑥主任相談支援専門員配置加算（Ⅰ：300 単位/月Ⅱ：100 単位/月）","t":"[事業所の要件]地域の相談支援の中核を担う機関として市町村長が認める※指定特定相談支援事業所に限ります。※「市町村が認める」とは、以下のいずれかの役割を担っている場合です。・市自立支援協議会や市の設置する検討会の委員を担っている。・相談支援従事者初任者研修又は現任研修の企画委員又は講師を担っている。・県域・市域の研修（相談支援研修Ⅰ、虐待防止研修等）の講師を担っている。・基幹の実施する事業所訪問や相談支援従事者向けの研修会の企画運営を実施していることを区自立支援協議会から認められている。[主任相談支援専門員が行うべき事項]主任相談支援専門員による地域における中核的な役割として期待される取組を特に評価するため、当該指定特定相談支援事業所の従業者に加え、当該指定特定相談支援事業所以外の指定特定相談支援事業所、指定障害児相談支援事業所及び指定一般相談支援事業所の従業者に対しても、その資質の向上のための指導及び助言を実施した場合に算定できます。"},{"s":"gl","p":133,"h":"5-27 報酬基準｜報酬③加算：体制加算／⑥主任相談支援専門員配置加算（Ⅰ：300 単位/月Ⅱ：100 単位/月）","t":"なお、ここでいう「指導及び助言を実施した場合」とは次に掲げるいずれの要件も満たす体制が整備されていなければいけません。(ア) 利用者に関する情報又はサービス提供に当たっての留意事項に係る伝達等を目的とした会議の開催(イ) 新規に採用した全ての相談支援専門員に対する主任相談支援専門員の同行による研修の実施(ウ) 当該相談支援事業所の全ての相談支援専門員に対して、地域づくり、人材育成、困難事例への対応などサービスの総合的かつ適切な利用支援等の援助技術の向上等を目的として主任相談支援専門員が行う指導、助言(エ) 基幹相談支援センターが実施する地域の相談支援事業者の人材育成や支援の質の向上のための取組の支援（日常的な支援方針等を検討する場の設置・運営、事業所の訪問や相談支援従事者の業務への同行等による専門的な助言、研修会の企画・運営（相談支援従事者研修の実習の受入を含む。）等）を基幹相談支援センターの職員と共同で実施していること。"},{"s":"gl","p":133,"h":"5-27 報酬基準｜報酬③加算：体制加算／⑥主任相談支援専門員配置加算（Ⅰ：300 単位/月Ⅱ：100 単位/月）","t":"イ主任相談支援専門員配置加算（Ⅱ）当該指定特定相談支援事業所の従業者又は当該指定特定相談支援事業所以外の指定特定相談支援事業所、指定障害児相談支援事業所及び指定一般相談支援事業所の従業者に対し、その資質の向上のための研修を実施した場合に算定できるものである。なお、ここでいう「研修を実施した場合」とは、アの[主任相談支援専門員が行うべき事項]の（ア）から（ウ）までに規定する要件に加えて、次に掲げる要件も満たす体制が整備されていなければいけません。基幹相談支援センターが実施する地域の相談支援事業者の人材育成や支援の質の向上のための取組の支援（日常的な支援方針等を検討する場の設置・運営、事業所の訪問や相談支援従事者の業務への同行等による専門的な助言、研修会の企画・運営（相談支援従事者研修の実習の受入を含む。）等）への主任相談支援専門員の協力"},{"s":"gl","p":133,"h":"5-27 報酬基準｜報酬③加算：体制加算／ Q＆A コーナー｜体制加算","t":"Q＆A コーナー｜体制加算精神障害支援体制加算等の算定Q 行動障害者支援体制加算（Ⅰ）、精神障害支援体制加算（Ⅰ）、高次脳機能障害支援体制加算（Ⅰ）の算定にあたって、複数の加算の要件である研修修了者が同一人物の場合であって、当該者により複数の加算の算定要件に該当する利用者１名を支援することをもって、行動障害者支援体制加算（Ⅰ）、精神障害支援体制加算、高次脳機能障害支援体制加算（Ⅰ）を複数算定することができるか。（国QA(R6)VOL.1 問 71）A 研修修了者と対象者となる利用者がそれぞれ１名のみである場合、複数の加算を算定することはできず、行動障害者支援体制加算（Ⅰ）、精神障害支援体制加算、高次脳機能障害支援体制加算（Ⅰ）のいずれか一つの加算を選択して算定することとなる。なお、上記で算定しなかった加算については、（Ⅱ）の区分で算定することができるため、申し添える。"},{"s":"gl","p":134,"h":"5-27 報酬基準｜報酬③加算：体制加算／ Q＆A コーナー｜体制加算","t":"Q＆A コーナー｜体制加算各種体制加算の算定対象Q 行動障害者支援体制加算・要医療児者支援体制加算・精神障害者支援体制加算・高次脳機能障害支援体制加算（Ⅰ）の算定対象は、各加算で対象者と規定する利用者のみか。また、研修修了者が計画（障害児）相談支援を行った利用者のみ（Ⅰ）の区分で算定可能か。（国 QA(R6)VOL.1 問 72）A 各種支援体制加算（Ⅰ）の要件を満たす場合、全ての利用者の基本報酬について加算されるものである。また、要件を満たすためには、研修修了者が各種支援体制加算で対象者と規定する利用者に対して支援を行う必要がある。各種体制加算の算定要件支援内容Q 行動障害者支援体制加算・要医療児者支援体制加算・精神障害者支援体制加算・高次脳機能障害支援体制加算（Ⅰ）については、研修修了者が現に計画（障害児）相談支援を行っていることが要件とされているが、計画（障害児）相談支援を行っていることとは、具体的にどのような支援が行われていることを要するか。（国 QA(R6)VOL.1 問 73）"},{"s":"gl","p":134,"h":"5-27 報酬基準｜報酬③加算：体制加算／ Q＆A コーナー｜体制加算","t":"A 原則として、研修修了者がサービス利用支援又はモニタリングを行っていることを要する。なお、研修修了者が他の相談支援専門員と共同で利用者を担当している等により、サービス利用支援又はモニタリングの業務の一部を担当している場合であっても、その他の相談支援専門員に対する指導・助言等の体制が確保されている場合については、研修修了者が計画（障害児）相談支援を行っていることと扱って差し支えない。体制加算の算定開始時期Q 「行動障害支援体制加算」の届出が月途中で提出された場合、いつから実施した計画相談支援で加算が算定できるのか。（国 QA(H30)VOL.1 問 90）A 「障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定障害福祉サービス等及び基準該当障害福祉サービスに要する費用の額の算定に関する基準等の制定に伴う実施上の留意事項について」（平成 18 年 10 月 31 日障発 1031001 厚生労働省社会・援護局障害保健福祉部長通知）"},{"s":"gl","p":134,"h":"5-27 報酬基準｜報酬③加算：体制加算／ Q＆A コーナー｜体制加算","t":"第一の１の（４）の規定に準じた取扱いとする。なお、要医療児者支援体制加算及び精神障害者支援体制加算も同様である。ピアサポート体制加算の算定についてQ ピアサポート体制加算について、当事者の障害種別と事業所が対象とする主たる障害種別が一致していない場合も算定することが可能か。（国 QA(R3)VOL.1 問７）A 算定することが可能である。"},{"s":"gl","p":135,"h":"5-28 報酬基準｜報酬③加算：利用者負担上限額管理加算","t":"※報酬告示２、留意事項通知第四の４■利用者負担上限額管理とは・障害福祉サービスの利用者負担について、負担上限月額を超える可能性がある方で、複数の事業所からサービスを利用する場合は、上限額を超えて利用者負担を支払うことがないよう、サービス提供事業所によって上限管理が行われます。・上限額管理の対象となるのは、以下の①と②の要件両方に該当する場合です。■上限管理事業所の優先順位上限管理事業所の優先順位は下記の表のとおりです。指定特定相談支援事業者が上限管理事業所となるのはモニタリングが毎月決定される利用者のみです。順位サービスの種類事業所１居住系サービス利用者※１療養介護、自立訓練（生活訓練）※２、施設入所支援、グル
