"r8","p":148,"h":"報酬算定の流れについて","t":"報酬算定の流れについてサービス等利用計画案の作成（同意署名含む）区役所へ提出（更新月又はサービス利用開始前月20日まで）受給者証の確認サービス等利用計画の作成（案の確定）（同意署名含む）計画作成費の請求（サービス提供月は計画案作成月）6/156/197/56/307/5以降"},{"s":"r8","p":149,"h":"代理受領通知について※業務ガイドラインP.40","t":"代理受領通知について※業務ガイドラインP.40•法定代理受領により計画相談支援に係る計画相談支援給付費の支給を受けた場合には、利用者に対し、当該利用者に係る計画相談支援給付費の額を通知しなければなりません。【代理受領通知への記載内容】•様式は定めていませんが、①利用者氏名、②指定特定相談支援事業者名、③サービス提供年月、④サービス内容、⑤受領日、⑥代理受領金額については最低限記載が必要です。"},{"s":"r8","p":151,"h":"計画相談支援終了時の対応について","t":"計画相談支援終了時の対応について※業務ガイドラインP.48、157サービスの利用終了や別事業所への引継ぎなどで、計画相談支援を終了する際は、必ず最後にモニタリングを実施することになっています。支援の終了時にはフェードアウトするのではなく、しっかりとモニタリングを行い終結させます。また、別の事業所へ引継ぎを予定している場合は、事前に何月から引継ぐのか（月途中での引継ぎは不可）、更新月であればどちらがサービス等利用計画案を作成するのか等、調整ししっかりと引継ぎを行います。（支給決定期間途中であれば、原則サービス等利用計画は前事業所が作成したものを引継ぎます。）"},{"s":"r8","p":152,"h":"障害福祉サービス等の問い合わせについて","t":"障害福祉サービス等の問い合わせについてサービス等利用計画の作成に当たって、利用者が利用する障害福祉サービス等の対象者や支給量などの基本的な要件やイレギュラーな利用に関する可否などの問い合わせは各区役所又は各サービス所管課にお問い合わせをお願いいたします。各区役所の連絡先については、受給者証に記載がありますので、そちらをご確認ください。"},{"s":"r8","p":153,"h":"受入可能状況調査へのご協力について","t":"受入可能状況調査へのご協力について※業務ガイドラインP.163横浜市では計画相談支援推進の取組の一つとして、「指定特定相談支援事業所受入可能状況調査」を行っております。本調査にご回答いただいた内容は、各区役所へ情報提供を行うほか、本市ホームページ（利用者向け）への掲載により利用者等へ周知しています。この情報は、計画相談の利用を希望する方と、新規利用者を受け入れることができる事業所の間でさらなる計画相談導入の推進を目的としています。ぜひ、回答にご協力をお願いいたします。【回答フォーム】https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/a86f882b-3273-4033-9f42-3ee2637bc795/start"},{"s":"r8","p":154,"h":"事業者リスト・受入可能状況リストについて","t":"事業者リスト・受入可能状況リストについて毎月初旬に市HPに掲載している「指定特定相談支援事業者リスト」及び「指定特定相談支援事業所受入可能状況リスト」を更新しております。事業者リストについては、電子申請システムから提出いただいた変更届や体制届などで更新をしておりますが、万が一漏れなどありましたら担当までご連絡をお願いします。【掲載場所】https://www.city.yokohama.lg.jp/kenko\u0002iryo-fukushi/fukushi\u0002kaigo/fukushi/annai/madoguchi/sogo/soudan-jigyosha.html【担当】健康福祉局障害施策推進課相談支援推進係電話： 045-671-4133メール：kf-shiteisoudan@city.yokohama.lg.jp"},{"s":"r8","p":156,"h":"障害児相談支援事業","t":"障害児相談支援事業こども青少年局障害児福祉保健課TEL：671-4274令和８年６月18日"},{"s":"r8","p":157,"h":"【目次】","t":"【目次】１障害児相談の必要性について２モニタリングの実施標準期間について３障害児相談支援のみ該当となる加算について４障害児相談支援によるプラン作成が必須の事業について５障害児支援利用計画の交付について６横浜市障害児相談支援推進事業補助金の実施について"},{"s":"r8","p":159,"h":"政令市における障害児相談支援セルフプラン率について","t":"政令市における障害児相談支援セルフプラン率について出典：厚生労働省障害者相談支援事業の実施状況等について（令和６年調査）※参考：横浜市の計画相談実施率３７．４％（令和６年３月時点）市名セルフプラン率市名セルフプラン率市名セルフプラン率札幌市 84.7％仙台市 72.6％さいたま市 62.4％千葉市 24.2％横浜市 80.2％川崎市 77.2％相模原市 62.7％新潟市 0.2％静岡市 4.9％浜松市 0.0％名古屋市 45.0％京都市 78.3％大阪市 47.9％堺市 54.9％神戸市 88.3％岡山市 71.9％広島市 76.1％北九州市 21.2％福岡市 16.1％熊本市 1.0％"},{"s":"r8","p":160,"h":"児童期における相談支援の役割と意義","t":"児童期における相談支援の役割と意義〇なぜ相談支援が必要か・発達段階に応じた適切な支援が重要。・ライフステージごとに支援者が変わるため、切れ目のない支援が必要。・早期支援は将来の自立、社会参加の基盤となる。〇目指す相談支援・診断前の早い段階から、家族に寄り添った支援を行う。・こどもの意見を尊重し、権利を保障する。・成長に応じて、一貫した継続的支援を提供する。→こども本人と家族に寄り添う「伴走者」として、一人ひとりの未来を一緒に支えていくため、相談支援専門員が求められています！"},{"s":"r8","p":162,"h":"モニタリング実施標準期間について","t":"モニタリング実施標準期間について障害児通所支援のみを利用している場合のモニタリング実施標準期間は６カ月ですが、モニタリング期間を標準より短い期間で設定することが望ましい例が示されています。※厚生労働省「令和6年度障害福祉サービス等報酬改定に関するQA 問60（令和6年3月29日）」"},{"s":"r8","p":163,"h":"【モニタリング期間を標準より短い期間で設定することが望ましい例】","t":"【モニタリング期間を標準より短い期間で設定することが望ましい例】・利用する指定障害児通所支援事業所の頻繁な変更やそのおそれのある障害児・障害児通所支援等を安定的に利用することに課題がある障害児・障害児通所支援事業所等と医療機関等との多機関連携が必要な障害児・複数の障害児通所支援事業所を利用している障害児"},{"s":"r8","p":164,"h":"【モニタリング期間を標準より短い期間で設定することが望ましい例】","t":"【モニタリング期間を標準より短い期間で設定することが望ましい例】（つづき）・家族や地域住民等との関係が不安定な世帯の障害児・学齢期の長期休暇等により、心身の状態が変化するおそれのある障害児・就学前の児童の状態や支援方法に関して、保護者の不安の軽減・解消を図る必要のある障害児・進学や就労をはじめとしたライフステージの移行期にある障害児や、複数の事業所を利用する等により発達支援や家族支援に係る連絡調整等が頻回に必要な障害児"},{"s":"r8","p":165,"h":"【モニタリング期間を標準より短い期間で設定することが望ましい例】","t":"【モニタリング期間を標準より短い期間で設定することが望ましい例】（つづき）※特に留意して検討することが必要な方・複合的な課題を抱えた世帯の障害児・医療的ケア児・強度行動障害児・被虐待児又はその恐れのある障害児（保護者の障害理解の不足、介護疲れが見られる、保護者自身が支援を要する、キーパーソンの不在や体調不良、死亡等の変化等）"},{"s":"r8","p":166,"h":"３障害児相談支援のみ","t":"３障害児相談支援のみ該当となる加算について（保育・教育等移行支援加算）"},{"s":"r8","p":167,"h":"保育・教育等移行支援加算について","t":"保育・教育等移行支援加算について【保育・教育等移行支援加算とは】就学、進学、就職等に伴い障害児通所支援の利用を終了するものであって、保育所、特別支援学校、企業等との引継ぎに一定期間を要する者に対し、一定の支援を行った場合に算定できる加算。【算定回数の上限】障害児通所支援等のサービスの利用中⇒それぞれ２回を限度障害児通所支援利用終了後（６か月以内）⇒それぞれ月１回を限度"},{"s":"r8","p":168,"h":"保育・教育等移行支援加算算定要件","t":"保育・教育等移行支援加算算定要件【算定要件】①当該月に2回以上、利用者の居宅を訪問し、利用者及び保護者と面接を行った場合②他機関の主催する利用者の支援内容の検討に関する会議に参加した場合③他機関との連携に当たり、利用者の心身の状況等に関する情報提供を文書（この目的のために作成した文書に限る）により実施し、関係機関等における支援内容の検討に協力する場合【加算単位数】①または②の相談支援業務を行った場合 : 月300単位③の相談支援業務を行った場合 : 月100単位"},{"s":"r8","p":169,"h":"保育・教育等移行支援加算算定上の留意点","t":"保育・教育等移行支援加算算定上の留意点・指定障害児支援利用援助費、指定継続障害児支援利用援助費、入院時情報連携加算、退院・退所加算を算定している月は算定できない。・③の「関係機関等における支援内容の検討に協力する場合」とは、関係機関の職員等が実施するアセスメントに同行することや、直近の障害児支援利用計画やモニタリング結果等を情報提供した上で、利用者の心身の状況、生活環境及びサービスの利用状況等を関係機関の職員等に対して説明を行った場合等をいう。"},{"s":"r8","p":170,"h":"４障害児相談支援によるプラン","t":"４障害児相談支援によるプラン作成が必須の事業について（居宅訪問型児童発達支援事業）"},{"s":"r8","p":171,"h":"居宅訪問型児童発達支援","t":"居宅訪問型児童発達支援対象児童療育の観点から、個別療育等を行う必要が認められ、重症心身障害児など重度の障害のため、外出が著しく困難であり、障害児通所支援に通うことが困難な障害児※学齢児も対象（満18歳に達するまで）定員なし事業所数６か所（令和８年４月現在）サービス内容重度の障害により外出が著しく困難な障害児に対して、その児童の居宅に訪問し、日常生活における基本的な動作の指導、知識技能の付与等の支援を実施障害児相談支援事業の利用が必須"},{"s":"r8","p":172,"h":"対象児童について","t":"対象児童について重症心身障害児など重度の障害のため、外出が著しく困難であり、障害児通所支援に通うことが困難な障害児【重度の障害の例】①人工呼吸器を装着している状態その他の日常生活を営むために医療を要する状態②重度疾病のため感染症にかかるおそれがある状態③精神障害や行動障害により外出や集団生活が著しく困難である状態"},{"s":"r8","p":173,"h":"児童発達支援や放課後等デイサービスとの並行利用について（１）","t":"児童発達支援や放課後等デイサービスとの並行利用について（１）外出することが著しく困難であると認められた障害児を対象としているため、児童発達支援等と組み合わせて利用することは、原則想定されていない。ただし、通所施設へ通うための移行期間として組み合わせることや、日ごとに体調の波があることを勘案し、効果的かつ継続的な支援を実施するために組み合わせることは可能。（こども家庭庁への問合せにより確認）"},{"s":"r8","p":174,"h":"児童発達支援や放課後等デイサービスとの並行利用について（２）","t":"児童発達支援や放課後等デイサービスとの並行利用について（２）【並行利用の際の留意点】〇移行に関して本人の状態像など医師の客観的評価を確認する。※医師の客観的評価は特に診断書等を求める必要はなく、障害児支援利用計画案作成にあたってのサービス担当者会議などで、医師の評価を確認する（保護者を通して確認する）ことで良い。〇居宅訪問型児童発達支援と通所を組み合わせる場合は、その必要性や方法・期間を障害児支援利用計画案に明記する。"},{"s":"r8","p":176,"h":"障害児支援利用計画の交付について","t":"障害児支援利用計画の交付について相談支援専門員は、障害児支援利用計画を作成した際には、障害児支援利用計画を障害児及び担当者に交付しなければならない。（基準省令第１５条第２項第１２号）また、サービス事業所についても、保護者だけでなく相談支援事業所にも、個別支援計画を交付しなければならない、こととなっています。保護者の同意をとり、サービス事業所と計画のやり取りをしてください。"},{"s":"r8","p":177,"h":"６横浜市障害児相談支援推進","t":"６横浜市障害児相談支援推進事業補助金の実施について"},{"s":"r8","p":178,"h":"横浜市障害児相談支援推進事業補助金の実施について","t":"横浜市障害児相談支援推進事業補助金の実施について【実施目的】令和３年度より障害児相談支援の拡充を目的に、補助事業を実施しています。【対象事業所】横浜市から指定を受けている障害児相談支援事業所【補助内容】対象児童に対して、障害児支援利用計画を新規で作成した場合に補助金額をお支払いします。"},{"s":"r8","p":179,"h":"横浜市障害児相談支援推進事業補助金の実施について","t":"横浜市障害児相談支援推進事業補助金の実施について【対象児童の要件】①：学齢児要件②～④：重度要件対象児童補助金額（１人当たり）①未就学の時に障害児相談の利用があるため、学齢児となって新たに実施しても、法定の初回加算の対象とならない学齢児２万円②居宅訪問型児童発達支援の対象となりうる、外出することが困難な、重度の障害の状態の児童５万円③障害児通所支援の支給決定において、強度行動障害支援加算の対象となりうる、重度の障害状態の児童４万円④障害児通所支援の支給決定において、重症心身障害児区分または医療的ケア児区分１～３の対象となりうる、重度の障害状態の児童４万円※ただし、事業所の人件費が、法定の給付費及び当該補助金の合計額よりも低い場合、人件費の額を上限とする。※①学齢児要件と②～④の重度障害児要件については併給が可能。（重度障害児要件での併給は不可。）【併給不可例】③強行加算かつ④医療的ケア児１の児童→４万円のみ【併給可能例】①学齢児かつ③強行加算の児童→２万円+４万円＝6万円R6年度より新設"},{"s":"r8","p":180,"h":"横浜市障害児相談支援推進事業補助金","t":"横浜市障害児相談支援推進事業補助金【募集開始（予定）】令和８年８月頃※開始時には「障害福祉情報サービスかながわ」にて改めて通知します。【補助（申請）対象期間】令和８年４月１日以降に対象児童に新規に作成した計画【申請からお支払いまでの流れ（予定）】①補助金交付申請書を提出事業所→横浜市②補助金交付決定通知又は不交付通知の送付横浜市→事業所③補助金実績報告書を提出事業所→事業所④補助金額確定通知を送付横浜市→事業所⑤補助金請求書を提出事業所→横浜市⑥補助金をお支払い横浜市→事業所"},{"s":"r8","p":183,"h":"地域相談支援事業とは","t":"地域相談支援事業とは指定一般相談＝基本相談支援＋地域相談支援地域相談=地域移行支援+地域定着支援地域移行支援および地域定着支援は、いずれか一方のみの申請も可能ですが、同時に指定申請を行うことを推奨します。指定一般相談基本相談地域移行地域定着地域相談"},{"s":"r8","p":185,"h":"人員に関する基準","t":"人員に関する基準職種人数・内容管理者１名※当該事業に支障がない場合は他事業との兼務が可能※従事者との兼務可従事者１名以上※１名は相談支援専門員でなければならない※当該業務に支障がない場合は、他事業との兼務が可能（指定特定相談事業所、指定障害児相談支援事業所、指定自立生活援助事業所との兼務は、業務に支障がない場合として認められる）※常勤・非常勤を問わない"},{"s":"r8","p":186,"h":"運営規程","t":"運営規程①事業所ごとに①～⑧についての重要事項に関する運営規程を定めること②事業の目的及び運営の方針③従業者の職種、員数及び職務の内容④営業日及び営業時間支援の提供方法及び内容並びに対象障害者等から受領する費用及びその額⑤通常の事業の実施地域⑥事業の主たる対象とする障害の種類を定めた場合には当該障害の種類⑦虐待の防止のための措置に関する事項⑧その他運営に関する重要事項基準第二十七条"},{"s":"r8","p":187,"h":"記録の整備①","t":"記録の整備①①指定地域移行・地域定着支援の提供に係る記録②地域移行・地域定着支援計画③基準※第25条の利用者の不正受給による市町村への通知に係る記録④基準第35条第２項に規定する苦情の内容等の記録⑤基準第36条第２項に規定する事故の状況及び事故に際して採った処置についての記録基準第三十八条"},{"s":"r8","p":188,"h":"記録の整備②","t":"記録の整備②•記録は支援を提供した日から５年間保存することとなっています。•個人情報が記載されている文書については、必ず鍵のかかる書庫に保管し、持出の制限や管理を行うなど適切に保存してください。•また、パソコンやサーバ、USBメモリ等の記録媒体で保存する場合についても、盗難・紛失防止及びウィルス感染等による個人情報の漏えいを防ぐための措置を行うことが必要です。"},{"s":"r8","p":189,"h":"地域相談の共通留意事項","t":"地域相談の共通留意事項地域移行支援の「障害福祉サービスの体験的な利用支援」や「体験的な宿泊支援」、地域定着支援の「一時的な滞在による支援」を提供する場合は、『指定障害福祉サービス事業所等※』への委託により行うことができる。※「指定障害福祉サービス事業所等」とは、法第29条第２項に規定する事業所であるため、市単事業の施設などには委託はできない。基準第二十二条、二十三条の二、四十四条の四"},{"s":"r8","p":191,"h":"地域移行支援サービスの概要①","t":"地域移行支援サービスの概要①障害者支援施設や精神科病院等に入所又は入院している障害者を対象に、住居の確保その他地域生活へ移行するための支援を行う【対象者】①障害者支援施設、のぞみの園又は療養介護を行う病院に入所している障害者※児童福祉施設に入所する18歳以上の者、障害者支援施設等に入所する15歳以上の障害者みなしの者も対象②精神科病院に入院している精神障害者③救護施設又は更生施設に入所している障害者④刑事施設、少年院に収容されている障害者⑤更生保護施設に入所している障害者又は自立更生促進センター、就業支援センター若しくは自立準備ホームに宿泊している障害者※宿泊型自立訓練施設、グループホームからの移行は対象外"},{"s":"r8","p":192,"h":"地域移行支援サービスの概要②","t":"地域移行支援サービスの概要②•区分は不要（R7.8.1～認定調査が原則不要）•給付決定期間は６か月：延長が必要な場合は、区福祉保健センターの判断で６か月以内で１回のみ更新可•給付決定期間６か月・更新６か月のあわせて１年を超えて延長が必要な場合には、市町村審査会の個別審査にかける。※延長を申請する場合、サービスの給付決定期間が終了する２か月前までに援護の実施機関（横浜市の場合は受給者証発行区）へ連絡が必要"},{"s":"r8","p":193,"h":"地域移行支援の内容","t":"地域移行支援の内容•地域移行支援計画の作成→アセスメントを行ったうえで、生活に対する意向、総合的な支援の方針、課題、目標、達成時期、留意事項等を記載する。※様式は各事業所ごとに定める。•概ね週１回、少なくとも月に２回の面接もしくは同行支援（対面での支援）→請求要件になります。•利用者から「サービス提供記録票」に署名確認をとること。"},{"s":"r8","p":194,"h":"支援手順","t":"支援手順①地域移行支援に係る相談②アセスメント③地域移行支援計画の原案作成④支援計画作成の為の個別支援会議の開催（利用者及び障害者支援施設又は精神科病院等の担当者を招集）⑤地域移行支援計画の確定、利用者及び家族への説明・同意⑥利用者及び計画相談支援担当者に交付※この手順を確認できなければ、基本報酬は請求できない基準第二十条"},{"s":"r8","p":195,"h":"地域移行支援の基本報酬","t":"地域移行支援の基本報酬地域移行支援計画を作成し、利用者と対面の支援を月に２回以上行った場合に算定※精神障害者地域移行・地域定着支援関係者研修区分単位数説明地域移行支援サービス費(Ⅰ) 3,613単位／月①社会福祉士・精神保健福祉士か対象研修※の修了者を１名以上配置②月１回以上、対象施設との会議等の連携を図っていること。③前年度の地域移行実績が３名以上(Ⅱ) 3,157単位／月①かつ②を満たし、前年度地域移行支援実績が１名以上(Ⅲ) 2,422単位／月上記以外"},{"s":"r8","p":196,"h":"地域移行支援の加算①","t":"地域移行支援の加算①区分単位数説明初回加算 500単位／月利用を開始した月に加算集中支援加算 500単位／月月６回以上の面接・同行による支援を行った場合に加算退院・退所月加算 2,700単位／月退院・退所した月に加算（入院期間が３月以上１年未満の場合は、さらに500単位加算）障害福祉サービスの体験利用加算（Ⅰ）開始月～５日目500単位／月障害福祉サービス（生活介護、自立訓練、就労移行支援、就労継続支援）の体験的な利用支援を行った場合地域移行支援決定期間の６か月につき15日まで算定※地域生活支援拠点として届出をしている場合、さらに1日につき50単位を加算（Ⅱ）６日目～15日目250単位／月体験宿泊加算（Ⅰ）下記以外300単位／日体験的な宿泊支援を行った場合、地域移行支援決定期間の６か月につき(Ⅰ)(Ⅱ)を合計して15日まで算定夜間及び深夜の時間帯を通して必要な見守りを行い、複数回以上巡回による支援を行った場合は(Ⅱ)を算定※地域生活支援拠点として届出をしている場合、さらに1日につき50単位を加算（Ⅱ）"},{"s":"r8","p":197,"h":"地域移行支援の加算②","t":"地域移行支援の加算②区分単位数説明ピアサポート体制加算 100単位／月ピアサポート研修を修了した次の者をそれぞれ常勤換算方法で0.5以上配置①障害者又は障害者であったと都道府県知事が認める者②管理者、サービス管理責任者又は地域生活支援員居住支援連携体制加算 35単位／月居住支援法人又は居住支援協議会との連携により、利用者の住宅の確保及び居住の支援の図る体制を確保し、居住支援法人等に対し、１月に１回以上利用者の住宅確保及び居住の支援に必要な情報を共有している場合地域居住支援体制強化推進加算 500単位／回居住支援法人と共同して、利用者に指導を行ったうえで、協議会や包括ケアの協議の場で、居住支援における課題を報告した場合"},{"s":"r8","p":198,"h":"加算の留意点①","t":"加算の留意点①【初回加算】500単位／月•初回加算算定後、引き続き入院・入所している間に地域移行支援の給付決定が更新された場合や、転院や転所して引き続き地域移行支援を利用する場合は、再度の算定は不可。•再度入院・入所した場合、退院・退所から３か月以上経過している場合に限り算定可（事業所が変わる場合は３か月以上経過していなくても算定可）【集中支援加算】500単位／月・「退院・退所月加算」と併給不可"},{"s":"r8","p":199,"h":"加算の留意点②","t":"加算の留意点②【退院・退所月加算】2700単位／月退院・退所等をする日が翌月の初日等の場合、その前月に支援が行われることになるため、退院・退所等が確実に見込まれる場合はその前月に算定できる。以下の場合は算定できない。①退院・退所等をして病院または診療所へ入院する場合②退院・退所等をして他の社会福祉施設等へ入所する場合③死亡による退院・退所等の場合※精神科病院に入院した日から起算して３月以上１年未満の間に退院した場合、さらに500単位加算"},{"s":"r8","p":200,"h":"加算の留意点③","t":"加算の留意点③【障害福祉サービス等の体験利用加算】（Ⅰ）開始日～５日目：500単位／日（Ⅱ）６日目～15日目：250単位／日•地域において障害福祉サービスを利用するにあたっての課題、目標、体験期間及び留意事項を地域移行支援計画に位置付けること•指定障害福祉サービス事業者等への委託により実施•体験利用については、原則、同行による支援を行い、担当職員等と緊密な連携を図ること•給付決定が更新された場合、再度15日を限度として算定可"},{"s":"r8","p":201,"h":"加算の留意点④","t":"加算の留意点④【体験宿泊加算】（Ⅰ）下記以外：300単位／日（Ⅱ）見守り巡回を行った場合：700単位／日※夜間及び深夜の時間帯を通じて必要な見守りを行い、複数回以上巡回による支援を行った場合に算定可•単身での生活に向けた課題、目標、体験期間及び留意事項等を地域移行支援計画に位置付けること。•指定障害福祉サービス事業所に委託できるが、委託による場合でも委託先の事業者と常時の連絡体制を確保すること。•利用開始日・終了日の両方を算定できる。•（Ⅰ）については、宿泊を伴わない場合も算定可。"},{"s":"r8","p":202,"h":"【参考】横浜市精神障害者地域生活推進事業","t":"【参考】横浜市精神障害者地域生活推進事業（通称：チャレンジ事業）について入院中の精神障害者が宿泊型自立訓練施設の宿泊を体験する本市独自事業退院後の生活をアセスメントする目的で、精神障害者退院サポート事業又は地域移行支援を利用しており、その支援計画に位置付けられていることが条件宿泊型自立訓練施設への入所を前提に体験宿泊するものではない利用調整・結果報告書の様式あり「横浜市精神障害者地域生活推進事業運営費補助金交付要綱」参照所管は、障害施設サービス課（045-671-2416）"},{"s":"r8","p":204,"h":"地域定着支援サービスの概要","t":"地域定着支援サービスの概要居宅において単身又は家族の状況等により同居している家族による支援を受けられない障害者に、常時の緊急連絡体制を確保し、障害の特性に起因して生じた緊急の事態等に相談などの支援を行う。•区分不要（R7.8.1～認定調査が原則不要）•支給期間は１年間、必要に応じて、更新可"},{"s":"r8","p":205,"h":"地域定着支援の対象者","t":"地域定着支援の対象者①居宅において単身であるため緊急時の支援が見込めない状況にある者②居宅において家族と同居している障害者であっても、当該家族等が障害、疾病等のため、障害者に対し、当該家族等による緊急時の支援が見込めない状況にある者③同居する家族に障害、疾病のない場合であっても、地域移行支援を利用して退院・退所した者、精神科病院の入退院を繰り返している者、強度行動障害や高次脳機能障害等の状態にある者等、地域生活を営むため緊急時に手厚い支援を必要としている者。※施設・病院からの退所・退院、家族との同居から一人暮らしに移行した者、地域生活が不安定なものも含む。※グループホーム、宿泊型自立訓練施設の入居者は対象外"},{"s":"r8","p":206,"h":"地域定着支援台帳の作成","t":"地域定着支援台帳の作成※置かれている環境及び日常生活全般の状況等の評価を通じて、利用者の希望する生活や課題等の把握（アセスメント）を行い、緊急時等に適切な対応を行うために作成※地域定着支援台帳の作成に係るアセスメントに当たって利用者との面接を行うこと※地域定着支援台帳の作成後も、適宜見直しを行い、必要に応じて台帳の変更を行うこと。【記載事項】・利用者の心身の状況・利用するサービス事業所等の情報・置かれている環境・医療機関、その他の関係機関の連絡先・緊急時において必要となる利用者の家族の情報・その他利用者に関する情報基準第四十二条"},{"s":"r8","p":207,"h":"常時の連絡体制の確保","t":"常時の連絡体制の確保•利用者の心身の状況及び障害の特性等に応じ、適切な方法により、利用者又はその家族との常時の連絡体制を確保すること•適宜、利用者への居宅訪問等による状況把握を行うこと基準第四十三条"},{"s":"r8","p":208,"h":"緊急の事態における支援等","t":"緊急の事態における支援等•緊急の事態その他の緊急に支援が必要な事態が生じた場合には、速やかに利用者の居宅への訪問等による状況把握を行うこと•利用者の家族、利用する指定障害福祉サービス事業者等、医療機関その他の関係機関との連絡調整、一時的な滞在による支援その他の必要な措置を適切に講じること基準第四十四条"},{"s":"r8","p":209,"h":"地域定着支援の基本報酬（地域定着支援サービス費）","t":"地域定着支援の基本報酬（地域定着支援サービス費）区分単位数説明体制確保費 315単位／月常時の連絡体制を確保している場合緊急時支援費（Ⅰ） 734単位／日利用者又はその家族等からの要請に基づき、訪問または一時的な滞在による支援を行った場合※地域生活支援拠点等として届出をしている場合、さらに50単位を算定緊急時支援費（Ⅱ） 98単位／日利用者又はその家族等からの要請に基づき、深夜（午後10時から午前6時）に電話による相談援助を行った場合"},{"s":"r8","p":210,"h":"地域定着支援の基本報酬（地域定着支援サービス費）","t":"地域定着支援の基本報酬（地域定着支援サービス費）【体制確保費】315単位／月•地域定着支援台帳を整備し、常時の連絡体制を確保した場合。•常時の連絡体制の確保は、夜間等に職員を配置する他、携帯電話等により利用者又はその家族との情事の連絡体制を確保する方法によることも可能。"},{"s":"r8","p":211,"h":"地域定着支援の基本報酬②（地域定着支援サービス費）","t":"地域定着支援の基本報酬②（地域定着支援サービス費）【緊急時支援費（Ⅰ）】734単位／日【緊急時支援費（Ⅱ）】98単位／日（メールによる対応は対象外）•１日に算定できるのは１回。•（Ⅰ）を請求する場合は、（Ⅱ）は算定できない。•要請のあった時間、要請の内容、支援の提供時刻、緊急時支援費の算定対象である旨を記録する。"},{"s":"r8","p":212,"h":"地域定着支援の加算","t":"地域定着支援の加算区分単位数説明日常生活支援情報提供加算100単位／回精神科病院に通院する利用者の必要な情報を当該精神科病院に提供した場合ピアサポート体制加算 100単位／月ピアサポート研修を修了した次の者をそれぞれ常勤換算方法で0.5以上配置①障害者又は障害者であったと都道府県知事が認める者②管理者、サービス管理責任者又は地域生活支援員居住支援連携体制加算 35単位／月居住支援法人又は居住支援協議会との連携により、利用者の住宅の確保及び居住の支援の図る体制を確保し、居住支援法人等に対し、１月に１回以上利用者の住宅確保及び居住の支援に必要な情報を共有している場合地域居住支援体制強化推進加算500単位／回居住支援法人と共同して、利用者に指導を行ったうえで、協議会や包括ケアの協議の場で、居住支援における課題を報告した場合"},{"s":"r8","p":213,"h":"地域定着支援の加算","t":"地域定着支援の加算【日常生活支援情報提供加算】 100単位／回•精神科病院等（精神科や心療内科の診療所を含む）に心身の状況や生活環境等の利用者の自立した日常生活の維持に必要な情報を提供した場合•利用者の同意を得ること•１人につき月１回まで算定可•情報提供を行った日時、提供先、内容、提供手段等について記録を作成する。"},{"s":"r8","p":214,"h":"地域定着支援の留意点","t":"地域定着支援の留意点自立生活援助との併給は不可宿泊型自立訓練施設及びグループホーム入居者は対象外常時の連絡体制は、当該事業所が直接利用者と連絡体制を確保し、緊急時の支援を速やかに行える体制を確保することが必要であるため、法人内の障害者支援施設やグループホームの宿直担当につながるなどのケースは不可地域定着支援台帳作成の際に、アセスメントのための利用者への面接を行っていない、または利用者の居宅への訪問等を適宜行っていない場合は、基本報酬の算定不可"},{"s":"r8","p":216,"h":"自立生活援助","t":"自立生活援助健康福祉局障害施策推進課TEL：671-4133"},{"s":"r8","p":217,"h":"自立生活援助とは","t":"自立生活援助とは居宅において単身等で生活する障害者につき、定期的な巡回訪問又は随時通報を受けて行う訪問、相談対応等により、居宅における自立した日常生活を営む上での各般の問題を把握し、必要な情報の提供及び助言並びに相談、関係機関との連絡調整等の自立した日常生活を営むために必要な援助を行うサービス"},{"s":"r8","p":218,"h":"対象者","t":"対象者①障害者支援施設やグループホーム、精神科病院等（※１）から地域での一人暮らしに移行した障害者等で、理解力や生活力等に不安がある者②現に一人で暮らしており、自立生活援助による支援が必要な者（※２）③障害、疾病等の家族と同居しており、（障害者同士で結婚している場合を含む）、家族による支援が見込めないため、実質的に一人暮らしと同様の状況であり、自立生活援助による支援が必要な者（※２）④同居する家族に障害、疾病のない場合であっても、地域移行支援を利用して退院・退所した者、精神科病院の入退院を繰り返している者、強度行動障害や高次脳機能障害等の状態にある者等、地域生活を営むための支援を必要としている者"},{"s":"r8","p":219,"h":"対象者","t":"対象者※１①障害者支援施設、のぞみの園、指定宿泊型自立訓練を行う自立訓練（生活訓練）事業所、児童福祉施設又は療養介護を行う病院に入所していた障害者※児童福祉施設に入所していた18歳以上の者、障害者支援施設等に入所していた15歳以上の障害者みなしの者も対象。②共同生活援助を行う住居又は福祉ホームに入居していた障害者③精神科病院に入院していた精神障害者④救護施設又は更生施設に入所していた障害者⑤刑事施設（刑務所、少年刑務所、拘置所）、少年院に収容されていた障害者⑥更生保護施設に入所していた障害者又は自立更生促進センター、就労支援センター若しくは自立準備ホームに宿泊していた障害者"},{"s":"r8","p":220,"h":"対象者","t":"対象者※２自立生活援助による支援が必要な者の例①地域移行支援の対象要件に該当する障害者施設に入所していた者や精神科病院に入院していた者等であり、理解力や生活力を補う観点から支援が必要と認められる場合②人間関係や環境の変化によって、一人暮らしや地域生活を継続することが困難と認められる場合（家族死亡、入退院の繰返し等）③その他、市町村審査会における個別審査を経てその必要性を判断した上で適当と認められる場合"},{"s":"r8","p":221,"h":"サービスの概要","t":"サービスの概要•区分は不要（R7.8.1～認定調査が原則不要）•利用者負担は、原則１割•標準利用期間は１年間•標準利用期間（１年間）を超えての延長は、審査会の個別審査を経たうえで判断される。※延長を申請する場合、サービスの給付決定期間が終了する2か月前までに援護の実施機関（横浜市の場合は受給者証発行区）へ連絡が必要※審査会において必要性が認められた場合は回数の制限なく更新が可能。•障害者総合支援法の「地域定着支援」及び「就労定着支援」との併給は不可。"},{"s":"r8","p":222,"h":"定期的な訪問等による支援","t":"定期的な訪問等による支援定期的に利用者の居宅を訪問することにより、又はテレビ電話装置等を活用して、当該利用者の心身の状況、その置かれている環境及び日常生活全般の状況等の把握を行い、必要な情報の提供及び助言並びに相談、指定障害福祉サービス事業者等、医療機関等との連絡調整その他の障害者が地域における自立した日常生活又は社会生活を営むために必要な援助を行う。基準第二百六条の十八"},{"s":"r8","p":223,"h":"随時の通報による支援等","t":"随時の通報による支援等基準第二百六条の十九①指定自立生活援助事業者は、利用者からの通報があった場合には、速やかに当該利用者の居宅への訪問等による状況把握を行わなければならない。②指定自立生活援助事業者は、前項の状況把握を踏まえ、当該利用者の家族、当該利用者が利用する指定障害福祉サービス事業者等、医療機関その他の関係機関等との連絡調整その他の必要な措置を適切に講じなければならない。③指定自立生活援助事業者は、利用者の心身の状況及び障害の特性に応じ、適切な方法により、当該利用者との常時の連絡体制を確保しなければならない。"},{"s":"r8","p":224,"h":"心身の状況等の把握","t":"心身の状況等の把握指定自立生活援助事業者は、指定自立生活援助の提供に当たっては、利用者の心身の状況、その置かれている環境、他の保健医療サービス又は福祉サービスの利用状況等の把握に努めなければならない。基準第十六、第二百六条の二十"},{"s":"r8","p":225,"h":"自立生活援助計画の作成等","t":"自立生活援助計画の作成等基準第五十八、第二百六条の二十サービス管理責任者は以下の流れで計画作成等を行う。①利用者との面接、アセスメント②自立生活援助計画の原案作成→利用者及びその家族の生活に対する意向、総合的な支援の方針、生活全般の質を向上させるための課題、目標及びその達成時期、自立生活援助を提供する上での留意事項等を記載③支援計画作成のための会議の開催→サービスの提供に当たる担当者等を招集。テレビ電話装置等の活用も可能。④自立生活援助計画の確定、利用者又は家族への説明・同意⑤自立生活援助計画を利用者に交付⑥少なくとも３か月に１回以上の計画の見直し、必要に応じて変更"},{"s":"r8","p":226,"h":"記録の整備","t":"記録の整備基準第二百六条の十一、二十①自立生活援助として提供した支援に係る必要な記録②自立生活援助計画③利用者の不正受給による市町村への通知に係る記録④苦情の内容等の記録⑤事故の状況及び事故に際して採った処置についての記録"},{"s":"r8","p":227,"h":"記録の整備","t":"記録の整備•記録は支援を提供した日から５年間保存してください。•個人情報が記載されている文書については、必ず鍵のかかる書庫に保管し、持出の制限や管理を行うなど適切に保存してください。•また、パソコンやサーバ、USBメモリ等の記録媒体で保存する場合についても、盗難・紛失防止及びウィルス感染等による個人情報の漏えいを防ぐための措置を行うことが必要です。"},{"s":"r8","p":228,"h":"人員に関する基準","t":"人員に関する基準管理者１名※サービス管理責任者や地域生活支援員・他事業の職員と兼務可従業者サービス管理責任者アサービス管理責任者が常勤である場合次の①又は②に掲げる数①利用者の数が60人以下 1人以上②利用者の数が61人以上 1に、利用者の数が60を超えて60又はその端数を増すごとに1を加えて得た数以上イア以外の場合次の①又は②に掲げる数①利用者の数が30人以下：1人以上②利用者の数が31人以上：1人に、利用者数が30人を超えて30又はその端数を増すごとに1人を加えて得た数以上※自立生活援助と地域相談支援の指定を併せて受け、かつ、同一事業所にて運営している場合は、相談支援専門員とサービス管理責任者の兼務可地域生活支援員事業所ごとに１名以上※サービス管理責任者と地域生活支援員との兼務可"},{"s":"r8","p":229,"h":"運営規程","t":"運営規程事業所ごとに、①～⑧の重要事項に関する運営規程を定めておくこと①事業の目的及び運営の方針②従業者の職種、員数及び職務の内容③営業日及び営業時間④支援の提供方法及び内容並びに対象障害者等から受領する費用及びその額⑤通常の事業の実施地域⑥事業の主たる対象とする障害の種類を定めた場合には当該障害の種類⑦虐待の防止のための措置に関する事項⑧その他運営に関する重要事項基準第二百六条の十、二十"},{"s":"r8","p":230,"h":"自立生活援助の基本報酬","t":"自立生活援助の基本報酬区分地域生活支援員１人あたり利用者数説明（１）30人未満（２）30人以上自立生活援助サービス費（Ⅰ） 1,566単位／月 1,095単位／月下記のいずれかの者に対して、地域生活支援員がひと月に２回以上居宅を訪問した場合に算定可。〇障害者支援施設やグループホーム、精神科病院、救護施設、更生施設、刑事施設等から退所し1年以内の者。〇同居家族の死亡や入院、虐待等、市町村が認める事情で単身生活を始めてから1年以内の者。（Ⅱ） 1,172単位／月 821単位／月上記以外の者に対し、地域生活支援員がひと月に２回以上居宅を訪問した場合に算定可。（Ⅲ） 700単位/月地域生活支援員がひと月に利用者の居宅への訪問による支援と及びテレビ電話装置等の活用による支援をそれぞれ月に1度以上行った場合に算定可"},{"s":"r8","p":231,"h":"サービス費（Ⅰ）（Ⅱ）について","t":"サービス費（Ⅰ）（Ⅱ）について例)退所後、３か月してから自立生活援助を利用する場合、サービス費(Ⅰ)として９カ月、サービス費(Ⅱ)として３か月で、あわせて12ケ月(１年間)の利用ができる。R7.6.30 退所日R6.4.1支給決定R6.7.1 R7.3.31 支給決定R7.4.1①退所日から１年後の月末までを有効期間として支給決定②①の決定と合わせて最初の決定日から１年以内となるよう支給決定支給決定期間１年自立生活援助基本決定＜退所後１年未満＞自立生活援助サービス費（Ⅰ）自立生活援助基本決定＜退所後１年以上・その他＞自立生活援助サービス費（Ⅱ）"},{"s":"r8","p":232,"h":"留意事項","t":"留意事項自立生活援助サービス費（Ⅰ）及び（Ⅱ）において、地域生活支援員1人あたりの利用者数を算定する際、サービス管理責任者と地域生活支援員を兼務する場合は0.5人とみなして算定する。（例）利用者数30人の事業所において、サービス管理責任者を兼ねる地域生活支援員１人と専従の地域生活支援員1人が障害者支援施設を退所してから１年以内の者に対し、支援を行った場合。→30人÷（0.5+１）＝20地域生活支援員１人あたり利用者数は30人未満であり、自立生活援助サービス費（Ⅰ）の（1）30人未満を算定する。"},{"s":"r8","p":233,"h":"加算について①","t":"加算について①区分説明初回加算５００単位／月利用開始月に算定※過去３か月間に利用したことがない限り算定可同行支援加算２回以下５００単位／月３回７５０単位／月４回以上１，０００単位／月利用者の外出に同行し必要な情報提供又は助言等の支援を行った場合に算定福祉専門職配置等加算（Ⅰ）常勤の地域生活支援員のうち、資格保有者が35％以上４５０単位常勤の地域生活支援員のうち、社会福祉士、介護福祉士、精神保健福祉士又は公認心理師の資（Ⅱ）格保有者の割合により算定常勤の地域生活支援員のうち、資格保有者が25％以上３００単位（Ⅲ）地域生活支援員のうち、常勤職員が75％以上、又は勤続３年以上の常勤職員30％以上１８０単位"},{"s":"r8","p":234,"h":"加算について②","t":"加算について②区分単位数説明緊急時支援加算（Ⅰ）７１１単位/日利用者の障害の特性に起因して生じた緊急の事態その他の緊急に支援が必要な事態が生じた場合利用者又はその家族からの要請に基づき、深夜（午後10時から午前６時までの間）に訪問または一時的な滞在による支援を行った場合※地域生活支援拠点として届出をしている場合、さらに50単位/日を加算（Ⅱ）９４単位/日利用者又はその家族からの要請に基づき、深夜に電話による相談援助を行った場合日常生活支援情報提供加算１００単位/回精神科病院等※に通院する利用者の必要な情報をあらかじめ利用者の同意を得て、当該精神科病院等の職員に提供した場合（利用者１人につき１月に１回まで算定可）※精神科病院、精神病床を有する病院または診療所、もしくは精神科または心療内科を担当診療科として届け出ている医療機関集中支援加算５００単位/月自立生活援助サービス費（Ⅰ）を算定する利用者に対して、月６回以上の訪問による支援を実施した場合"},{"s":"r8","p":235,"h":"加算について③","t":"加算について③区分単位数説明ピアサポート体制加算１００単位/月ピアサポート研修を修了した者を障害者とその他職員を常勤換算で0.5人以上配置し、当該者により障害者に対する配慮等の研修を実施居住支援連携体制加算３５単位/月居住支援法人又は居住支援協議会との連携により、利用者の住宅確保及び居住支援の図る体制を確保し、居住支援法人等に対し、１月に１回以上利用者の住宅確保及び居住の支援に必要な情報を共有した場合地域居住支援体制強化推進加算５００単位/回居住支援法人と共同して、利用者に生活上必要な説明等を行った上で、協議会や包括ケアの協議の場で、居住支援における課題を報告した場合"},{"s":"r8","p":236,"h":"減算について","t":"減算について減算区分所定単位数のうち請求率サービス管理責任者欠如減算サービス管理責任者が欠如した月の翌月末までに配置基準を満たせない場合、翌々月から減算減算の開始月から４か月目まで７０％５月以上連続して減算の場合５０％自立生活支援計画未作成減算未作成期間が３月未満の場合７０％未作成期間が３月以上の場合５０％標準利用期間超過減算利用者ごとの利用期間の平均値が18か月を超える場合９５％"},{"s":"r8","p":237,"h":"【参考】横浜市障害者自立生活アシスタント事業","t":"【参考】横浜市障害者自立生活アシスタント事業•横浜市の事業で、単身等で生活する知的障害・精神障害・高次脳機能障害者に対し、地域生活を継続できるよう、自立生活アシスタントが具体的な生活の場面での助言やコミュニケーション支援を行う•自立生活援助のモデルとなった事業、自立生活援助が優先•利用期間の限定はなく、グループホームや家族との同居から単身生活へ移行を希望する方も支援対象•障害種別によりそれぞれ実施施設あり（37か所）"},{"s":"r8","p":239,"h":"相談支援実践の向上のために","t":"相談支援実践の向上のために健康福祉局障害施策推進課TEL：671-4133"},{"s":"r8","p":241,"h":"１２","t":"１２次ページ以降で詳しく説明支援機関の連携体制の構築Point横浜市の相談支援体制"},{"s":"r8","p":242,"h":"一次相談支援機関とは","t":"一次相談支援機関とは地域の相談支援専門機関として、あらゆる相談を受け止めるとともに、指定特定相談支援事業所等を後方支援する役割特に「基幹相談支援センター」「区役所」「精神障害者生活支援センター」の３機関は、地域の相談支援機関の中核として、計画相談を実施する事業所を後方支援する役割も持つ区自立支援協議会「相談支援部会」の運営の中核も担う。必ず部会に参画し、地域での連携体制構築を！"},{"s":"r8","p":243,"h":"参考：基幹相談支援センターの事業所訪問について","t":"参考：基幹相談支援センターの事業所訪問について【基幹相談支援センターの役割】障害（難病）のある方及びその家族、関係機関等からの相談に応じるとともに、地域づくりに取り組む【取組内容】１総合的・専門的な相談支援の実施２地域の相談支援体制の強化の取組３権利擁護・虐待防止の取組４その他地域の状況に応じた独自の取組５地域生活支援拠点機能の整備に向けた取組地域の相談支援従事者に対する助言等の支援者支援・相談支援事業者への専門的指導、助言・相談支援事業者の人材育成・相談機関との連携強化の取組"},{"s":"r8","p":244,"h":"二次相談支援機関とは","t":"二次相談支援機関とは【対象となる機関（全14機関）】てらん広場、青葉メゾン、花みずき、光の丘、横浜医療福祉センター港南、十愛病院、発達障害者支援センター、総合リハビリテーションセンター、総合保健医療センター、障害者更生相談所、こころの健康相談センター、小児療育相談センター、学齢後期発達相談室くらす、学齢後期発達相談室みなと専門知識を生かして、他の相談支援機関をサポートする役割・一次相談支援機関等と連携を図りながら、専門的・個別的な相談及び助言を行う・研修等の実施により、身近な相談者、指定特定相談支援事業所、一次相談支援機関に対する支援や育成を行う"},{"s":"r8","p":245,"h":"二次相談支援機関の種類とマップ","t":"二次相談支援機関の種類とマップ専門領域機関名番号知的入所施設てらん広場①青葉メゾン②花みずき③光の丘④重心横浜医療福祉センター港南⑤知的（成人）十愛病院⑥発達（成人）横浜市発達障害者支援センター⑦身体・高次脳機能、難病（ALS等）発達（中学・高校生年齢）横浜市総合リハビリテーションセンター⑧精神横浜市総合保健医療センター⑨身体・知的横浜市障害者更生相談所⑩精神横浜市こころの健康相談センター⑪発達（中学生・高校生年齢）小児療育相談センター⑫発達（中学生・高校生年齢）横浜市学齢後期発達相談室くらす⑬発達（中学生・高校生年齢）横浜市学齢後期発達相談室みなと⑭"},{"s":"r8","p":246,"h":"二次相談支援機関の活用方法","t":"二次相談支援機関の活用方法花みずき・・・中央ブロック（鶴見、神奈川、西、中、南）青葉メゾン・・・北部ブロック（港北、緑、青葉、都筑）てらん広場・・・南部ブロック（港南、磯子、金沢、戸塚、栄）光の丘・・・西部ブロック（保土ケ谷、旭、泉、瀬谷）〇発達障害、行動障害、重症心身障害等により専門的な助言が必要な場合や、困難ケース等について協力者を増やしたい場合、是非二次相談の活用を（各機関に直接ご相談を）〇知的（障害者支援施設）の４機関（①～④）は、ブロック担当制→まずは、事業所が所属するブロックの担当機関へ"},{"s":"r8","p":248,"h":"横浜市相談支援従事者人材育成ビジョン","t":"横浜市相談支援従事者人材育成ビジョン横浜市において相談支援に携わる人に求めることを示すとともに、その育成と確保を目的に策定したもの令和７年度改訂主な改定ポイント・意思決定支援について章立てをし、内容を充実させました。・横浜版障害福祉分野における相談支援従事者の人材育成指標について人材育成指標の内容を本文中に表記をし、ポイントについて確認、振り返りがしやすいような仕様としました。・実践取組確認シートについて人材育成指標の各項目の内容を確認し、第３者と自身の実践状況や取組を確認・共有していくツールとして、実践取組確認シートを新しく作成しました。実践取組確認シート（P39～42）自身の実践を振り返り、事業所の内外を問わず、よい取組を共有しましょう。是非、ご活用ください。横浜市相談支援従事者人材育成ビジョンhttps://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.files/0366_20250611.pdf"},{"s":"r8","p":249,"h":"相談支援実践の向上のための研修","t":"相談支援実践の向上のための研修◆現任研修相談支援専門員の資格更新研修（５年ごとに要受講）◆主任相談支援専門員研修（県主催）地域において、中核的な役割を果たす人材を養成する研修受講修了が、「主任相談支援専門員配置加算」の算定要件の一部となる◆専門コース別研修（県主催）テーマに基づく、コース別研修※研修によっては、受講修了が加算の算定要件の一部となる"},{"s":"r8","p":250,"h":"障害特性に応じた支援のための研修（一例）","t":"障害特性に応じた支援のための研修（一例）◆発達障害者相談基礎研修・応用研修◆強度行動障害支援力向上研修（基礎・実践）受講修了が、「行動障害支援体制加算」の算定要件の一部となる◆横浜型医療的ケア児・者等支援者養成研修受講修了が、「要医療児者支援体制加算」の算定要件の一部となる※「障害福祉情報サービスかながわ（通称：らくらく）」を通して研修情報を配信します。"},{"s":"r8","p":252,"h":"自立支援協議会","t":"自立支援協議会障害のある方が地域で安心して生活するために、「人と人をつなぎ、地域の課題を地域の中で共有し、解決に向け協働する場」障害福祉分野の関係者に限らず、保健、医療、教育、就労、当事者、地域住民など様々な立場の方が、地域づくりのために協議し取り組みます。「横浜市区障害者自立支援協議会運営ガイドライン」より『ガイドライン』は、横浜市のホームページに掲載しています。https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.files/0365_20250605.pdf"},{"s":"r8","p":1,"h":"横浜市の自立支援協議会の体制","t":"横浜市の自立支援協議会の体制市自立支援協議会ブロック連絡会区自立支援協議会"},{"s":"r8","p":254,"h":"区自立支援協議会の主な機能","t":"区自立支援協議会の主な機能個別事例への支援のあり方に関する協議、調整地域における障害者等への支援体制等に関する課題（以下、「地域課題」という）の抽出、把握及び共有地域における相談支援体制及び福祉サービス等の整備状況並びに課題等の抽出、把握及び共有地域における関係機関の連携強化社会資源の開発・改善等の地域課題への対応に向けた協議や取組の実施相談支援従事者及び障害福祉サービス等従事者の人材確保・養成方法（研修のあり方を含む）の協議"},{"s":"r8","p":255,"h":"自立支援協議会への参画について","t":"自立支援協議会への参画について•自立支援協議会へは一参加者として参加ではなく、主体的に参画することが求められます。つまり、協議会の中で、役割を担うことになります。•横浜市では、区域で一人一人の障害児者への支援が行われているため、区自立支援協議会において日々の支援や個別支援会議、事例検討を通じて把握された地域課題を共有し、地域づくりにつなげていくことが必要です。"},{"s":"r8","p":256,"h":"区自立支援協議会の活用について","t":"区自立支援協議会の活用についてたとえば、•事例検討会に事例を提供し、支援のスキルアップをはかる•モニタリング報告書の記載方法について学ぶ•困難事例などを個別で抱えず、相談し解決の糸口を得る•小規模事業所同士で事業所間のつながりを作る•制度改正や新規の事業所開設情報などを得る•他部会と合同開催し、事業所交流、情報交換をする相談支援専門員は、初任者研修と現任者研修までの間は研修を受ける等、スキルアップの機会が限られるため、ぜひ勉強の機会として活用してください"},{"s":"r8","p":258,"h":"意思決定支援「支援のヒント集」","t":"意思決定支援「支援のヒント集」・令和６年度報酬改定意思決定支援の推進を、運営基準に位置づけ・横浜市自立支援協議会本体会議で「意思決定支援支援のヒント集」を作成・ヒント集が目指すもの・横浜市が目指す意思決定支援・意思決定支援で大切な日々のかかわり・考え方のもとになるＱ＆Ａ集めてみました・支援者あるある！「良かれと思って」失敗談・終わりに：ヒント集作成に寄せて全18ページ（表紙含む）ぜひ読んでみてください。また、研修等でもご活用ください。意思決定支援支援のヒント集https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi\u0002kaigo/fukushi/service/soudan.files/0421_20260119.pdf"},{"s":"r8","p":260,"h":"相談支援と地域課題への取組","t":"相談支援と地域課題への取組健康福祉局障害施策推進課TEL：671-4133"},{"s":"r8","p":262,"h":"障害者手帳所持者数及び障害福祉サービス支給決定者数等","t":"障害者手帳所持者数及び障害福祉サービス支給決定者数等■手帳所持者数身体障害者手帳96,865人療育手帳（愛の手帳）40,588人精神障害者保健福祉手帳57,011人■サービス利用状況障害福祉サービス及び地域相談支援29,826人計画相談支援16,964人■事業所数計画相談支援288か所地域相談支援51か所自立生活援助41か所（令和８年３月末時点）"},{"s":"r8","p":263,"h":"22％ 61.9％","t":"22％ 61.9％16％セルフプラン希望者計画相談希望者（事業所が見つからない人）約4,800人計画相談利用者(介護保険ケアプラン含む)計画相談希望者の数（障害福祉サービス等利用者の内訳）（令和８年３月末時点）"},{"s":"r8","p":264,"h":"（令和８年３月末時点）","t":"（令和８年３月末時点）計画相談支援の状況（区別）サービス受給者数計画相談決定数実施率事業所数鶴見 2,063 1,040 55.9% 17神奈川 1,739 776 50.4% 12西 634 357 62.0% 8中 1,369 1,018 81.8% 23南 1,887 1,131 67.5% 21港南 1,926 1,041 57.9% 13保土ケ谷 1,840 947 55.4% 25旭 2,283 1,476 69.0% 20磯子 1,336 799 65.1% 14サービス受給者数計画相談決定数実施率事業所数金沢 1,743 1,311 80.3% 12港北 2,135 1,014 52.5% 19緑 1,653 914 58.7% 16青葉 1,721 1,026 64.9% 15都筑 1,343 729 59.9% 16戸塚 2,230 1,134 55.3% 21栄 1,037 570 59.6% 7泉 1,498 927 66.0% 14瀬谷 1,389 754 58.7% 15※実施率は介護保険の介護保険ケアプラン利用者も併せて算出"},{"s":"r8","p":266,"h":"計画相談における報酬アップのポイント","t":"計画相談における報酬アップのポイント利用者の居住エリアは近隣に！利用者の居住エリアを近隣地域等に集約することで、面談や訪問を効率的に実施することができます。モニタリングは他の利用者の加算算定の機会に！同一のサービス事業所に複数利用者がいる場合、モニタリング月の方の訪問に合わせて、他利用者の様子も確認することで、加算算定することができます。また、頻繁に顔を出すことでサービス提供事業所職員との関係づくりも可能。新規ケースを受けるときは更新月に注目！更新月が集中してしまうとモニタリングも重複してしまうので、新規に利用者を受け入れる際は、更新月にも注目することで繁忙期をなくすことができます。"},{"s":"r8","p":267,"h":"機能強化型を意識した人員配置を！協働体制の活用も！","t":"機能強化型を意識した人員配置を！協働体制の活用も！事業所には相談支援専門員を複数配置し、機能強化型（継続）サービス利用支援費を算定することで基本報酬が上乗せされます。令和６年度報酬改定でも、機能強化型の報酬がアップしました。１事業所のみで人員が確保できない場合は、複数事業所による協働体制の確保も活用ください。各種体制加算を積極的に取得！対象の研修を修了すること等により各種体制加算を取得することができます。(Ⅰ)であれば基本報酬に、一体制加算に対して毎回60単位（660円程度）上乗せされます。地域相談、自立生活援助事業と包括的な支援を実施！計画相談では評価されない動きも地域相談や自立生活援助では算定対象となる場合があります。計画相談における報酬アップのポイント"},{"s":"r8","p":268,"h":"計画相談支援と地域相談・自立生活援助の包括的支援について","t":"計画相談支援と地域相談・自立生活援助の包括的支援について計画相談支援と地域相談、自立生活援助は、兼務が認められている(業務に支障がない場合として認められている)ため、一体的に実施できる。職員配置において、時間帯をわける必要はない。ただし、計画相談支援の機能強化型（Ⅰ）～（Ⅳ）をとっている場合、同じ支援者を自立生活援助の福祉専門職加算の算定に含められない。"},{"s":"r8","p":269,"h":"同じ利用者に対して、計画相談支援の相談支援専門員と地域相談・","t":"同じ利用者に対して、計画相談支援の相談支援専門員と地域相談・自立生活援助の支援員として関わることも可。(訪問日は兼ねることはできますが、時間を切りわけ、事業ごとに記録を残してください)計画相談の基本相談が多い方に関しては、地域相談や自立生活援助で算定対象となる場合があります。併せて指定を取って、一体的に支援を行うことで支援の幅も広がります。計画相談支援と地域相談・自立生活援助の包括的支援について"},{"s":"r8","p":270,"h":"計画相談支援","t":"計画相談支援(例)精神科病院に入院中。退院後、一人暮らしをして日中活動と居宅サービスの利用希望入院中・・・退院支援として、計画相談支援と地域移行で支援退院後から１年間…計画相談支援と自立生活援助で、一人暮らしの課題を支援退院から１年後から・・・一人暮らしも安定しており、計画相談支援と地域定着で支援相談系事業の一体的な実施について"},{"s":"r8","p":271,"h":"包括的支援の流れ（例）","t":"包括的支援の流れ（例）令和７年３月４月から地域移行を利用開始するので、前月から計画相談の利用開始令和８年１月退院し、アパートでの一人暮らしをはじめる一人暮らしの支援として、自立生活援助の利用開始令和７年４月病院からの退院を目指し、地域移行支援の利用を開始令和８年12月自立生活援助の利用終了令和７年９月もう少しで退院できそうなので、地域移行支援の利用を延長令和９年１月地域定着の利用開始令和７年12月地域移行の利用終了令和９年12月地域定着の利用終了計画相談計画相地談域移行自立生活援助地域定着"},{"s":"r8","p":273,"h":"横浜市における地域生活支援拠点とは","t":"横浜市における地域生活支援拠点とは障害のある方を地域全体で支えるサービス提供体制の構築を目的とし、既存のあらゆる資源を有機的につなぎ、ネットワーク型で整備を行う。地域全体が「地域生活支援拠点」の主体者となる。①相談、②緊急時の受入れ・対応、③体験の機会・場の提供、④専門的人材の確保・養成等の４つの機能で、障害のある方を地域全体で支えるサービス提供体制のこと。"},{"s":"r8","p":274,"h":"地域生活支援拠点関連の加算について","t":"地域生活支援拠点関連の加算について•地域生活支援拠点の役割を理解し、その機能を担う事業所として運営規程にもその旨を規定し、市町村に届け出ること。•地域生活支援拠点の機能については、「横浜市地域生活支援拠点構築のための連携ガイドライン」を確認してください。＜手続き＞•「地域生活支援拠点等の機能に関連する届出」を提出する。•加えて、体制届及び変更届（運営規程の変更）を提出する。※具体の手続きは、以下のページにある通知を参照ください。「横浜市相談系サービス」ホームページ > 横浜市からの通知・地域生活支援拠点等の機能に関連する届出（外部サイト）https://shougai.rakuraku.or.jp/search-library/lower-3-3.html?download=14908"},{"s":"r8","p":275,"h":"対象となる加算","t":"対象となる加算【計画相談支援】地域生活支援拠点等相談強化加算 700単位地域体制強化共同支援加算 2000単位協働による機能強化型の体制確保【自立生活援助】緊急時支援加算Ⅰ +５０単位【地域移行支援】障害福祉サービスの体験利用加算 +５０単位体験宿泊加算 +５０単位【地域定着支援】緊急時支援費Ⅰ +５０単位【計画相談支援・自立生活援助・地域移行支援・地域定着支援】地域生活支援拠点等機能強化加算 500単位"},{"s":"r8","p":276,"h":"地域生活支援拠点等機能強化加算","t":"地域生活支援拠点等機能強化加算令和６年度報酬改定により、地域生活支援拠点等において、情報連携等を担うコーディネーターの配置を評価する加算が創設されました。＜算定要件＞①、②ともに満たす必要があります。①以下の全てのサービスを一体的に運営していること・計画相談支援及び障害児相談支援（機能強化型Ⅰ又はⅡを算定していること）・自立生活援助・地域移行支援及び地域定着支援又は、拠点機能強化サービスに係る複数の事業者が地域生活支援拠点等のネットワークにおいて相互に連携して運営していること。②市町村により地域生活支援拠点等に位置付けられた場合であって、相互の有機的な連携及び調整等の業務に従事する者（拠点コーディネーター）が常勤で１以上配置されていること"},{"s":"r8","p":277,"h":"地域生活支援拠点等機能強化加算","t":"地域生活支援拠点等機能強化加算＜拠点コーディネーターの要件及び業務＞拠点コーディネーターについては、専ら当該地域生活支援拠点等におけるコーディネート業務に従事することを基本とし、原則として、拠点コーディネーターが他の職務を兼ねることはできません。※本市では各区に基幹相談支援センターが整備されていること、また、３機関が中心となってコーディネーター的業務を担うことを踏まえ、当該加算を算定する事業所を想定していません。算定を希望する場合には、本市に事前にご相談ください。"},{"s":"r8","p":278,"h":"地域体制強化共同支援加算の趣旨","t":"地域体制強化共同支援加算の趣旨地域の体制づくりを強化する観点から、指定特定相談事業所を中心に、月に１回、支援困難事例等についての課題検討を通じ、地域課題の明確化と解決に向けて、情報共有等を行い、共同で対応していることを評価する。•「地域の体制づくり」を目的に、「地域課題」の明確化と解決に向けての取組を評価するものです。•担当者会議の報告や個別事案の共有を評価するものではありません。"},{"s":"r8","p":279,"h":"地域体制強化共同支援加算の条件","t":"地域体制強化共同支援加算の条件支援が困難な利用者に対して、サービス等を提供する事業者のうちいずれか３者以上（当該相談支援専門員除く）と共同して、会議により情報共有及び支援内容を検討し、必要な支援を共同して実施するとともに、地域課題を整理し、区自立支援協議会に報告した場合に算定※報告及び記録様式は本市ホームページに掲載しています。提出前セルフチェック表で要件・内容を確認してください。「横浜市相談系サービス」ホームページ > 様式集https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi\u0002kaigo/fukushi/service/soudan.html#yousiki"},{"s":"r8","p":281,"h":"※課題を出すにあたって「基盤」となる地域の状況を分析しましょう","t":"※課題を出すにあたって「基盤」となる地域の状況を分析しましょう「強み」を意識するとよいでしょう区自立支援協議会（部会）では、事業所からあがった地域課題を検討し、地域のサービス体系を構築したり、区域で解決できないものは、ブロック・市自支協に提案します。入院者数障害福祉サービス利用者数年齢分布障害者手帳所持者数通所事業所数病院・精神科病院数ＧＨ数"},{"s":"r8","p":282,"h":"報告書作成の手順例","t":"報告書作成の手順例①個別の困難ケースの課題を関係機関で話しあう。②その課題に関係する、地域資源、地域の状況を確認する。③周囲の関係機関や支援者、３機関なども活用し、その課題を解決する方法や活用できる資源がないかを確認する。④課題を一般化できるか（他に同じニーズはあるか）を確認する。⑤地域課題として、報告書にまとめる。自立支援協議会で地域課題として議論すべき内容と確認できたら、内容をまとめ、その課題が市域・区域、どこの課題なのか、誰に何を提案したいのか明確にする。"},{"s":"r8","p":283,"h":"地域課題の解決を考えるにあたって","t":"地域課題の解決を考えるにあたって①既存の社会資源の活用②既存の社会資源の改善③社会資源の新規開発気づいていなかった資源を活用してみる。役割をもう一歩踏み込んで広げる。お金や人手がかからない方法だってある。今あるものが活用できないか。今あるものを改善できないか。"},{"s":"r8","p":284,"h":"地域資源の確認専門機関への相談","t":"地域資源の確認専門機関への相談区自立支援協議会報告／自立支援協議会での検討を依頼共同加算は、ココ!取り組みの具体化検討個別課題個別課題個別課題個別課題サービス担当者会議／個別支援会議／事例検討会地域課題？課題の抽出／整理解決! 課題解決の検討現状サービスの利用・工夫支援者の協力地域課題の解決を考えるにあたって"},{"s":"r8","p":287,"h":"強度行動障害者集中的支援事業","t":"強度行動障害者集中的支援事業健康福祉局障害施策推進課TEL：671-4133"},{"s":"r8","p":288,"h":"強度行動障害支援に関わる地域の支援機関等","t":"強度行動障害支援に関わる地域の支援機関等支援者間で連携・ネットワーク構築を行い、地域での支援力の向上を図る横浜市における状態が悪化した強度行動障害を有する者への集中的支援令和８年４月から、居住支援活用型を実施開始【広域的支援人材】（横浜市が選定・登録）○強度行動障害に関する支援困難事例に対して助言等を行い地域を支援する人材○集中的支援計画を作成し、標準的支援（個々の障害特性と行動の機能をアセスメントし、環境調整等を行う）を実施しながら、助言を行う＊広域的支援人材は、ア～ウのいずれかに該当する者から選定ア中核的支援人材養成研修の講師等（ディレクター・トレーナー）である者イ発達障害者支援体制整備事業による発達障害支援地域支援マネジャーである者ウその他強度行動障害を有する児者への支援に知見を有すると横浜市が認める者◆居住支援活用型（集中的支援加算Ⅱ）…500単位/日（３か月を限度）状態が悪化した者に対して、短期入所等の居住支援系サービスを活用して居住の場し、集中的支援を実施。終了後は、元の住まいや新たな住まいへ移行する（※）"},{"s":"r8","p":288,"h":"強度行動障害支援に関わる地域の支援機関等","t":"※集中的支援終了後の居住の場を確保、又は方針を決定し実施【実施施設等】（横浜市が選定・登録）○障害者支援施設○共同生活援助等＊実施施設等は、アを必ず満たし、イ又はウいずれかに該当する施設等から選定ア施設入所支援は重度障害者支援加算Ⅱ又はⅢ、共同生活援助・短期入所は重度障害者支援加算Ⅰ又はⅡを算定できる体制があるイ強度行動障害者への標準的支援について外部専門家によるコンサルを継続的に受けているウ強度行動障害支援者養成研修の講師・ファシリ等派遣に協力している参考：中核的人材○国または都道府県等で実施する中核的人材養成研修を受講し、標準的支援を踏まえた適切な支援を実施し、現場支援の中心となる人材※実施施設の中に中核的人材が配置されていない場合も集中的支援の利用は可発達障害者支援センター○集中的支援の必要性の検討(実施検討会議の開催)○広域的支援人材の派遣要請○実施施設の検討・調整事業所○日常的な支援の提供○事業所内の支援のマネジメント管理相談支援事業所○サービス等利用計画作成○集中的支援前後のケースワーク基幹相談支援センター○相談支援事業所のバックアップ○地域の体制づくり区役所○集中的支援適合基準の確認○支給決定(新たにサービス利用する場合等）"},{"s":"r8","p":288,"h":"強度行動障害支援に関わる地域の支援機関等","t":"医療・教育・その他関係機関事務局報酬訪問・広域的支援人材が訪問した場合、1,000単位/日を算定可（月４回まで）・広域的支援人材に報酬として支払う"},{"s":"r8","p":289,"h":"状態の悪化した強度行動障害者への集中的支援の流れ（事務処理フロー）","t":"状態の悪化した強度行動障害者への集中的支援の流れ（事務処理フロー）健康福祉局障害施策推進課区役所発達障害者支援センター(事務局) 事業所等・対象者が行動関連10点以上(区分は問わない)・支援終了後の居住の場について方針がある基準の適合確認支給決定個別支援会議等実施短期入所など新たなサービス利用が必要となる場合集中的支援の必要性(地域の支援チームで検討)広域的支援人材実施施設等短期入所等を活用した受入れ・支援(環境調整等)受入調整等適合、担当者名等を補記対象者への集中的支援の必要性について、実施検討会議を開催(発達障害者支援センターが主催、原則月１回の定例開催)※メンバー：地域支援マネジャー、広域的支援人材、申請事業所、実施予定施設、区、基幹相談支援センター、相談支援事業所(計画相談)等実施施設の検討(広域支援人材と連携）名簿の共有(様式1-1・1-2)名簿の共有(様式1-1・1-2)名簿の共有(様式1-1・1-2)名簿の共有(様式1-1・1-2)①広域的支援人材の選定・登録及び名簿(様式1-1)の管理・共有②実施施設等の選定及び名簿(様式1-2)の管理・共有共有(様式2写し・様式3写し)同意書・実施申請書受理送付(補記済の様式3写し)送付(様式4) ※同意書(様式2)写し・実施申請書(様式3)の写しを添付共有(様式4写し)広域的支援人材の検討・実施要請書(様式4)の送付実施施設等へ連絡・調整送付(参考様式1)②実施施設の選定・名簿の管理・共有について◆選定(ア)を必ず満たし、(イ)又は(ウ)のいずれかに該当する施設から選定(ア)施設入所支援は重度障害者支援加算Ⅱ又はⅢ、共同生活援助・短期入所は重度障害者支援加算Ⅰ又はⅡを算定できる体制がある(イ)強度行動障害者への標準的支援について外部専門家によるコンサルを継続的に受けている(ウ)強度行動障害支援者養成研修の講師・ファシリ等派遣に協力している◆名簿管理・共有・選定施設等の事業所名、種別等を記載した登録名簿を作成し保管・名簿に掲載した全ての広域支援人材及び掲載した全ての施設、県に情報を共有共有(参考様式1写し) 共有(参考様式1写し)共有(参考様式1写し)実施計画に基づく支援(環境調整や有効な支援方法等の助言援助)・申請事業所等へ訪問しアセスメントのうえ作成(概ね月1回見直し)集中的支援実施計画書(参考様式1)作成送付(参考様式2)共有(参考様式2写し)送付(様式2写し・様式3)・集中的支援に係る同意書(様式2)・集中的支援実施申請書(様式3)共有(参考様式2写し) 集中的支援実施報告書(参考様式2)作成支援方法等の引継ぎ・関係機関への共有※発達障害者支援センター(事務局) へ相談の上、申請送付(補記済の様式3写し) 実施申請書(様式3)写しへの補記による支援実施依頼"},{"s":"r8","p":290,"h":"計画相談の関わり","t":"計画相談の関わり集中的支援は、広域的支援人材や発達障害者支援センターが専門的立場で助言等を行うことで、地域の支援チームをエンパワメントしていくものです。実施検討会議は、地域の支援チームの参加のもと開催されます。対象者の支援の主体はあくまで地域の支援チーム・これまでの関わりの中で、対象者をどのようにアセスメントしているのか・集中的支援を活用する目的は何かを明確にしておくことが必要です。"},{"s":"r8","p":291,"h":"Q 集中的支援の実施検討会議は、計画相談のモニタリングとして位置付","t":"Q 集中的支援の実施検討会議は、計画相談のモニタリングとして位置付けてよいか。また、計画相談の集中支援加算は該当するか。A 実施検討会議の他、利用者の居宅、障害者支援施設、入院先の医療機関等において面接を実施し、モニタリングの要件を満たす場合には、当該会議をモニタリングの一部として位置付けることが可能です。なお、モニタリング月でない場合は、モニタリング追加が必要となります。また、モニタリング月でなく、モニタリング追加の要件にも該当しないときは、集中支援加算（福祉サービス等提供機関が開催する会議への参加）の算定が可能です。"},{"s":"r8","p":293,"h":"施設入所者の地域移行に関する","t":"施設入所者の地域移行に関する移動支援の特例適用について健康福祉局障害自立支援課【連絡先：０４５－６７１－２４０１】令和８年６月18日相談系サービス事業所集団指導資料"},{"s":"r8","p":294,"h":"趣旨","t":"趣旨本市では、国の第７期障害者福祉計画に基づき、施設入所者の地域移行を推進しています。これまで本市では、施設入所者による移動支援の利用を認めない運用としていましたが、施設入所者が移動支援を利用して地域移行後の生活を事前に体験することは、本人の意思決定支援に資するものであることから、地域移行に向けたアセスメントを目的とする場合に限り、施設入所者の移動支援の利用を認めることとします。"},{"s":"r8","p":295,"h":"適用開始日・支給決定可能なサービス","t":"適用開始日・支給決定可能なサービス■適用開始日令和８年10月１日■支給決定可能なサービス移動介護最大５時間/月（二人派遣 10時間/月）※外出先が通所施設の場合も、主目的は地域移行に向けたアセスメントであるため、移動介護で支給決定します。"},{"s":"r8","p":296,"h":"対象者要件","t":"対象者要件横浜市障害者移動支援事業実施要綱で定める対象者要件に加え、以下の要件をすべて満たす者が対象（１）18歳以上の施設入所者（２）１年以内に地域移行の見込みがある者（３）本人・家族等から地域移行に関する同意を得ている者（４）計画相談支援で地域移行に関する検討・調整をしている者"},{"s":"r8","p":297,"h":"支給決定の流れ①","t":"支給決定の流れ①（１）サービス担当者会議の実施（２）申請書類の作成・提出通常の申請書類に加え、地域移行に関する方針が確認できる以下の書類が必要作成主体書類名備考入所施設①個別支援計画②移動支援事業地域移行支援計画書②は本市ホームページ掲載の参考様式のとおり作成してください。計画相談支援事業所③サービス等利用計画案④モニタリング報告書・週間計画表計画作成時期の都合により、③に地域移行に関する方針の記載がない場合でも、④に記載があれば可とします。"},{"s":"r8","p":298,"h":"支給決定の流れ②","t":"支給決定の流れ②（３）区役所による審査・確認地域移行に向けた移動支援の利用目的・支援目標等を確認（４）支給決定原則６か月（一度だけ更新可・最長１年）（５）実施後の検証３か月ごとに入所施設等が検証を行い、別添の「移動支援事業地域移行支援【検証報告書】」を作成（参考）支援開始→３か月後検証（入所施設）→最終検証（入所施設）→更新・終了（区）"},{"s":"r8","p":299,"h":"関係事業者の役割等","t":"関係事業者の役割等（１）入所施設・「個別支援計画」、「移動支援事業地域移行支援計画書」の作成・「移動支援事業地域移行支援【検証報告書】」の作成・提出・支援内容の見直し、関係機関との連携（２）計画相談支援事業所・地域移行に向けた全体調整の観点から、サービス等利用計画案の作成及びモニタリングを実施し、関係機関と連携（３）移動支援事業所・入所施設等と連携し、サービス提供を実施"},{"s":"r8","p":300,"h":"留意事項","t":"留意事項（１）他の障害福祉サービスとの併給について本通知に該当する場合を除き、移動支援と施設入所支援の併給は不可（２）効果検証の実施具体的な利用計画及び効果検証の実施を前提に支給決定（３）その他今回の特例では、地域移行を効果的に進めるため、「計画相談支援で地域移行に関する検討・調整をしている者」を対象要件としていますが、移動支援事業を計画相談支援の対象サービスとする趣旨ではありません。なお、地域移行を進めるにあたり、地域移行支援事業の利用もご検討ください。"},{"s":"r8","p":301,"h":"最後に","t":"最後に・その他詳細は、横浜市ホームページをご確認ください。市ホームページＵＲＬ：https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi\u0002kaigo/fukushi/service/houmon-guide.html"},{"s":"r8","p":303,"h":"横浜市新規相談支援専門員配置等補助金","t":"横浜市新規相談支援専門員配置等補助金【目的】計画相談利用希望者に対する利用を促進するため、計画相談支援事業所に従事する常勤・専従の相談支援専門員の配置を推進し、計画件数の増加を諮る。【対象事業所】横浜市から指定を受けている指定特定相談支援事業所【補助内容】交付額 30万円（対象となる相談支援専門員１人あたりの人件費）"},{"s":"r8","p":304,"h":"横浜市新規相談支援専門員配置等補助金","t":"横浜市新規相談支援専門員配置等補助金【交付要件】①令和８年４月１日以降に、新たに常勤かつ専従の相談支援専門員を配置し、交付申請日及び実績報告日時点において、常勤かつ専従の相談支援専門員の配置を継続していること。②上記に該当する相談支援専門員の配置日以降に、新たに計画相談支援の利用契約を締結した件数（新規契約）が、実績報告日時点で配置日時点と比して30件以上増加していること。[新規契約の対象]・横浜市が援護の実施をしている者（横浜市が支給決定している者）・障害児相談支援の支給決定を受けていない者・事業所変更でない者（別の事業所の休止又は廃止により事業所を変更した者は除く）・同一法人内の別の相談支援事業所からの変更でない者③区自立支援協議会相談支援部会に参画し、基幹相談支援センターや区福祉保健センターと連携していること。"},{"s":"r8","p":305,"h":"横浜市新規相談支援専門員配置等補助金","t":"横浜市新規相談支援専門員配置等補助金【交付申請書類】①補助金交付申請書（第１号様式）※押印は不要②相談支援専門員の配置状況報告書（第２号様式）③交付対象となる相談支援専門員の挙証資料【申請期間】令和８年12月28日まで【書類提出方法と提出先】ＰＤＦファイルにしたものを電子メールにて提出してください。提出書類は、市HP「横浜市相談系サービス」のページからダウンロードできます。https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html#hojokin"},{"s":"r8","p":306,"h":"横浜市新規相談支援専門員配置等補助金","t":"横浜市新規相談支援専門員配置等補助金【申請から支払いまでの流れ】4月 12月 3月 4月～５月【事業所】新たな常勤専従を配置→事業所全体で30件新規契約増申請：12/28まで→交付決定補助金額確定・お支払い実績報告：3/1まで※当該職員を継続配置※取下げを行う場合も3/1まで"},{"s":"r8","p":307,"h":"介護テクノロジー導入支援補助金","t":"介護テクノロジー導入支援補助金【目的】障害福祉現場の職員の業務負担軽減、労働環境の改善及び業務効率化を図り、働きやすい職場づくりと安全・安心なサービス提供を推進すること【対象事業所】横浜市から指定を受けた事業所を運営している事業者（障害者支援施設、障害福祉サービス、特定・一般相談支援）※令和８年度から特定・一般相談支援が対象になりました。"},{"s":"r8","p":308,"h":"介護テクノロジー導入支援補助金","t":"介護テクノロジー導入支援補助金事業名基準額対象経費補助割合介護ロボット等の導入支援事業本市負担3/4事業者負担1/4ＩＣＴの導入支援事業アＩＣＴ導入支援事業イＡＩカメラ等の導入支援アとイ合わせて１施設又は事業所あたり100 万円アＩＣＴ導入実施に必要な工事費、報償費、旅費、需用費、役務費、委託料、使用料及び賃借料、備品購入費イＡＩカメラ導入実施に必要な工事費、報償費、旅費、需用費、役務費、委託料、使用料及び賃借料、備品購入費介護テクノロジーパッケージ型導入支援事業"},{"s":"r8","p":309,"h":"介護テクノロジー導入支援補助金","t":"介護テクノロジー導入支援補助金【交付申請書類】①事業計画書及び積算内訳書②見積書の写し（原則、市内事業者２者以上から徴収）③導入機器のカタログ若しくはパンフレット④その他確認資料(ソフトウェアの導入について協議を行う場合のみ)【交付の条件】①ICT機器（AIカメラ等除く）の申請のために、都道府県等が行うICT導入に伴う研修会に参加すること（本市HPの研修動画の視聴）②導入製品の内容や導入効果等についてホームページ等により広く公表するとともに、本市及び厚生労働省からの求めがあった場合は、ロボット等導入の効果分析や事例の公表等に対応すること"},{"s":"r8","p":310,"h":"介護テクノロジー導入支援補助金","t":"介護テクノロジー導入支援補助金【参考】申請から支払いまでの流れ（令和８年度）３月令和８年度申請受付(国庫補助協議)８月頃国内示(補助対象事業所決定)、機器導入可能８月下旬頃横浜市交付申請(補助対象事業所のみ)11月頃交付決定１月頃実績報告"},{"s":"r8","p":311,"h":"介護テクノロジー導入支援補助金","t":"介護テクノロジー導入支援補助金【令和９年度分仮申請】介護テクノロジー導入支援事業の事業準備のため、令和９年度の申請予定額や導入予定の機器等についてご回答をお願いいたします。①受付期間令和８年６月15日（予定）から令和８年７月15日（水）23：59まで②申請方法電子申請システム※市HP「横浜市障害福祉分野における介護テクノロジー導入支援事業」のページに掲載https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi\u0002kaigo/fukushi/kaigotechnology.html※申請予定額を証明できる書類（カタログや見積書等）を添付が必要"},{"s":"r8","p":312,"h":"介護テクノロジー導入支援補助金","t":"介護テクノロジー導入支援補助金【ICTの活用事例】市HP「横浜市障害福祉分野における介護テクノロジー導入支援事業」のページに活用事例が掲載されています。「２．介護テクノロジーの導入について」「＜参考資料＞・障害福祉サービス事業所のICTを活用した業務改善ガイドライン」https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi\u0002kaigo/fukushi/kaigotechnology.html#8222F"},{"s":"r8","p":313,"h":"障害者相談支援事業の実施状況等について","t":"障害者相談支援事業の実施状況等について６月９日にメールにて照会しましたが、改めて御案内いたします。このたび、厚生労働省及び神奈川県から、指定特定相談支援事業所、指定一般相談支援事業所及び指定障害児相談支援事業所における相談支援の実施体制や実施状況等に関する調査に対する回答依頼がありました。つきましては、次の方法で回答していただくようお願いいたします。【提出期限】令和８年６月19日（金）まで※期限が短く大変申し訳ありませんが、御協力いただきますようお願い申し上げます。"},{"s":"r8","p":314,"h":"障害者相談支援事業の実施状況等について","t":"障害者相談支援事業の実施状況等について【回答方法】以下のURLから進んでいただき、電子申請システムから必要項目を入力してください。特定相談支援事業所と一般相談支援事業所で回答フォームが分かれていますが、両方の指定を受けている場合は、両方とも回答をお願いいたします。特定相談支援事業所https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/fab79775-9687-4a77-ba0f-a0cfdf2fcc2c/start一般相談支援事業所https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/8691624e-f91f-4897-a2c0-5c0d41200082/start※本調査は令和８年４月１日時点で指定されている市内全事業所が対象です。"},{"s":"r8","p":314,"h":"障害者相談支援事業の実施状況等について","t":"※回答は令和８年４月１日現在の状況を御記入下さい。"},{"s":"r8","p":315,"h":"ご質問等について","t":"ご質問等について本日はお忙しい中、ありがとうございました。集団指導の説明・内容について、ご質問がある場合は、下記URL又はQRコードからフォームにアクセスし、登録をお願いします。質問と回答については、後日、市のHPに掲載します。【期限】令和８年６月30日（火）17時https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/aa3f5b32-2350-49a1-b191-370964eed99e/start"},{"s":"r8","p":316,"h":"問い合わせ先","t":"問い合わせ先横浜市健康福祉局障害施策推進課相談支援推進係TEL:671-4133 FAX：671-3566E-mail：kf-shiteisoudan@city.yokohama.lg.jp※障害児相談支援事業に関する問い合わせ先は以下です。横浜市こども青少年局障害児福祉保健課TEL：671-4274 FAX：663-2304E-mail：kd-syogaijifukuho@city.yokohama.lg.jp"},{"s":"hp","p":0,"h":"体制届（加算・減算の届出）","t":"加算・減算を新たに算定する、算定をやめる、種類が変わる場合は「介護給付費等算定に係る体制等に関する届出書」（体制届）を提出する。毎月15日までの届出は翌月から、16日以降の届出は翌々月からの適用。減算になる場合は15日を過ぎた届出でも翌月から適用。体制が整った時点から届出でき、見込みでの届出はできない。報酬改定の年度は全事業所が4月に体制届を提出し、届出期間が通常と異なる。様式は障害福祉情報サービスかながわに掲載。（横浜市ホームページの記載を要約）","u":"https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html"},{"s":"hp","p":0,"h":"変更届・廃止届・休止届","t":"相談支援専門員や運営規程などに変更があったときは、変更の日から10日以内に届け出る。廃止・休止は所管課に相談したうえで、廃止・休止の日の1か月前までに届け出る。再開は再開の日から10日以内。（横浜市ホームページの記載を要約）","u":"https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html"},{"s":"hp","p":0,"h":"過誤申立","t":"請求内容の訂正が必要な場合は、横浜市電子申請・届出システムから過誤取下げを依頼する。締切は月の最終開庁日の前日23時59分（土日祝と重なる場合は前倒し）。再請求は過誤取下げ後に国保連へ行う。1サービスで30件を超える場合は個別に相談。（横浜市ホームページの記載を要約）","u":"https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html"},{"s":"hp","p":0,"h":"主任相談支援専門員配置加算の通知","t":"主任相談支援専門員配置加算の取扱いについて（通知）健障推第157号・令和6年4月9日が横浜市ホームページに掲載されている。（Ⅰ）を算定する場合は、届出前に障害施策推進課相談支援推進係へ相談する。（横浜市ホームページの記載を要約）","u":"https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html"},{"s":"hp","p":0,"h":"地域生活支援拠点等の機能に関連する届出","t":"地域生活支援拠点関連加算を取得して支援を行う場合は、体制届とは別に「地域生活支援拠点等の機能に関連する届出」が必要。複数事業所が協働して機能強化型（継続）サービス利用支援費（Ⅰ）（Ⅱ）（Ⅲ）を算定する場合は、届出の「市町村及び地域生活支援拠点等との連携及び調整に従事する者の氏名」欄に事業所ごとの氏名を書く。（横浜市ホームページの記載を要約）","u":"https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html"},{"s":"hp","p":0,"h":"加算記録の様式","t":"加算算定に係る記録作成の参考として「加算記録」の様式（エクセル）が掲載されている。業務ガイドラインP.154も確認する。地域体制強化共同支援加算の報告書兼記録書と参考資料も掲載。（横浜市ホームページの記載を要約）","u":"https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html"},{"s":"hp","p":0,"h":"業務ガイドラインの版","t":"計画相談支援の業務ガイドラインは令和6年11月版が最新として掲載されている（ページの最終更新日は2026年9月18日）。（横浜市ホームページの記載を要約）","u":"https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html"},{"s":"ji","p":90,"h":"","t":"第四児童福祉法に基づく指定障害児相談支援に要する費用の額の算定に関する基準（平成24年厚生労働省告示第126号）別表障害児相談支援給付費単位数表（以下「障害児相談支援報酬告示」という。）に関する事項"},{"s":"ji","p":90,"h":"第四の1 障害児相談支援費の算定について","t":"１障害児相談支援費の算定について(１) 基本的な取扱いについて指定障害児相談支援の提供に当たっては、障害児相談支援基準に定める以下の基準のいずれかを満たさない場合には、所定単位数を算定しないものとする。①指定障害児支援利用援助(一) 障害児支援利用計画の作成に当たってのアセスメントに係る障害児の居宅への訪問による障害児及びその家族への面接等（第15条第２項第６号）(二) 障害児支援利用計画案の障害児及びその家族への説明並びに障害児又は障害児の保護者（以下「障害児等」という。）の文書による同意（同項第８号及び第11号）(三) 障害児支援利用計画案及び障害児支援利用計画の障害児等及び担当者への交付（同項第９号及び第12号）(四) サービス担当者会議の開催等による担当者への説明及び専門的な意見の聴取（同項第10号）"},{"s":"ji","p":90,"h":"第四の1 障害児相談支援費の算定について","t":"②指定継続障害児支援利用援助(一) 障害児の居宅への訪問による障害児又はその家族への面接等（同条第３項第２号）"},{"s":"ji","p":91,"h":"第四の1 障害児相談支援費の算定について","t":"(二) 障害児支援利用計画の変更についての①の(一)から(四)に準じた手続の実施（同条第３項第３号により準用する同条第２項第６号、第10号から第12号まで）(２) 機能強化型障害児支援利用援助費（機能強化型継続障害児支援利用援助費）の取扱いについて①趣旨機能強化型障害児支援利用援助費（機能強化型継続障害児支援利用援助費を含む。）は、支援困難ケースへの積極的な対応を行うほか、専門性の高い人材を確保し、質の高いマネジメントを実施している事業所を評価し、地域全体のマネジメントの質の向上に資することを目的とするものである。②基本的取扱方針当該報酬の対象となる事業所は、以下について強く望まれるものである。・公正中立性を確保し、サービス提供主体からも実質的に独立した事業所であること・常勤かつ専従の相談支援専門員が配置され、どのような支援困難ケースでも適切に支援できる体制が整備されており、市町村や基幹相談支援センター等との連携体制が確保されていること・協議会と連携や参画していること本報酬については、こうした基本的な取扱方針を十分に踏まえ、支援困難ケースを含めた質の高いマネジメントを行うという趣旨に合致した適切な運用を図られるよう留意されたい。"},{"s":"ji","p":91,"h":"第四の1 障害児相談支援費の算定について","t":"③具体的運用方針児童福祉法に基づく指定障害児相談支援に要する費用の額の算定に関する基準に基づき厚生労働大臣が定める基準（平成27年厚生労働省告示第181号。以下「厚生労働大臣が定める基準」という。）における機能強化型障害児支援利用援助費に係る各要件の取扱については、次に定めるところによること。(一) 共通事項ア共通(ｱ) 人員配置要件ａ総則質の高い相談支援の提供を図るため、常勤（機能強化型障害児支援利用援助費（Ⅳ）を除く。）かつ専従の相談支援専門員を２名から４名以上配置し、そのうち 1 名以上が相談支援従事者現任研修を修了した相談支援専門員（以下「現任研修修了者」という。）であることを要件とする。その他の具体的な取扱いについては、(二)のア、(三)のア、(四)のア及び(五)のアをそれぞれ参照すること。"},{"s":"ji","p":91,"h":"第四の1 障害児相談支援費の算定について","t":"ｂ兼務の取扱い配置される相談支援専門員については、原則専従であることが要件であるが、同一敷地内にある事業所における指定特定相談支援事業所、指定一般相談支援事業所若しくは指定治立生活援助事業所、基幹相談支援センター又は障害者相談支援事業の業務（ただし、基幹相談支援センター又は障害者相談支援事業の業務と兼務する場合につ"},{"s":"ji","p":92,"h":"第四の1 障害児相談支援費の算定について","t":"いては、当該業務を委託する市町村が認める場合に限る。）と兼務しても差し支えないこととしている。このほか、当該指定障害児相談支援事業所の業務に支障がない場合は、一部の相談支援専門員につき兼務しても差し支えないものとしている（機能強化型障害児支援利用援助費（Ⅳ）を除く。）が、具体的な取扱いについては、(二)のア、(三)のア、(四)のア及び(五)のアをそれぞれ参照すること。(ｲ) 留意事項伝達会議「利用者に関する情報又はサービス提供に当たっての留意事項に係る伝達等を目的とした会議」は、次のａからｃまでに掲げる要件をいずれも満たすものでなければならないこと。なお、会議については、テレビ電話装置等を活用して行うことができるものである。ａ議題については、少なくとも次のような議事を含めること。⒜現に抱える処遇困難ケースについての具体的な処遇方針⒝過去に取り扱ったケースについての問題点及びその改善方策⒞地域における事業者や活用できる社会資源の状況⒟保健医療及び福祉に関する諸制度⒠アセスメント及びサービス等利用計画の作成に関する技術⒡利用者からの苦情があった場合は、その内容及び改善方針⒢その他必要な事項ｂ議事については、記録を作成し、５年間保存しなければならないこと。"},{"s":"ji","p":92,"h":"第四の1 障害児相談支援費の算定について","t":"ｃ「定期的」とは、概ね週１回以上であること。なお、一体的に管理運営を行う事業所であってイの(ｲ)のａの⒞に定める会議を開催した週については、当該会議をもって本会議を開催したこととして差し支えない。(ｳ) 現任研修修了者同行による研修現任研修修了者の同行による研修については、当該現任研修修了者が、新規に採用した従業者に対し、適切な指導を行うこと。なお、テレビ電話装置等を活用して行われる研修についても、当該現任研修修了者による適切な指導等が可能な体制が確保されている場合は対象に含めて差し支えない。なお、一体的に管理運営を行う事業所の場合、現任研修修了者が配置されていない事業所に新規に採用した従業者がいる場合、他の一体的に管理運営を行う事業所に配置された現任研修修了者により適切な指導を行う必要がある。(ｴ) 支援困難ケースの受入れ治ら積極的に支援困難ケースを受け入れなければならず、そのため、常に基幹相談支援センター、委託相談支援事業所又は協議会との連携を図らなければならないこと。"},{"s":"ji","p":92,"h":"第四の1 障害児相談支援費の算定について","t":"(ｵ) 事例検討会への参加基幹相談支援センター、委託相談支援事業所又は協議会が実施する事例検討会等に参加していること。(ｶ) 取扱件数"},{"s":"ji","p":93,"h":"第四の1 障害児相談支援費の算定について","t":"取扱件数については、当該指定障害児相談支援事業所及び一体的に管理運営を行う指定障害児相談支援事業所においてそれぞれ 40 件未満であること。また、取扱件数は、１月の当該指定障害児相談支援事業所全体の障害児相談支援対象保護者の数の前６月の平均値(以下「障害児相談支援対象保護者の平均数」という。)を、当該指定障害児相談支援事業所の相談支援専門員（相談支援員については、１人につき相談支援専門員 0.5 人とみなして算定する。）の員数の前６月の平均値（以下「相談支援専門員の平均員数」という。)で除して得た数とする。なお、当該指定障害児相談支援事業所が指定特定相談支援事業所も一体的に運営している場合は、指定サービス利用支援又は指定継続サービス利用支援を行った障害児相談支援対象保護者の数も取扱件数に含むものとする。イ複数事業所が協働により体制を確保する場合(ｱ) 趣旨障害児通所支援の利用者が少ないあるいは地域に分散している等により、単独の事業所で機能強化型障害児支援利用援助費の算定要件を満たすことが困難であっても、複数の指定障害児相談支援事業所間で一体的に管理運営を行うための必要な体制を構築した上で、当該事業所全体をもって人員配置及び 24 時間の連絡体制が確保されていることにより、(二)のア及びイ、(三)のア及びイ並びに(四)のアに規定する要件を満たすことを可能とするものである。"},{"s":"ji","p":93,"h":"第四の1 障害児相談支援費の算定について","t":"(ｲ) 要件次のａからｃまでに掲げる要件をいずれも満たしているものでなければならない。ａ体制要件次の⒜から⒞までに掲げる要件をいずれも満たしていること。⒜協働体制を確保する事業所間において、協定を締果していること。⒝機能強化型障害児支援利用援助費に係る各要件を満たしているかについて、協定を締果した事業所間において定期的（月１回）に確認が実施されていること。⒞原則、全職員が参加するケース共有会議、事例検討会等を月２回以上共同して実施していること。なお、会議等については、テレビ電話装置等を活用して行うことができるものである。ｂ事業所要件次の⒜又は⒝に掲げる要件のいずれかを満たしていること。なお、一体的に管理運営を行う事業所の範囲は、原則として同一市町村又は同一圏域内の地域生活支援拠点等を構成している場合に限る。"},{"s":"ji","p":93,"h":"第四の1 障害児相談支援費の算定について","t":"⒜一体的に管理運営を行う事業所それぞれが、障害児相談支援基準第 19 条に規定する運営規程において、地域生活支援拠点等であることを市町村により位置付けられていることを定めていること。⒝地域生活支援拠点等を構成する関係機関（以下「拠点関係機関」という。）との連携体制を確保するとともに、協議会に定期的に参画していること。"},{"s":"ji","p":94,"h":"第四の1 障害児相談支援費の算定について","t":"なお、拠点関係機関との連携体制を確保することについては、支援が必要な者への対応について協議する体制及び緊急時に連絡をとれる体制を確保していることとする。また、協議会に定期的に参画していることについては、協議会の構成員として定期的に専門部会等に参加し、個別事例の報告等を行っていることとする。ｃ人員配置要件（各事業所）当該指定障害児相談支援事業所及び一体的に管理運営を行う指定障害児相談支援事業所において、常勤専従の相談支援専門員をそれぞれ 1 名以上配置していること。(二) 機能強化型障害児支援利用援助費(Ⅰ)についてア人員配置要件常勤かつ専従の相談支援専門員を４名以上配置し、そのうち１名以上が現任研修修了者であること。ただし、３名（現任研修修了者１名を含む。）を除いた相談支援専門員については、当該指定障害児相談支援事業所の業務に支障がない場合は、同一敷地内にある他の事業所の職務を兼務しても差し支えないものとする。"},{"s":"ji","p":94,"h":"第四の1 障害児相談支援費の算定について","t":"なお、その他の兼務の取扱いについては、(一)のアの(ｱ)のｂを参照すること。イ 24 時間の連絡体制24 時間連絡可能な体制とは、営業時間と同様の体制をとることを求めるものではなく、営業時間外においては、利用者が緊急事態に際しても担当者と携帯電話等により連絡を取ることができ、必要に応じて相談に応じることが可能な体制をとる必要があることをいうものである。営業時間外の体制は当該事業所の相談支援専門員の輪番制による対応等によることも可能であること。ウ協議会への参画協議会に構成員として定期的に参画し、他の構成員である関係機関等との連携の緊密化を図るために必要な取組を実施していること。具体的には、定期的に専門部会等に参加し、個別事例の報告等、地域づくりに向けた検討及びそれに伴い必要な取組を当該関係機関等と連携して行うこととする。"},{"s":"ji","p":94,"h":"第四の1 障害児相談支援費の算定について","t":"エ基幹相談支援センターによる取組への参画基幹相談支援センターが行う地域の相談支援体制の強化の取組に参画していること。具体的には、地域生活支援事業通知の別紙 1 地域生活支援事業実施要綱別記 1-3 相談支援事業実施要領の３の(１)のイの(イ)に規定されている基幹相談支援センターによる地域の相談支援体制の強化の取組に協力していることとする。(三) 機能強化型障害児支援利用援助費(Ⅱ)についてア人員配置要件常勤かつ専従の相談支援専門員を３名以上配置し、そのうち１名以上が現任研修修了者であること。"},{"s":"ji","p":95,"h":"第四の1 障害児相談支援費の算定について","t":"ただし、２名(現任研修修了者１名を含む。)を除いた相談支援専門員については、当該指定障害児相談支援事業所の業務に支障がない場合は、同一敷地内にある他の事業所の職務を兼務しても差し支えないものとする。なお、その他の兼務の取扱いについては、(一)のアの(ｱ)のｂを参照すること。イ 24 時間の連絡体制(二)のイの規定を準用する。ウ協議会への参画(二)のウの規定を準用する。エ基幹相談支援センターによる取組への参画(二)のエの規定を準用する。(四) 機能強化型障害児支援利用援助費(Ⅲ)についてア人員配置要件常勤かつ専従の相談支援専門員を２名以上配置し、そのうち１名以上が現任研修修了者であること。ただし、現任研修修了者１名を除いた相談支援専門員については、指定障害児相談支援事業所の業務に支障がないと市町村が認めた場合においては、同一敷地内にあるそれ以外の他の事業所の職務を兼務しても差し支えないものとする。"},{"s":"ji","p":95,"h":"第四の1 障害児相談支援費の算定について","t":"なお、その他の兼務の取扱いについては、(一)のアの(ｱ)のｂを参照すること。イ協議会への参画(二)のウの規定を準用する。ウ基幹相談支援センターによる取組への参画(二)のエの規定を準用する。(五) 機能強化型障害児支援利用援助費(Ⅳ)についてア人員配置要件専従の相談支援専門員を 2 名以上配置し、かつ、そのうち 1 名以上が常勤の現任研修修了者であること。本区分については、(一)のアの(ｱ)のｂに規定する職務を除き、同一敷地内にあるそれ以外の他の事業所の業務を兼務することはできないことに留意すること。(六) その他ア離島等における特例(ｱ) 趣旨特別地域（障害児相談支援報酬告示１の注８に規定する特別地域をいう。以下同じ。）に所在する指定障害児相談支援事業所については、広域で相談支援体制を整備する必要がある場合があることを踏まえ、当該必要性について各事業所が所在する市町村が認めた場合の特例を規定するものである。なお、この場合において、都道府県協議会において、当該事業所の適正な運営が図られるように検討するとともに、都道府県が地域生活支援事業の都道府県相談支援体制整備事業の実施等により、当該地域の相談支援体制の整備等に関する助言等を行うことが望ましいため、都道府県及び市町村と必要な連携を図りつつ、事業の運営に努めること。"},{"s":"ji","p":96,"h":"第四の1 障害児相談支援費の算定について","t":"(ｲ) 一体的に管理運営する事業所の範囲一体的に管理運営する事業所で機能強化型障害児支援利用援助費を算定する場合、一体的に管理運営を行う事業所の範囲は、(一)のイの(ｲ)のｂに規定しているところであるが、特例の対象となる指定障害児相談支援事業所については、当該範囲を同一都道府県内とする。(ｳ) 現任研修修了者の配置要件人員配置要件として、(二)のア、(三)のア、(四)のア及び(五)のアに規定しているとおり、現任研修修了者を１名以上配置することが必要であるが、特例の対象となる指定障害児相談支援事業所については、当該指定障害児相談支援事業所以外の指定障害児相談支援事業所又は指定特定相談支援事業所に配置される現任研修修了者により一定の指導及び助言が行われる体制が確保されていることで足りることとしている。具体的には、現任研修修了者が定期的に当該指定障害児相談支援事業所を訪問し、専門的な助言、スーパーバイズ、事例検討等が行われる体制が確保されていることとし、これらの指導及び助言については、主任相談支援専門員により行われることが望ましいものである。"},{"s":"ji","p":96,"h":"第四の1 障害児相談支援費の算定について","t":"イ経過措置(ｱ) 拠点関係機関との連携令和８年度末までの間、市町村が地域生活支援拠点等を整備していない場合、(一)のイの(ｲ)のｂの⒝に規定する要件については、拠点関係機関との連携体制を確保することに代えて、地域生活支援拠点等の役割の一部である緊急事態等への対処及び地域における生活に移行するための活動に関する取組に協力することで足りるものである。なお、当該協力に当たっては、市町村及び基幹相談支援センター（基幹相談支援センターが未設置の場合はその他の地域の中核的な役割を担う相談支援事業所でも可とする）と日頃から利用者の緊急事態に備えた対応や入所施設・病院棟からの地域移行に関する事項について連携を図ること。(ｲ) 基幹相談支援センターによる取組への参画令和８年度末までの間、市町村が基幹相談支援センターを設置していない場合、(二)"},{"s":"ji","p":96,"h":"第四の1 障害児相談支援費の算定について","t":"のエ、(三)のエ及び(四)のウに規定する要件については、基幹相談支援センターが行う地域の相談支援体制の強化の取組に参画していることに代えて、基幹相談支援センターに準ずる地域の相談支援の中核を担う機関が行う地域の相談支援体制の強化の取組に参画していることとする。なお、地域の相談支援の中核を担う機関とは、具体的には、主任相談支援専門員配置加算（Ⅰ）を算定する指定障害児相談支援事業所等を想定している。また、地域の相談支援体制の強化の取組については、(二)のエの規定を参照すること。(３) 障害児支援利用援助費及び継続障害児支援利用援助費の適用について①取扱件数の取扱いについて取扱件数(２)の③の(一)のアの(ｶ)に規定するところにより算定したものとする。以下同じ。）が40件以上の場合は、40件以上に相当する件数に相談支援専門員の平均員数を乗じた件"},{"s":"ji","p":97,"h":"第四の1 障害児相談支援費の算定について","t":"数（小数点以下の端数は切り捨てる。）が、算定月における障害児支援利用援助費（Ⅱ）又は継続障害児支援利用援助費（Ⅱ）を適用する件数となる。②障害児支援利用援助費及び継続障害児支援利用援助費の割り当てについて障害児支援利用援助費（Ⅰ）又は（Ⅱ）及び継続障害児支援利用援助費（Ⅰ）又は（Ⅱ）の利用者ごとの割り当てに当たっては、利用者の契約日が新しいものから順に、(３)において算定した件数分について、障害児支援利用援助費（Ⅱ）又は継続障害児支援利用援助費（Ⅱ）を割り当て、それ以外の利用者について、障害児支援利用援助費（Ⅰ）又は継続障害児支援利用援助費（Ⅰ）を割り当てること。なお、当該指定障害児相談支援事業所が指定特定相談支援事業所も一体的に運営している場合は、指定特定相談支援事業所における利用者の契約日が新しいものから順に割り当て、その後に指定障害児相談支援事業所の利用者の契約日が新しいものから順に割り当てること。"},{"s":"ji","p":97,"h":"第四の1 障害児相談支援費の算定について","t":"(４) 継続障害児支援利用援助費の算定月の取扱いについて継続障害児支援利用援助費については、モニタリング期間ごとに指定継続障害児支援利用援助を実施する場合に算定するが、対象者が不在である等により当該期間を踏まえ、市町村が障害児等の心身の状況等を勘案して柔軟かつ適切に設定する期間ごとに設定された指定継続障害児支援利用援助の実施予定月の翌月となった場合であって、市町村がやむを得ないと認めるときは、当該翌月においても継続障害児支援利用援助費を算定できること。なお、機能強化型継続障害児支援利用援助費についても同様である（以下(５)において同じ。）。(５) 同一の月に指定継続障害児支援利用援助と指定障害児支援利用援助を行う場合について障害児相談支援費については、通所給付決定の有効期間の終期月等において、指定継続障害児支援利用援助を行った果等、通所給付決定の更新等の申請がなされ、同一の月に当該申請に係る指定障害児支援利用援助を行った場合には、障害児支援利用計画の作成の一連の支援であることから、継続障害児支援利用援助費は算定せず、障害児支援利用援助費のみ算定するものとする。"},{"s":"ji","p":97,"h":"第四の1 障害児相談支援費の算定について","t":"なお、通所給付決定に当たって指定障害児支援利用援助を行った後、同一の月に当該通所給付決定に係るサービスの利用状況を検証するための指定継続障害児支援利用援助を行った場合には、障害児支援利用援助費及び継続障害児支援利用援助費の両方を算定できるものであること。"},{"s":"ji","p":97,"h":"第四の2 特別地域加算の取扱いについて","t":"２特別地域加算の取扱いについて障害児相談支援報酬告示１の注８の特別地域加算については、第二の２の(４)の②を準用する。"},{"s":"ji","p":97,"h":"第四の3 地域生活支援拠点等機能強化加算の算定について","t":"３地域生活支援拠点等機能強化加算の算定について(１) 趣旨当該加算は、障害者等の重度化・高齢化や親亡き後を見据え、地域生活障害者等（障害者総合支援法第77条第３項の規定に基づく地域生活障害者等をいう。以下同じ。）の緊急時に備えた相談や緊急時の対応、入院・入所からの地域移行の推進等、地域体制の構築を目的とする地域生活支援拠点等についての機能強化に資する取組を評価するものである。具体的な算定要件としては、計画相談支援及び障害児相談支援（機能強化型（継続）サービス利用支援費（Ⅰ）又は（Ⅱ）を算定する場合に限る。）と治立生活援助、地域移行支援及"},{"s":"ji","p":98,"h":"第四の3 地域生活支援拠点等機能強化加算の算定について","t":"び地域定着支援の全てのサービス（以下「拠点機能強化サービス」と総称する。）を一体的に運営していること又は拠点機能強化サービスに係る複数の事業者が、地域生活支援拠点等のネットワークにおいて相互に連携して運営していること、かつ、市町村により地域生活支援拠点等に位置付けられた場合であって、相互の有機的な連携及び調整等の業務に従事する者（以下「拠点コーディネーター」という。）が常勤で１以上配置されている事業所（拠点コーディネーターが当該事業所以外の拠点関係機関に配置されている場合を含む。以下「拠点機能強化事業所」と総称する。）について加算する。(２) 拠点コーディネーターの要件及び業務拠点コーディネーターについては、専ら当該地域生活支援拠点等におけるコーディネート業務に従事することを基本とし、原則として、拠点コーディネーターが他の職務を兼ねることはできない。ただし、障害の特性に起因して生じる事態等における緊急的な支援や、地域生活障害者等の地域移行等に係る支援など、拠点コーディネーターが治ら支援を提供することについて市町村が特に必要と認める場合には、拠点機能強化事業所の他の職務に従事することができるものとする。"},{"s":"ji","p":98,"h":"第四の3 地域生活支援拠点等機能強化加算の算定について","t":"なお、拠点コーディネーターの要件及び実施すべき業務については、「地域生活支援拠点・ネットワーク運営推進事業の実施について（令和６年３月29日障発0329第８号厚生労働省社会・援護局障害保健福祉部長通知）」を参照すること。(３) 算定に当たっての留意事項①当該加算については、地域生活支援拠点等に配置された拠点コーディネーター１人当たり、１月につき100回を上限として算定する。この上限については、拠点機能強化事業所の単位における算定回数の合計であることから、相互に連携して運営する拠点機能強化事業所については、事前に毎月の算定回数の目安を共有しておくこと。②拠点機能強化事業所は、１月に１回以上の頻度で、拠点コーディネーター及び拠点機能強化事業所の従業者が参加し、当該加算の算定状況の共有に加え、地域生活支援拠点等における機能の整備状況、支援において明らかになった地域課題の抽出及び共有その他地域生活支援拠点等の機能強化を推進するために必要な事項を協議すること。また、その協議内容については、市町村の職員出席や書面の提出等の方法により、市町村と共有すること。"},{"s":"ji","p":98,"h":"第四の3 地域生活支援拠点等機能強化加算の算定について","t":"③当該加算の算定に係る事務処理等の詳細については、この通知に定めるもののほか、「地域生活支援拠点等の整備の推進及び機能強化について（令和６年３月29日障障発0329第１号厚生労働省社会・援護局障害保健福祉部障害福祉課長通知）」を参照すること。"},{"s":"ji","p":98,"h":"第四の4 利用者負担上限額管理加算の取扱いについて","t":"４利用者負担上限額管理加算の取扱いについて障害児相談支援報酬告示２の利用者負担上限額管理加算については、第二の２の(１)の⑧を準用する。"},{"s":"ji","p":98,"h":"第四の5 初回加算の取扱いについて","t":"５初回加算の取扱いについて障害児相談支援報酬告示３の初回加算については、具体的には次のような場合に算定される。(１) 新規に障害児支援利用計画を作成する場合なお、指定障害児相談支援を利用せずに障害児通所支援を利用している障害児相談支援対象保護者について障害児支援利用計画を作成する場合についても含まれる。"},{"s":"ji","p":99,"h":"第四の5 初回加算の取扱いについて","t":"(２) 障害児相談支援対象保護者が障害児通所支援を利用する月の前６月間において障害児通所支援及び障害福祉サービスを利用していない場合(３) 指定障害児相談支援に係る契約をした日から障害児支援利用計画案を交付した日までの期間が３月を超える場合であって、３月が経過する日以後に月２回以上、障害児等に面接した場合なお、テレビ電話装置等を活用して面接した場合を含む。ただし、月に１回は障害児の居宅を訪問し、面接することを要するものである。この場合においても、障害児等に対して面接方法に係る意向を確認するとともに、居宅を訪問して面接することを希望する場合は、居宅を訪問して面接するよう努めること。上記(３)の要件を満たす場合については、その月分の初回加算に相当する額を加えた単位（所定単位数に当該面接を行った月の数（３を限度とする。）を乗じて得た単位数）を加算するものである。"},{"s":"ji","p":99,"h":"第四の5 初回加算の取扱いについて","t":"ただし、初回加算の算定月から、前６月間において保育・教育等移行支援加算を算定している場合は、初回加算を算定できない。"},{"s":"ji","p":99,"h":"第四の6 主任相談支援専門員配置加算について","t":"６主任相談支援専門員配置加算について(１) 趣旨当該加算の対象となる事業所は、相談支援従事者主任研修を修了した常勤かつ専従の主任相談支援専門員を１名以上配置し、当該主任相談支援専門員が適切な助言・指導を行うことができる体制が整備されていることが必要となる。なお、主任相談支援専門員の兼務の取扱いについては、機能強化型障害児支援利用援助費と同趣旨であるため、(一)のアの(ｱ)のｂを参照すること。(２) 算定にあたっての留意事項当該加算は、主任相談支援専門員に求められる地域における中核的な役割を踏まえ、次に掲げる区分に応じ、算定する。①主任相談支援専門員配置加算(Ⅰ)(一) 事業所の要件基幹相談支援センターの委託を受けている、児童発達支援センターに併設される又は地域の相談支援の中核を担う機関として市町村長が認める指定障害児相談支援事業所に限る。"},{"s":"ji","p":99,"h":"第四の6 主任相談支援専門員配置加算について","t":"(二) 主任相談支援専門員が行うべき事項主任相談支援専門員による地域における中核的な役割として期待される取組を特に評価するため、当該指定障害児相談支援事業所の従業者に加え、当該指定障害児相談支援事業所以外の指定障害児相談支援事業所、指定特定相談支援事業所及び指定一般相談支援事業所の従業者に対しても、その資質の向上のための研修を実施した場合に算定できるものである。なお、ここでいう「研修を実施した場合」とは次に掲げるいずれの要件も満たす体制が整備されていなければならない。"},{"s":"ji","p":100,"h":"第四の6 主任相談支援専門員配置加算について","t":"ア利用者に関する情報又はサービス提供に当たっての留意事項に係る伝達等を目的とした会議の開催イ新規に採用した全ての相談支援専門員に対する主任相談支援専門員の同行による研修の実施ウ当該相談支援事業所の全ての相談支援専門員に対して、地域づくり、人材育成、困難事例への対応などサービスの総合的かつ適切な利用支援等の援助技術の向上等を目的として主任相談支援専門員が行う指導、助言エ基幹相談支援センターが実施する地域の相談支援事業者の人材育成や支援の質の向上のための取組の支援平日常的な支援方針等を検討する場の設置・運営、事業所の訪問や相談支援従事者の業務への同行等による専門的な助言、研修会の企画・運営（相談支援従事者研修の実習の受入を含む。）等を基幹相談支援センターの職員と共同で実施していること（ただし、市町村が基幹相談支援センターを設置していない場合は、地域の相談支援の中核を担う機関が実施する取組への協力とする。）"},{"s":"ji","p":100,"h":"第四の6 主任相談支援専門員配置加算について","t":"。②主任相談支援専門員配置加算(Ⅱ)当該指定障害児相談支援事業所の従業者又は当該指定障害児相談支援事業所以外の指定障害児相談支援事業所、指定特定相談支援事業所及び指定一般相談支援事業所の従業者に対し、その資質の向上のための研修を実施した場合に算定できるものである。なお、ここでいう「研修を実施した場合」とは、①の(二)のアからウに規定する要件に加えて、次に掲げる要件も満たす体制が整備されていなければならない。基幹相談支援センターが実施する地域の相談支援事業者の人材育成や支援の質の向上のための取組の支援平日常的な支援方針等を検討する場の設置・運営、事業所の訪問や相談支援従事者の業務への同行等による専門的な助言、研修会の企画・運営（相談支援従事者研修の実習の受入を含む。）等）への主任相談支援専門員の協力（ただし、市町村が基幹相談支援センターを設置していない場合は、地域の相談支援の中核を担う機関が実施する取組への協力とする。）"},{"s":"ji","p":100,"h":"第四の6 主任相談支援専門員配置加算について","t":"(３) 手続この加算を算定する場合は、研修を修了した主任相談支援専門員を配置している旨を市町村へ届け出るとともに、体制が整備されている旨を事業所に掲示するとともに公表する必要があること。"},{"s":"ji","p":100,"h":"第四の7 入院時情報連携加算の取扱いについて","t":"７入院時情報連携加算の取扱いについて(１) 趣旨障害児相談支援報酬告示の５の入院時情報連携加算の注中「必要な情報」とは、具体的には、当該障害児等の基本情報、障害児の状態、支援における留意点等、家族・世帯の状況、生活の状況、受診・服薬の状況等をいう。なお、医療機関との連携に当たっては、当該事項を記載した入院時情報提供書を作成し、当該障害児等の同意の上、医療機関に提供することを基本とする。(２) 算定に当たっての留意事項当該加算は、次に掲げる区分に応じ、障害児相談支援対象保護者１人につき１月に１回を限度として算定する。"},{"s":"ji","p":101,"h":"第四の7 入院時情報連携加算の取扱いについて","t":"①入院時情報連携加算（Ⅰ）医療機関へ出向いて、当該医療機関の職員と面談し、必要な情報を提供した場合に所定単位数を加算する。②入院時情報連携加算（Ⅱ）①以外の方法により必要な情報を提供した場合に所定単位数を加算する。(３) 手続情報提供を行った日時、場所（医療機関へ出向いた場合）、内容、提供手段平面談、ＦＡＸ等）等について記録（基準省令第30条第２項に規定する記録をいう。以下同じ。）を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければならない。"},{"s":"ji","p":101,"h":"第四の8 退院・退所加算の取扱いについて","t":"８退院・退所加算の取扱いについて(１) 趣旨病院若しくは診療所又は児童福祉施設等へ入院、入所等をしていた障害児が退院、退所し、障害児通所支援を利用する場合において、当該障害児の退院、退所に当たって、当該施設の職員と面談を行い、当該障害児及びその家族に関する必要な情報の提供を得た上で、障害児支援利用計画を作成し、障害児通所支援の利用に関する調整を行い、当該障害児の保護者が障害児通所支援の支給決定を受けた場合に加算するものである。ただし、初回加算を算定する場合は、当該加算は算定できない。なお、障害児及びその家族に関する必要な情報とは、第四の７の(１)の入院時情報連携加算において具体的に掲げた内容に加え、入院、入所等の期間中の障害児に係る心身の状況の変化並びに退院、退所に当たって特に配慮等すべき事項の有無及びその内容をいう。"},{"s":"ji","p":101,"h":"第四の8 退院・退所加算の取扱いについて","t":"(２) 算定に当たっての留意事項退院・退所加算については、入院、入所等の期間中に実施した情報収集又は調整等に関して、当該利用者のサービス等利用計画の作成に係るサービス利用支援費の算定に併せて当該入院、入所の開始から退院、退所までの間において３回分を限度に加算を算定できるものであること。(３) 手続退院、退所する施設の職員と面談を行い情報の提供を受けた場合には、相手や面談日時、その内容の要旨及び障害児支援利用計画に反映されるべき内容に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければならない。"},{"s":"ji","p":101,"h":"第四の9 保育・教育等移行支援加算の取扱いについて","t":"９保育・教育等移行支援加算の取扱いについて(１) 趣旨当該加算は、これまで障害福祉サービス等を利用していた利用者が、就学、進学する場合又は通常の事業所に新たに雇用される場合であって、保育所、小学校、特別支援学校、雇用先の事業所又は障害者就業・生活支援センター等（以下９において「関係機関」という。）へ引継ぐ場合において、一定期間を要するものに対し、当該利用者を担当している相談支援専門員が、以下に掲げる業務を行った場合に所定単位数を加算するものである。"},{"s":"ji","p":102,"h":"第四の9 保育・教育等移行支援加算の取扱いについて","t":"①関係機関への情報提供関係機関に対して障害児に関する必要な情報を提供し、関係機関における障害児の支援内容の検討に協力する場合②障害児等への訪問による面接障害児が保育所等に通い、又は通常の事業所に新たに雇用されるに当たり、月２回以上、障害児等に面接する場合③関係機関が開催する会議への参加障害児が保育所等に通い、又は通常の事業所に新たに雇用され、関係機関による支援を受けるに当たり、関係者が開催する会議に参加する場合(２) 算定に当たっての留意事項①関係機関への情報提供障害児相談支援報酬告示７の保育・教育等移行支援加算の注中(１)の「必要な情報の提供」は文書（この目的のために作成した文書に限る）によるものをいう。障害児相談支援報酬告示７の保育・教育等移行支援加算の注中(１)の「支援内容の検討に協力する場合」とは、具体的には、関係機関の職員等が実施するアセスメントに同行することや、当該障害児に関する直近の障害児支援利用計画やモニタリング果等等を情報提供した上で、障害児の心身の状況、生活環境及びサービスの利用状況等を保育所等の職員等に対して説明を行った場合等をいう。"},{"s":"ji","p":102,"h":"第四の9 保育・教育等移行支援加算の取扱いについて","t":"②障害児等への訪問による面接同注中(２)の「面接」については、テレビ電話装置等を活用して面接した場合を含む。ただし、月に１回は障害児の居宅を訪問し、面接することを要するものである。この場合においても、障害児等に対して面接方法に係る意向を確認するとともに、居宅を訪問して面接することを希望する場合は、居宅を訪問して面接するよう努めること。③関係機関が開催する会議への参加会議への参加については、テレビ電話装置等を活用して行うことができる。④加算の算定方法当該加算は、(１)の①から③までに該当する場合、障害福祉サービス等を利用している期間においては、１月につき同注中(１)から(３)までのそれぞれに定める単位数（それぞれ２回を限度とする）を合算した単位数を加算し、障害福祉サービス等の利用を終了した日から起算して６月以内においては、１月につきそれぞれに定める単位数を合算した単位数を加算する。"},{"s":"ji","p":102,"h":"第四の9 保育・教育等移行支援加算の取扱いについて","t":"例えば、障害児相談支援対象保護者が小学校等に就学するにあたり、１月に居宅を２回以上訪問し、障害児等に面接をし、かつ、小学校等が開催する会議に参加する場合は、それぞれ所定単位を算定できる。ただし、複数の関係機関が開催する会議が同一日に連続して一体的に開催される場合、算定回数は１回とする。また、当該加算は、障害児が保育所等に通う場合、通常の事業所等に新たに雇用された場合に算定できるものである。"},{"s":"ji","p":103,"h":"第四の9 保育・教育等移行支援加算の取扱いについて","t":"ただし、指定障害児支援利用援助費、指定継続障害児支援利用援助費、入院時情報連携加算又は退院・退所加算を算定している月は、当該加算は算定できない（同注中(１)については、指定障害児支援利用援助費又は指定継続障害児支援利用援助費を算定している月でも算定可能である）。(３) 手続①障害児相談支援報酬告示７の保育・教育等移行支援加算の注中(１)を算定する場合は第４の７の(３)の規定を準用する。②同注中(２)を算定する場合は、面談日時、その内容の要旨に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければならない。③同注中(３)を算定する場合は、会議の出席者や開催日時、検討した内容の要旨及びそれを踏まえた対応方針に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければならない。"},{"s":"ji","p":103,"h":"第四の10 医療・保育・教育機関等連携加算の取扱いについて","t":"10 医療・保育・教育機関等連携加算の取扱いについて(１) 趣旨当該加算は、障害児が利用する病院等、訪問看護事業所、保育所、幼稚園、小学校、特別支援学校等の関係機関との日常的な連携体制を構築するとともに、障害児の状態や支援方法の共有を行うことを目的とするものであるから、当該加算の算定場面に限らず、関係機関との日常的な連絡調整に努めること。当該加算の算定が可能な場合は次のとおりである。①福祉サービス等提供機関の職員との面談等福祉サービス等提供機関（障害児通所支援事業者及び障害福祉サービス等事業者を除く。以下10において同じ。）の職員との面談又は会議により、障害児に関する必要な情報の提供を受けた上で指定障害児支援利用援助又は指定継続障害児支援利用援助を行った場合②障害児への通院同行障害児が病院等に通院するに当たり、病院等を訪問し、当該病院等の職員に対して利用者に係る必要な情報を提供した場合③福祉サービス等提供機関への情報提供福祉サービス等提供機関からの求めに応じて障害児に関する必要な情報を提供した場合(２) 算定に当たっての留意事項①連携の対象機関指定障害児相談支援の実施に当たっては、障害児相談支援基準上、障害児通所支援等事業者と連携することが求められているところ、障害児通所支援等事業者以外の福祉サービス等提供機関との連携も望ましいとしている。当該加算は、医療・保育・教育機関をはじめとする各福祉サービス等提供機関との連携をさらに促進することを目的とするものであることから、連携の対象機関については、障害児通所支援等事業者以外の福祉サービス等提供機関と規定しているものである。具体的には、病院等、訪問看護事業所、児童相談所、企業、保育所、幼稚園、小学校、特別支援学校等が対象となる。"},{"s":"ji","p":103,"h":"第四の10 医療・保育・教育機関等連携加算の取扱いについて","t":"②福祉サービス等提供機関の職員との面談等"},{"s":"ji","p":104,"h":"第四の10 医療・保育・教育機関等連携加算の取扱いについて","t":"福祉サービス等提供機関の職員との会議については、テレビ電話装置等を活用して行うことができるものである。また、様々な専門的見地からの意見等を踏まえて障害児支援利用計画を作成するため、サービス担当者会議には障害児通所支援等の担当者のみならず必要な本人の生活に関係する者や支援関係者が参加するように努めることとしていることから、サービス担当者会議において福祉サービス等提供機関の職員から必要な情報の提供を受ける場合も、医療・保育・教育機関等連携加算の算定が可能である。なおこの場合において、サービス担当者会議実施加算の算定はできない。なお、当該加算は、初回加算を算定する場合又は退院・退所加算を算定し、かつ、退院又は退所する施設の職員のみから情報の提供を受けている場合は算定することができないものであること。③利用者への通院同行当該加算は、単に障害児の病院等への通院に同行することを評価するものではなく、通院に同行した上で、病院等の職員等に対して、当該障害児の基本情報、障害児の状態、支援における留意点等、家族・世帯の状況、生活の状況、受診・服薬の状況、サービスの利用状況及び障害児支援利用計画の内容等の必要な情報を提供し、連携の強化を図ることを趣旨とするものである。そのため、例えば、障害児の状態に変化があった場合又は障害児の法療や療養上病院等と在宅生活の支援に係る関係機関等が連携する必要がある場合並びに利用するサービス及び障害児支援利用計画に変更があった場合等に算定することを想定している。"},{"s":"ji","p":104,"h":"第四の10 医療・保育・教育機関等連携加算の取扱いについて","t":"なお、情報提供に当たっては、入院時情報提供書等を参考にした上で行うこと。④福祉サービス等提供機関への情報提供次の区分ごとにそれぞれ 1 月に 1 回を限度に算定するものとしている。(一) 病院等、訪問看護事業所(二) (一)以外の福祉サービス等提供機関なお、(一)に掲げる機関への情報提供に当たっては、入院時情報提供書等を参考にした上で行うこと。また、病院等への情報提供と同じ月において、同病院等に対して通院同行により情報提供している場合、重複して算定することはできないが、異なる病院等に対して情報提供を行う場合はそれぞれで算定することが可能である。⑤加算の算定方法当該加算は、(１)の②から④までに該当する場合、1 月につきそれぞれに定める単位数を合算した単位数を加算する。例えば、福祉サービス等提供機関の職員と面談し、かつ、利用者への通院同行する場合は、それぞれ所定単位数を算定できる。"},{"s":"ji","p":104,"h":"第四の10 医療・保育・教育機関等連携加算の取扱いについて","t":"(３) 手続第四の８の(３)の規定を準用する。"},{"s":"ji","p":104,"h":"第四の11 集中支援加算について","t":"11 集中支援加算について(１) 趣旨"},{"s":"ji","p":105,"h":"第四の11 集中支援加算について","t":"当該加算は計画決定月及びモニタリング対象月以外において、以下に掲げるいずれかの業務を行ったものである。なお、当該加算は、定期的なモニタリングの場面以外で支援の必要が生じた場合において、緊急的、臨時的に対応したことを評価するものであるため、頻回に算定が必要となる利用者については、モニタリング期間を改めて検証する必要があることに留意すること。①障害児等への訪問による面接障害児等又は市町村等の求めに応じ、月２回以上、障害児等に面接する場合②サービス担当者会議の開催サービス担当者会議を開催し、障害児支援利用計画の変更等について検討を行う場合③関係機関が開催する会議への参加福祉サービス等提供機関が開催する会議に参加し、関係機関相互の連絡調整を行った場合④障害児への通院同行障害児が病院等に通院するに当たり、病院等を訪問し、当該病院等の職員に対して障害児に係る必要な情報を提供した場合⑤福祉サービス等提供機関への情報提供福祉サービス等提供機関からの求めに応じて障害児に関する必要な情報を提供した場合(２) 算定にあたっての留意事項①連携の対象機関(１)のとおり、当該加算は、定期的なモニタリングの場面以外で支援の必要が生じた場合において、緊急的、臨時的に対応したことを評価するものであるため、連携の対象機関については、障害児支援利用計画に位置付けられている又は位置付けられることが見込まれる福祉サービス等提供機関であり、具体的には、障害福祉サービス事業者、一般相談支援事業者、障害児通所支援事業者、障害児入所施設、指定発達支援医療機関、病院等、企業、地方治法体等をいう。"},{"s":"ji","p":105,"h":"第四の11 集中支援加算について","t":"②障害児等への訪問による面接障害児相談支援報酬告示９の集中支援加算の注中(１)の「障害児相談支援対象保護者又は市町村等」とは、障害児等、市町村、福祉サービス等の事業を行う者等をいう。「面接」については、第四の９の(２)の②の規定を準用する。③サービス担当者会議の開催サービス担当者会議の開催に当たっては、障害児等も出席し、利用するサービスに対する意向等を確認しなければならない。④関係機関が開催する会議への参加福祉サービス等を提供する機関等からの求めに応じた会議参加については、保育・教育等移行支援加算における会議参加と会議の趣旨、つなぎ先等が同様で、保育・教育等移行支援加算を算定する場合、本加算は算定できないことに留意すること。また、入院時情報連携加算（Ⅰ）又は退院・退所加算を算定している場合においても当該加算は算定できない。"},{"s":"ji","p":105,"h":"第四の11 集中支援加算について","t":"⑤利用者への通院同行"},{"s":"ji","p":106,"h":"第四の11 集中支援加算について","t":"第四の 10 の(２)の③の規定を準用する。⑥福祉サービス等提供機関への情報提供第四の 10 の(２)の④の規定を準用する。⑦加算の算定方法当該加算は、(１)の①から⑤までに該当する場合、１月につきそれぞれに定める単位数を合算した単位数を加算する。例えば、１月に２回以上障害児等に面接し、かつ、障害児への通院同行を行う場合は、それぞれ所定単位数を算定できる。なお、②から⑥のいずれの場合も、指定障害児支援利用援助費又は指定継続障害児支援利用援助費を算定している場合は、当該加算は算定できない。(３) 手続①障害児相談支援報酬告示９の集中支援加算の注中(１)を算定する場合は、第四の９の(３)の②の規定を準用する。②同注中(２)を算定する場合は、サービス担当者会議の出席者や開催日時、検討した内容の要旨及びそれを踏まえた対応方針に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければならない。"},{"s":"ji","p":106,"h":"第四の11 集中支援加算について","t":"③同注中(３)を算定する場合は、第四の９の(３)の③の規定を準用する。"},{"s":"ji","p":106,"h":"第四の12 サービス担当者会議実施加算の取扱いについて","t":"12 サービス担当者会議実施加算の取扱いについて(１) 趣旨継続障害児支援利用援助の実施時において、障害児の居宅等を訪問し障害児等に面接することに加えて、障害児支援利用計画に位置付けた福祉サービス等の担当者を招集してサービス担当者会議を開催し、相談支援専門員が把握した障害児支援利用計画の実施状況（障害児相談支援対象保護者についての継続的な評価を含む。）について説明を行うとともに、担当者から専門的な見地からの意見を求め、障害児支援利用計画の変更その他必要な便宜の提供について検討を行った場合に加算するものである。(２) 算定に当たっての留意事項サービス担当者会議の開催に係る取扱いについては、障害児相談支援基準第15条第２項第10号に規定するとおりとする。サービス担当者会議において検討した果等、障害児支援利用計画の変更を行った場合は、障害児支援利用援助費を算定することとなるため、当該加算は算定できないものであること。"},{"s":"ji","p":106,"h":"第四の12 サービス担当者会議実施加算の取扱いについて","t":"また、障害児相談支援報酬告示８の医療・保育・教育機関等連携加算の注中(１)を算定する場合も、同加算においてサービス担当者会議の開催等に係る業務を評価していることから、当該加算は算定できない。(３) 手続第四の11の(３)の②の規定を準用する。"},{"s":"ji","p":106,"h":"第四の13 サービス提供時モニタリング加算の取扱いについて","t":"13 サービス提供時モニタリング加算の取扱いについて(１) 趣旨"},{"s":"ji","p":107,"h":"第四の13 サービス提供時モニタリング加算の取扱いについて","t":"継続障害児支援利用援助の実施時又はそれ以外の機会において、障害児支援利用計画に位置付けた障害児通所支援を提供する事業所又は当該障害児通所支援の提供場所を訪問し、支援の提供場面を直接確認することにより、支援の提供状況について詳細に把握し、確認果等の記録を作成した場合に加算するものである。なお、支援提供時のモニタリングを実施するに当たっては次のような事項を確認し、記録するものとする。①障害児通所支援の事業所等における支援の提供状況②支援提供時の障害児の状況③その他必要な事項(２) 算定に当たっての留意事項１人の相談支援専門員が１月に請求できる当該加算の件数は39件（相談支援員の場合は19件）を限度とし、当該障害児が利用する障害児通所支援事業所等の業務と兼務している場合であって、かつ当該事業所における支援提供場面のみを確認した場合は、加算は算定できないものであること。"},{"s":"ji","p":107,"h":"第四の13 サービス提供時モニタリング加算の取扱いについて","t":"障害児通所支援の提供場所等が特別地域に所在する場合であって、指定障害児相談支援事業所との間に一定の距離がある場合は、訪問に代えてテレビ電話装置等を活用して支援提供場面を確認することも可能である。なお、一定の距離については、障害児通所支援の提供場所等への訪問に片道概ね１時間を要する距離とする。また、当該時間については、交通機関の運行頻度が少ない等により、合理的経路かつ最短時間となる移動方法を選択した場合の待機時間も含むものであること。(３) 手続(１)における記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければならない。"},{"s":"ji","p":107,"h":"第四の14 行動障害支援体制加算の取扱いについて","t":"14 行動障害支援体制加算の取扱いについて(１) 趣旨当該加算の対象となる事業所は、行動障害のある障害児に対して適切な障害児相談支援を実施するために、各都道府県が実施する強度行動障害支援者養成研修（実践研修）又は行動援護従業者養成研修を修了した常勤の相談支援専門員を１名以上配置し、行動障害のある障害児への支援を現に実施している又は行動障害のある障害児について適切に対応できる体制が整備されていることが必要となる。なお、強度行動障害を有する障害児の保護者から利用申込みがあった場合に、障害特性に対応できないことを理由にサービスの提供を拒むことは認めないものとすることに留意すること。(２) 算定に当たっての留意事項①共通事項当該加算は行動障害のある障害児に対して適切な障害児相談支援を実施するための体制を整備することを評価するものであることから、強度行動障害を有する障害児のみならず、当該"},{"s":"ji","p":108,"h":"第四の14 行動障害支援体制加算の取扱いについて","t":"指定障害児相談支援事業所における全ての障害児の保護者に対して指定障害児支援利用援助又は指定継続障害児支援利用援助を実施する場合に加算することができるものである。②行動障害支援体制加算（Ⅰ）当該区分は、研修を修了した相談支援専門員を 1 名以上配置し、その旨を公表している場合であって、かつ、(一)に規定する障害児に対して(二)に規定する支援を行っている場合に算定するものである。(一) 対象となる障害児当該区分は、支援対象者の要件を児基準の合計点数が20点以上である者（以下「強度行動障害を有する児」という。）としている。そのため、障害児が強度行動障害を有するかについて、一定期間毎に確認すること。なお、当該確認にあたって、受給者証の記載（加算対象等）により確認が可能な場合は、これによって確認することも考えられる。(二) 対象者への支援当該区分は、研修を修了した相談支援専門員により、強度行動障害を有する児に対して現に指定障害児相談支援を行っていることを要件としているが、「現に指定障害児相談支援を行っている」とは、前６月に、強度行動障害を有する児に対して指定障害児相談支援を行っていることとする。そのため、強度行動障害を有する児に対する指定障害児相談支援の実施状況について管理しておくこと。"},{"s":"ji","p":108,"h":"第四の14 行動障害支援体制加算の取扱いについて","t":"なお、研修を修了した相談支援専門員が同一敷地内に所在する指定特定相談支援事業所の職務を兼務する場合であって、強度行動障害を有する者（障害支援区分３以上に該当しており、かつ、行動関連項目の合計点数が10点以上である者）又は強度行動障害を有する児に対して指定計画相談支援を行っている場合も当該区分に該当するものである。③行動障害支援体制加算（Ⅱ）当該区分は、研修を修了した相談支援専門員を１名以上配置し、その旨を公表している場合に算定するものである。(３) 手続当該加算を算定する場合は、研修を修了した相談支援専門員を配置している旨を市町村へ届け出るとともに、体制が整備されている旨を事業所に掲示するとともに公表する必要があること。"},{"s":"ji","p":108,"h":"第四の15 要医療児者支援体制加算の取扱いについて","t":"15 要医療児者支援体制加算の取扱いについて(１) 趣旨当該加算の対象となる事業所は、人工呼吸器を装着している障害児その他の日常生活を営むために医療を要する状態にある障害児（以下「医療的ケア児等」という。）に対して適切な障害児相談支援を実施するために、医療的ケア児等の障害特性及びこれに応じた支援技法等に関する研修を修了した常勤の相談支援専門員を１名以上配置し、医療的ケア児等への支援を現に実施している又は医療的ケア児等について適切に対応できる体制が整備されていることが必要となる。"},{"s":"ji","p":109,"h":"第四の15 要医療児者支援体制加算の取扱いについて","t":"ここでいう「医療的ケア児等の障害特性及びこれに応じた支援技法等に関する研修」とは、医療的ケア児等総合支援事業により行われる医療的ケア児等コーディネーター養成研修その他これに準ずるものとして都道府県知事が認める研修をいう。なお、医療的ケアが必要な障害児の保護者から利用申込みがあった場合に、利用者の障害特性に対応できないことを理由にサービスの提供を拒むことは認めないものとすることに留意すること。(２) 算定に当たっての留意事項①共通事項第四の 14 の(２)の①と同趣旨であり、適宜「医療的ケア児等」と読み替えること。②要医療児者支援体制加算（Ⅰ）当該区分は、研修を修了した相談支援専門員を 1 名以上配置し、その旨を公表している場合であって、かつ、(一)に規定する障害児に対して(二)に規定する支援を行っている場合に算定するものである。"},{"s":"ji","p":109,"h":"第四の15 要医療児者支援体制加算の取扱いについて","t":"(一) 対象となる障害児当該区分は、支援対象者の要件を医療的ケアスコア表の項目の欄に掲げるいずれかの医療行為を必要とする状態である児童（以下「対象医療的ケア児」という。）としている。そのため、障害児が対象医療的ケア児に該当するかについて、一定期間毎に確認すること。なお、当該確認にあたって、受給者証の記載（加算対象等）により確認が可能な場合は、これによって確認することも考えられる。(二) 対象者への支援当該区分は、研修を修了した相談支援専門員により、対象医療的ケア児に対して現に指定障害児相談支援を行っていることを要件としているが、「現に指定障害児相談支援を行っている」とは、前６月に、対象医療的ケア児に対して指定障害児相談支援を行っていることとする。そのため、対象医療的ケア児に対する指定障害児相談支援の実施状況について管理しておくこと。"},{"s":"ji","p":109,"h":"第四の15 要医療児者支援体制加算の取扱いについて","t":"なお、研修を修了した相談支援専門員が同一敷地内に所在する指定特定相談支援事業所の職務を兼務する場合であって、医療的ケアスコア表の項目の欄に掲げるいずれかの医療行為を必要とする状態である者に対して指定特定相談支援を行っている場合も当該区分に該当するものである。③要医療児者支援体制加算（Ⅱ）当該区分は、研修を修了した相談支援専門員を 1 名以上配置し、その旨を公表している場合に算定するものである。(３) 手続第四の14の(３)の規定を準用する。"},{"s":"ji","p":109,"h":"第四の16 精神障害者支援体制加算の取扱いについて","t":"16 精神障害者支援体制加算の取扱いについて(１) 趣旨当該加算の対象となる事業所は、精神科病院等に入院する障害児及び地域において生活等をする精神障害のある障害児に対して、適切な障害児相談支援を実施するために、精神障害"},{"s":"ji","p":110,"h":"第四の16 精神障害者支援体制加算の取扱いについて","t":"者等の障害特性及びこれに応じた支援技法等に関する研修を修了した常勤の相談支援専門員を１名以上配置し、精神に障害を有する児童への支援を現に実施しており、かつ、障害児が通院する病院等若しくは障害児が利用する訪問看護事業所における保健師、看護師若しくは精神保健福祉士等と必要な連携をとっている又は精神に障害を有する児童について適切に対応できる体制が整備されていることが必要となるものである。ここでいう「精神障害者の障害特性及びこれに応じた支援技法等に関する研修」とは、地域生活支援事業通知の別紙1地域生活支援事業実施要綱別記1―17に定める精神障害関係従事者養成研修事業若しくは精神障害者支援の障害特性と支援技法を学ぶ研修事業又は同通知の別紙２地域生活支援促進事業実施要綱別記2―18に定める精神障害にも対応した地域包括ケアシステムの構築推進事業において行われる精神障害者の地域移行関係職員に対する研修事業により行われる研修その他これに準ずるものとして都道府県知事が認める研修をいう。"},{"s":"ji","p":110,"h":"第四の16 精神障害者支援体制加算の取扱いについて","t":"なお、精神に障害を有する児童の保護者から利用申込があった場合に、障害特性に対応できないことを理由にサービスの提供を拒むことは認めないものとすることに留意すること。(２) 算定に当たっての留意事項①共通事項第四の 14 の(２)の①と同趣旨であり、適宜「精神に障害を有する児童」と読み替えること。②精神障害者支援体制加算（Ⅰ）当該区分は、研修を修了した相談支援専門員を 1 名以上配置し、その旨を公表している場合であって、かつ、(一)に規定する障害児に対して(二)に規定する支援を行っており、(三)に規定する連携体制が構築されている場合に算定するものである。(一) 対象となる障害児当該区分は、支援対象者の要件を児童福祉法第４条第２項に規定する精神に障害のある児童（以下「精神に障害のある児童」という。）としている。そのため、障害児が精神に障害のある児童に該当するかについて、一定期間毎に確認すること。なお、当該確認に当たっては、精神障害者保健福祉手帳、治立支援医療（精神通院医療）の受給者証、診断書、医療機関からの診療情報提供書等によって確認することが考えられる。"},{"s":"ji","p":110,"h":"第四の16 精神障害者支援体制加算の取扱いについて","t":"(二) 対象者への支援当該区分は、研修を修了した相談支援専門員により、精神に障害のある児童に対して現に指定障害児相談支援を行っていることを要件としているが、「現に指定障害児相談支援を行っている」とは、前６月に、精神に障害のある児童の保護者に対して指定障害児相談支援を行っていることとする。そのため、精神に障害のある児童に対する指定障害児相談支援の実施状況について管理しておくこと。なお、研修を修了した相談支援専門員が同一敷地内に所在する指定特定相談支援事業所の職務を兼務する場合であって、障害者総合支援法第４条第１項に規定する精神障害者に対して指定特定相談支援を行っている場合も当該区分に該当するものである。(三) 病院等における保健師、看護師又は精神保健福祉士との連携体制"},{"s":"ji","p":111,"h":"第四の16 精神障害者支援体制加算の取扱いについて","t":"当該区分は、精神疾患を有する患者であって重点的な支援を要するものに対して支援を行う病院等又は訪問看護事業所であって、障害児が通院又は利用するものの保健師、看護師又は精神保健福祉士と連携する体制が構築されていることを要件としている。保健師、看護師又は精神保健福祉士と連携する体制が構築されていることとは、少なくとも１年に１回以上、研修を修了した相談支援専門員と保健師、看護師又は精神保健福祉士との間で面談又は会議を行い、精神に障害のある児童に対する支援に関して検討を行っていることとする。また、精神疾患を有する患者であって重点的な支援を要するものに対して支援を行う病院等又は訪問看護事業所とは、療養生活継続支援加算を算定している病院等又は精神科重症患者支援管理連携加算の届出をしている訪問看護事業所をいうものであり、障害児が通院又は利用するとは、障害児が前 1 年以内に通院又は利用していることとする。"},{"s":"ji","p":111,"h":"第四の16 精神障害者支援体制加算の取扱いについて","t":"③精神障害者支援体制加算（Ⅱ）当該区分は、研修を修了した相談支援専門員を１名以上配置し、その旨を公表している場合に算定するものである。(３) 手続第四の14の(３)の規定を準用する。"},{"s":"ji","p":111,"h":"第四の17 高次脳機能障害支援体制加算の取扱いについて","t":"17 高次脳機能障害支援体制加算の取扱いについて(１) 趣旨当該加算の対象となる事業所は、脳の器質的病変の原因となる事故による受傷や疾病の発症の事実が確認され、かつ、日常生活又は社会生活に制約があり、その主たる原因が記憶障害、注意障害、遂行機能障害、社会的行動障害等の認知障害である者(以下「高次脳機能障害者」という。）であって満18歳に満たないもの（以下「高次脳機能障害児」という。）に対して適切な障害児相談支援を実施するために、高次脳機能障害支援者養成に関する研修を修了した常勤の相談支援専門員を１名以上配置し、高次脳機能障害児への支援を現に実施している又は高次脳機能障害児について適切に対応できる体制が整備されていることが必要となる。ここでいう「高次脳機能障害支援者養成に関する研修」とは、地域生活支援事業通知の別紙1地域生活支援事業実施要綱別記1-12に定める「高次脳機能障害及びその関連障害に対する支援普及事業」として行われる高次脳機能障害支援者養成に関する研修（基礎研修及び実践研修）又はこれに準ずるものとして、同研修におけるカリキュラムで示された研修内容と同等以上のものとして都道府県知事が認める研修をいう。"},{"s":"ji","p":111,"h":"第四の17 高次脳機能障害支援体制加算の取扱いについて","t":"なお、高次脳機能障害児の保護者から利用申込みがあった場合に、障害特性に対応できないことを理由にサービスの提供を拒むことは認めないものとすることに留意すること。(２) 算定に当たっての留意事項①共通事項第四の 14 の(２)の①と同趣旨であり、適宜「高次脳機能障害児」と読み替えること。②高次脳機能障害支援体制加算（Ⅰ）"},{"s":"ji","p":112,"h":"第四の17 高次脳機能障害支援体制加算の取扱いについて","t":"当該区分は、研修を修了した相談支援専門員を 1 名以上配置し、その旨を公表している場合であって、かつ、(一)に規定する障害児に対して(二)に規定する支援を行っている場合に算定するものである。(一) 対象となる障害児当該区分は、支援対象者の要件を高次脳機能障害児としている。そのため、障害児が高次脳機能障害児に該当するかについて、一定期間毎に確認すること。また、当該確認に当たっては、以下のいずれかの書類において高次脳機能障害の診断の記載があることを確認する方法によること。ア障害児通所支援等の支給決定における医師の意見書イ精神障害者保健福祉手帳の申請における医師の診断書ウその他医師の診断書等（原則として主法医が記載したものであること。）(二) 対象者への支援当該区分は、研修を修了した相談支援専門員により、高次脳機能障害児の保護者に対して現に指定障害児相談支援を行っていることを要件としているが、「現に指定障害児相談支援を行っている」とは、前６月に、高次脳機能障害児に対して指定障害児相談支援を行っていることとする。そのため、高次脳機能障害児の保護者に対する指定障害児相談支援の実施状況について管理しておくこと。"},{"s":"ji","p":112,"h":"第四の17 高次脳機能障害支援体制加算の取扱いについて","t":"なお、研修を修了した相談支援専門員が同一敷地内に所在する指定障害児相談支援事業所の職務を兼務する場合であって、高次脳機能障害者に対して指定特定相談支援を行っている場合も当該区分に該当するものである。③高次脳機能障害支援体制加算（Ⅱ）当該区分は、研修を修了した相談支援専門員を 1 名以上配置し、その旨を公表している場合に算定するものである。(３) 手続第四の14の(３)の規定を準用する。"},{"s":"ji","p":112,"h":"第四の18 ピアサポート体制加算の取扱いについて","t":"18 ピアサポート体制加算の取扱いについて障害児相談支援報酬告示第15のピアサポート体制加算については、都道府県又は指定都市が実施する障害者ピアサポート研修の基礎研修及び専門研修を修了した次の者をそれぞれ常勤換算方法で0.5以上配置する事業所であって、当該者によりその他の従業者に対して障害者に対する配慮等に関する研修が年１回以上行われている場合に算定することができる。ア障害者又は障害者であったと市町村が認める者（以下この16において「障害者等」という。）であって、相談支援専門員、相談支援員その他指定障害児相談支援に従事する者イ管理者、相談支援専門員、相談支援員その他指定障害児相談支援に従事する者なお、上記の常勤換算方法の算定に当たっては、併設する事業所（指定治立生活援助事業所、指定地域移行支援事業所、指定地域定着支援事業所又は指定計画相談支援事業所に限る。）の職員を兼務する場合は当該兼務先を含む業務時間の合計が常勤換算方法で0.5以上になる場合を含むものとする。"},{"s":"ji","p":112,"h":"第四の18 ピアサポート体制加算の取扱いについて","t":"(１) 算定に当たっての留意事項"},{"s":"ji","p":113,"h":"第四の18 ピアサポート体制加算の取扱いについて","t":"ア研修の要件「障害者ピアサポート研修」とは、地域生活支援事業通知の別紙1地域生活支援事業実施要綱別記1―17に定める障害者ピアサポート研修事業として行われる基礎研修及び専門研修をいう。イ障害者等の確認方法当該加算の算定要件となる研修の課程を修了した「障害者等」については、以下の書類又は確認方法により確認するものとする。（ｱ）身体障害者身体障害者手帳（ｲ）知的障害者①療育手帳②療育手帳を有しない場合は、市町村が必要に応じて知的障害者更生相談所に意見を求めて確認する。（ｳ）精神障害者以下のいずれかの証書類により確認する（これらに限定されるものではない。）。①精神障害者保健福祉手帳②精神障害を事由とする公的年金を現に受けていること又は受けていたことを証明する書類（国民年金、厚生年金などの年金証書等）"},{"s":"ji","p":113,"h":"第四の18 ピアサポート体制加算の取扱いについて","t":"③精神障害を事由とする特別障害給付金を現に受けている又は受けていたことを証明する書類④治立支援医療受給者証（精神通院医療に限る。）⑤医師の診断書（原則として主法医が記載し、国際疾病分類ＩＣＤ―10コードを記載するなど精神障害者であることが確認できる内容であること）等（ｴ）難病等対象者医師の診断書、特定医療費（指定難病）受給者証、指定難病に罹患していることが記載されている難病医療費助成の却下通知等（ｵ）その他市町村が認める書類又は確認方法(２) 手続当該加算を算定する場合は、研修を修了した従業者を配置している旨を市町村へ届け出るとともに、体制が整備されている旨を事業所に掲示するとともに公表する必要があること。なお、ピアサポーター等の本人の氏名の公表を求めるものではなく、加算の算定要件を満たすピアサポーター等を配置している事業所である旨を公表することを求める趣旨であること。また、当該旨の公表に当たっては、あらかじめピアサポーターである障害者等の本人に対し、公表の趣旨（※）を障害特性に配慮しつつ丁寧に説明を行った上で、同意を得ることが必要である。"},{"s":"ji","p":113,"h":"第四の18 ピアサポート体制加算の取扱いについて","t":"※ピアサポートによる支援を希望する者に対し、事業所の選択の重要な情報として知ってもらうために公表するものである。"},{"s":"ji","p":113,"h":"第四の19 地域生活支援拠点等相談強化加算の取扱いについて","t":"19 地域生活支援拠点等相談強化加算の取扱いについて"},{"s":"ji","p":114,"h":"第四の19 地域生活支援拠点等相談強化加算の取扱いについて","t":"(１) 趣旨当該加算は、地域生活支援拠点等の必要な相談機能として、地域の生活で生じる障害児等やその家族の緊急事態において、迅速・確実な相談支援の実施及び短期入所等の活用により、地域における生活の安心感を担保することを目的とするものであり、この加算の対象となる事業所については、地域生活支援拠点等であることを十分に踏まえ、当該加算の趣旨に合致した適切な運用を図られるよう留意されたい。(２) 算定に当たっての留意事項当該加算は、障害の特性に起因して生じた緊急の事態その他の緊急に支援が必要な事態が生じた障害児の保護者からの要請に基づき、速やかに指定短期入所事業者に対して当該要支援者に関する必要な情報の提供及び当該指定短期入所の利用に関する調整（以下「連絡・調整」という。）を行った場合に障害児相談支援対象保護者１人につき１月に４回を限度として加算するものである。"},{"s":"ji","p":114,"h":"第四の19 地域生活支援拠点等相談強化加算の取扱いについて","t":"また、当該加算は、他の指定障害児相談支援事業所において指定障害児相談支援を行っている障害児等やその家族からの要請に基づき連絡・調整を行った場合は算定できない。ただし、当該障害児が指定短期入所を含む障害福祉サービス及び障害児通所支援を利用していない場合においては、当該指定障害児相談支援事業所により障害児支援利用計画の作成を行った場合は、当該計画作成に係る障害児支援利用援助費の算定に併せて算定できるものであること。(３) 手続当該加算の対象となる連絡・調整を行った場合は、要請のあった時間、要請の内容、連絡・調整を行った時刻及び地域生活支援拠点等相談強化加算の算定対象である旨を記録するものとする。なお、作成した記録は５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければならない。"},{"s":"ji","p":114,"h":"第四の20 地域体制強化共同支援加算の取扱いについて","t":"20 地域体制強化共同支援加算の取扱いについて(１) 趣旨当該加算は、指定障害児相談支援事業所が把握した障害児の個別の課題から地域の課題を抽出し、協議会に参画した上で、地域の様々なニーズに対応出来うるサービス提供体制の確保や、地域の社会資源の連携体制の構築に向けた検討を推進することを目的とするものであることから、そのことを十分に踏まえ、当該加算の趣旨に合致した適切な運用を図られるよう留意されたい。(２) 算定に当たっての留意事項当該加算は、支援が困難な障害児に対して、当該指定障害児相談支援事業所の相談支援専門員又は相談支援員と福祉サービスを提供する事業者の職員等（以下「支援関係者」という。）が、会議により情報共有及び支援内容を検討し、在宅での療養又は地域において生活する上で必要となる説明等の必要な支援を共同して実施するとともに、地域課題を整理し、協議会に報告を行った場合に加算するものである。"},{"s":"ji","p":114,"h":"第四の20 地域体制強化共同支援加算の取扱いについて","t":"当該加算の対象となる事業所については、以下のいずれかとする。なお、第四の１の(２)の③の(一)のイの(ｲ)のbの⒝の規定を準用する。"},{"s":"ji","p":115,"h":"第四の20 地域体制強化共同支援加算の取扱いについて","t":"①運営規程において、地域生活支援拠点等であることを市町村により位置付けられていることを定めていること。②拠点関係機関との連携体制を確保するとともに、協議会に定期的に参画していること。なお、令和８年度末までの間、市町村が地域生活支援拠点等を整備していない場合は、第四の１の(２)の③の(六)のイの(ｱ)の規定を準用する。また、当該加算で協議会へ報告する事例として想定しているものとしては、利用者の支援に当たり、広く地域の関係者間で検討する必要性がある課題があるものであるため、事例の選定に当たってはその点に留意すること。なお、当該加算は、支援が困難な利用者に係る支援等を行う指定障害児相談支援事業所のみが算定できるものであるが、当該指定障害児相談支援事業所の支援等に係る業務負担のみを評価するものではなく、その他の支援関係者の業務負担も評価する趣旨のものである。そのため、その他の支援関係者が支援等を行うに当たり要した費用については、当該指定障害児相談支援事業所が負担することが望ましいものであること。"},{"s":"ji","p":115,"h":"第四の20 地域体制強化共同支援加算の取扱いについて","t":"なお、協議会等への報告の内容等詳細については、「（治立支援）協議会の設置・運営ガイドライン」（令和６年３月29日厚生労働省社会・援護局障害保健福祉部障害福祉課地域生活・発達障害者支援室）を参照すること。(３) 手続当該加算の対象となる会議を行った場合及び利用者に対する説明等の必要な支援を行った場合は、その内容を記録するものとする。なお、作成した記録は５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければならない。21 遠隔地訪問加算(１) 趣旨当該加算は、特別地域に所在し、指定障害児相談支援事業所との間に一定の距離がある障害児等の居宅その他機関を訪問して所定の支援等を行う場合、当該訪問に相当な時間及び費用の負担が生じることを踏まえて算定を可能とするものである。(２) 算定に当たっての留意事項①対象となる加算当該加算は、以下に掲げる加算と合わせて算定するものである。"},{"s":"ji","p":115,"h":"第四の20 地域体制強化共同支援加算の取扱いについて","t":"(一) 初回加算第四の５の(３)の要件を満たす場合に限る。(二) 入院時情報連携加算第四の７の(２)の①の要件を満たす場合に限る。(三) 退院・退所加算(四) 保育・教育等移行支援加算第四の９の(１)の②の要件を満たす場合に限る。(五) 医療・保育・教育機関等連携加算第四の10の(１)の①又は②の要件を満たす場合に限る。(六) 集中支援加算"},{"s":"ji","p":116,"h":"第四の20 地域体制強化共同支援加算の取扱いについて","t":"第四の11の(１)の①又は④の要件を満たす場合に限る。②対象区域当該加算の算定対象となる訪問先については、指定障害児相談支援事業所との間に一定の距離がある障害児等の居宅その他機関であるが、一定の距離については、障害児等の居宅その他機関への訪問に概ね片道１時間を要する距離とする。また、当該時間については、交通機関の運行頻度が少ない等により、合理的経路かつ最短時間となる移動方法を選択した場合の待機時間も含むものであること。③加算の算定方法当該加算の算定に当たっては、300単位に①の(一)から(六)までの算定回数の合計を乗じて得た単位数を算定するものとする。ただし、初回加算については、第四の５の(３)に規定する場合に該当する月数（３を限度とする。）を算定回数とする。例えば、当該月数が２の場合、当該加算は300単位に２を乗じて600単位を算定するものとする。"},{"s":"ji","p":116,"h":"第四の22 福祉・介護職員等処遇改善加算の取扱い","t":"22 福祉・介護職員等処遇改善加算の取扱い障害児相談支援報酬告示19の福祉・介護職員等処遇改善加算については、２の(１)の⑯を準用する。"},{"s":"qa","p":1,"h":"No.1（２計画相談支援）計画相談の請求について。更新月の請求は計画案の日付で請求というお話でした。本計画の日付で請求して","t":"問：計画相談の請求について。更新月の請求は計画案の日付で請求というお話でした。本計画の日付で請求してしまったものは過誤請求し、再請求するということでしょうか。答：例えば、４月に計画案を作成し、５月に計画を確定させた場合、本来は４月サービス提供分として請求すべきところ、５月サービス提供分として請求していることがあります。この場合は、原則として、５月サービス提供分として請求した分を過誤申立を行い、４月サービス提供分として再請求してください。"},{"s":"qa","p":2,"h":"No.2（２計画相談支援）計画書について計画案をそのまま引き継いだ場合も計画書に署名が必要でしょうか？その場合、計画案の上","t":"問：計画書について計画案をそのまま引き継いだ場合も計画書に署名が必要でしょうか？その場合、計画案の上部にある本案を確定させた計画案とするにチェックを入れた後、新しい計画書を作成日を変えて作成し署名をいただくということでしょうか？答：計画案の内容を変更することなく、そのまま本計画とする場合であっても、確定させた計画について、利用者等に対して説明し、文書により利用者の同意を得なければなりません。また、確定した計画については、利用者及びサービス提供事業所に交付しなければなりません。一方で、サービス等利用計画案から変更がない場合には、その旨を区役所に電話等により報告することで、区役所へ提出を省略することが可能です。その際は、区役所に連絡した日にちを記録に残してください。なお、計画案上部の「本案を確定させた計画とする」のチェック欄は、区役所の記載欄になります。（業務ガイドラインP37、P57参照）"},{"s":"qa","p":3,"h":"No.3（２計画相談支援）精神障害者支援体制加算について 1の加算を取る場合の対象者あり、とはどう判断すればよいか。対象者の","t":"問：精神障害者支援体制加算について 1の加算を取る場合の対象者あり、とはどう判断すればよいか。対象者の要件を教えてください。また、障害児相談支援において、事業所内に18歳以上の対象者がいるが、障害児相談の対象者にはいない場合は、障害者相談は１を算定できるが、障害児相談は2の対象者なしということになりますでしょうか。答：【計画相談】当該事項の確認に当たっては、精神障害者保健福祉手帳、自立支援医療（精神通院医療）の受給者証、診断書、医療機関からの診療情報提供書等により確認することが考えられます。（業務ガイドラインP128参照）【障害児相談】研修を修了した相談支援専門員が指定特定相談支援事業所と指定障害児相談支援事業所を兼務している場合は、計画相談支援において精神障害者支援体制加算（Ⅰ）の対象となる利用者への支援実績があれば、障害児相談支援の利用者に精神障害児等がいない場合であっても、障害児相談支援においても区分Ⅰの算定が可能です。"},{"s":"qa","p":4,"h":"No.4（２計画相談支援）相談員が病気等で一定の期間休みで、代理の職員も配置できない場合、事業は休止としたほうがいいのでしょ","t":"問：相談員が病気等で一定の期間休みで、代理の職員も配置できない場合、事業は休止としたほうがいいのでしょうか。答：相談支援専門員は、当該事業所の開所時間には必ず１名以上の配置が必要なので、配置できない場合は、休止の手続きをしてください。"},{"s":"qa","p":5,"h":"No.5（２計画相談支援）主任相談員が要件となる役割を担っているかはどのように確認しますか？","t":"問：主任相談員が要件となる役割を担っているかはどのように確認しますか？答：「主任相談支援専門員配置加算の取扱いについて（通知）」をご確認ください。 https://www.city.yokohama.lg.jp/business/bunyabetsu/f ukushi- kaigo/fukushi/service/soudan.files/20240409_syuninkasa"},{"s":"qa","p":6,"h":"No.6（２計画相談支援）代理受領証に記載するサービス内容は、利用支援、モニタリング加算など、具体的に記載する必要があります","t":"問：代理受領証に記載するサービス内容は、利用支援、モニタリング加算など、具体的に記載する必要がありますか。また、記録や報告書の作成に録音やAIの利用は想定されていますか。答：代理受領通知への記載内容について、様式は定めていませんが、①利用者氏名、②指定特定相談支援事業者名、③サービス提供年月、④サービス内容、⑤受領日、⑥代理受領金額については最低限記載が必要です。（業務ガイドラインP40参照）録音やAIの利用については、個人情報保護と記録の正確性確保を前提として活用することが考えられます。"},{"s":"qa","p":7,"h":"No.7（２計画相談支援）計画書や報告書の署名について、電子署名は可とのことでしたが、安全な実施方法を教えていただけたらと思","t":"問：計画書や報告書の署名について、電子署名は可とのことでしたが、安全な実施方法を教えていただけたらと思います。（共有できるフォームがあれば知りたい）（ご相談・お願い）区へ原本提出としておりますが、電子媒体で横浜市がシステム導入いただき、セキュリティ構築の上でペーパーレスで書類やり取りができると、経費削減・負担軽減図れると思われます。ご検討お願い致します。答：計画書や報告書への電子署名については、署名後の改ざん防止が確保できる方法であれば差し支えありません。具体的な方法としては、タブレット等を用いて利用者に直接署名していただく方法が考えられます。電子署名の取得方法について、自治体として特定のサービスやフォームを指定しているものではありませんので、上記の方法をご検討ください。また、利用者等が電子署名による対応を希望しない場合に備え、従来どおりの紙による署名も選択できるようにしておくことが望ましいと考えます。提出方法のシステム導入については、ご意見として承り、今後の施策の参考とさせていただきます。"},{"s":"qa","p":8,"h":"No.8（２計画相談支援）支援体制加算（１）の算定要件について確認させてください。（スライド128）障発第1031001号に","t":"問：支援体制加算（１）の算定要件について確認させてください。（スライド128）障発第1031001号において、「『現に指定計画相談支援を行っている』とは、前6 月に、（対象者）に対して指定計画相談支援を行っていることとする。」とされています。この文言について、「前6か月間継続して」「前6か月の各月に」「6か月以上継続して」等の記載はなく、前6か月の範囲内に対象者への「指定計画相談支援」の実績が存在することを示したものとも解釈できるように思われます。令和６年度障害福祉サービス等報酬改定等に関するＱ＆Ａ VOL.１（令和６年３月29日）問73では、「研修修了者が現に計画（障害児）相談支援を行っていること」は、「原則として、研修修了者がサービス利用支援又はモニタリングを行っていることを要する」とあります。すると、先の文言は、「前6か月の範囲内に、対象者についてサービス利用支援または継続サービス利用支援の実績があること」を意味するとの解釈になると考えています。一方で、本日の集団指導では、支援体制加算（１）の算定には、前６か月間の継続した対象者への支援実績が必要であるとの説明があったものと認識しております。そこで、以下の点についてご教示ください。①「前6月に」とは、届出日以前の6か月間の範囲内において、対象者に対する指定計画相談支援（サービス利用支援または継続サービス利用支援）の実績が1件以上存在することを意味しますか？②それとも、前6か月間継続して対象者への指定計画相談支援（サービス利用支援または継続サービス利用支援）の実績を有していることを意味しますか？③②の場合、障発第1031001号の「前6月に」との文言を、「前6か月の範囲内における実績の有無」ではなく、「前6か月間の継続した支援実績」と解釈する根拠についてご教示ください。④②の場合、当該前６か月間に行われる「基本相談」は、ここでの「指定計画相談支援」には含まれないと理解していますが、６か月間に継続的に指定計画相談支援を行っていることをどのように判断するかを具体的にご教示ください。⑤①の場合、集団指導で例示の8月1日研修修了、８月 15日までに体制届提出のケースでは、８月に対象者への「指定計画相談支援」の実績がある場合、9月から支援体制加算（１）を算定できるということでよいでしょうか？答：①～④体制加算というのは、専⾨性の⾼い⽀援を実施できる体制を整えている場合に、その体制整備を適切に評価するための加算です。実績件数や算定回数を評価するものではなく、研修を修了した相談支援専門員が対象者に対してサービス等利用計画作成支援またはモニタリングを実施している体制を評価するものです。ご指摘のとおり、令和６年度障害福祉サービス等報酬改定等に関するQ&A VOL.1 問73では「研修修了者が現に計画相談支援を行っていること」とは、原則として研修修了者がサービス利用支援又は継続サービス利用支援（モニタリング）を行っていることを要するとされています。このため、研修修了者が対象となる利用者に対し計画相談支援を実施している状況を確認するための要件であり、必ずしも前６か月の各月に継続してサービス利用支援又は継続サービス利用支援の実績が存在することを求めるものではありません。したがって「前６月に」とは、届出日前６か月以内に対象者に対する指定計画相談支援（サービス利用支援又は継続サービス利用支援）の実績があることにより、当該研修修了者が現に対象者の支援を担当していることを確認する趣旨と解しています。⑤体制加算の算定に当たっては、研修修了者が対象者に対して直近６月以内に指定計画相談支援を行っている必要があります。また、体制が整備された時点で届出が可能となります。したがって、集団指導の例示では体制が整備された時期は１月であるため、１月15日までに体制届を提出した場合は、２月のサービス提供分から算定可能です。"},{"s":"qa","p":9,"h":"No.9（２計画相談支援）資料P128～129 （Ⅰ）を算定する場合の理解について・R6より以前から精神障害・行動障害の方々","t":"問：資料P128～129 （Ⅰ）を算定する場合の理解について・R6より以前から精神障害・行動障害の方々にも指定特定相談事業所として契約、現在も相談支援のサービスを行っている・それぞれの体制加算ができる資格要件を満たし、体制届によって変更を希望する前月15日までに申請を行った・翌月からサービス等利用
