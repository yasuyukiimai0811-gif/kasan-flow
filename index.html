計画・継続支援の場合に（Ⅰ）を算定、翌々月に請求をはじめた 1. R6以前のものは過誤の対象外という理解でいいか？ 2. この場合は、過誤請求にあたるのか？ 3. ②で、過誤になる場合、「体制届を提出した翌々月請求分から、体制届を提出後6ヶ月めの請求分まで」を行うのか？答：１．令和６年度の報酬改定で、体制加算に(Ⅰ)と（Ⅱ）ができたので、対象外です。２．体制が整備された時点で届出が可能となりますので、体制が整備される前に提出した場合は過誤の対象です。３．過誤の対象は、研修修了者が対象者に対して直近６月以内において計画相談支援を実施している間に（Ⅰ）を算定していた期間です。"},{"s":"qa","p":10,"h":"No.10（３障害児相談支援）横浜市の相談支援専門員と直接支援での兼務について｢配置含め｣という文言がありましたが、放デイで兼","t":"問：横浜市の相談支援専門員と直接支援での兼務について｢配置含め｣という文言がありましたが、放デイで兼務する場合、どのような配置であっても兼務は不可でしょうか？専門的支援の配置として現在入っており、計画書、実地は別職員が行っていますが、この場合も不可でしょうか？答：本市においては、相談支援事業者が不足している状況を受け、相談支援専門員が担当する利用者が利用するサービス提供事業所の職員との兼務を一部認めています。ただし、当該利用者の直接支援に携わる場合には兼務不可となります。管理者等で直接支援に携わらない場合においてのみ特例的に可能としています。直接支援に携わらない場合とは、直接支援の実態のみで判断するのではなく、職員の配置上においても直接支援を担当する職員として計上されていないことをいいます。お問い合わせのケースについても、放課後等デイサービスの専門的支援の配置職員として人員配置に位置付けられている場合は、計画書作成や実地を他職員が担当していても兼務不可となります。"}];

const APP=true;
const V=(x,s)=>{if(typeof x==="function")return x(s);if(x&&typeof x==="object"&&!Array.isArray(x)&&"kei" in x&&"ji" in x)return x[s.svc];return x};
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SV={kei:"計画相談支援",ji:"障害児相談支援"};

const view=document.getElementById("view"),side=document.getElementById("side");
const CAUTION=`<details class="caution"><summary>ご利用前の注意（2026年10月25日時点）</summary><ol>
<li><b>横浜市への照会が済んでいない点があります。</b>保育・教育等移行支援加算について、(1)情報提供の単位数、(1)を計画作成・モニタリングの月に算定できるか、(2)面接で必要な居宅訪問の回数の3点で、国の基準と横浜市資料の書き方が食い違っています。本ツールは国の基準（告示本文で確認済み）で判定しています。</li>
<li><b>判定していない要件があります。</b>処遇改善加算の賃金改善の要件と、各加算の記録の中身は判定していません。計画相談支援の医療・保育・教育機関等連携加算（面談・会議）と退院・退所加算の関係は、横浜市のガイドラインと国の障害児向け通知で書き方が違うため「要確認」と表示します。</li>
<li><b>判定できない境界があります。</b>初回加算と保育・教育等移行支援加算(1)を同じ月に算定する場合、通知の「前6月間」に当月が含まれるかは文言から判断できません。請求前に横浜市へ確認してください。</li></ol></details>`;
const GKEYS=GLOSS.flatMap((g,i)=>g.k.map(k=>({k,i}))).sort((a,b)=>b.k.length-a.k.length);
function linkTerms(s){s=String(s??"");const hits=[],used=new Set();for(const {k,i} of GKEYS){if(used.has(i))continue;let p=s.indexOf(k);while(p>=0){const e=p+k.length;if(!hits.some(h=>p<h[1]&&e>h[0])){hits.push([p,e,i]);used.add(i);break}p=s.indexOf(k,p+1)}}
 hits.sort((a,b)=>a[0]-b[0]);let o="",c=0;hits.forEach(([a,b,i])=>{o+=esc(s.slice(c,a))+`<button type="button" class="term" data-g="${i}" aria-label="${esc(s.slice(a,b))}の意味を表示">${esc(s.slice(a,b))}</button>`;c=b});return o+esc(s.slice(c))}

function glossCard(i){const g=GLOSS[i];const cs=cmpFor(g.k);return `<div class="gcard"><p class="gt">${esc(g.t)}</p><p class="gd">${esc(g.d)}</p><p class="gr">根拠：${esc(g.ref)}${g.u?`　<a href="${g.u}" target="_blank" rel="noopener">ホームページを開く</a>`:""}</p><div class="nav" style="margin-top:0"><button type="button" class="l sm" data-gdoc="${i}">資料の記載を見る</button>${cs.map(x=>`<button type="button" class="l sm" data-cmp="${x.j}">${esc(x.c.t.replace(/の違い$/,""))}の違い</button>`).join("")}</div><div class="gdoc"></div></div>`}

function glossFind(q){q=q.trim();if(!q)return[];if(/違い|ちがい|比較/.test(q)){const w=q.replace(/(と|の|は|って|違い|ちがい|比較|を|教えて|？|\?)/g," ").split(/\s+/).filter(x=>x.length>=2);const c=CMP.map((c,j)=>({c,j,s:w.filter(x=>c.t.includes(x)||c.keys.some(k=>k.includes(x))).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);if(c.length)return c.slice(0,2).map(x=>({cmp:x.j}))}return GLOSS.map((g,i)=>({g,i,s:(g.t.includes(q)?3:0)+(g.k.some(k=>k.includes(q)||q.includes(k))?2+Math.max(...g.k.filter(k=>k.includes(q)||q.includes(k)).map(k=>k.length))/10:0)+(g.d.includes(q)?1:0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,5)}

function reach(a,svc){const st=KBST(svc),seen=new Set(),q=[V(a.start,{svc})];while(q.length){const id=q.shift();if(!id||seen.has(id)||!N[id])continue;seen.add(id);const n=N[id];if(n.r)continue;for(const x of [n.yes,n.no,n.skip]){if(!x)continue;let g=x;if(typeof g==="object"&&("go" in g))g=g.go;g=V(g,st);if(typeof g==="string")q.push(g)}}return [...seen]}

 "", "warnTag": "", "multi": true}, {"name": "集中支援加算（情報提供）", "group": "kobetsu", "unit": 150, "type": "interval", "count_limit": "区分ごと月1回", "unitText": "150単位", "info": "【算定条件】計画作成月・モニタリング月「以外」の月に、福祉サービス等提供機関からの求めに応じて情報提供した場合（150単位）。\n回数：①病院等・訪問看護事業所、②それ以外の機関の区分ごとに月1回まで。\n出典：業務ガイドラインP.147・P.139", "warn": "", "warnTag": "", "multi": false}, {"name": "地域生活支援拠点等相談強化加算", "group": "kobetsu", "unit": 700, "type": "any", "count_limit": "月4回", "unitText": "700単位", "info": "", "warn": "", "warnTag": "", "multi": true}, {"name": "地域体制強化共同支援加算", "group": "kobetsu", "unit": 2000, "type": "any", "count_limit": "月1回", "unitText": "2000単位", "info": "【地域体制強化共同支援加算とは】2,000単位/月（利用者1人につき月1回を限度）。\n\n【算定要件】支援が困難な利用者に対して、相談支援専門員等が利用者の同意を得て、福祉サービス等を提供する事業者のうち3者以上と共同して、\n①会議により情報共有・支援内容を検討し、\n②在宅療養・地域生活に必要な説明・指導等の支援を共同して実施し、\n③地域課題を整理して協議会等に文書で報告した場合に算定できます。\n\n【算定に当たっての留意事項】\n・個別課題から地域課題を抽出し、協議会に参画して地域のサービス提供体制・社会資源の連携体制の構築を推進する趣旨の加算です。協議会へ報告する事例は、広く地域の関係者間で検討する必要がある課題を選定してください。\n・支援関係者が支援に要した費用は、指定特定相談支援事業所が負担することが望ましいとされています。\n・「地域体制強化共同支援加算報告書兼記録書」（市ホームページ掲載）を作成し、5年間保存。市町村長等から求めがあれば提出義務があります。\n\n【届出】算定には本市への手続きが必要です。運営規程に地域生活支援拠点である旨を規定し、体制届＋「地域生活支援拠点等の機能に関連する届出」の提出、および事業所所在区の自立支援協議会への報告が必要です。\n\n出典：横浜市業務ガイドラインP.149（⑩地域体制強化共同支援加算）・P.152（拠点関連加算の注意点）、報酬告示17、留意事項通知第四の20。確認日：2026-07-12", "warn": "", "warnTag": "", "multi": false}, {"name": "地域生活支援拠点等機能強化加算", "group": "kobetsu", "unit": 500, "type": "any", "count_limit": "月100回", "unitText": "500単位", "info": "", "warn": "⚠️ 横浜市では本加算を算定する事業所を想定していません。算定前に必ず障害施策推進課等へ確認してください。", "warnTag": "", "multi": false}, {"name": "遠隔地訪問加算", "group": "kobetsu", "unit": 300, "type": "any", "count_limit": "", "unitText": "300単位", "info": "【遠隔地訪問加算とは】300単位/回。特別地域に所在し、事業所から利用者の居宅等まで合理的な経路で概ね片道1時間を要する距離がある場合に、訪問を伴う対象加算と合わせて算定します。\n\n【重要：単純な1回=300単位ではありません】\n「300単位 × 対象加算の算定回数の合計」で算定します。訪問を伴う以下の対象加算を算定した回数を数え、その合計回数分だけチェックしてください（チェック1つ＝1回分＝300単位）。\n\n【対象となる加算（訪問・面接・通院同行を伴うもの）】\n①初回加算（契約〜計画交付が3か月超で月2回以上面接した場合。該当月数を回数としてカウント／最大3）\n②入院時情報連携加算（医療機関へ出向いて面談）\n③退院・退所加 ング月の面談等」か「通院同行」（右の列）かを個別に確認し、必要なら横浜市へ直接お問い合わせください。なお、R8開設説明会資料（R8.9.30）で、障害児相談支援にも「面談・会議（計画作成200／モニタリング300）」「通院同行300」の区分があることは確認済みです（列構成は妥当。旧列からの移行先のみ推定）。他の統合列（保育・教育等移行支援加算、サービス担当者会議実施加算）は名称・単位ともに横浜市資料で一致確認済みですが、本列のみ確度が異なります。", "warnTag": "統合先推定", "multi": false}, {"name": "医療・保育・教育機関等連携加算（通院同行）", "group": "kobetsu", "unit": 300, "type": "both", "count_limit": "月3回・同一病院は月1回", "unitText": "300単位", "info": "【算定条件】通院に同行し、病院等の職員に必要な情報を提供した場合。計画作成月・モニタリング月（基本報酬を算定する月）に限る。\n出典：業務ガイドラインP.138", "warn": "", "warnTag": "", "multi": true}, {"name": "医療・保育・教育機関等連携加算（情報提供）", "group": "kobetsu", "unit": 150, "type": "both", "count_limit": "区分ごと月1回", "unitText": "150単位", "info": "【算定条件】福祉サービス等提供機関からの求めに応じて情報提供した場合。計画作成月・モニタリング月に限る。①病院等・訪問看護事業所、②それ以外の区分ごとに月1回。同じ病院に通院同行で情報提供した月は重複算定不可。\n出典：業務ガイドラインP.139", "warn": "", "warnTag": "", "multi": false}, {"name": "サービス提供時モニタリング加算", "group": "kobetsu", "unit": 100, "type": "any", "count_limit": "月1回・専門員1人月39件まで", "unitText": "100単位", "info": "【算定条件】サービス提供事業所等を訪問し、サービス提供場面を直接確認して記録した場合。モニタリング月以外でも算定でき、単独請求も可（体制加算は付かない）。\n回数：利用者1人につき月1回。相談支援専門員1人が1月に請求できるのは39件まで（相談支援員は19件）。兼務先の事業所の確認は不可。\n出典：業務ガイドラインP.145、国QA(H30)問80", "warn": "", "warnTag": "", "multi": false}, {"name": "サービス担当者会議実施加算", "group": "kobetsu", "unit": 100, "type": "monitor", "count_limit": "月1回", "unitText": "100単位", "info": "計画相談支援・障害児相談支援のどちらでも、この同じ列に単位数を入力してください（横浜市の説明資料上、両サービスで同一の加算・単位として一覧化されています）。\n【算定不可】会議の結果、計画を変更してサービス利用支援費を算定する月（更新月を計画作成費で請求する月を含む）。医療・保育・教育機関等連携加算（面談等）を算定する月。\n出典：業務ガイドラインP.140", "warn": "", "warnTag": "", "multi": false}, {"name": "入院時情報連携加算（Ⅰ）", "group": "kobetsu", "unit": 300, "type": "any", "count_limit": "月1回", "unitText": "300単位", "info": "【算定条件】入院に当たり医療機関へ出向き、職員と面談して必要な情報を提供した場合。基本報酬のない月でも単独請求可（体制加算は付かない）。\n【併給不可】（Ⅰ）と（Ⅱ）の同時算定、同一医療機関への医療・保育・教育機関等連携加算。\n出典：業務ガイドラインP.141", "warn": "", "warnTag": "", "multi": false}, {"name": "入院時情報連携加算（Ⅱ）", "group": "kobetsu", "unit": 150, "type": "any", "count_limit": "月1回", "unitText": "150単位", "info": "【算定条件】（Ⅰ） 開催する会議への参加\n→ 同じ月に複数に該当する場合は、チェックを外して合計（最大900単位）を数値で入力してください。\n\n【入院時情報連携加算（Ⅰ）・退院・退所加算との関係】\n併給不可なのは「ウ 関係機関が開催する会議への参加」（300単位）のみです。両加算を算定した月でも、ア（訪問）・イ（会議開催）は算定できます（業務ガイドラインP.108、国QA(R3)VOL.2問27③）。\n\nウは居宅介護支援事業所等連携加算の会議参加と趣旨・つなぎ先が同じ場合は算定不可。\n出典：業務ガイドラインP.146〜147（⑧集中支援加算）", "warn": "", "warnTag": "", "multi": false}, {"name": "集中支援加算（通院同行）", "group": "kobetsu", "unit": 300, "type": "interval", "count_limit": "月3回・同一病院は月1回", "unitText": "300単位", "info": "【算定条件】計画作成月・モニタリング月「以外」の月に、利用者の通院に同行し、病院等の職員に必要な情報を提供した場合（300単位）。\n回数：1月に3回まで、同一の病院等は1月に1回まで（医療・保育・教育機関等連携加算の通院同行と同じ扱い）。\n出典：業務ガイドラインP.147・P.138", "warn": "", "warnTag": "", "multi": true}, {"name": "集中支援加算（情報提供）", "group": "kobetsu", "unit": 150, "type": "interval", "count_limit": "区分ごと月1回", "unitText": "150単位", "info": "【算定条件】計画作成月・モニタリング月「以外」の月に、福祉サービス等提供機関からの求めに応じて情報提供した場合（150単位）。\n回数：①病院等・訪問看護事業所、②それ以外の機関の区分ごとに月1回まで。\n出典：業務ガイドラインP.147・P.139", "warn": "", "warnTag": "", "multi": false}, {"name": "地域生活支援拠点等相談強化加算", "group": "kobetsu", "unit": 700, "type": "any", "count_limit": "月4回", "unitText": "700単位", "info": "", "warn": "", "warnTag": "", "multi": true}, {"name": "地域体制強化共同支援加算", "group": "kobetsu", "unit": 2000, "type": "any", "count_limit": "月1回", "unitText": "2000単位", "info": "【地域体制強化共同支援加算とは】2,000単位/月（利用者1人につき月1回を限度）。\n\n【算定要件】支援が困難な利用者に対して、相談支援専門員等が利用者の同意を得て、福祉サービス等を提供する事業者のうち3者以上と共同して、\n①会議により情報共有・支援内容を検討し、\n②在宅療養・地域生活に必要な説明・指導等の支援を共同して実施し、\n③地域課題を整理して協議会等に文書で報告した場合に算定できます。\n\n【算定に当たっての留意事項】\n・個別課題から地域課題を抽出し、協議会に参画して地域のサービス提供体制・社会資源の連携体制の構築を推進する趣旨の加算です。協議会へ報告する事例は、広く地域の関係者間で検討する必要がある課題を選定してください。\n・支援関係者が支援に要した費用は、指定特定相談支援事業所が負担することが望ましいとされています。\n・「地域体制強化共同支援加算報告書兼記録書」（市ホームページ掲載）を作成し、5年間保存。市町村長等から求めがあれば提出義務があります。\n\n【届出】算定には本市への手続きが必要です。運営規程に地域生活支援拠点である旨を規定し、体制届＋「地域生活支援拠点等の機能に関連する届出」の提出、および事業所所在区の自立支援協議会への報告が必要です。\n\n出典：横浜市業務ガイドラインP.149（⑩地域体制強化共同支援加算）・P.152（拠点関連加算の注意点）、報酬告示17、留意事項通知第四の20。確認日：2026-07-12", "warn": "", "warnTag": "", "multi": false}, {"name": "地域生活支援拠点等機能強化加算", "group": "kobetsu", "unit": 500,  h.unshift({id,at:new Date().toLocaleString("sv-SE",{hour12:false}).slice(0,16),ini,ym,svc:rec.svc||S.svc,act:rec.act,aid:rec.aid||"",r:rec.r,t:rec.t,w:rec.w,ref:rec.ref,notes:rec.notes,path:rec.path});
 try{localStorage.setItem(HK,JSON.stringify(h.slice(0,300)));return true}catch(e){return false}}
function histDel(id){const h=getH().filter(x=>{if(x.items)return !String(id).startsWith((x.at||"")+"#");return x.id!==id});try{localStorage.setItem(HK,JSON.stringify(h))}catch(e){}}
function saveBox(rec){const box=document.createElement("div");box.className="savebox";
 box.innerHTML=`<p class="sbt">この判定を保存して後で見返す</p><div class="sbr"><div><label for="rIni">利用者のイニシャル</label><input id="rIni" maxlength="10" autocomplete="off" placeholder="例：Y.T" value="${esc(CUR.ini)}"></div><div><label for="rYm">対象月</label><input id="rYm" type="month" value="${esc(CUR.ym||ymNow())}"></div><button class="l pri" id="rSv">保存</button></div><p class="fnote" id="rMsg">氏名は入れず、ローマ字のイニシャルで入力してください。保存先はこの端末のブラウザです。</p>`;
 const go=()=>{const i=normIni(box.querySelector("#rIni").value),ym=box.querySelector("#rYm").value;const m=box.querySelector("#rMsg");
  if(!iniOk(i)){m.textContent="イニシャルはローマ字で入力してください（例：Y.T）。氏名は保存できません。";m.classList.add("err");box.querySelector("#rIni").focus();return}
  CUR.ini=i;CUR.ym=ym;if(histSave(rec,i,ym)){m.classList.remove("err");m.innerHTML=`保存しました。メニューの「保存した判定」から見返せます。`;const b=box.querySelector("#rSv");b.disabled=true;b.textContent="保存済み";toast("保存しました")}else{m.textContent="保存できませんでした（ブラウザの保存領域を確認してください）";m.classList.add("err")}};
 box.querySelector("#rSv").onclick=go;box.querySelector("#rIni").onkeydown=e=>{if(e.key==="Enter")go()};return box}
const HV=document.getElementById("histv");let HF={q:"",svc:""};
function histText(x){return [`【${RL[x.r]}】${x.t}（${SV[x.svc]||x.svc||""}）`,`利用者：${x.ini||"（未入力）"}　対象月：${x.ym?x.ym.replace("-","年")+"月":"-"}　保存：${x.at}`,x.act?`支援：${x.act}`:"",...(x.path||[]).map((p,i)=>`Q${i+1} ${p.q} → ${p.a?"はい":"いいえ"}`),x.w?`理由：${x.w}`:"",...(x.notes||[]).map(n=>"※"+n),x.ref?`根拠：${x.ref}`:""].filter(Boolean).join("\n")}
function renderHist(){const all=histAll();const inis=[...new Set(all.map(x=>x.ini).filter(Boolean))].sort();
 const list=all.filter(x=>(!HF.q||(x.ini||"").includes(normIni(HF.q)))&&(!HF.svc||x.svc===HF.svc));
 const ym=v=>v?v.replace("-","年")+"月":"対象月なし";
 HV.innerHTML=`<div class="card"><h2 id="histh">保存した判定</h2><p class="sub">${all.length?`${all.length}件を保存しています（この端末のブラウザ）。`:"まだ保存した判定はありません。判定結果の画面で「保存」を押すと、ここで見返せます。"}</p>
 ${all.length?`<div class="sform"><div><label for="hQ">イニシャルで絞り込む</label><input id="hQ" list="hIniL" maxlength="10" autocomplete="off" placeholder="例：Y.T" value="${esc(HF.q)}"><datalist id="hIniL">${inis.map(i=>`<option value="${esc(i)}">`).join("")}</datalist></div><div><label for="hS">サービス</label><select id="hS"><option value="">すべて</option><option value="kei"${HF.svc==="kei"?" selected":""}>${SV.kei}</option><option value="ji"${HF.svc==="ji"?" selected":""}>${SV.ji}</option></select></div></div>
 <div class="hlist">${list.length?list.map(x=>`<details class="hitem ${x.r}"><summary><span class="hb ${x.r}">${RL[x.r]}</span><span class="ht"><b>${esc(x.t)}</b><small>${esc(x.ini||"イニシャルなし")}　${esc(ym(x.ym))}　${esc(SV[x.svc]||"")}</small></span></summary>
  <div class="hd">${x.act?`<p><b>支援：</b>${esc(x.act)}</p>`:""}${x.path&&x.path.length?`<ol class="hp">${x.path.map(p=>`<li>${esc(p.q)}<span class="ha ${p.a?"y":"n"}">${p.a?"はい":"いいえ"}</span></li>`).join("")}</ol>`:""}${x.w?`<p><b>理由：</b>${esc(x.w)}</p>`:""}${x.notes&&x.notes.length?`<ul class="notes">${x.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}${x.ref?`<p class="ref">根拠：${esc(x.ref)}</p>`:""}<p class="fnote">保存：${esc(x.at||"")}</p>
  <div class="nav"><button class="l sm" data-hc="${esc(x.id)}">コピー</button>${x.aid&&ACTIONS.find(a=>a.id===x.aid)?`<button class="l sm" data-hr="${esc(x.id)}">同じ支援をもう一度判定</button>`:""}<button class="l sm hdel" data-hd="${esc(x.id)}">削除</button></div></div></details>`).join(""):`<p class="hint">条件に合う判定はありません。</p>`}</div>
 <div class="tools"><button class="l" id="hAll">表示中の${list.length}件をコピー</button>${APP?`<button class="l" id="hCsv">CSVで書き出す</button>`:""}<button class="l hdel" id="hClr">すべて削除</button></div>`:""}</div>`;
 const $=id=>document.getElementById(id);const byId=id=>all.find(x=>String(x.id)===id);
 if($("hQ")){$("hQ").oninput=e=>{HF.q=e.target.value;const p=e.target.selectionStart;renderHist();const n=$("hQ");n.focus();try{n.setSelectionRange(p,p)}catch(_){}};$("hS").onchange=e=>{HF.svc=e.target.value;renderHist()};
  HV.querySelectorAll("[data-hc]").forEach(b=>b.onclick=()=>copy(histText(byId(b.dataset.hc))));
  HV.querySelectorAll("[data-hd]").forEach(b=>b.onclick=()=>{if(!confirm("この判定を削除しますか？"))return;histDel(b.dataset.hd);renderHist();toast("削除しました")});
  HV.querySelectorAll("[data-hr]").forEach(b=>b.onclick=()=>{const x=byId(b.dataset.hr);CUR.ini=x.ini||"";CUR.ym=x.ym||"";showPanel("k");S={svc:x.svc};session=[];start(x.aid)});
  $("hAll").onclick=()=>copy(list.map(histText).join("\n\n"));
  $("hClr").onclick=()=>{if(!confirm("保存した判定をすべて削除します。元に戻せません。よろしいですか？"))return;try{localStorage.removeItem(HK)}catch(e){}renderHist();toast("すべて削除しました")};
  if($("hCsv"))$("hCsv").onclick=()=>{const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';const rows=["保存日時,イニシャル,対象月,サービス,支援,判定,加算,理由,根拠,回答の流れ"];list.forEach(x=>rows.push([x.at,x.ini,x.ym,SV[x.svc],x.act,RL[x.r],x.t,x.w,x.ref,(x.path||[]).map(p=>p.q+"→"+(p.a?"はい":"いいえ")).join(" / ")].map(q).join(",")));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\r\n")],{type:"text/csv"}));a.download="加算フロー判定履歴.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}}

/* ===== 加算入力チェックの保存（イニシャル） ===== */
const ASK="kasan-flow-adsave";let AD_OPEN=null;
function asGet(){try{return JSON.parse(localStorage.getItem(ASK)||"[]")}catch(e){return[]}}
function asPut(a){try{localStorage.setItem(ASK,JSON.stringify(a.slice(0,300)));return true}catch(e){return false}}
function asState(){return {svc:AD.svc,kind:AD.kind,renewMonitor:AD.renewMonitor,monthly:AD.monthly,cat:AD.cat,ym:AD.ym,tanka:AD.tanka,red:AD.red.slice(),adjust:AD.adjust,dual:AD.dual,tier:AD.tier,base:AD.base,vals:AD.vals.slice()}}
function asSummary(){const b=adBillCalc(),m=adMsgs();return {I:b.I,J:b.J,cnt:AD.vals.filter(Boolean).length,warn:m?m.length:null}}
function asSave(over){const i=normIni(document.getElementById("adIni").value),msg=document.getElementById("adSvMsg");
 if(!iniOk(i)){msg.textContent="イニシャルはローマ字で入力してください（例：Y.T）。氏名は保存できません。";msg.classList.add("err");document.getElementById("adIni").focus();return}
 AD.ini=i;const a=asGet();const now=new Date().toLocaleString("sv-SE",{hour12:false}).slice(0,16);const e={id:over&&AD_OPEN?AD_OPEN:Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:now,ini:i,st:asState(),sum:asSummary()};
 const k=over&&AD_OPEN?a.findIndex(x=>x.id===AD_OPEN):-1;if(k>=0)a[k]=e;else a.unshift(e);
 if(asPut(a)){AD_OPEN=e.id;msg.classList.remove("err");msg.textContent=k>=0?"上書き保存しました。":"保存しました。下の「保存した内容」から開けます。";toast(k>=0?"上書き保存しました":"保存しました");asList()}else{msg.textContent="保存できませんでした（ブラウザの保存領域を確認してください）";msg.classList.add("err")}}
function asYm(v){return v?v.replace("-","年")+"月":"対象月なし"}
function asList(){const box=document.getElementById("asBox");if(!box)return;const a=asGet();const q=normIni(AD.q||"");const l=a.filter(x=>!q||(x.ini||"").includes(q));
 document.getElementById("asN").textContent=a.length;
 document.getElementById("adSvOver").hidden=!AD_OPEN||!a.some(x=>x.id===AD_OPEN);
 box.innerHTML=a.length?`<div class="sform" style="margin-top:6px"><div class="w"><label for="asQ">イニシャルで絞り込む</label><input id="asQ" maxlength="10" autocomplete="off" placeholder="例：Y.T" value="${esc(AD.q||"")}"></div></div><div class="hlist">${l.length?l.map(x=>`<div class="asi${x.id===AD_OPEN?" cur":""}"><div class="ht"><b>${esc(x.ini||"イニシャルなし")}　${esc(asYm(x.st.ym))}</b><small>${esc(x.st.svc)}${ADDEF[x.st.svc]&&ADDEF[x.st.svc].soudan?"・"+esc(KINDL[x.st.kind]||""):""}　加算${x.sum.cnt}件　合計 ${Number(x.sum.I).toLocaleString()}単位・${Number(x.sum.J).toLocaleString()}円${x.sum.warn?`　<span class="adw">確認${x.sum.warn}件</span>`:""}</small><small>保存：${esc(x.at)}</small></div><div class="nav"><button class="l sm" data-ao="${x.id}">開く</button><button class="l sm" data-ac="${x.id}">コピー</button><button class="l sm hdel" data-ad="${x.id}">削除</button></div></div>`).join(""):`<p class="hint">条件に合う保存はありません。</p>`}</div>`:`<p class="hint">まだ保存した内容はありません。</p>`;
 const qi=document.getElementById("asQ");if(qi)qi.oninput=e=>{AD.q=e.target.value;const p=e.target.selectionStart;asList();const n=document.getElementById("asQ");n.focus();try{n.setSelectionRange(p,p)}catch(_){}};
 box.querySelectorAll("[data-ao]").forEach(b=>b.onclick=()=>asOpen(b.dataset.ao));
 box.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{const x=a.find(y=>y.id===b.dataset.ac);const keep=asState(),ki=AD.ini;Object.assign(AD,JSON.parse(JSON.stringify(x.st)));AD.ini=x.ini;const t=adText();Object.assign(AD,keep);AD.ini=ki;copy(t)});
 box.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>{if(!confirm("この保存を削除しますか？"))return;asPut(a.filter(y=>y.id!==b.dataset.ad));if(AD_OPEN===b.dataset.ad)AD_OPEN=null;asList();toast("削除しました")})}
function asOpen(id){const x=asGet().find(y=>y.id===id);if(!x||!ADDEF[x.st.svc])return;Object.assign(AD,JSON.parse(JSON.stringify(x.st)));AD.ini=x.ini;if(AD.vals.length!==ADDEF[AD.svc].defs.length)AD.vals=ADDEF[AD.svc].defs.map((d,j)=>AD.vals[j]||false);AD_OPEN=id;renderAd(true);toast("保存した内容を開きました");document.getElementById("adh").scrollIntoView({block:"start"})}
/* ===== 移動できるメニュー ===== */
const FAB=document.getElementById("fab"),FM=document.getElementById("fmenu"),FPK="kasan-flow-fab";
function curPanel(){return !SIMV.hidden?"s":(!ADV.hidden?"a":(!HV.hidden?"h":(!WV.hidden?"w":"k")))}
function showPanel(p){if(p==="h"){setTab(false);document.getElementById("mainK").hidden=true;HV.hidden=false;document.getElementById("tabK").setAttribute("aria-selected","false");document.getElementById("tabW").setAttribute("aria-selected","false");document.getElementById("lead").textContent="保存した判定";document.getElementById("svcTag").classList.add("hide");renderHist();const h=document.getElementById("histh");h.setAttribute("tabindex","-1");h.focus({preventScroll:true});window.scrollTo({top:0});return}if(p==="a"){setTab(false);document.getElementById("mainK").hidden=true;ADV.hidden=false;document.getElementById("tabK").setAttribute("aria-selected","false");document.getElementById("tabW").setAttribute("aria-selected","false");document.getElementById("lead").textContent="加算入力チェック";document.getElementById("svcTag").classList.add("hide");if(!adReady)renderAd();const h=document.getElementById("adh");h.setAttribute("tabindex","-1");h.focus({preventScroll:true});window.scrollTo({top:0});return}if(p==="s"){setTab(false);document.getElementById("mainK").hidden=true;SIMV.hidden=false;document.getElementById("tabK").setAttribute("aria-selected","false");document.getElementById("tabW").setAttribute("aria-selected","false");document.getElementById("lead").textContent="損益シミュレーション";document.getElementById("svcTag").classList.add("hide");if(!simReady)renderSim();const h=document.getElementById("simh");h.setAttribute("tabindex","-1");h.focus({preventScroll:true});window.scrollTo({top:0})}else setTab(p==="w")}
function placeFab(x,y){const w=FAB.offsetWidth,h=FAB.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;x=Math.min(Math.max(8,x),vw-w-8);y=Math.min(Math.max(8,y),vh-h-8);FAB.style.left=x+"px";FAB.style.top=y+"px";FAB.style.right="auto";FAB.style.bottom="auto";return{x,y}}
function loadFab(){try{const p=JSON.parse(localStorage.getItem(FPK)||"null");if(p&&isFinite(p.rx)&&isFinite(p.ry)){placeFab(p.rx*document.documentElement.clientWidth,p.ry*window.innerHeight)}}catch(e){}}
function saveFab(){try{const r=FAB.getBoundingClientRect();localStorage.setItem(FPK,JSON.stringify({rx:r.left/document.documentElement.clientWidth,ry:r.top/window.innerHeight}))}catch(e){}}
function resetFab(){FAB.style.left=FAB.style.top="";FAB.style.right=FAB.style.bottom="";try{localStorage.removeItem(FPK)}catch(e){}}
function openMenu(){const cp=curPanel();FM.querySelectorAll("[data-m]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.m===cp)));FM.hidden=false;FAB.setAttribute("aria-expanded","true");
 const r=FAB.getBoundingClientRect(),mw=FM.offsetWidth,mh=FM.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
 let x=r.right-mw;if(x<8)x=Math.min(r.left,vw-mw-8);let y=r.top-mh-8;if(y<8)y=Math.min(r.bottom+8,vh-mh-8);FM.style.left=Math.max(8,x)+"px";FM.style.top=Math.max(8,y)+"px";FM.querySelector("[data-m]").focus()}
function closeMenu(f){FM.hidden=true;FAB.setAttribute("aria-expanded","false");if(f)FAB.focus()}
(function(){let st=null,moved=false;
 FAB.addEventListener("pointerdown",e=>{if(e.button>0)return;const r=FAB.getBoundingClientRect();st={px:e.clientX,py:e.clientY,ox:r.left,oy:r.top};moved=false;FAB.setPointerCapture(e.pointerId)});
 FAB.addEventListener("pointermove",e=>{if(!st)return;const dx=e.clientX-st.px,dy=e.clientY-st.py;if(!moved&&Math.hypot(dx,dy)<8)return;if(!moved){moved=true;FAB.classList.add("drag");closeMenu(false)}placeFab(st.ox+dx,st.oy+dy)});
 const end=e=>{if(!st)return;st=null;FAB.classList.remove("drag");if(moved){saveFab()}else{FM.hidden?openMenu():closeMenu(true)}};
 FAB.addEventListener("pointerup",end);FAB.addEventListener("pointercancel",()=>{st=null;FAB.classList.remove("drag");if(moved)saveFab()});
 FAB.addEventListener("keydown",e=>{const k={ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]}[e.key];if(k&&e.altKey){e.preventDefault();const r=FAB.getBoundingClientRect();placeFab(r.left+k[0],r.top+k[1]);saveFab()}else if(e.key==="Enter"||e.key===" "){e.preventDefault();FM.hidden?openMenu():closeMenu(true)}});
 FM.addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;closeMenu(false);if(b.dataset.m==="r"){resetFab();toast("メニューの位置を元に戻しました");FAB.focus();return}showPanel(b.dataset.m)});
 FM.addEventListener("keydown",e=>{const items=[...FM.querySelectorAll("[data-m]")],i=items.indexOf(document.activeElement);if(e.key==="Escape"){closeMenu(true)}else if(e.key==="ArrowDown"){e.preventDefault();items[(i+1)%items.length].focus()}else if(e.key==="ArrowUp"){e.preventDefault();items[(i-1+items.length)%items.length].focus()}});
 document.addEventListener("pointerdown",e=>{if(!FM.hidden&&!FM.contains(e.target)&&e.target!==FAB&&!FAB.contains(e.target))closeMenu(false)});
 window.addEventListener("resize",()=>{if(FAB.style.left){const r=FAB.getBoundingClientRect();placeFab(r.left,r.top)}if(!FM.hidden)closeMenu(false)});
 loadFab()})();

home();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
