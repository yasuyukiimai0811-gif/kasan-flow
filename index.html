ープホーム（体験利用を除く）２計画相談支援給付費支給対象者のうちモニタリングの頻度が「毎月ごと」である利用者特定相談支援（計画相談）"},{"s":"gl","p":135,"h":"5-28 報酬基準｜報酬③加算：利用者負担上限額管理加算","t":"３日中系サービス利用者生活介護、就労移行支援、自立訓練（機能訓練）、就労継続支援、自立訓練（生活訓練）４訪問系サービス利用者重度訪問介護、同行援護、居宅介護、行動援護５就労定着支援又は自立生活援助の利用者就労定着支援、自立生活援助６短期入所利用者※３短期入所７グループホームの体験利用者グループホーム（体験利用に限る）■利用者負担上限額管理加算基準第 13 条に規定する利用者負担額合計額の管理を行った場合、1 月につき 150 単位を加算します。加算の算定対象となる場合は、区役所で決定が必要です。"},{"s":"gl","p":135,"h":"5-28 報酬基準｜報酬③加算：利用者負担上限額管理加算／①利用者負担があり、負担上限額を超えると見込まれる方","t":"①利用者負担があり、負担上限額を超えると見込まれる方"},{"s":"gl","p":135,"h":"5-28 報酬基準｜報酬③加算：利用者負担上限額管理加算／②同一月内で複数のサービス事業所を利用する方（事業所番号が異なる場合に限る。）","t":"②同一月内で複数のサービス事業所を利用する方（事業所番号が異なる場合に限る。）※同一番号の事業所からサービス提供を受ける場合は、対象外です。※サービスの根拠となる法律（障害者総合支援法、児童福祉法等）ごとに利用者負担額を定めるため、同じ法律を根拠として複数のサービスを利用する場合に、上限額管理が必要です。※地域生活支援事業は上限額管理の対象となりません。※具体例：居住系サービス（施設入所支援、療養介護、短期入所、宿泊型自立訓練、共同生活援助）の利用者で、他のサービスを利用する者 / 在宅サービスの利用者で、複数の事業所から利用する者※１療養介護及び旧法施設（入所）は単一事業者からのサービス利用となるため原則として上限管理は不要※２宿泊型自立訓練及び精神障害者退院支援施設利用者に限る※３短期入所のみの利用者で上限管理が必要となる場合は、原則として、その月の最終利用事業所が管理を行う"},{"s":"gl","p":136,"h":"5-29 報酬基準｜報酬③加算：その他の加算","t":"※報酬告示３・５～11・16・17、厚生労働大臣が定める基準２・３・５・11・12 留意事項通知第四の 5・7～13・19・20国 QA(H30)VOL.1 問 79～88■各加算の内容※「障害福祉サービス等」とは、障害福祉サービス及び地域相談支援をいいます。"},{"s":"gl","p":136,"h":"5-29 報酬基準｜報酬③加算：その他の加算／①初回加算（計画相談支援 300 単位/月、障害児相談支援 500 単位/月）","t":"①初回加算（計画相談支援 300 単位/月、障害児相談支援 500 単位/月）※報酬告示３、厚生労働大臣が定める基準３、留意事項通知第四の５＜算定要件＞ア新規にサービス等利用計画を作成する者に対して指定サービス利用支援を行った場合なお、指定計画相談支援を利用せずに障害福祉サービス等を利用している計画相談支援対象障害者等についてサービス等利用計画を作成する場合についても含まれる。イサービス等利用計画を作成する月の前６月間において、障害福祉サービス等を利用していない者に対して指定サービス利用支援を行った場合ウ指定計画相談支援に係る契約をした日からサービス等利用計画案を交付した日までの期間が３か月を超える場合であって、３か月が経過する日以後に月２回以上、利用者等に面接した場合なお、テレビ電話装置等を活用して面接した場合を含む。ただし、月に 1 回は利用者の居宅等を訪問し、面接することを要するものである。この場合においても、利用者等に対して面接方法に係る意向を確認するとともに、居宅等を訪問して面接することを希望する場合は、居宅等を訪問して面接するよう努めること。"},{"s":"gl","p":136,"h":"5-29 報酬基準｜報酬③加算：その他の加算／①初回加算（計画相談支援 300 単位/月、障害児相談支援 500 単位/月）","t":"＜算定に当たっての留意事項＞・ウの要件を満たす場合については、その月分の初回加算に相当する額を加えた額の初回加算を最大３回算定することができます。・アとウ又はイとウの要件を満たす場合は、合算することができ、合計で 1 月に４回を限度として加算することができます。・初回加算の算定月から、前６月において居宅介護支援事業所等連携加算を算定している場合は、初回加算を算定することはできません。"},{"s":"gl","p":136,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の考え方","t":"Q＆A コーナー｜加算の考え方初回加算Q 障害児相談支援を利用していた障害児が、初めて計画相談支援を利用する場合について、計画相談支援の初回加算は算定可能か。また、計画相談支援を利用していた障害児が、初めて障害児相談支援を利用する場合も、障害児相談支援の初回加算は算定可能か。（国 QA(H30)VOL.1 問 81）A 算定できる。"},{"s":"gl","p":137,"h":"5-29 報酬基準｜報酬③加算：その他の加算／②退院・退所加算（300 単位/回）※報酬告示６、留意事項通知第四の８","t":"②退院・退所加算（300 単位/回）※報酬告示６、留意事項通知第四の８＜算定要件＞障害者支援施設、のぞみの園（法第５条第１項）、児童福祉施設（乳児院、母子生活支援施設、児童養護施設、障害児入所施設、児童心理治療施設及び児童自立支援施設に限る。）、救護施設若しくは更生施設に入所していた計画相談支援対象障害者等、病院等に入院していた計画相談支援対象障害者等、刑事収容施設及び刑事施設、少年院若しくは更生保護施設に収容されていた計画相談支援対象障害者等又は保護観察所に設置若しくは併設された宿泊施設若しくは更生保護法（平成19 年法律第 88 号）第 62 条第３項若しくは第 85 条第３項の規定による委託を受けた者が当該委託に係る同法第 62 条第２項の救護若しくは同法第 85 条第１項の更生緊急保護として利用させる宿泊施設（更生保護施設を除く。）に宿泊していた計画相談支援対象障害者等が退院、退所等をし、障害福祉サービス又は地域相談支援を利用する場合において、当該計画相談支援対象障害者等の退院、退所等に当たって、当該施設の職員と面談を行い、当該計画相談支援対象障害者等に関する必要な情報※１の提供を受けた上で、サービス等利用計画を作成し、障害福祉サービス又は地域相談支援の利用に関する調整を行い、当該利用者が障害福祉サービス等の支給決定を受けた場合に算定します。"},{"s":"gl","p":137,"h":"5-29 報酬基準｜報酬③加算：その他の加算／②退院・退所加算（300 単位/回）※報酬告示６、留意事項通知第四の８","t":"※１「必要な情報」とは、具体的には、当該利用者の基本情報、利用者の状態、支援における留意点等、家族・世帯の状況、生活の状況、受診・服薬の状況等に加え、入院又は入所等の期間中の利用者に係る心身の状況の変化並びに退院又は退所に当たって特に配慮等すべき事項の有無及びその内容をいいます。＜算定に当たっての留意事項＞・初回加算を算定する場合は、当該加算は算定できません。・入院、入所等の期間中に実施した情報収集又は調整等に関して、当該利用者のサービス等利用計画の作成に係るサービス利用支援費の算定に併せて当該入院、入所の開始から退院、退所までの間において３回分を限度に算定できます。・退院又は退所する施設の職員と面談を行い情報の提供を受けた場合には、相手や面談日時、その内容の要旨及びサービス等利用計画に反映されるべき内容に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。"},{"s":"gl","p":138,"h":"5-29 報酬基準｜報酬③加算：その他の加算／③医療・保育・教育機関等連携加算※報酬告示８、留意事項通知第四の 10","t":"③医療・保育・教育機関等連携加算※報酬告示８、留意事項通知第四の 10＜算定要件＞当該加算は、利用者が利用する病院等、訪問看護事業所、企業、児童相談所、保育所、幼稚園、小学校、特別支援学校等の関係機関との日常的な連携体制を構築するとともに、利用者の状態や支援方法の共有を行うことを目的とするものであるから、当該加算の算定場面に限らず、関係機関との日常的な連絡調整に努めることとします。当該加算の算定が可能な場合は次のとおりです。※ア～ウを１月に複数算定も可ア福祉サービス等提供機関の職員との面談等指定サービス利用支援を行った場合 200 単位/月指定継続サービス利用支援を行った場合 300 単位/月福祉サービス等提供機関（障害福祉サービス等事業者を除く。）の職員との面談又は会議により、利用者に関する必要な情報の提供を受けた上で指定サービス利用支援又は指定継続サービス利用支援を行った場合・計画相談支援対象障害者等１人につき１月に１回を限度として算定可能・「初回加算」を算定する場合及び「退院・退所加算」を算定する場合、又は、退院、退所等をする施設の職員のみから情報の提供を受けているときは算定不可＜算定に当たっての留意事項＞・福祉サービス等提供機関の職員との会議については、テレビ電話装置等を活用して行うことができるものとします。"},{"s":"gl","p":138,"h":"5-29 報酬基準｜報酬③加算：その他の加算／③医療・保育・教育機関等連携加算※報酬告示８、留意事項通知第四の 10","t":"・関係機関から情報の提供を受けた場合には、相手や面談日時、その内容の要旨及びサービス等利用計画に反映されるべき内容に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。ただし、作成したサービス等利用計画等において、上記の記録すべき内容が明確にされている場合は、別途記録の作成を行うことは要しません。イ利用者への通院同行 300 単位/月利用者が病院等に通院するに当たり、病院等を訪問し、当該病院等の職員に対して利用者に係る必要な情報を提供した場合・１月に３回を限度とし、同一の病院等については１月に１回を限度とします。・指定サービス利用支援、指定継続サービス利用支援を算定する場合に限ります。＜算定に当たっての留意事項＞・当該加算は、単に利用者の病院等への通院に同行することを評価するものではなく、通院に同行した上で、病院等の職員等に対して、当該利用者の基本情報、利用者の状態、支援における留意点等、家族・世帯の状況、生活の状況、受診・服薬の状況、サービスの利用状況及びサー"},{"s":"gl","p":139,"h":"5-29 報酬基準｜報酬③加算：その他の加算／③医療・保育・教育機関等連携加算※報酬告示８、留意事項通知第四の 10","t":"ビス等利用計画の内容等の必要な情報を提供し、連携の強化を図ることを趣旨とするものです。・そのため、例えば、利用者の状態に変化があった場合又は利用者の治療や療養上病院等と在宅生活の支援に係る関係機関等が連携する必要がある場合並びに利用するサービス及びサービス等利用計画に変更があった場合等に算定することを想定しています。・なお、情報提供にあたっては、入院時情報提供書等を参考にした上で行うこととします。ウ福祉サービス等提供機関への情報提供 150 単位/月福祉サービス等提供機関からの求めに応じて利用者に関する必要な情報を提供した場合・指定サービス利用支援、指定継続サービス利用支援を算定する場合に限る。＜算定に当たっての留意事項＞・次の区分ごとにそれぞれ 1 月に 1 回を限度に算定するものとしています。㈠病院等、訪問看護事業所㈡㈠以外の福祉サービス等提供機関なお、㈠に掲げる機関への情報提供にあたっては、入院時情報提供書等を参考にした上で行うこと。"},{"s":"gl","p":139,"h":"5-29 報酬基準｜報酬③加算：その他の加算／③医療・保育・教育機関等連携加算※報酬告示８、留意事項通知第四の 10","t":"・病院等への情報提供と同じ月において、同病院等に対して通院同行により情報提供している場合、重複して算定することはできませんが、異なる病院等に対して情報提供を行う場合はそれぞれで算定することは可能です。"},{"s":"gl","p":139,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の考え方","t":"Q＆A コーナー｜加算の考え方福祉サービス等提供機関の対象Q 医療・保育・教育機関等連携加算について、福祉サービス等提供機関の職員との面談・会議については、どのような機関であっても対象と認められるか。（国 QA(R6)VOL.1 問 67）A 原則として、サービス等利用計画に位置付けられている福祉サービス等の提供機関に限ることとするが、サービス等利用計画に新たに福祉サービス等を位置付ける予定である場合、急遽利用者等に状況の変化が生じた場合であって、福祉サービス等提供機関の職員との面談・会議を行う必要が生じた場合は、対象として差し支えない。なお、「福祉サービス等提供機関」とは障害福祉サービス等を含むものであるが、本加算の算定に当たっては障害福祉サービス等事業所以外との連携に限るものであるので留意されたい。医療・保育・教育機関等連携加算の算定要件Q 医療・保育・教育機関等連携加算（福祉サービス等提供機関の職員との面談・会議）について、サービス担当者会議を開催し、障害福祉サービス等事業所以外の福祉サービス等提供機関の職員が出席した上で必要な情報の提供を受けた場合に算定可能か。（国 QA(R6)VOL.1 問 68）"},{"s":"gl","p":139,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の考え方","t":"A サービス担当者会議に際して障害福祉サービス等事業所以外の福祉サービス等提供機関の職員から情報提供を受ける場合も本加算の算定は可能である。ただし、情報提供を受ける方法は当該職員が会議への出席（オンラインを含む）により行われた場合に限られる。"},{"s":"gl","p":140,"h":"5-29 報酬基準｜報酬③加算：その他の加算／④サービス担当者会議実施加算（100 単位/月）※報酬告示 10、留意事項通","t":"④サービス担当者会議実施加算（100 単位/月）※報酬告示 10、留意事項通知第四の 12＜算定要件＞指定継続サービス利用支援の実施時において、利用者の居宅等を訪問し利用者に面接することに加えて、サービス等利用計画に位置付けた福祉サービス等の担当者を招集してサービス担当者会議を開催し、相談支援専門員又は相談支援員が把握したサービス等利用計画の実施状況（計画相談支援対象障害者等についての継続的な評価を含む。）について説明を行うとともに、担当者に対して、専門的な見地からの意見を求め、サービス等利用計画の変更その他必要な便宜の提供について検討を行った場合に算定を行います。＜算定に当たっての留意事項＞・利用者１人につき、１月に１回を限度として算定します。・サービス担当者会議において検討した結果、サービス等利用計画の変更を行った場合は、サービス利用支援費を算定することとなるため、当該加算は算定できません。"},{"s":"gl","p":140,"h":"5-29 報酬基準｜報酬③加算：その他の加算／④サービス担当者会議実施加算（100 単位/月）※報酬告示 10、留意事項通","t":"・医療・保育・教育機関等連携加算の「福祉サービス等提供機関の職員との面談等」を算定する場合も、同加算においてサービス担当者会議の開催等に係る業務を評価していることから、当該加算は算定できません。・サービス担当者会議の出席者や開催日時、検討した内容の要旨及びそれを踏まえた対応方針に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。・利用者の会議出席は必須としていませんが、可能な限り参加を求めることが望ましいです。"},{"s":"gl","p":140,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の考え方","t":"Q＆A コーナー｜加算の考え方サービス担当者会議実施加算①Q 「サービス担当者会議実施加算」は、サービス利用支援時に開催したサービス担当者会議と同様の担当者を招集する必要があるのか。また、全員集まらないと算定できないのか。（国 QA(H30)VOL.1 問84）A サービス利用支援時に開催したサービス担当者会議と同様の担当者が全員参加することが望ましいが、検討を行うにあたり必要な者が参加していれば、担当者全員の参加は要しない。ただし、会議開催を調整したが全員参加せず、メール等による担当者への報告のみの実施である場合は、当該加算を算定することはできない。サービス担当者会議実施加算②Q モニタリング時にサービス担当者会議を開催した結果、サービス等利用計画等を変更することになった場合、支給決定後に指定基準に基づき、再度サービス担当者会議を開催しなければならないのか。"},{"s":"gl","p":140,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の考え方","t":"（国 QA(H30)VOL.1 問 85）A モニタリング時に開催したサービス担当者会議の結果、サービス等利用計画等を変更することとなった場合は、その際に検討した変更案から変更がない又は軽微な変更のみであれば、その旨を関係者に報告する等によって、サービス担当者会議の開催について簡素化することは差し支えない。"},{"s":"gl","p":141,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑤入院時情報連携加算※報酬告示５、厚生労働大臣が定める基準５、留意事項通知第","t":"⑤入院時情報連携加算※報酬告示５、厚生労働大臣が定める基準５、留意事項通知第四の７＜算定要件＞※いずれかに該当する場合に算定可能計画相談支援対象障害者等が医療法（昭和 23 年法律第 205 号）第１条の５第１項に規定する病院又は同条第２項に規定する診療所（以下、「病院等」という。）に入院するに当たり、別に厚生労働大臣が定める基準に従い、当該病院等の職員に対して、当該計画相談支援対象障害者等の心身の状況、生活環境等の当該計画相談支援対象障害者等に係る必要な情報を提供した場合は、次に掲げる区分に応じ所定単位数に加算します。種類内容単位入院時情報連携加算（Ⅰ）医療機関へ出向いて、当該医療機関の職員と面談し、必要な情報※１を提供した場合300 単位／月入院時情報連携加算（Ⅱ）（Ⅰ）以外の方法により、必要な情報を提供した場合 150 単位／月※１「必要な情報」とは、具体的には、基本情報、利用者の状態、支援における留意点等、家族・世帯の状況、生活の状況、受診・服薬の状況等をいいます。"},{"s":"gl","p":141,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑤入院時情報連携加算※報酬告示５、厚生労働大臣が定める基準５、留意事項通知第","t":"＜算定に当たっての留意事項＞・利用者１人につき、１月に１回を限度として加算します。入院時情報連携加算（Ⅰ）、（Ⅱ）の同時算定は不可です。・同一医療機関の場合には、医療・保育・教育機関等連携加算との併給算定は不可です。どちらか一方のみの算定になります。・情報提供を行った日時、場所（医療機関へ出向いた場合）、内容、提供手段（面談、FAX 等）等について記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。・なお、当該利用者が重度訪問介護を利用して入院する場合は、当該利用者を支援する重度訪問介護事業所と連携の上当該入院に係る医療機関との連携を行うものとします。その際、入院時情報提供書は、当該重度訪問介護事業所と共同で作成すること等も考えられますが、他の事業所が代表して作成した入院時情報提供書を提供することのみをもって入院時情報連携加算を算定することはできません。"},{"s":"gl","p":141,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑤入院時情報連携加算※報酬告示５、厚生労働大臣が定める基準５、留意事項通知第","t":"・本加算は、入院するに当たり医療機関へ情報提供した場合に算定対象となり、入院中や退院に受けたカンファレンス等は対象とはなりません。・本加算は、単独での請求が可能です。"},{"s":"gl","p":142,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑥居宅介護支援事業所等連携加算※報酬告示 7、留意事項通知第四の９、国 QA","t":"⑥居宅介護支援事業所等連携加算※報酬告示 7、留意事項通知第四の９、国 QA(R3)VOL.2 問 37＜算定要件＞計画相談支援対象障害者等が障害福祉サービス等を利用している期間において、次のア～カまでのいずれかに該当する場合に、１月につきそれぞれア～カに定める単位数（ア～カに掲げる場合のそれぞれについて２回を限度とする。）を合算した単位数を加算します。また、計画相談支援対象障害者等が障害福祉サービス等の利用を終了した日から起算して６月以内において、次のア～カのいずれかに該当する場合に、１月につきそれぞれア～カに定める単位数を合算した単位数を加算します。ア居宅介護支援事業所等へ情報提供した場合 150 単位/月計画相談支援対象者等が指定居宅介護支援又は指定介護予防支援を開始するに当たり、当該指定居宅介護支援等を提供する指定居宅介護支援事業所又は指定介護予防支援事業所に対して、文書により心身の状況等※１の利用者等に係る必要な情報を提供※２し、当該指定居宅介護支援事業所等※３における居宅サービス計画又は介護予防サービス計画の作成等に協力する場合※４に算定する。"},{"s":"gl","p":142,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑥居宅介護支援事業所等連携加算※報酬告示 7、留意事項通知第四の９、国 QA","t":"イ居宅等を訪問し面接した場合 300 単位/月計画相談支援対象障害者等が指定居宅介護支援等の利用を開始するに当たり、月に２回以上、当該利用者等の居宅等※５を訪問し、当該利用者及びその家族に面接※６する場合に算定する。ただし、サービス利用支援費及び継続サービス利用支援費を算定する月を除く。ウ居宅介護支援事業所等が開催する会議に参加した場合 300 単位/月計画相談支援対象障害者等が指定居宅介護支援等の利用を開始するに当たり、当該利用者の心身の状況の確認及び支援内容の検討に係る指定居宅介護支援事業所等が開催する会議に参加する場合に算定する。会議への参加については、テレビ電話装置等を活用して行うことができるものである。ただし、サービス利用支援費及び継続サービス利用支援費を算定する月を除く。エ障害者就業・生活支援センター等へ情報提供した場合 150 単位/月計画相談支援対象障害者等が通常の事業所に新たに雇用され、障害者就業・生活支援センター又は当該通常の事業所の事業主等による支援を受けるに当たり、当該障害者就業・生活支援センター等に対して、心身の状況等※１の当該利用者に係る必要な情報を提供※２し、当該障害者就業・生活支援センター等における当該利用者の支援内容の検討に協力する場合※４に算定する。"},{"s":"gl","p":143,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑥居宅介護支援事業所等連携加算※報酬告示 7、留意事項通知第四の９、国 QA","t":"オ事業所に新たに雇用されるに当たり面接した場合 300 単位/月計画相談支援対象障害者等が通常の事業所に新たに雇用されるに当たり、月に２回以上、当該利用者等の居宅等※５を訪問し、当該利用者及び家族に面接※６する場合に算定する。ただし、サービス利用支援費及び継続サービス利用支援費を算定する月を除く。カ障害者就業・生活支援センター等が開催する会議に参加した場合 300 単位/月計画相談支援対象障害者等が通常の事業所に新たに雇用され、障害者就業・生活支援センター等による支援を受けるに当たり、当該利用者の心身の状況の確認及び支援内容の検討に係る当該障害者就業・生活支援センター等が開催する会議に参加する場合に算定する。会議への参加については、テレビ電話装置等を活用して行うことができるものである。ただし、サービス利用支援費及び継続サービス利用支援費を算定する月を除く。"},{"s":"gl","p":143,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑥居宅介護支援事業所等連携加算※報酬告示 7、留意事項通知第四の９、国 QA","t":"※１「心身の状況等」とは、当該利用者の心身の状況（例えば、障害の程度や特性、疾患・病歴の有無など）、生活環境（例えば、家族構成、生活歴など）、日常生活における本人の支援の有無やその具体的状況及びサービスの利用状況をいう。（国 QA(R3)VOL.2 問 37）※２「必要な情報の提供」はこの目的のために作成した文書によるものをいう。※３当該計画相談支援対象障害者等が利用する指定特定相談支援事業所と一体的に運営している場合は除く。※４介護支援専門員や障害者就業・生活支援センターの職員等が実施するアセスメントへの同行や当該利用者に関する直近のサービス等利用計画やモニタリング結果等を情報提供した上で、利用者の心身の状況、生活環境及びサービスの利用状況等を介護支援専門員等に対して説明を行った場合等をいう。※５利用者の居宅等、障害者支援施設等、病院をいう。"},{"s":"gl","p":143,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑥居宅介護支援事業所等連携加算※報酬告示 7、留意事項通知第四の９、国 QA","t":"※６「面接」については、テレビ電話装置等を活用して面接した場合を含む。ただし、月に１回は利用者の居宅等を訪問し、面接することを要するものである。＜算定に当たっての留意事項＞・本加算は、単独での請求が可能です。ただし、入院時情報連携加算、退院・退所加算を算定している月は、当該加算は算定できません。・イ、ウ、オ、カを算定する場合はサービス利用支援費及び継続サービス利用支援費を算定する月を除く。ただし、障害福祉サービス等の利用を終了した日から起算して６月以内に算定要件を満たし加算を算定する場合は、計画相談支援の支給決定最終月に請求を行うため、継続サービス利用支援費と同月の請求となります。・ウ、カを算定する際に、複数の指定居宅介護支援事業所等又は雇用先事業所等が開催する会議が"},{"s":"gl","p":144,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑥居宅介護支援事業所等連携加算※報酬告示 7、留意事項通知第四の９、国 QA","t":"同一日に連続して一体的に開催される場合の算定回数は１回となります。・ア及びエを算定する場合は、情報提供を行った日時、場所、内容、提供手段（面談、FAX 等）等について記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。なお、情報提供の方法としては、サービス等利用計画等の活用が考えられます。・イ及びオを算定する場合は、面談日時、その内容の要旨に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。・ウ及びカを算定する場合は、会議の出席者や開催日時、検討した内容の要旨及びそれぞれを踏まえた対応方針に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。"},{"s":"gl","p":144,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑥居宅介護支援事業所等連携加算※報酬告示 7、留意事項通知第四の９、国 QA","t":"・「居宅介護支援事業所等」とは、いわゆるケアマネジャーを指します。障害者総合支援法における居宅介護事業所（いわゆるヘルパー）ではありません。"},{"s":"gl","p":144,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の考え方","t":"Q＆A コーナー｜加算の考え方居宅介護支援事業所等連携加算Q 「居宅介護支援事業所等連携加算」は、当該指定居宅介護支援等の利用開始日前６月以内に算定している場合は算定不可とあるが、異なる居宅介護支援事業所が居宅サービス計画を作成する場合は、６月以内でも算定可能か。（国 QA(H30)VOL.1 問 82）A 算定できる。居宅介護支援事業所等連携加算の算定方法Q 居宅介護支援事業所等連携加算の算定方法について、具体的な取扱いはどのようなものか。（国QA(R6)VOL.1 問 66）A ①障害福祉サービス等の支給決定期間中については、当該加算を算定できる(1)～(6)に定める場合毎に、当該期間中に２回まで算定できるものである。例：１月＜(1)＞、２月＜(1),(2)＞、３月＜(2)＞、４月＜(1),(3)＞→(1)：２回、(2)：２回、(3)：１回算定可（４月の(1)のみ上限到達のため算定不可）"},{"s":"gl","p":144,"h":"5-29 報酬基準｜報酬③加算：その他の加算／②障害福祉サービス等の支給決定期間後の６月間は、当該加算を算定できる","t":"②障害福祉サービス等の支給決定期間後の６月間は、当該加算を算定できる(1)～(6)に定める場合毎に、1 月あたり各１回まで算定できるものである。例：１月＜(1),(3)＞、２月＜(1),(2)＞、３月＜(2)＞、４月＜(1),(2),(3)＞→(1)：３回、(2)：３回、(3)：２回算定可"},{"s":"gl","p":145,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑦サービス提供時モニタリング加算（100 単位/月）※報酬告示 11、留意事","t":"⑦サービス提供時モニタリング加算（100 単位/月）※報酬告示 11、留意事項通知第四の 13＜算定要件＞指定継続サービス利用支援の実施時又はそれ以外の機会において、サービス等利用計画に位置付けた障害福祉サービス等を提供する事業所又は当該障害福祉サービス等の提供場所を訪問し、サービス提供場面を直接確認することにより、サービスの提供状況について詳細に把握し、確認結果の記録を作成した場合に算定を行います。＜算定に当たっての留意事項＞・サービス提供時のモニタリングを実施するにあたっては次のような事項を確認・記録し、５年間保存するとともに、市町村長等から求めがあった場合については提出しなければなりません。ア障害福祉サービス等の事業所等におけるサービスの提供状況イサービス提供時の利用者の状況ウその他必要な事項・利用者１人につき、１月に１回を限度として加算します。ただし、１人の相談支援専門員が１月に請求できる当該加算の件数は 39 件（相談支援員の場合は 19 件）を限度とします。"},{"s":"gl","p":145,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑦サービス提供時モニタリング加算（100 単位/月）※報酬告示 11、留意事","t":"・相談支援専門員が兼務者の場合、兼務先の事業所のサービス提供時のモニタリングを行っても本加算の算定はできません。兼務先でない場合には、同一敷地内の場合でも算定可能です。・本加算の「障害福祉サービス等」は計画相談支援の対象となるサービスのみが該当です。（居宅介護などの介護給付、就労移行支援などの訓練等給付、地域相談支援）移動支援などのいわゆる地域生活支援事業などは対象とはなりません。・本加算は、単独での請求が可能です。"},{"s":"gl","p":145,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の考え方","t":"Q＆A コーナー｜加算の考え方サービス提供時モニタリング加算①Q 「サービス提供時モニタリング加算」は、居宅で利用する障害福祉サービス等の提供現場を確認した場合も算定可能か。（国 QA(H30)VOL.1 問 86）A 算定可能である。ただし、指定基準に基づいた定期的なモニタリングを行う日と同一日に、居宅で利用する障害福祉サービス等の提供現場を確認し、当該加算を算定する場合は、モニタリング結果と当該加算に関する記録をそれぞれ作成する必要があるので留意すること。"},{"s":"gl","p":146,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑧集中支援加算※報酬告示９、留意事項通知第四の 11","t":"⑧集中支援加算※報酬告示９、留意事項通知第四の 11＜算定要件＞次のアからオまでに該当する場合に、１月にそれぞれアからオまでに掲げる単位数を加算する。ただし、アからウまでについては、計画相談支援対象障害者等１人につき１月に１回を限度とする。ア利用者等への訪問による面接 300 単位/月障害福祉サービス等の利用に関して、利用者又は市町村等※１の求めに応じ、月に２回以上、当該利用者の居宅等を訪問し、又はテレビ電話装置等を活用して（ただし、月に１回は利用者の居宅等を訪問し、面接することを要する）、当該利用者及びその家族に面接する場合に算定する。イサービス担当者会議の開催 300 単位/月サービス担当者会議※２を開催し、相談支援専門員又は相談支援員が把握したサービス等利用計画の実施状況について説明を行うとともに、担当者に対して、専門的な見地からの意見を求め、サービス等利用計画の変更その他必要な便宜の供与について検討を行う場合に算定する。"},{"s":"gl","p":146,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑧集中支援加算※報酬告示９、留意事項通知第四の 11","t":"ウ福祉サービス等提供機関が開催する会議への参加 300 単位/月福祉サービス等を提供する機関等※３（以下、「関係機関」という。）の求めに応じ、当該関係機関が開催する会議に参加し、利用者の障害福祉サービス等の利用について、関係機関相互の連絡調整を行った場合に算定する。サービス提供時モニタリング加算②Q 複数の障害福祉サービス等を利用する利用者について、「サービス提供時モニタリング加算」を算定する場合は、利用する全ての障害福祉サービス等の提供現場を確認しないと算定できないのか。（国 QA(H30)VOL.1 問 87）A 複数の障害福祉サービス等を利用している者については、全ての障害福祉サービス等の提供現場を確認することが望ましいが、１箇所でも確認していれば算定は可能である。サービス提供時モニタリング加算③Q 「サービス提供時モニタリング加算」は相談支援専門員 1 人当たり 39 件まで請求できるが、取扱件数と同様に前６月平均なのか。（国 QA(H30)VOL.1 問 88）"},{"s":"gl","p":146,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑧集中支援加算※報酬告示９、留意事項通知第四の 11","t":"A 取扱件数については、月によってモニタリング件数が集中する場合があることに配慮して前６月平均としたところであるが、「サービス提供時モニタリング加算」は実施月を調整することが可能であるため、前６月平均ではなく当該月の実施件数を 39 件までとする。"},{"s":"gl","p":147,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑧集中支援加算※報酬告示９、留意事項通知第四の 11","t":"エ利用者への通院同行 300 単位/月利用者が病院等に通院するに当たり、病院等を訪問し、当該病院等の職員に対して利用者の心身の状況、生活環境等の利用者に係る必要な情報を提供した場合に算定する。オ福祉サービス等提供機関への情報提供 150 単位/月福祉サービス等提供機関からの求めに応じて利用者に関する必要な情報を提供した場合に算定する。※１「市町村等」とは、市町村、福祉サービス等の事業を行う者等をいう。※２「サービス担当者会議」における会議の開催に当たっては、利用者又はその家族も出席し、利用するサービスに対する意向等を確認しなければならない。※３「福祉サービス等を提供する機関等」とは、病院等、企業、地方自治体等をいう。＜算定に当たっての留意事項＞・入院時情報連携加算（Ⅰ）又は退院・退所加算を算定している月は、当該加算は算定できません。"},{"s":"gl","p":147,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑧集中支援加算※報酬告示９、留意事項通知第四の 11","t":"・連携の対象機関については、サービス等利用計画に位置付けられている又は位置付けられることが見込まれる福祉サービス等提供機関であり、具体的には、障害福祉サービス事業者、一般相談支援事業者、病院等、訪問看護事業所、企業、地方自治体等をいいます。・アを算定する場合は、面談日時、その内容の要旨に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。・イを算定する場合は、サービス担当者会議の出席者や開催日時、検討した内容の要旨及びそれを踏まえた対応方針に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。・ウを算定する場合は、会議の出席者や開催日時、検討した内容の要旨及びそれを踏まえた対応方針に関する記録を作成し、５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。"},{"s":"gl","p":147,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑧集中支援加算※報酬告示９、留意事項通知第四の 11","t":"・ウを算定する場合、居宅介護支援事業所等連携加算における会議参加と会議の趣旨、つなぎ先等が同様で、居宅介護支援事業所等連携加算を算定する場合は、本加算は算定できません。・エを算定する場合、医療・保育・教育機関等連携加算の「イ利用者への通院同行」における＜算定に当たっての留意事項＞と同様とします。・オを算定する場合、医療・保育・教育機関等連携加算の「ウ福祉サービス等提供機関への情報提供」における＜算定に当たっての留意事項＞と同様とします。"},{"s":"gl","p":148,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑨地域生活支援拠点等相談強化加算（700 単位/回）","t":"⑨地域生活支援拠点等相談強化加算（700 単位/回）※報酬告示 16、厚生労働大臣が定める基準 11、留意事項通知第四の 19※当該加算の算定には、本市に手続きを行うことが必要です。＜算定要件＞障害の特性に起因して生じた緊急の事態その他の緊急に支援が必要な事態が生じた者（以下、「要支援者」という。）又はその家族等からの要請に基づき、速やかに指定短期入所事業者に対して当該要支援者に関する必要な情報の提供及び当該指定短期入所の利用に関する調整（現に当該要支援者が指定短期入所を利用していない場合にあっては、サービス等利用計画の作成又は変更を含む。）を行った場合に算定を行います。＜算定に当たっての留意事項＞・当該加算は、地域生活支援拠点等の必要な相談機能として、地域の生活で生じる障害者等や家族の緊急事態において、迅速・確実な相談支援の実施及び短期入所の活用により、地域における生活の安心感を担保することを目的とするものであり、この加算の対象となる事業所については、地域生活支援拠点等であることを十分に踏まえ、当該加算の趣旨に合致した適切な運用を図られるよう留意が必要です。"},{"s":"gl","p":148,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑨地域生活支援拠点等相談強化加算（700 単位/回）","t":"・当該要支援者１人につき１月に４回を限度として算定できます。なお、当該加算は、他の指定特定相談支援事業所において指定計画相談支援を行っている要支援者又はその家族等からの要請に基づき連絡・調整を行った場合は算定できません。・ただし、当該要支援者が指定短期入所を含む障害福祉サービス等を利用していない場合においては、当該指定特定相談支援事業所によりサービス等利用計画の作成を行った場合は、当該計画作成に係るサービス利用支援費の算定に併せて算定できます。・また、指定自立生活援助事業所又は指定地域定着支援事業所と一体的に事業を行っている場合であって、かつ、当該指定自立生活援助事業所又は当該指定地域定着支援事業所において当該利用者に係る自立生活援助における緊急時支援加算又は地域定着支援サービス費を算定する場合は、指定特定相談支援事業所において当該加算を算定できません。"},{"s":"gl","p":148,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑨地域生活支援拠点等相談強化加算（700 単位/回）","t":"・当該加算の対象となる連絡・調整を行った場合は、要請のあった時間、要請の内容、連絡・調整を行った時刻及び地域生活支援拠点等相談強化加算の算定対象である旨を記録します。なお、作成した記録は５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。"},{"s":"gl","p":149,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑩地域体制強化共同支援加算（2,000 単位/月）","t":"⑩地域体制強化共同支援加算（2,000 単位/月）※報酬告示 17、厚生労働大臣が定める基準 12、留意事項通知第四の 20※当該加算の算定には、本市に手続きを行うことが必要です。＜算定要件＞支援が困難な利用者に対して、相談支援専門員又は相談支援員が、当該計画相談支援対象障害者等の同意を得て、当該計画相談支援対象障害者等に基準第２条第３項に規定する福祉サービス等を提供する事業者のうちいずれか３者以上と共同して、会議により情報共有及び支援内容を検討し、在宅での療養又は地域において生活する上で必要となる説明及び指導等の必要な支援を共同して実施するとともに、地域課題を整理し、協議会（法第 89 条の３第１項に規定する協議会をいう。）等に対し、文書により当該説明及び指導の内容等を報告した場合に、当該計画相談支援対象障害者等に対して指定サービス利用支援を行っている指定特定相談支援事業所において算定を行います。"},{"s":"gl","p":149,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑩地域体制強化共同支援加算（2,000 単位/月）","t":"＜算定に当たっての留意事項＞・当該加算は、指定特定相談支援事業所が把握した利用者の個別の課題から地域の課題を抽出し、協議会に参画した上で、地域の様々なニーズに対応できるサービス提供体制の確保や、地域の社会資源の連携体制の構築に向けた検討を推進することを目的とするものであることから、そのことを十分に踏まえ、当該加算の趣旨に合致した適切な運用を図られるよう留意が必要です。さらに、当該加算で協議会へ報告する事例として想定しているものとしては、利用者の支援に当たり、広く地域の関係者間で検討する必要性がある課題があるものであるため、事例の選定にあたってはその点に留意してください。・当該計画相談支援対象障害者等１人につき１月に１回を限度として所定単位数を算定できます。当該加算は、支援が困難な利用者に係る支援等を行う指定特定相談支援事業所のみが算定できるものですが、当該指定特定相談支援事業所の支援等に係る業務負担のみを評価するものではなく、その他の支援関係者の業務負担も評価する趣旨のものであるため、支援関係者が支援等を行うに当たり要した費用については、指定特定相談支援事業所が負担することが望ましいです。"},{"s":"gl","p":149,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑩地域体制強化共同支援加算（2,000 単位/月）","t":"・「地域体制強化共同支援加算報告書兼記録書」は本市ホームページに掲載しています。作成した記録は５年間保存するとともに、市町村長等から求めがあった場合については、提出しなければなりません。"},{"s":"gl","p":150,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑪地域生活支援拠点等機能強化加算（500 単位/回）","t":"⑪地域生活支援拠点等機能強化加算（500 単位/回）※報酬告示 1、厚生労働大臣が定める基準２、留意事項通知第四の３※本市では各区に基幹相談支援センターが整備されていること、また、３機関が中心となってコーディネーター的業務を担うことを踏まえ、当該加算を算定する事業所を想定していません。算定を希望する場合には、本市に事前にご相談ください。＜算定要件＞・当該加算は、障害者等の重度化・高齢化や親亡き後を見据え、地域生活障害者等（法第 77 条第３項に規定する地域生活障害者等をいう。）の緊急時に備えた相談や緊急時の対応、入院・入所からの地域移行の推進等、地域体制の構築を目的とする地域生活支援拠点等についての機能強化に資する取組を評価するものです。・計画相談支援及び障害児相談支援（機能強化型（継続）サービス利用支援費（（Ⅰ）又は（Ⅱ）"},{"s":"gl","p":150,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑪地域生活支援拠点等機能強化加算（500 単位/回）","t":"を算定する場合に限る。）と自立生活援助、地域移行支援及び地域定着支援の全てのサービスを一体的に運営していること又は拠点機能強化サービスに係る複数の事業者が地域生活支援拠点等のネットワークにおいて相互に連携して運営しており、かつ、市町村により地域生活支援拠点等に位置付けられた場合であって、相互の有機的な連携及び調整等の業務に従事する者（以下「拠点コーディネーター」という。が常勤で１以上配置されている事業所について加算します。＜拠点コーディネーターの要件及び業務＞・拠点コーディネーターについては、専ら当該地域生活支援拠点等におけるコーディネート業務に従事することを基本とし、原則として、拠点コーディネーターが他の職務を兼ねることはできません。"},{"s":"gl","p":151,"h":"5-29 報酬基準｜報酬③加算：その他の加算／⑫遠隔地訪問加算（300 単位/回）","t":"⑫遠隔地訪問加算（300 単位/回）※報酬告示 18、留意事項通知第四の 21＜算定要件＞・当該加算は、特別地域※に所在し、指定特定相談支援事業所との間に一定の距離がある利用者の居宅その他機関を訪問して所定の支援等を行う場合、当該訪問に相当な時間及び費用の負担が生じることを踏まえて算定を可能とするものです。※5-26 も参照ください。＜算定に当たっての留意事項＞➀対象となる加算当該加算は、以下に掲げる加算と合わせて算定するものです。(１) 初回加算指定計画相談支援の契約日からサービス等利用計画案を交付した日までの期間が 3 か月を超える場合で、3 か月が経過する日以後に月 2 回以上、利用者等に面接した場合(２) 入院時情報連携加算医療機関へ出向いて、当該医療機関の職員と面談し、必要な情報を提供した場合(３) 退院・退所加算(４) 居宅介護支援事業所等連携加算利用者等への訪問による面接（指定居宅介護支援等の利用関係、利用者等の雇用関係）した場合(５) 医療・保育・教育機関等連携加算「福祉サービス等提供機関の職員との面談等」又は「利用者への通院同行」(６) 集中支援加算「利用者等への訪問による面接」又は「利用者への通院同行」"},{"s":"gl","p":151,"h":"5-29 報酬基準｜報酬③加算：その他の加算／②対象区域","t":"②対象区域当該加算の算定対象となる訪問先については、指定特定相談支援事業所との間に一定の距離がある利用者の居宅その他機関であるが、一定の距離については、利用者の居宅その他機関への訪問に概ね片道 1 時間を要する距離とします。また、当該時間については、交通機関の運行頻度が少ない等により、合理的経路かつ最短時間となる移動方法を選択した場合の待機時間も含むものであることとします。➂加算の算定方法当該加算の算定に当たっては、300 単位に①の(1)から(6)までの算定回数の合計を乗じて得た単位数を算定するものとします。ただし、初回加算については、該当する月数（3 を限度とする。）を算定回数とします。例えば、当該月数が 2 の場合、当該加算は 300 単位に 2 を乗じて 600 単位を算定するものとします。"},{"s":"gl","p":152,"h":"5-29 報酬基準｜報酬③加算：その他の加算／②対象区域","t":"補足(再掲) ｜訪問・計画等交付・サービス担当者会議等実施確認表対応状況を把握するために、本表を利用者ごとに作成し、適宜記入してください。※区役所等に提出するものではありません。事業所での報酬算定に関する対応状況の管理記録として柔軟に活用してください。補足｜地域生活支援拠点関連加算を算定する場合の注意点地域生活支援拠点等相談強化加算及び地域体制強化共同支援加算を算定する場合は、事業所の運営規程に地域生活支援拠点である旨を規定し、体制届の提出が必要です。運営規程の「目的及び運営方針」又はそれに類する条項に『事業所は、地域生活支援拠点として障害のある方を地域全体で支えるサービス提供体制を担う。』と記載してください。併せて、事業所所在区の自立支援協議会に当該届出を行う旨と地域生活支援拠点として機能を担っていくことの報告をしてください。"},{"s":"gl","p":152,"h":"5-29 報酬基準｜報酬③加算：その他の加算／②対象区域","t":"また、地域生活支援拠点としての役割は「横浜市地域生活支援拠点機能構築のための連携ガイドライン」に記載されておりますので、必ずご確認ください。加えて、事業所所在区の自立支援協議会に参画していることや、積極的に緊急時予防・対応プランを作成していただくこと、地域のネットワーク作りにご尽力いただきますようお願いいたします。※令和６年度の報酬改定において、市町村が障害福祉サービス事業所等を地域生活支援拠点等に位置付ける際の手順等が示されました。体制届の提出とは別に、「地域生活支援拠点等の機能に関連する届出」が必要になります。詳細の手続きは、『地域生活支援拠点関連加算の取扱い及び「地域生活支援拠点等の機能に関連する届出」等について（通知）健障推第４９５号・令和６年５月９日』参照ください。"},{"s":"gl","p":153,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の考え方","t":"Q＆A コーナー｜加算の考え方加算のみの請求可否Q 平成 30 年度の報酬改定で創設された加算の中で、基本報酬を算定していない月でも請求可能な加算はあるか。また、当該加算を単独で請求した場合、当該加算に対して特定事業所加算などの体制加算を算定することは可能か。（国 QA(H30)VOL.1 問 80）A 「入院時情報連携加算」、「居宅介護支援事業所等連携加算」及び「サービス提供時モニタリング加算」については、当該利用者について基本報酬を算定しない月においても、当該加算のみでの請求が可能である。ただし、特定事業所加算などの体制加算は基本報酬にのみ加算されるため、「入院時情報連携加算」、「居宅介護支援事業所等連携加算」、及び「サービス提供時モニタリング加算」に対して算定することはできない。Q 令和３年度の報酬改定で創設された加算の中で、基本報酬を算定していない月でも請求可能な加算はあるか。（国 QA(R3)VOL.2 問 30）"},{"s":"gl","p":153,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の考え方","t":"A 以下の加算については、基本報酬を算定しない月にのみ算定可能である。"},{"s":"gl","p":153,"h":"5-29 報酬基準｜報酬③加算：その他の加算／②居宅介護支援事業所等連携加算、保育・教育等移行支援加算における「訪問」及び「","t":"②居宅介護支援事業所等連携加算、保育・教育等移行支援加算における「訪問」及び「会議参加」加算の支援内容が重複する場合Q 加算が複数創設されているが、既存の加算と支援の内容が重複する場合、どのように算定したらよいのか。（国 QA(R3)VOL.2 問 27）A 以下に記載する例のとおり、同一の支援業務においては複数の加算を算定することはできないため、いずれかの加算を選択し請求を行う必要がある。"},{"s":"gl","p":153,"h":"5-29 報酬基準｜報酬③加算：その他の加算／①居宅介護支援事業所等連携加算における「情報提供」及び「会議参加」と入院時情報連","t":"①居宅介護支援事業所等連携加算における「情報提供」及び「会議参加」と入院時情報連携加算"},{"s":"gl","p":153,"h":"5-29 報酬基準｜報酬③加算：その他の加算／②居宅介護支援事業所連携加算における「会議参加」と退院・退所加算","t":"②居宅介護支援事業所連携加算における「会議参加」と退院・退所加算"},{"s":"gl","p":153,"h":"5-29 報酬基準｜報酬③加算：その他の加算／③集中支援加算における「会議参加」と入院時情報連携加算（Ⅰ）及び退院・退所加算","t":"③集中支援加算における「会議参加」と入院時情報連携加算（Ⅰ）及び退院・退所加算"},{"s":"gl","p":154,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の記録について","t":"Q＆A コーナー｜加算の記録について記録の作成が必要な加算についてQ 記録の作成が必要な加算についてはどのように記録したら良いか。また、加算の算定要件となる業務の挙証資料については、基準省令で定める記録（相談支援台帳等）に記載、保管することで足りることとされたが、具体的にどのような記載事項を想定しているのか。（国 QA(R3)VOL.2 問 28）A 各加算（体制を評価する者を除く）の算定を挙証するためには、該当する支援について、以下の表に掲げる事項を含む記録の作成が必要である。これらは、基準省令第 30 条第２項に定める記録に必要事項の記載がある場合、別途重ねて記録を作成する必要はない。ただし、運営指導等において市町村等から求めがあった場合には直ちに提示できるよう整理し保管すること。なお、個々の利用者ごとに相談支援を提供した都度作成する支援経過等の記録や会議録が基準省令第 30 条第２項に定める記録に含まれるものとして一体的に管理・保存されている場合、当該記録や会議録を含めて当該基準省令に定める記録として取り扱うことができる。"},{"s":"gl","p":154,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の記録について","t":"例えば、関係機関が主催する利用者の支援の方向性を検討する会議に参加し、その会議録を当該基準省令に定める記録の一部として一体的に管理・保存した場合、集中支援加算（会議参加）を算定する場合であっても、別途加算を挙証するための記録を作成することは不要である。ただし、他機関が作成した会議録等を受領し、そのまま自事業所の記録へ転用することは適切でなく、加えて少なくとも自事業所の記録様式に自らの所見（考察）等を記録することが必要である。（平成 30 年度障害福祉サービス等報酬改定に関する Q&A（平成 30 年３月 30 日障害福祉課事務連絡）の別添資料 2 は廃止する）加算名記録に記載する事項【利用者及び家族への面接に係る加算】初回加算（重ねて算定する場合）集中支援加算（訪問）居宅介護事業所等連携加算（訪問）保育・教育等移行支援加算※１（訪問）"},{"s":"gl","p":154,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の記録について","t":"・利用者氏名・担当相談支援専門員氏名・面接を行った年月日、場所及び開始時刻・終了時刻・面接の内容入院時情報連携加算（Ⅰ）・利用者氏名・担当相談支援専門員氏名・機関名、対応者氏名・開催年月日、場所及び開始時刻、終了時刻・情報共有や情報提供等の概要退院・退所加算医療・保育・教育連携加算・利用者氏名・担当相談支援専門員氏名・機関名・対応者氏名・開催年月日、場所及び開始時刻、終了時刻・情報交換等の内容、情報交換の結果からサービス等利用計画に反映されるべき事項"},{"s":"gl","p":155,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算の記録について","t":"Q＆A コーナー｜加算の記録について記録の作成が必要な加算について（続き）加算名記録に記載する事項【会議の開催、参加に係る加算】集中支援加算（会議開催、会議参加）居宅介護事業所等連携加算（会議参加）サービス担当者会議実施加算保育・教育等移行支援加算※１（会議参加）・利用者氏名・担当相談支援専門員氏名・開始年月日、場所、開始時刻・終了時刻及び出席者（氏名、所属・職種）・検討内容の概要※（例：支援の経過、支援上の課題、課題への対応策）※検討事項等に係る詳細については留意事項通知のとおり。サービス提供時モニタリング加算・利用者氏名・担当相談支援専門員氏名・訪問した機関名、場所及び対応者氏名・訪問年月日、開始時刻、終了時刻・確認した障害福祉サービスにおけるサービスの提供状況・サービス提供時の利用者の状況・その他必要な事項※１「保育・教育等移行支援加算」は障害児相談支援のみの加算です。"},{"s":"gl","p":156,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算における連携先について","t":"Q＆A コーナー｜加算における連携先について各種加算における連携先についてQ 居宅介護支援事業所等連携加算、保育・教育等移行支援加算、集中支援加算の連携先はどこまで含まれるのか。（国 QA(R3)VOL.2 問 35）A それぞれ、主な連携先は以下を想定している。加算名連携（つなぎ）先居宅介護支援事業所等連携加算（介護保険への移行、進学、企業等への就職による障害福祉サービス利用終了時）指定居宅介護支援事業所、指定居宅介護予防支援事業所、保育所、幼稚園、認定こども園、小学校、中学校、高等学校、専修学校、大学、特別支援学校、企業及び障害者就業・生活支援センター保育・教育等移行支援加算※１（進学、企業等への就職による障害児通所支援利用終了時）保育所、幼稚園、認定こども園、小学校、中学校、高等学校、専修学校、大学、特別支援学校、企業及び障碍者就業・生活支援センター集中支援加算障害福祉サービス事業者、一般相談支援事業者、障害児通所支援事業者、障害児入所支援施設、指定発達支援医療機関、病院、企業、保育所、幼稚園、小学校認定こども園、中学校、高等学校、専修学校、大学、特別支援学校、公的な支援機関や他法他施策に基づく支援機関（※）及び地方自治体（※）公的な支援機関や他法他施策に基づく支援機関の例保護観察所、公共職業安定所、保健センター、地域包括支援センター、利用者支援事業、自立相談支援機関、包括的相談支援事業、他期間共同事業、居住支援法人、精神保健福祉センター、保健所、更生相談所、児童相談所、発達障害者支援センター、高次脳機能障害者支援センター、難病相談支援センター、地域生活定借支援センター、子ども家庭支援センター、配偶者暴力相談支援センター、女性センター※１「保育・教育等移行支援加算」は障害児相談支援のみの加算です。"},{"s":"gl","p":156,"h":"5-29 報酬基準｜報酬③加算：その他の加算／ Q＆A コーナー｜加算における連携先について","t":"Q 「医療・保育・教育機関等連携加算」の連携先はどこまで含まれるのか。（国 QA(Ｈ30) VOL.１問 83）A サービス等利用計画又は障害児支援利用計画（以下「サービス等利用計画等」という。）を作成する際に、利用者が利用している病院、企業、保育所、幼稚園、小学校、特別支援学校と連携することが想定されるが、その他にも利用者が利用しているインフォーマルサービスの提供事業所等が想定される。なお、これらの障害福祉サービス等以外の機関における支援内容や担当者等についても、サービス等利用計画等に位置付けることが望ましい。"},{"s":"gl","p":157,"h":"5-30 報酬基準｜事業所変更の対応と計画相談支援給付費の請求","t":"■十分な調整が必要・事業所が変更になる場合には、その予定等を事前に確認し、指定特定相談支援事業者に円滑に引き継げる（引継ぎを受けられる）ように配慮することが求められます。・月途中での引継ぎは原則できません。必ず月単位で引継ぎを行ってください。・支給決定期間の途中で事業所が変更となった際に、計画相談事業所のみを変更する場合（支援方針や利用サービス、居住地などの変更を伴わない）は、既存のサービス等利用計画を引き継ぐため、再作成は不要です。・事業所変更の場合には、区役所への届け出が必要です。区役所で変更手続きを行うように、利用者にご案内ください。（事務処理要領Ⅳ３）・また、利用者との契約を終了した場合は「契約内容報告書」を区役所へ提出します。■報酬算定の考え方は通常と同じ・同一月に変更前の事業所と変更後の事業所がモニタリングを行っても、どちらか一方のみの請求となります。"},{"s":"gl","p":157,"h":"5-30 報酬基準｜事業所変更の対応と計画相談支援給付費の請求","t":"・同一月に変更前の事業所がモニタリングをし、変更後の事業所が計画作成をした場合、変更後の事業所の計画作成費のみしか請求はできません。そのため、更新月に合わせて事業所を変更する場合は、モニタリングを実施し新しい計画案を作成するまでを担当するか、モニタリング実施から次の事業所が引継ぐか、いずれかで対応してください。■市外への転出・転入の報酬算定・市外への転出・転入に伴い、支給決定を行う市町村が変わった場合は、同一の月であってもサービス利用支援費又は継続サービス利用支援費を算定できます。・どのように対応するかは、事前に関係者と確認をしてください。補足｜事業所変更時の対応※基準第 16 条、解釈通知第二の２（12）指定特定相談支援事業者は、利用者等が他の指定特定相談支援事業者の利用を希望する場合その他利用者等から申出があった場合には、当該利用者等に対し、直近のサービス等利用計画及びその実施状況に関する書類を交付しなければなりません。"},{"s":"gl","p":158,"h":"5-30 報酬基準｜事業所変更の対応と計画相談支援給付費の請求／ Q＆A コーナー｜算定の考え方","t":"Q＆A コーナー｜算定の考え方継続サービス利用支援費の算定の考え方Q 契約変更前の指定特定相談支援事業者が継続サービス利用支援を行った場合は、同一月に契約変更後の指定特定相談支援事業者は継続サービス利用支援費を算定できるか。（国 QA 問 65）A 契約変更後の指定特定相談支援事業者が継続サービス利用支援を行った場合には、継続サービス利用支援費を算定できる。ただし、その場合には、継続サービス利用支援費は月額報酬のため同一の月に複数回行ったとしても１回しか算定することはできないことから、契約変更前の指定特定相談支援事業者は継続サービス利用支援費を算定できない。（報酬告示１の注２参照）このような場合、変更前の指定特定相談支援事業者は、転居等に関する利用者の意向を確認しておくべきである。なお、契約変更後の指定特定相談支援事業者にケースを引き継ぐ場合には、ケースを円滑に引き継げるよう配慮すること。"},{"s":"gl","p":158,"h":"5-30 報酬基準｜事業所変更の対応と計画相談支援給付費の請求／ Q＆A コーナー｜算定の考え方","t":"サービス利用支援費と継続サービス利用支援費の算定の考え方①Q 障害福祉サービス等の支給決定の終期月等において継続サービス利用支援を行った後に、別の指定特定相談支援事業者が同一の月にサービス利用支援を行った場合、契約変更前の指定特定相談支援事業者は継続サービス利用支援費を、契約変更後の指定特定相談支援事業者はサービス利用支援費を算定できるか。（国 QA 問 66）A 同一の月に継続サービス利用支援を行った後に、サービス利用支援を行った場合は、継続サービス利用支援費は算定せず、サービス利用支援費のみを算定することとされているため、契約変更前の指定特定相談支援事業者は継続サービス利用支援費を算定できず、契約変更後の指定特定相談支援事業者のみサービス利用支援費を算定する。サービス利用支援費と継続サービス利用支援費の算定の考え方②Q サービス利用支援を行った後に、指定特定相談支援事業者の廃止や利用者の市町村内の転居等により、別の指定特定相談支援事業者に契約変更した場合であって、同一の月に契約変更後の指定特定相談支援事業者が、契約変更前の指定特定相談支援事業者からサービス等利用計画を引き継ぎ、利用者の状況を把握するため利用者と面接したり、サービス担当者会議を行う等モニタリングを行った場合に、契約変更前の指定特定相談支援事業者はサービス利用支援費を、契約変更後の指定特定相談支援事業者は継続サービス利用支援費を算定することは可能と考えるが、いかがか。（国 QA 問 67）"},{"s":"gl","p":159,"h":"5-30 報酬基準｜事業所変更の対応と計画相談支援給付費の請求／ Q＆A コーナー｜算定の考え方","t":"Q＆A コーナー｜算定の考え方転出・転入時の算定の考え方Q サービス利用支援又は継続サービス利用支援を行った後に、利用者が市町村外に転出し、同一の月に転出先の市町村で障害福祉サービス等の申請に係るサービス利用支援を別の指定特定相談支援事業者が行った場合、両方の指定特定相談支援事業者が計画相談支援給付費を算定できると考えるが、いかがか。（国 QA 問 68）A お見込みのとおり。転出に伴い支給決定を行う市町村が変わった場合は、同一の月であってもサービス利用支援費又は継続サービス利用支援費を算定できる。この場合、指定特定相談支援事業者は、利用者の転出予定等を事前に確認しておくべきであり、転出先の指定特定相談支援事業者に円滑に引き継げるよう配慮すること。"},{"s":"gl","p":160,"h":"5-31 報酬基準｜計画相談支援費の請求のタイミング※国 QA 問 44、45","t":"■書類を利用者・区役所等に交付した後に請求・計画作成費については、"},{"s":"gl","p":160,"h":"5-31 報酬基準｜計画相談支援費の請求のタイミング※国 QA 問 44、45 ／①区役所から障害福祉サービス等の支給決定を受けた後に、","t":"①区役所から障害福祉サービス等の支給決定を受けた後に、"},{"s":"gl","p":160,"h":"5-31 報酬基準｜計画相談支援費の請求のタイミング※国 QA 問 44、45 ／②サービス担当者会議を踏まえたサービス等利用計画を作成し、","t":"②サービス担当者会議を踏まえたサービス等利用計画を作成し、"},{"s":"gl","p":160,"h":"5-31 報酬基準｜計画相談支援費の請求のタイミング※国 QA 問 44、45 ／④その写しを本人、サービス提供事業所、区役所※に提出したうえで、","t":"④その写しを本人、サービス提供事業所、区役所※に提出したうえで、"},{"s":"gl","p":160,"h":"5-31 報酬基準｜計画相談支援費の請求のタイミング※国 QA 問 44、45 ／⑤請求を行う取扱としています。","t":"⑤請求を行う取扱としています。※確定させたサービス等利用計画の区役所への提出は、サービス等利用計画案から変更がない場合には電話等により区役所に連絡することで省略可能です。・モニタリング作成費については、"},{"s":"gl","p":160,"h":"5-31 報酬基準｜計画相談支援費の請求のタイミング※国 QA 問 44、45 ／④その写しを本人、原本を区役所、サービス提供事業所※に提出したうえで","t":"④その写しを本人、原本を区役所、サービス提供事業所※に提出したうえで、"},{"s":"gl","p":160,"h":"5-31 報酬基準｜計画相談支援費の請求のタイミング※国 QA 問 44、45 ／⑤請求を行う取扱としています。","t":"⑤請求を行う取扱としています。※モニタリング報告書のサービス提供事業所への提出は、サービス提供事業所からの申し出を受け、利用者の同意を得たうえで提供します。補足(再掲) ｜請求の取り下げ請求の取り下げをする場合には、横浜市電子申請システムを通じて申請します。初回申請時に申請者 ID を取得し、各月最終開庁日前日までに電子申請フォームより過誤申立の申請を行ってください。計画相談支援の過誤申立は【全国システム用】フォームを使用してください。※詳細は、横浜市ホームページに掲載されています。横浜市トップページ＞「暮らし・総合」＞電子申請＞「過誤申立」で検索補足(再掲) ｜請求に関する問い合わせ・請求の手続きは、インターネット上の「電子請求受付システム」を通じて行います。・請求システムや請求方法等に関する問合せは、神奈川県国民健康保険団体連合会電話番号：045－329－3416・請求エラーが出た場合で、請求情報を再確認してもなお原因が分からない場合の問合せは、横浜市健康福祉局障害施策推進課電話番号： 045－671－4133"},{"s":"gl","p":161,"h":"5-31 報酬基準｜計画相談支援費の請求のタイミング※国 QA 問 44、45 ／⑤請求を行う取扱としています。","t":"第６章横浜市の指定特定相談支援事業者としてのその他の対応【本章の目的】★“横浜市”の指定特定相談支援事業者として活動する"},{"s":"gl","p":162,"h":"6-1 障害福祉情報サービスかながわ及び横浜市のホームページの定期的な確認","t":"■研修、集団指導などのお知らせや最新の情報を確認障害福祉情報サービスかながわ及び横浜市のホームページを用い、研修や集団指導などのお知らせを行うとともに、集団指導時の資料や最新の情報を掲載します。必ず両方のホームページを定期的に確認してください。また、障害福祉情報サービスかながわのメール機能を使って、本市からの重要な情報や緊急のお知らせを配信していますので、メールアドレスの登録をお願いします。登録の方法は、「障害福祉情報サービスかながわ事業者管理操作マニュアル」で確認してください。（障害福祉情報サービスかながわトップページ＞書式ライブラリ＞10.利用マニュアル・振興会からのお知らせ等＞操作マニュアル）・横浜市相談系サービス（事業所向けページ）https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html指定特定相談支援事業所のみなさま向けに業務ガイドラインなどのマニュアルや集団指導及び運営指導の資料、サービス等利用計画の様式をはじめとした各種様式、お役立ち通信などの情報を掲載しています。"},{"s":"gl","p":162,"h":"6-1 障害福祉情報サービスかながわ及び横浜市のホームページの定期的な確認","t":"・横浜市障害者相談支援（利用者向けページ）https://www.city.yokohama.lg.jp/kurashi/fukushi-kaigo/fukushi/annai/madoguchi/sogo/soudan\u0002jigyosha.html障害福祉サービス等の利用者向けに市内指定特定相談支援事業所のリストや受入可能状況リスト、セルフプラン参考様式などを掲載しています。・障害福祉情報サービスかながわ（通称「らくらく」）https://www.rakuraku.or.jp/shienhi/指定特定相談支援事業所のみなさま向けに集団指導や各種研修のご案内など大切なお知らせを掲載しています。また、変更届や体制届等の様式類もこちらからダウンロードしてください。"},{"s":"gl","p":163,"h":"6-2 横浜市からの依頼への対応（運営指導、照会等）","t":"■横浜市の指定特定相談支援事業者としての協力定期的に運営指導や各種照会への回答を依頼させていただきます。その際には、協力をお願いいたします。■適切な事業運営を確認するための運営指導・運営指導では、本ガイドラインに則した運営がされているかどうかを確認させていただきます。日頃から適切な事業運営を実施し、いつ運営指導が行われても大丈夫なように取り組んでください。・概ね３年に１度実施します。実施に当たっては運営指導日の約１，２か月前に電話にて日程を確認し、文書にて通知します。運営指導日の約一週間前までに事前提出資料等のご提出をお願いいたします。・当日準備していただく資料や事前提出資料については、横浜市のホームページに掲載していますので、必要に応じてご確認ください。実施が決まった事業所のみならず、日頃のセルフチェックとしてもご活用ください。"},{"s":"gl","p":163,"h":"6-2 横浜市からの依頼への対応（運営指導、照会等）","t":"■受入可能状況調査への協力横浜市では計画相談支援の推進の取り組みの一つとして、「指定特定相談支援事業所受入可能状況調査」を実施しています。本調査にご回答いただいた内容はリスト化し、各区役所へ情報提供を行うほか、本市ホームページ（利用者向けページ）への掲載等により計画相談利用希望者へ周知します。この情報を基に計画相談の利用を希望する方と、新規利用者を受け入れることができる事業所の間でさらなる計画相談導入の推進を目的としています。本市ホームページに掲載しているリストを基準とし（以下、「基準リスト」。）、そこから変更があった場合や新規に登録したい場合は、毎月 10 日までに電子申請システムからご回答いただき、その内容等を反映していきます。（基準リストに記載されている内容に変更がない場合、回答は不要です。）【電子申請システム・回答フォーム】https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/a86f882b-3273-4033-9f42-3ee2637bc795/start"},{"s":"gl","p":164,"h":"6-3 集団指導への参加及び職員への伝達","t":"■毎年６月頃に開催・毎年６月頃に集団指導を実施します。集団指導では、最新の法改正の内容や運営指導等を通じて把握した間違いやすい点等を説明させていただきます。適正な事業運営のために必要な情報を提供しますので、必ず参加してください。・また、集団指導にて確認した内容については、必ず当該事業所の職員に伝達し、共有を図ってください。・集団指導のお知らせは、障害福祉情報サービスかながわのホームページにて行うとともに、当日の資料も同ホームページに掲載します。集団指導への参加にあたっては、当日資料を事前に印刷し、持参してください。"},{"s":"gl","p":165,"h":"6-4 区役所、基幹相談支援センター、精神障害者生活支援センター等との連携","t":"■各区における障害のある方への相談支援の中核機関本市では、区役所、基幹相談支援センター、精神障害者生活支援センターを各区に１か所ずつ設置しています。この３機関は、＜両輪＞の関係として、各区における障害のある方の相談支援を牽引していく機関です。障害のある方の地域生活の支援においては、この３機関をはじめとした関係機関等と連携し、その充実を図ってください。■基幹相談支援センターによるフォローの実施・基幹相談支援センターは、本市から委託を受けた機関であり、その委託業務の一つとして指定特定相談支援事業所へのフォローを位置付けています。新規で開設した指定特定相談支援事業所には同行訪問を行い、直接的な OJT を実施するほか、既存の指定特定事業所に対しても定期的に訪問させていただきます。ぜひともその機会を活用し、日頃の悩みや不明点等を確認してください。"},{"s":"gl","p":165,"h":"6-4 区役所、基幹相談支援センター、精神障害者生活支援センター等との連携","t":"・各指定特定相談支援事業所へのフォローは、事業所所在区の基幹相談支援センターが担います。本市ホームページに連絡先を掲載していますので、指定特定相談支援事業者として活動を開始した際には、必ず担当の基幹相談支援センターに連絡してください。補足｜指定特定相談支援事業者に関わる基幹相談支援センターの業務基準（抜粋）基幹相談支援センターの業務は、①総合的・専門的な相談支援の実施、②地域の相談支援体制の強化の取組、③地域移行・地域定着の促進の取組、④権利擁護・虐待の防止、⑤その他地域の状況に応じた独自の取組の５つの柱で成り立っています。このうち、②地域の相談支援体制の強化の取組として、指定特定相談支援事業者へのフォローの実施を位置付けています。・新規指定特定相談支援事業者等との同行訪問の実施（初回訪問３回以上）・指定特定相談支援事業者への訪問（区内の各事業者に年数回以上）"},{"s":"gl","p":165,"h":"6-4 区役所、基幹相談支援センター、精神障害者生活支援センター等との連携","t":"・区内の指定特定相談支援事業者等を対象としたサービス等利用計画作成に必要となる事業等に関する研修会や事例検討会、相談支援部会の開催等"},{"s":"gl","p":166,"h":"6-5 各区障害者自立支援協議会（相談支援部会）への参画","t":"■相談支援部会への参画は義務・本市では、各区障害者自立支援協議会に相談支援部会を設置しています。そこでは、相談支援の質の向上に向け、相談支援専門員を対象とした研修や事例検討会等を開催しています。・相談支援専門員の多くが一人職場で働いている中では、この相談支援部会は仲間とつながる貴重な機会です。そして、仲間とともに、日頃の支援を振り返り、その相談支援の質を高める場にもなります。・本市における指定特定相談支援事業者の相談支援専門員には、本部会への参画を必須としています。まだ参画していない場合には、事業所所在区の基幹相談支援センターへ連絡し、参画に向けた調整を行ってください。なお、相談支援部会に参画していない状況が確認された場合には、運営指導の対象としての優先順位を上げ、状況の確認を行うことがあります。※事業所所在区の相談支援部会への参画は必須です。それに加えて、事業所所在区以外の部会にも参画ができます。その場合には、希望区の基幹相談支援センターに連絡してください。"},{"s":"gl","p":166,"h":"6-5 各区障害者自立支援協議会（相談支援部会）への参画","t":"■事例提供、サービス等利用計画の相互確認、担当件数・受入空き状況等の確認への協力・相談支援専門員は、相談支援部会に参加するのではなく、参画することが求められます。したがって、事例検討時の事例提供への協力をはじめ、意義ある場とするために積極的に活動することが必要です。・また、相談支援部会は、日頃の支援を振り返り、支援の質を高め合っていく場です。そのため、サービス等利用計画についての相互確認も行います。完璧なサービス等利用計画はありませんので、安心してお互いの計画を確認し合い、利用者への相談支援の質の向上に向けて、取り組んでください。・本市では、指定特定相談支援事業者が不足していることから、各事業者の担当件数や受入空き状況等の定期的な確認をさせていただきます。相談支援部会で把握した情報をもとに、利用者を計画相談支援へとつなげられるように調整を行いますので、ご協力をお願いします。"},{"s":"gl","p":167,"h":"6-6 各種届出の対応※施行規則第 34 条の 60","t":"■速やかに届け出るいくら基準に則した運営を行っていたとしても、本市にその届け出を漏れなく提出していなければ無効となります。届出は遅延なく、速やかに行ってください。※障害福祉情報サービスかながわホームページに様式を掲載しています。トップページ＞書式ライブラリ＞２．横浜市からのお知らせ＞③変更等に関する届出等様式（障害者総合支援法）■変更届は変更の日から 10 日以内に提出！下記の事項に変更があった場合、変更の日から 10 日以内に本市に届け出ることが必要です。1 事業所（施設）の名称 9 相談支援専門員の氏名および住所2 事業所（施設）の所在地（設置の場所） 10 主たる対象者3 申請者の名称（申請法人の名称） 11 運営規程4 主たる事務所の所在地（法人の所在地） 12 介護給付費の請求に関する事項5 代表者の氏名および住所（法人の代表者） 13 当該申請に係る事業の開始予定年月日"},{"s":"gl","p":6,"h":"6-6 各種届出の対応※施行規則第 34 条の 60","t":"定款・寄附行為およびその登記事項証明書又は条例等（当該指定に係る事業に関するものに限る）14 同一敷地内にある入所施設および病院の概要7 事業所（施設）の平面図および設備の概要 15 役員の氏名および住所8 事業所（施設）の管理者の氏名および住所 16指定地域相談支援の提供にあたる者の氏名および住所【各種届出の提出方法】令和４年９月より郵送から「電子申請（データアップロード方式）」に変更になりました。申請に必要なデータ（提出が必要な書類のデータ、エクセルや PDF 等）を準備後、横浜市電子申請システムにて申請をお願いします。・（指定障害福祉サービス等事業者）体制等に関する届出書https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/3c02990f-61fd\u00024998-af5c-ec47897fefc2/start・（指定障害福祉サービス等事業者）変更届、廃止届、休止届、再開届https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/05bb00c2-4afc\u000246ad-92ae-e3512d502f0d/start"},{"s":"gl","p":168,"h":"6-6 各種届出の対応※施行規則第 34 条の 60","t":"■体制届・各種加算・減算を新たに算定する場合、算定を終了する場合、または加算・減算の種類が変更になる場合は、「介護給付費等算定に係る体制等に関する届出書」の提出が必要です。・毎月 15 日までに届出があった場合、翌月から適用になります（加算される場合）が、16 日以降の届出に関しては、翌々月からの適用になります。ただし、減算になる場合は、15 日以降の届出でも、翌月からの適用となります。・体制が整備された時点から届出が可能となりますので、見込みでは届出はできません。例えば、６月に配置をする予定であり、早めに体制届を５月に提出することはできません。・障害福祉サービス等の報酬改定の年度については、全事業所が４月に体制届の提出が必要です。届出期間については、通常の期間と異なりますので、ご注意ください。■事業の廃止・休止・再開の届出・事業を廃止・休止・再開を行う場合は、まず、所管課へご相談の連絡をした上で、本市に事前に届け出る必要があります。廃止及び休止の場合には【廃止、休止の日の１か月前】、再開の場合には【再開の日から 10 日以内】が提出期限です。"},{"s":"gl","p":168,"h":"6-6 各種届出の対応※施行規則第 34 条の 60","t":"・休止期間は最長１年としてください。期間が終了した後、継続して休止する場合、再度届出が必要となります。・また、指定更新時においては、休止の延長はできません。再開又は廃止を選択してください。・休止及び廃止時に利用者がいる場合は、本人の意向を確認し必要に応じて他事業所へ引継ぐなど対応を行ってください。"},{"s":"gl","p":169,"h":"6-6 各種届出の対応※施行規則第 34 条の 60","t":"■指定更新の届出・６年間の指定有効期間満了後に引き続き指定を受けようとする場合には指定更新が必要です。引き続き指定を受けようとする場合は、申請受付期間に申請を行ってください。指定更新を受けなければ、有効期間の満了によりその効力を失いますのでご注意ください。・本市では、原則、指定有効期間満了日が属する月の前月１か月間を指定更新の申請受付期間とします。ただし、例年、４月１日及び 10 月１日の指定に関しては、他の月に比較し対象数が非常に多いため、指定更新の申請受付期間を指定有効期間満了日が属する月の前々月（２か月前）の１か月間とします。※障害福祉情報サービスかながわホームページに様式を掲載しています。補足｜廃止及び休止時の対応※法第 51 条の 24 の３、施行規則第 34 条の 60 の３・指定相談支援事業者は、次条第４項の規定による事業の廃止又は休止の届け出をしたときは、当該届け出の日前一月以内に当該指定計画相談支援を受けていた者であって、当該事業の廃止又は休止の日以後においても引き続き当該指定計画相談支援に相当するサービスの提供を希望する者に対し、必要な計画相談支援が継続的に提供されるよう、他の指定特定相談支援事業者その他関係者との連絡調整その他の便宜の提供を行わなければなりません。"},{"s":"gl","p":169,"h":"6-6 各種届出の対応※施行規則第 34 条の 60","t":"・したがって、指定特定相談支援事業者は、当該指定計画相談支援の事業を廃止し、又は休止しようとするときは、その廃止又は休止の日の一月前までに、次に掲げる事項を当該指定特定相談支援事業者の事業所の所在地を管轄する市町村長に届け出なければなりません。"},{"s":"gl","p":169,"h":"6-6 各種届出の対応※施行規則第 34 条の 60 ／③現に指定計画相談支援を受けている者に対する措置","t":"③現に指定計画相談支援を受けている者に対する措置現に当該指定計画相談支援を受けている者に対する措置現に当該指定計画相談支援を受けている者の氏名、連絡先、受給者証番号及び引き続き当該指定計画相談支援に相当するサービスの提供を希望する旨の申出の有無引き続き当該指定計画相談支援に相当するサービスの提供を希望する者に対し、必要な計画相談支援を継続的に提供する他の指定特定相談支援事業者の名称"},{"s":"gl","p":169,"h":"6-6 各種届出の対応※施行規則第 34 条の 60 ／④休止しようとする場合にあっては、休止の予定期間","t":"④休止しようとする場合にあっては、休止の予定期間令和６年 11 月発行横浜市健康福祉局障害施策推進課電話：045-671-4133 FAX：045-671-3566メール：kf-shiteisoudan@city.yokohama.jpＵＲＬ：https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html"},{"s":"r8","p":1,"h":"令和８年度","t":"令和８年度相談系サービス事業所集団指導健康福祉局障害施策推進課TEL：671-4133令和８年６月18日目次１共通事項 P.1２計画相談支援 P.67３障害児相談支援 P.156４地域相談支援 P.182５自立生活援助 P.216６相談支援実践の向上のために P.239７相談支援と地域課題への取組 P.260８強度行動障害者集中的支援事業 P.287９施設入所者の地域移行に関する移動支援の特例適用について P.29310 その他 P.302共通事項健康福祉局障害施策推進課TEL：671-4133"},{"s":"r8","p":2,"h":"相談系サービスの","t":"相談系サービスの根拠法令等について※本集団指導では各事業のスライドにおいて法や基準と省略して記載しますが、それぞれの基準に読み替えてください。"},{"s":"r8","p":3,"h":"計画相談支援に関する法令等","t":"計画相談支援に関する法令等・障害者の日常生活及び社会生活を総合的に支援するための法律（以下、「法」又は「障害者総合支援法」と記載）・障害者総合支援法に基づく指定計画相談支援の事業の人員及び運営に関する基準（以下、「基準」と記載）・障害者総合支援法に基づく指定計画相談支援の事業の人員及び運営に関する基準について（以下、「解釈通知」と記載）・障害者総合支援法に基づく指定計画相談支援に要する費用の額の算定に関する基準（以下、「報酬告示」と記載）・障害者総合支援法に基づく指定障害福祉サービス等及び基準該当障害福祉サービスに要する費用の額の算定に関する基準等の制定に伴う実施上の留意事項について（以下、「留意事項通知」と記載）"},{"s":"r8","p":4,"h":"計画相談支援における基準の性格（解釈通知第一）","t":"計画相談支援における基準の性格（解釈通知第一）基準は、指定計画相談支援の事業がその目的を達成するため、必要な最低限度の基準を定めたものであり、指定特定相談支援事業者は、常にその事業の運営の向上に努めなければなりません。指定特定相談支援事業者が満たすべき基準を満たさない場合には、指定特定相談支援事業者の指定を受けられません。また、運営開始後、基準に違反することが明らかになった場合は、市町村長の指導等の対象となり、この指導等に従わない場合には、当該指定を取り消すことができます。"},{"s":"r8","p":5,"h":"計画相談支援における基準の性格（解釈通知第一）","t":"計画相談支援における基準の性格（解釈通知第一）指定特定相談支援事業者が運営に関する基準に従って事業の運営をすることができなくなったことを理由として指定が取り消され、法に定める期間の経過後に再度当該事業者から指定特定相談支援事業所についての指定の申請がなされた場合には、当該事業者が運営に関する基準を遵守することを確保することに特段の注意が必要であり、その改善状況等が確認されない限り指定を行いません。"},{"s":"r8","p":6,"h":"地域相談支援に関する法令等","t":"地域相談支援に関する法令等・障害者の日常生活及び社会生活を総合的に支援するための法律（以下、「法」又は「障害者総合支援法」と記載）・障害者総合支援法に基づく指定地域相談支援の事業の人員及び運営に関する基準（以下、「基準」と記載）・障害者総合支援法に基づく指定地域相談支援の事業の人員及び運営に関する基準について（以下、「解釈通知」と記載）・障害者総合支援法に基づく指定地域相談支援に要する費用の額の算定に関する基準（以下、「報酬告示」と記載）・障害者総合支援法に基づく指定障害福祉サービス等及び基準該当障害福祉サービスに要する費用の額の算定に関する基準等の制定に伴う実施上の留意事項について（以下、「留意事項通知」と記載）"},{"s":"r8","p":7,"h":"地域相談における基準の性格（解釈通知第一）","t":"地域相談における基準の性格（解釈通知第一）基準は、指定地域相談支援の事業がその目的を達成するため、必要な最低限度の基準を定めたものであり、指定一般相談支援事業者は、常にその事業の運営の向上に努めなければならない。指定一般相談支援事業者が満たすべき基準を満たさない場合には、指定一般相談支援事業者の指定を受けられない。また、運営開始後、基準に違反することが明らかになった場合は、都道府県知事の指導等の対象となり、この指導等に従わない場合には、当該指定を取り消すことができる。"},{"s":"r8","p":8,"h":"地域相談における基準の性格（解釈通知第一）","t":"地域相談における基準の性格（解釈通知第一）指定一般相談支援事業者が運営に関する基準に従って事業の運営をすることができなくなったことを理由として指定が取り消され、法に定める期間の経過後に再度当該事業者から指定一般相談支援事業所についての指定の申請がなされた場合には、当該事業者が運営に関する基準を遵守することを確保することに特段の注意が必要であり、その改善状況等が確認されない限り指定を行わない。"},{"s":"r8","p":9,"h":"自立生活援助に関する法令等","t":"自立生活援助に関する法令等・障害者の日常生活及び社会生活を総合的に支援するための法律（以下、「法」又は「障害者総合支援法」と記載）・障害者総合支援法に基づく指定障害福祉サービスの事業等の人員、設備及び運営に関する基準（以下、「基準」と記載）・障害者総合支援法に基づく指定障害福祉サービスの事業等の人員、設備及び運営に関する基準について（以下、「解釈通知」と記載）・障害者総合支援法に基づく指定障害福祉サービス等及び基準該当障害福祉サービスに要する費用の額の算定に関する基準（以下、「報酬告示」と記載）・障害者総合支援法に基づく指定障害福祉サービス等及び基準該当障害福祉サービスに要する費用の額の算定に関する基準等の制定に伴う実施上の留意事項について（以下、「留意事項通知」と記載）・横浜市指定障害福祉サービスの事業等の人員、設備、運営等の基準に関する条例（以下、「基準条例」と記載）"},{"s":"r8","p":10,"h":"自立生活援助における基準の性格","t":"自立生活援助における基準の性格（解釈通知第一）基準は、指定障害福祉サービス事業者等が法に規定する便宜を適切に実施するため、必要な最低限度の基準を定めたものであり、指定障害福祉サービス事業者等は、常にその運営の向上に努めなければならない。指定障害福祉サービスを行う者又は行おうとする者が満たすべき基準を満たさない場合には、指定障害福祉サービス事業者等の指定等又は更新は受けられない。また、運営開始後、基準に違反することが明らかになった場合は、都道府県知事の指導等の対象となり、この指導等に従わない場合には、当該指定を取り消すことができる。"},{"s":"r8","p":11,"h":"自立生活援助にける基準の性格（解釈通知第一）","t":"自立生活援助にける基準の性格（解釈通知第一）指定障害福祉サービス事業者等が運営に関する基準に従って事業の運営をすることができなくなったことを理由として指定が取り消され、法に定める期間の経過後に再度当該事業者から指定障害福祉サービス事業者等についての指定の申請がなされた場合には、当該事業者が運営に関する基準を遵守することを確保することに特段の注意が必要であり、その改善状況等が確認されない限り指定を行わない。"},{"s":"r8","p":13,"h":"指導・監査内容","t":"指導・監査内容指導運営指導（従来は実地指導）法令等の基準に定めるサービスの取扱い、給付費の請求等について、周知徹底することを目的として、事業者の事業所において、概ね３年に１度、原則実地で行う。集団指導事業者に対して、必要な指導の内容に応じ、講習等の方法により行う。監査サービスの取扱いや給付費の請求等について、基準違反、不正又は著しい不当等が認められる場合若しくは疑われる場合において、事実関係を明確に把握し、公正かつ適切な措置をとることを主眼として行う。横浜市が行う指導・監査の実施形態"},{"s":"r8","p":14,"h":"集団指導の役割","t":"集団指導の役割●基準省令や報酬告示、横浜市のルールなどを確認する場●障害福祉サービス等の制度や要件などを理解する場●事業経営者としての責任を再確認する場改めて確認しておくことで･･･・不適切な請求を防ぐことができ、安定した事業所運営につながる・各事業者が統一したルールで利用者を支援することができる・職員の管理や指導を適切に行うことができる・サービスの知識を習得することでよりよい支援を行うことができる"},{"s":"r8","p":15,"h":"運営指導について","t":"運営指導について実施機関：横浜市健康福祉局障害施策推進課運営指導の流れ：①実施通知事前に障害施策推進課から日程調整の連絡をします。障害施策推進課から事業者宛に実施通知を送付します。運営指導実施の約２か月前運営指導実施の約１か月半～１か月前"},{"s":"r8","p":16,"h":"運営指導について","t":"運営指導について②準備・事前提出「事前提出資料」を作成し添付資料と共に、郵送又は電子メールで障害施策推進課へ提出します。・「当日必要書類一覧」をもとに、必要書類を準備します。・運営指導を受ける場所を確保します（書類の確認やヒアリング等を実施できる場所の確保をお願いします）。【事前提出資料及び当日必要書類一覧の掲載場所】横浜市ホームページURLhttps://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html#unei運営指導実施の一週間前まで運営指導実施当日まで"},{"s":"r8","p":17,"h":"運営指導について","t":"運営指導について③当日の対応•準備した各種書類の確認及びヒアリングをします。☛当日は人員体制等の運営全般、サービス提供内容、請求事務等について説明することができる方の同席をお願いします。•書類の確認及びヒアリング実施後に講評をします。☛講評は必ず記録を取り、速やかに改善に取り組みましょう。☛当日口頭でお伝えするのみの指摘（結果通知に記載されない指摘）もありますのでご注意ください。"},{"s":"r8","p":18,"h":"運営指導について","t":"運営指導について④運営指導後•指摘事項について、改善を実施します。☛結果通知を待たずに改善できるところは速やかに取り組みましょう。•結果通知を受理し、確認します。☛指摘区分は「改善報告書提出指摘事項」「文書指摘事項」「口頭指摘事項」の３種類です。結果通知には「改善報告書提出指摘事項」と「文書指摘事項」が記載されています。•改善報告書提出指摘事項については、期日までに改善報告書を提出します。"},{"s":"r8","p":19,"h":"【参考】監査について","t":"【参考】監査について監査は、指定基準違反等の確認が必要である場合に実施されます。①通報・苦情・相談等に基づく情報や、請求データ等の分析から特異な傾向を示す場合や、②運営指導で確認した指定基準違反等がある場合などが該当します。（運営指導において、著しい基準違反等が認められる、又は疑いがある場合などは、直ちに監査に切り替える場合もあります。）監査の結果、基準違反や不当等が認められた場合は、行政上の措置を受けることがあります。①勧告、②命令、③指定の取消等があり、その上で返還金が生じる場合は経済上の措置として返還金に加えて加算金の支払いが生じる場合もあります。"},{"s":"r8","p":21,"h":"業務継続計画の策定等について","t":"業務継続計画の策定等について（業務ガイドラインｐ86）・感染症や非常災害の発生時において、利用者に対する指定計画相談支援の提供を継続的に実施するための、及び非常時の体制で早期の業務再開を図るための計画を策定し、当該業務継続計画に従い必要な措置を講じなければならない。・「感染症に係る計画」と「災害に係る計画」をそれぞれ事業所ごとに作成・作成した業務継続計画は従業者に対して周知するとともに、必要な研修及び訓練を定期的に（年１回以上）実施業務継続計画の策定がない場合は、「基準を満たさない事実が生じた時点」まで遡及して減算になります。令和６年度より義務化"},{"s":"r8","p":22,"h":"業務継続計画の策定等について","t":"業務継続計画の策定等について【ガイドラインの掲載場所】・感染症に係る業務継続計画厚生労働省ホームページ「感染対策マニュアル・業務継続ガイドライン等」https://www.mhlw.go.jp/stf/newpage_15758.html・災害に係る業務継続計画厚生労働省ホームページ「障害福祉サービス事業所等における自然災害発生時の業務継続ガイドライン等」https://www.mhlw.go.jp/stf/newpage_17517.html※ガイドラインを確認しながら、ひな形等参考に作成してください。"},{"s":"r8","p":23,"h":"衛生管理等について","t":"衛生管理等について当該指定特定相談支援事業所において感染症が発生し、又はまん延しないように、次の各号に掲げる措置を講じなければならない。①感染症対策を検討する委員会を定期的に開催し、その結果を従業者に周知すること②平常時の対策及び感染症発生時の対応を規定した指針を整備すること③研修及び訓練を定期的（年１回以上）に実施すること※上記の措置は、他のサービス事業者と連携等による実施も可（業務ガイドラインｐ89）令和６年度より義務化"},{"s":"r8","p":24,"h":"衛生管理等について","t":"衛生管理等について【手引きの掲載場所】厚生労働省ホームページ「障害福祉サービス事業所等における感染対策指針作成の手引きについて」https://www.mhlw.go.jp/stf/newpage_15758.html※平常時の対策及び感染症発生時の対応を規定した指針の整備に当たっては、厚生労働省のホームページに掲載されている手引きやひな形などを参考にしてください。"},{"s":"r8","p":25,"h":"虐待の防止について","t":"虐待の防止について・虐待防止のための計画づくりや虐待防止のチェックとモニタリングの実施、虐待発生後の検証と再発防止策の検討などを目的とした虐待防止委員会を設置しなければならない。・虐待防止委員会には、専任の虐待防止担当者を必ず置き、構成員には、利用者やその家族、専門的な見地のある外部の第三者等も加えるよう努める。・従業者に対し、虐待防止のための研修を定期的（年１回以上）に実施し、内容について記録しなければならない。なお、研修の実施は、施設内で行う職員研修及び自立支援協議会や基幹相談支援センター等が実施する研修に参加した場合も含む。（業務ガイドラインｐ97）"},{"s":"r8","p":26,"h":"職場におけるハラスメントの防止について","t":"職場におけるハラスメントの防止について・適切な計画相談支援の提供を確保する観点から、職場において行われる性的な言動（セクシュアルハラスメント）又は優越的な関係を背景とした言動（パワーハラスメント）であって業務上必要かつ相当な範囲を超えたものにより従業者の就業環境が害されることを防止するための方針の明確化等の必要な措置を講じなければなりません。・なお、セクシュアルハラスメントについては、上司や同僚に限らず、利用者やその家族等から受けるものも含まれます。・職場におけるハラスメントの内容及びハラスメントを行ってはならない旨の方針を明確化し、相談への対応のための窓口をあらかじめ定め、従業者に周知する必要があります。（業務ガイドラインｐ84）"},{"s":"r8","p":27,"h":"【参考】令和６年度の報酬改定で追加となった減算","t":"【参考】令和６年度の報酬改定で追加となった減算〇情報公表未報告減算（所定単位数の100分の５に相当する単位数）情報公表対象サービス等情報に係る報告を行っていない場合に減算があります。（情報公表制度公表の概要と公表方法等は別添資料を参照ください。）〇虐待防止措置未実施減算（所定単位数の100分の１に相当する単位数）次に掲げる虐待の防止のための取組が適切に行われていない場合に減算があります。①虐待防止委員会を定期的に開催する。（具体的には、１年に１回以上）②虐待の防止のための研修を定期的に実施する。（具体的には、研修を１年に１回以上）③上記①、②を適切に実施するための担当者を配置する。〇業務継続計画未策定減算（所定単位数の100分の１に相当する単位数）計画を策定し、当該業務継続計画に従い必要な措置を講じていない場合に減算があります。（業務ガイドラインｐ123）"},{"s":"r8","p":28,"h":"利用契約締結について","t":"利用契約締結について各サービスを利用する場合、利用者に対して、当該事業の契約書及び重要事項説明書、個人情報同意書等の内容について説明を行い、利用者の同意を得た上で契約を締結します。【運営指導での指摘】・契約書や重要事項説明書、個人情報同意書に署名がない・契約書の契約締結日が記載されていない・契約書の契約期間が失効しており、更新契約がされていない・契約書と重要事項説明書の記載内容に齟齬がある・重要事項説明書の内容が誤っていたり最新の状況になっていない・そもそも契約書や重要事項説明書、個人情報同意書がない（業務ガイドラインｐ22）"},{"s":"r8","p":29,"h":"利用契約締結について","t":"利用契約締結について【参考】重要事項説明書に記載すべき事項①法人、事業所の概要（法人名、事業所名、事業所番号、併設サービス等）②営業日、営業時間、サービス提供日、サービス提供時間③サービスの内容、利用料その他の費用の額④従業者の勤務体制（従業者の職種、員数及び職務の内容）⑤通常の事業の実施地域⑥緊急時等における対応方法⑦苦情処理の体制（事業所担当、市、区などの相談・苦情の窓口も記載）⑧虐待の防止のための措置に関する事項⑨その他利用申込者のサービスの選択に資すると認められる重要事項（従業者の研修機会の確保、衛生管理、秘密の保持、事故発生時の対応等）（業務ガイドラインｐ22）"},{"s":"r8","p":30,"h":"提供拒否の禁止及びサービス提供困難時の対応について","t":"提供拒否の禁止及びサービス提供困難時の対応について事業者は、原則として、利用申込みに対して応じなければなりません。提供を拒むことのできる正当な理由としては、下記が挙げられます。・当該事業所の現員からは利用申込に応じきれない場合・利用申込者の居住地（地域移行の場合は入所、入院先）が当該事業所の通常の事業の実施地域外である場合・当該事業所の運営規程において主たる対象とする障害の種類を定めている場合であって、これに該当しない者から利用申込があった場合・その他、利用申込者に対し自ら適切な支援を提供することが困難な場合上記の理由により提供を拒んだ場合は、他の事業者の紹介その他必要な措置を速やかに講じなければなりません。（業務ガイドラインｐ103）"},{"s":"r8","p":31,"h":"掲示等及び広告について","t":"掲示等及び広告について・事業所の見やすい場所に、運営規程の概要や従業者の有する資格、各種体制加算（主任相談支援専門員配置加算、行動障害支援体制加算、要医療児者支援体制加算、精神障害者支援体制加算、ピアサポート体制加算、高次脳機能障害支援体制加算）の算定状況をはじめとする、利用申込者のサービスの選択に資すると認められている重要事項を掲示及び公表しなければなりません。・掲示については、重要事項を記載したファイル等を事業所に備え付け、かつ、これをいつでも関係者に自由に閲覧させることで代えることができます。・公表については、ホームページ（WAM NET含む）による掲載等、適宜工夫をして行ってください。また、ホームページやちらし等に、虚偽や誇大な内容の広告を出してはいけません。（業務ガイドラインｐ91、93）"},{"s":"r8","p":32,"h":"秘密保持等（個人情報保護）について","t":"秘密保持等（個人情報保護）について・管理者及び従業者は、正当な理由がなく、その業務上知り得た利用者又はその家族の秘密を漏らしてはいけません。・過去に当該事業所の管理者及び従業者であった者の退職後についても、上記と同様に、秘密を保持すべき旨を、事業者の雇用時等に取り決めておくことや、秘密を洩らした場合の違約金についての定めを置くなどの措置を講じる必要があります。・また、サービス担当者会議や他サービス提供事業所等に対して、利用者又はその家族の個人情報を用いる場合は、あらかじめ文書により当該利用者又はその家族の同意を得ておかなければなりません。（業務ガイドラインｐ92）"},{"s":"r8","p":33,"h":"秘密保持等（個人情報保護）について","t":"秘密保持等（個人情報保護）について個人情報の保護は事業を行う上で非常に重要であり、適切な対応が求められています。具体的な取り扱いに関するガイドライン等は個人情報保護委員会のホームページでご確認をお願いします。【各種ガイドライン掲載場所】「個人情報保護委員会」ホームページ https://www.ppc.go.jp/•特定個人情報の適切な取扱いに関するガイドライン•個人情報の保護に関する法律についてのガイドライン個人情報漏洩時の、国への報告書類誤送付などの個人情報漏洩があった時は、事故報告書を市及び区に提出してもらうとともに、利用者情報は「要配慮個人情報」にあたるため、事業所から国への報告義務があります。〇個人情報保護委員会「漏えい等の対応とお役立ち資料」https://www.ppc.go.jp/personalinfo/legal/leakAction/"},{"s":"r8","p":34,"h":"秘密保持等（個人情報保護）について","t":"秘密保持等（個人情報保護）について【運営指導での指摘】・従業者との間で、業務上知り得た個人情報を在職中及び退職後も漏らさない旨の誓約書が締結されていない・利用者及び家族等から、文書により個人情報を用いる旨の同意書が得られていない個人情報使用同意書には、最低限、次の項目が必要です。①使用目的②使用する事業者の範囲③使用する期間④使用にあたっての条件"},{"s":"r8","p":35,"h":"苦情解決について","t":"苦情解決について・苦情に迅速かつ適切に対応するために、苦情を受け付けるための窓口を設置する等の必要な措置を講じなければなりません。・当該事業所における苦情を処理するために講ずる措置の概要について明らかにし、相談窓口の連絡先、苦情処理の体制及び手順等を利用申込者にサービスの内容を説明する文書（重要事項説明書等）に記載するとともに、事業所に掲示することが望まれます。・苦情に対し事業者が組織として迅速かつ適切に対応するため、当該苦情の受付日、内容等を記録し、５年間保存しなければなりません。（業務ガイドラインｐ95）"},{"s":"r8","p":36,"h":"苦情解決について","t":"苦情解決について苦情はサービスの質の向上を図る上での重要な情報であるとの認識に立ち、苦情の内容を踏まえ、サービスの質の向上に向けた取り組みを自ら行うべきとされています。【運営指導での指摘】・苦情解決窓口が設置されていない・苦情解決マニュアルが整備されていない・苦情に関する記録が保存されていない・重要事項説明書における相談窓口の連絡先等が間違っている"},{"s":"r8","p":37,"h":"事故発生時の対応について","t":"事故発生時の対応について・利用者等に対する相談支援やサービス等の提供により事故が発生した場合は、都道府県、市町村、当該利用者等の家族等に連絡を行うとともに、必要な措置を講じなければなりません。・利用者等に対する相談支援やサービス等の提供により賠償すべき事故が発生した場合は、損害賠償を速やかに行わなければなりません。・事故が生じた際にはその原因を解明し、再発生を防ぐための対策を講じることが求められます。・その事故の状況及び事故に際して採った処置について、記録しなければなりません。（５年間保存）（業務ガイドラインｐ96）"},{"s":"r8","p":38,"h":"事故発生時の対応について（事務処理）","t":"事故発生時の対応について（事務処理）サービスの提供により、①死亡、②骨折、③誤嚥、④食中毒、⑤感染症、⑥所在不明、⑦利用者の不利益につながる職員による犯罪行為等、⑧その他、利用者の身体に重大な影響を及ぼす事故や事件が発生した場合は、まず横浜市及び援護の実施区へ第一報の連絡をします。その上で、「事故報告書」を作成し、横浜市へ提出します。※郵送物等の誤送付や個人情報の漏えいなども事故報告の対象となります。※計画相談及び地域相談は、県への報告も必要です。※新型コロナウイルス感染症については、事故報告書ではなく現在も運用しているメールにてご報告をお願いします。【様式の掲載場所】「障害福祉情報サービスかながわ」ホームページ書式ライブラリ＞１．神奈川県からのお知らせ＞7-4 事故報告に関するお知らせhttps://shougai.rakuraku.or.jp/search-library/lower-3-3.html?topid=1&id=275（「横浜市新型コロナウイルス関連情報【障害者福祉】」で検索）"},{"s":"r8","p":39,"h":"会計の区分について","t":"会計の区分について事業所ごとに経理を区分するとともに、各サービス・事業の会計をその他の事業の会計と区分しなければなりません。各サービスにおける収支について区分しておく必要があります。例えば計画相談支援と障害児相談支援を実施している場合は、それぞれの会計を区分する必要があります。【運営指導での指摘】・会計の区分が法人や拠点ごとになっており事業ごとになっていない（業務ガイドラインｐ100）"},{"s":"r8","p":40,"h":"記録の整備について","t":"記録の整備について事業者は、従業者、設備、備品及び会計等に関する諸記録を文書により整備しておかなければなりません。利用者等に対する支援の提供に関する各種記録については、当該支援を提供した日から少なくとも５年以上保存しなければならない。【運営指導での指摘】・整備するべき記録が文書で残っていない・契約終了者の記録が残っていない☛契約が終了した利用者についても、５年は保存義務があります。（業務ガイドラインｐ101）"},{"s":"r8","p":41,"h":"報酬算定の考え方について","t":"報酬算定の考え方について給付費の算定は、報酬告示上の単位数×級地区分（円）＝支給額（円）例えば、計画相談におけるサービス等利用計画を１件作成すると…1,572単位（サービス利用支援費）×10.96円＝17,229円※横浜市は２級地に該当するので１単位あたり 10.96円※級地区分は事業所の所在地によって異なります。"},{"s":"r8","p":42,"h":"特別地域加算","t":"特別地域加算厚生労働省が定める地域（中山間地域等）に居住している利用者に対して支援をした場合に加算（業務ガイドラインｐ124）サービス加算計画相談支援所定単位数の15％地域相談支援※所定単位数の15％自立生活援助１月につき230単位☛いずれも、区役所で支給決定が必要☛特別地域加算を算定する利用者に対して、通常の事業の実施地域を越えてサービス提供した場合は、交通費の支払いを受けることはできない※地域移行支援は、厚生労働省が定める地域（中山間地域等）の精神科病院、障害者支援施設等に入院・入所している者に対して支援した場合"},{"s":"r8","p":43,"h":"福祉・介護職員等処遇改善加算","t":"福祉・介護職員等処遇改善加算算定要件は、①キャリアパス要件、②月額賃金改善要件、③職場環境等要件詳細は、厚生労働省ホームページをご確認ください。https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/shougaishahukushi/minaoshi/index_00007.htmlサービス加算率計画相談支援 5.1％地域相談支援 5.1％自立生活援助Ⅰイ11.5％Ⅰロ11.9％Ⅱイ11.3％Ⅱロ11.7％Ⅲ9.8％Ⅳ8.1％令和８年６月から、計画相談支援、地域相談支援が新たに対象になりました。また、自立生活援助の加算区分も変更されました。"},{"s":"r8","p":44,"h":"横浜市への届出について","t":"横浜市への届出について（業務ガイドラインｐ167）※相談支援専門員の増減により、体制加算が変更になる場合は、変更届と体制届、両方提出が必要。※指定更新では、相談支援専門員の変更は不可。相談支援専門員の追加や削除は必ず変更届が必要。届出書名内容提出期限変更届運営法人や事業所の名称、所在地の変更法人代表者や管理者、従業者の変更運営規程の変更など変更の日から10日以内休止廃止再開届事業所を休止、廃止、再開する場合※休廃止する場合は、事前に横浜市へ電話で相談※利用者がいる場合は、引継ぎ先など調整が必要です。休廃止：休廃止の１か月前まで再開：再開の日から10日以内体制届基本報酬の区分に関する届出各種加算算定に関する届出毎年４月又は各種算定を希望する前月15日まで例：８月サービス提供分から算定を希望する場合７月15日までに提出（15日が閉庁日の場合は直前営業日まで）"},{"s":"r8","p":45,"h":"横浜市への届出について","t":"横浜市への届出について（業務ガイドラインｐ167）届出書名手続き方法や様式（障害福祉情報サービスかながわ）横浜市電子申請・届出システム変更・休止・廃止・再開届https://shougai.rakuraku.or.jp/search\u0002library/lower-3-3.html?topid=2&id=39https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/05bb00c2-4afc-46ad\u000292ae\u0002e3512d502f0d/start体制届https://shougai.rakuraku.or.jp/search\u0002library/lower-3-3.html?topid=2&id=74https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/3c02990f-61fd-4998-af5c\u0002ec47897fefc2/start"},{"s":"r8","p":46,"h":"請求に関する問い合わせについて","t":"請求に関する問い合わせについて問い合わせ内容問い合わせ先簡易入力システムの入力方法等について障害者総合支援電子請求ヘルプデスクE-mail:mail@support-e-seikyuu.jpTEL:0570-059-403 FAX:0570-059-433請求に関わることについて（送信した請求データの照会、給付費の振込内容など）神奈川県国民健康保険団体連合会TEL:045-329-3416 FAX:045-329-3418請求エラーについて（一次審査後のエラーや過誤申立など）横浜市健康福祉局障害施策推進課TEL:045-671-4133 FAX:045-671-3566受給者証の決定内容や更新について（区役所で月末までに入力処理した内容が翌月の請求台帳に反映されます）受給者証の発行区へ連絡先は受給者証の（八）面下部に記載"},{"s":"r8","p":47,"h":"請求に関する問い合わせについて","t":"請求に関する問い合わせについて請求エラーの問い合わせをされる際は、必ず下記をご確認してください。・発行されている受給者証の内容（事業所名、支給期間）に誤りがないか☛そもそも受給者証はしっかりと確認していますか？）・区役所が請求の前月末までに支給決定を行っているか☛５月サービス提供分を６月に請求する場合、５月末までに支給決定が必要。受給者証がいつ発行されたか、区役所がいつ支給決定を行ったか要確認！・市町村番号や受給者番号は正しいものが入力されているか☛その他、サービス提供月や事業所番号、級地区分が間違っていることもあり多くの問い合わせが、これらの理由で解決します。請求がエラーとなった場合は、今一度、自己点検をお願いします。"},{"s":"r8","p":48,"h":"過誤申立について","t":"過誤申立について請求内容に誤りがあった場合は、受付期間内に過誤処理を行ってください。【受付フォーム】「横浜市電子申請・届出システム」＞手続き一覧（事業者向け）＞キーワード検索：「過誤」＞「【全国システム用】障害者自立支援給付費等過誤申立（請求取下依頼）」https://shinsei.city.yokohama.lg.jp/cu/141003/ea/residents/procedures/apply/aad99b18-4bc9-4eeb-b17b-b7264bfd7414/start【申請締切】毎月最終開庁日の前日23時59分まで※過誤再請求が必要な場合は、過誤申立の翌月の請求期間内に必ず行ってください。"},{"s":"r8","p":49,"h":"障害福祉情報サービスかながわについて","t":"障害福祉情報サービスかながわについて「障害福祉情報サービスかながわ」（通称：「らくらく」）には、研修や集団指導のお知らせ、資料、変更届などの各種様式など、事業所を運営していく上で、大切な情報を掲載しています。また、横浜市ではお知らせを掲載するとともに、障害福祉情報サービスかながわのメール配信機能を使って、事業所のみなさまに情報提供をさせていただいております。【障害福祉情報サービスかながわトップページ】https://www.rakuraku.or.jp/shienhi/「書式ライブラリ」＞「２．横浜市からのお知らせ」"},{"s":"r8","p":50,"h":"障害福祉情報サービスかながわへのメールアドレスの登録","t":"障害福祉情報サービスかながわへのメールアドレスの登録本市からの重要なお知らせや緊急情報などは、障害福祉情報サービスかながわのメール配信機能を用いて周知を行っているため、必ずメールアドレスを登録し受信できる環境の設定をお願いします。登録方法は、「障害福祉情報サービスかながわ事業者管理操作マニュアル」をご確認ください。【マニュアルの掲載場所】「障害福祉情報サービスかながわ」ホームページ書式ライブラリ＞10．利用マニュアル・振興会からのお知らせ等＞操作マニュアル＞事業者管理操作マニュアルhttps://shougai.rakuraku.or.jp/search-library/lower-3-3.html?topid=9&id=22"},{"s":"r8","p":51,"h":"横浜市ホームページについて","t":"横浜市ホームページについて【事業者向けホームページ】「横浜市相談系サービス」サービス等利用計画の様式や業務ガイドライン、各種研修等資料、お役立ち通信や便利なツールなどを掲載しています。大切なお知らせも掲載しておりますので、定期的にご確認をお願いいたします。https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi\u0002kaigo/fukushi/service/soudan.html【市民向けホームページ】「横浜市障害者相談支援」市内指定特定相談支援事業所リストや各事業所における受入可能状況のリストなどを掲載しています。https://www.city.yokohama.lg.jp/kenko-iryo-fukushi/fukushi\u0002kaigo/fukushi/annai/madoguchi/sogo/soudan-jigyosha.html"},{"s":"r8","p":52,"h":"障害福祉サービス等情報公表制度","t":"障害福祉サービス等情報公表制度及び災害時情報共有システムについて健康福祉局障害施策推進課TEL：671-4133"},{"s":"r8","p":53,"h":"障害福祉サービス等情報公表制度について","t":"障害福祉サービス等情報公表制度について障害福祉サービス等情報検索(WAMNET)の公開平成30年4月から施行された障害福祉サービス等情報公表制度に伴い、ウェブサイト「障害福祉サービス等情報検索(WAMNET)」が公開されました。ウェブサイトイメージ図"},{"s":"r8","p":54,"h":"障害福祉サービス等情報公表制度について","t":"障害福祉サービス等情報公表制度について【制度設立の趣旨・目的】障害福祉サービス等を提供する事業所数が増加する中で、利用者が個々のニーズに応じて良質なサービスを選択できるようにすること、事業者によるサービスの質を向上することが重要な課題となっています。このため、①事業者に対して障害福祉サービスの内容等を都道府県知事等へ報告することを求めるとともに、②都道府県知事等が報告された内容を公表する仕組みを創設し、利用者による個々のニーズに応じた良質なサービスの選択に資することを目的として本制度が設立されました。【根拠法】・障害者の日常生活及び社会生活を総合的に支援するための法律第76条の３・児童福祉法第33条の18【気を付けていただきたいこと】・毎年度、報告年度の４月１日時点の「障害福祉サービス等情報」を報告が必要・年度途中に「障害福祉サービス等」に変更が生じた場合は、随時報告が必要・毎会計年度終了後、経営情報の報告が必要障害福祉サービス等情報公表制度とは"},{"s":"r8","p":55,"h":"障害福祉サービス等情報公表制度について","t":"障害福祉サービス等情報公表制度について障害福祉サービス等情報の公表までの手順５．承認の場合、障害福祉サービス等情報検索（WAMNET）に公表開始１．「障害福祉サービス等情報公表システム法人ID発行依頼票/事業所情報追加（変更/削除）依頼票」（以下「発行依頼票」※１という。）に法人基礎情報を記入し健康福祉局障害施策推進課宛にEメールで依頼する※１掲載場所：『障害福祉情報サービスかながわ』で検索「書式ライブラリ」「２横浜市からのお知らせ」「⑦情報公表制度（障害者総合支援法）・災害時情報共有システムについて」※２ログインID・パスワードは自治体及び法人ごとに1つです。市内で複数事業所を運営している法人の事業所はID・パスワードを共有してください。２．≪障害福祉サービス等情報公表システム（WAMNET）≫からログインID・パスワードがメールに届く３．≪障害福祉サービス等情報公表システム（WAMNET）≫にログインし、事業所の詳細な運営情報を入力し、横浜市に承認依頼をする４．横浜市が内容を確認し、承認又は差し戻しを行う（差し戻しの場合は、差し戻し理由を確認・再入力し、承認依頼をかける）"},{"s":"r8","p":56,"h":"障害福祉サービス等情報公表制度について","t":"障害福祉サービス等情報公表制度について１．≪障害福祉サービス等情報公表システム≫にログインし、毎年度４月1日時点の事業所の詳細な運営情報を入力し、横浜市に承認依頼をする※ログインID・パスワードは自治体及び法人ごとに1つです。市内で複数事業所を運営している法人の事業所はID・パスワードを共有してください。２．横浜市が内容を確認し、承認又は差し戻しを行う（差し戻しの場合は、差し戻し理由を確認・再入力し、承認依頼をかける）３．≪障害福祉サービス等情報検索（WAMNET）≫に公表開始障害福祉サービス等情報の更新までの手順"},{"s":"r8","p":57,"h":"障害福祉サービス等情報公表制度について","t":"障害福祉サービス等情報公表制度について■障害福祉サービス等情報公表システム法人ID発行依頼票/事業所情報追加（変更/削除）依頼票掲載場所：「障害福祉情報サービスかながわ」「書式ライブラリ」「文書・カテゴリ検索」「⑦情報公表制度（障害者総合支援法）・災害時情報共有システムについて）」URL: https://shougai.rakuraku.or.jp/search-library/lower-3-3.html?topid=2&id=175■依頼先健康福祉局障害施策推進課Ｅメールアドレス： kf-syotaisei@city.yokohama.lg.jp発行依頼票に法人基礎情報を記入し健康福祉局障害施策推進課宛にEメールで依頼【IDが未発行の場合】【IDは発行されているが事業所に過不足がある場合】発行依頼票に事業所情報を記入し健康福祉局障害施策推進課宛にEメールで依頼【参考➀】障害福祉サービス等情報公表システムID等の発行手順"},{"s":"r8","p":58,"h":"【参考②-１】障害福祉サービス等情報公表システムID等の発行・ログイン方法","t":"【参考②-１】障害福祉サービス等情報公表システムID等の発行・ログイン方法発行依頼票で依頼いただいた法人基礎情報を健康福祉局障害施策推進課が≪障害福祉サービス等情報公表システム≫に登録します。その後、≪障害福祉サービス等情報公表システム≫から事業者のＥメールアドレス宛にログインＩＤ及びパスワードが発行されます。発行されたＩＤ等を用いてシステムにログインし各情報を入力してください。ログインID・パスワードの書かれたメールのイメージメールに貼られている「システムのログインURL」からウェブサイト≪障害福祉サービス等情報公表システム≫を開き、ログインする。メールに書かれている手順に従って事業所の詳細情報を入力する。(事業所を検索後、事業所名称をクリックすると事業所詳細情報の入力画面に切り替わります)事業所詳細情報を入力後一時保存をしてから、承認依頼をする。横浜市が確認後、承認すると公表される。"},{"s":"r8","p":59,"h":"障害福祉サービス等情報公表制度について","t":"障害福祉サービス等情報公表制度について【参考②-２】障害福祉サービス等情報公表システムID等の発行・ログイン方法≪障害福祉サービス等情報公表システム≫ログイン画面①発行されたログインＩＤ・パスワードを入力②ログインをクリック"},{"s":"r8","p":60,"h":"障害福祉サービス等情報公表制度について","t":"障害福祉サービス等情報公表制度について【参考③】パスワードの変更について①≪障害福祉サービス等情報公表システム≫のログインページを開く②「こちら」をクリック③「ログインＩＤ」を入力し、パスワードを初期化するボタンをクリック※ログインＩＤの前後に空白スペースがあると、入力できません。"},{"s":"r8","p":61,"h":"障害福祉サービス等情報公表制度について","t":"障害福祉サービス等情報公表制度について【参考④】事業所情報が公表されているかの確認方法についてURL：https://www.wam.go.jp/sfkohyoout/COP000100E0000.do１．ウェブサイト障害福祉サービス等情報検索（WAMNET）を開く２．事業所を検索して出てくるか確認する３．出てきた場合、更新申請をする出てこない場合、新規登録をする"},{"s":"r8","p":62,"h":"災害時情報共有システムについて","t":"災害時情報共有システムについて災害時情報共有システムとは災害時情報共有システムは、情報公表システムに追加された災害時情報共有機能のことです。災害発生時における障害福祉サービス施設、事業所の被害状況等を国・自治体が迅速に把握・共有し、被災した施設、事業所への迅速かつ適切な支援につなげることを目的としています。災害時情報共有システムは国・自治体が被災状況を把握するシステムであるため、WAMNET 障害福祉サービス等情報公表システムとは異なり、一般には非公開となります。"},{"s":"r8","p":63,"h":"災害時情報共有システムについて","t":"災害時情報共有システムについて登録方法１．障害福祉サービス等情報公表システムにログイン【障害福祉サービス等情報公表システム関係連絡板】https://www.wam.go.jp/content/wamnet/pcpub/top/shofukuinfopub/jigyo３．承認メールが届いたら、災害時情報共有システムにアクセスhttps://www.wam.go.jp/s-saigai/DIS050100E00.do２．①～⑥の事業所詳細情報及び⑦システムからの連絡先（メールアドレス）を登録し、⑧承認者へ申請"},{"s":"r8","p":64,"h":"災害時情報共有システムについて","t":"災害時情報共有システムについて登録方法５．災害時情報共有システムから届いたメールに記載してあるURL へアクセスし、連絡先メールアドレス（災害時緊急連絡先）を入力し、申請４．２の「⑦システムからの連絡先」で登録したメールアドレスを入力し、施設情報登録メール送信を選択６．確認完了通知が届いたら登録完了"},{"s":"r8","p":65,"h":"情報公表制度・災害時情報共有システム共通","t":"情報公表制度・災害時情報共有システム共通☆横浜市からの障害福祉サービス等情報公表制度・災害時情報共有システムに関するお知らせをご確認ください。『障害福祉情報サービスかながわ』で検索「書式ライブラリ」→「２横浜市からのお知らせ」→「⑦情報公表制度（障害者総合支援法）・災害時情報共有システムについて」☆ WAM NETにおいて、本システムに関するお知らせや操作説明書（マニュアル）等の資料を掲載していますので、是非ご活用ください。https://www.wam.go.jp/content/wamnet/pcpub/top/shofukuinfopub/jigyo/【障害者総合支援法に基づくサービスに関すること】横浜市健康福祉局障害福祉保健部障害施策推進課施策調整係電話：045-671-3601 ＦＡＸ：045-671-3566メールアドレス： kf-syotaisei@city.yokohama.lg.jp【児童福祉法に基づくサービスに関すること】横浜市こども青少年局障害児福祉保健課電話：045-671-4274メール：kd-syogaijifukuho@city.yokohama.lg.jp"},{"s":"r8","p":67,"h":"計画相談支援","t":"計画相談支援•相談支援事業所の基準及び留意点•運営指導時の指摘事項健康福祉局障害施策推進課TEL：671-4133"},{"s":"r8","p":69,"h":"業務ガイドラインについて","t":"業務ガイドラインについて横浜市では、厚生労働省より示されている法や規則、基準、通知等に基づき「横浜市における指定特定相談支援事業（計画相談）『業務ガイドライン』～障害のある人本人を中心とした相談支援を実践するための基本ルール～」（令和６年11月改定）を作成しています。横浜市が指定特定相談支援事業者（相談支援専門員）に求める基本ルールをまとめたものです、必ずご確認ください。（併せて最新の基準省令や報酬告示等のご確認もお願いします。）【掲載場所】「横浜市相談系サービス」ホームページhttps://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html#gaido"},{"s":"r8","p":70,"h":"従業者・管理者について※業務ガイドラインP.76～","t":"従業者・管理者について※業務ガイドラインP.76～従業者要件管理者（資格不要）１名※当該業務に支障がない場合は、他事業との兼務が可能※当該事業所の相談支援専門員との兼務が可能※障害児相談支援事業所との兼務が可能相談支援専門員（要相談支援専門員資格）１名以上※当該業務に支障がない場合は、他事業との兼務が可能※障害児相談支援、地域相談支援、自立生活援助事業所との兼務が可能※当該事業所の開所時間には必ず１名以上の配置が必要※常勤・非常勤の別は問わない"},{"s":"r8","p":71,"h":"従業者・管理者について","t":"従業者・管理者について【相談支援専門員が１名の場合】※サービス提供事業所Bと兼務サービス提供事業所Bパターン①月水金・9時～17時※営業日・時間月水金 9時～17時パターン②月～金 9時～12時※営業日・時間月～金 9時～12時計画相談支援事業所A相談支援専門員パターン①火木・9時～17時パターン②月～金 13時～17時"},{"s":"r8","p":72,"h":"従業者・管理者について(資格研修) ※業務ガイドラインP.78～","t":"従業者・管理者について(資格研修) ※業務ガイドラインP.78～相談支援専門員として活動するためには、実務経験要件と相談支援従事者研修の修了が必要です。•相談支援業務：５年以上又は直接支援業務：10年以上実務経験要件※有資格者等の場合、短縮することが可能です。•相談支援従事者初任者研修修了•相談支援従事者現任研修修了（初任者研修修了の翌年度から起算して５年毎に受講）相談支援従事者研修修了"},{"s":"r8","p":73,"h":"従業者・管理者について（資格更新について）","t":"従業者・管理者について（資格更新について）相談支援専門員として活動を継続するためには、初任者研修を修了した翌年度から起算して５年ごとに相談支援従事者現任研修を受講し続けなければなりません。(期間中に受講できなかった場合は、資格が失効します。）※現任研修を受講する際は、「一定の実務経験を有する者」が受講要件となっています。【令和４年度に初任研を受講した場合のイメージ】"},{"s":"r8","p":75,"h":"従業者・管理者について（兼務）※業務ガイドラインP.78～","t":"従業者・管理者について（兼務）※業務ガイドラインP.78～相談支援専門員の兼務について、国の基準では、相談支援専門員が業務に支障がない場合で、他事業と兼務するとき、兼務先の事業所の利用者に対して、モニタリング等を行うことは出来ません。ただし、横浜市では相談支援専門員が不足している状況を受け、その他市町村がやむを得ないと認める場合の特例として、直接支援に携わらない利用者については、モニタリング等を行うことを可能としています。※上記の取扱いは特例的な措置です。今後、取扱いが変更になる可能性があることをご留意ください。また、基本的には、公正中立な立場を確保する観点から国基準が望ましいです。"},{"s":"r8","p":76,"h":"従業者・管理者について","t":"従業者・管理者について・サービス提供事業所Bと兼務・サービス提供事業所Bでは利用者①と②に対し直接支援を担当利用者①利用者②利用者③利用者④＜国の基準＞利用者①、②、③、④すべてに対してモニタリング等ができません。＜横浜市特例＞利用者①、②に対してモニタリング等ができません。利用者③、④に対しては直接支援を行っていないためモニタリング等ができます。サービス提供事業所Ｂ★直接支援に携わらない場合とは、直接支援の実態のみで判断するのではなく、職員の配置上においても直接支援を担当する職員として計上されていないことをいいます。ただし、訪問系サービスで利用者の担当が固定されている場合や、日中系サービスで勤務日が交わらない場合など、直接支援に携わらないことが明確な場合はモニタリング等を行うことは可能としています。計画相談支援事業所Ａ相談支援専門員"},{"s":"r8","p":77,"h":"従業者・管理者について（勤務表）※業務ガイドラインP.84","t":"従業者・管理者について（勤務表）※業務ガイドラインP.84•利用者等に対し、適切な計画相談支援を提供できるよう、指定特定相談支援事業所ごとに、相談支援専門員その他の従業者の勤務の体制を定めておかなければなりません。•指定特定相談支援事業者ごとに、原則として月ごとの勤務表を作成し、従業者については、日々の勤務時間、職務の内容、常勤・非常勤の別、管理者との兼務関係等を明確にしなければなりません。"},{"s":"r8","p":78,"h":"従業者・管理者について","t":"従業者・管理者について【運営指導での指摘】・相談支援専門員の資格を持っていない者（実務経験要件を満たしていない等）が計画相談を実施している・管理者や相談支援専門員が変更になっているのに、変更届が提出されていない・事業所の営業時間に相談支援専門員が１名以上配置されていない（勤務体制の確保等で定められている月ごとの勤務表が作成されていない）・職員が兼務の場合で、兼務先で直接支援を担当しているにもかかわらず、相談支援専門員としてモニタリング等を実施している"},{"s":"r8","p":79,"h":"相談支援員について※業務ガイドラインP.80～","t":"相談支援員について※業務ガイドラインP.80～令和６年度報酬改定等により、相談支援に従事する人材の確保を目的として、「相談支援員」の配置が可能となりました。【事業者要件】①機能強化型サービス利用支援費の算定要件を満たしている。②主任相談支援専門員の配置があり、相談支援員に対して指導及び助言が行われる体制が確保されている。"},{"s":"r8","p":80,"h":"相談支援員について","t":"相談支援員について【相談支援員の要件】・専ら当該指定特定相談支援事業所の職務に従事する者である者であって、社会福祉士又は精神保健福祉士の資格を有するものであることが必要です。【相談支援員が可能な業務の範囲】・サービス等利用計画の原案の作成・モニタリングの実施※サービス担当者会議、サービス等利用計画の作成は、相談支援専門員でなければできません。"},{"s":"r8","p":81,"h":"運営規程について※業務ガイドラインP.83～","t":"運営規程について※業務ガイドラインP.83～指定特定相談支援事業所ごとに、下記に掲げる事業の運営（①～⑧）についての重要事項に関する運営規程を定めておかなければなりません。①事業の目的及び運営の方針②従業者の職種、員数及び職務の内容③営業日及び営業時間④支援の提供方法及び内容並びに対象障害者等から受領する費用及びその額⑤通常の事業の実施地域"},{"s":"r8","p":82,"h":"運営規程について","t":"運営規程について⑥事業の主たる対象とする障害の種類を定めた場合には当該障害の種類⑦虐待の防止のための措置に関する事項⑧その他運営に関する重要事項運営規程の内容について、変更が生じた場合には、修正を行うとともに、本市へ期日内に変更届の提出が必要です。"},{"s":"r8","p":83,"h":"記録の整備について※業務ガイドラインP.101～","t":"記録の整備について※業務ガイドラインP.101～次に掲げる記録（①～⑤）を最低限整備し、当該計画相談支援を提供した日から少なくとも５年以上保存しなければなりません。①福祉サービス等の事業を行う者等との連絡調整に関する記録②個々の利用者ごとに次に掲げる事項を記載した相談支援台帳・サービス等利用計画案及びサービス等利用計画・アセスメントの記録・サービス担当者会議等の記録・モニタリングの結果の記録③基準第17条の規定による市町村への通知に係る記録"},{"s":"r8","p":84,"h":"記録の整備について","t":"記録の整備について④基準第27条第２項に規定する苦情の内容等の記録⑤基準第28条第２項に規定する事故の状況及び事故に際して採った処置についての記録個人情報が記載されている文書については、必ず鍵のかかる書庫に保管し、持出の制限や管理を行うなど適切に保存してください。また、パソコンやサーバ、USBメモリ等の記録媒体で保存する場合についても、盗難・紛失防止及びウィルス感染等による個人情報の漏えいを防ぐための措置を行うことが必要です。"},{"s":"r8","p":86,"h":"区役所への契約内容の報告について※業務ガイドラインP.23～","t":"区役所への契約内容の報告について※業務ガイドラインP.23～計画相談支援の利用に係る契約をしたときは、その旨を「計画相談支援・障害児相談支援契約内容報告書」に記載し、区役所に報告しなければなりません。（提出はサービス等利用計画案の送付時に同封していただいても構いません。）【契約内容報告書の掲載場所】「横浜市相談系サービス」ホームページ「６利用者との契約締結及び契約終了時に区役所へ提出する書類」https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi-kaigo/fukushi/service/soudan.html#yousiki【運営指導での指摘】•契約内容報告書の作成・提出がされていない"},{"s":"r8","p":87,"h":"利用者の意思決定の支援への配慮※業務ガイドラインP.24～","t":"利用者の意思決定の支援への配慮※業務ガイドラインP.24～サービス等利用計画の作成にあたっては、利用者の自己決定の尊重及び意思決定の支援の配慮しつつ、利用者の希望等を踏まえて作成することを基本とします。次の基本原則に十分に留意しつつ、利用者の意思決定の支援に配慮します。ア本人への支援は、自己決定の尊重に基づき行う。イ職員等の価値観においては不合理と思われる決定でも、他者への権利を侵害しないのであれば、その選択を尊重するように努める姿勢が求められる。ウ本人の自己決定や意思確認がどうしても困難な場合は、本人をよく知る関係者が集まって、様々な情報を把握し、根拠を明確にしながら意思及び選好を推定する。"},{"s":"r8","p":88,"h":"アセスメントの実施について※業務ガイドラインP.25～","t":"アセスメントの実施について※業務ガイドラインP.25～本人の希望する生活の実現に向けて、必ず利用者の居宅、障害者支援施設等、精神科病院（現に日々の生活拠点としている場所）を訪問し、利用者及びその家族に面接をしてアセスメントを実施しなければなりません。アセスメントの過程で収集した情報は、「基礎調査資料」に記載していきます。基礎調査資料に記載する情報は、最低限把握しておくべきものですが、全てを最初から埋めることは困難です。不要な情報や利用者との関係構築等から現段階では確認できない部分等については空欄で構いません。その後の支援経過の中で、変化と共に随時追記・修正を行い更新してください。"},{"s":"r8","p":89,"h":"アセスメントの実施について","t":"アセスメントの実施について【運営指導での指摘】•基礎調査資料が作成されていない•基礎調査資料の内容が、区役所から情報提供された「在宅援助記録票」の丸写しになっている•初回に作成したきり、環境等に変化があったにもかかわらず、基礎調査資料が更新されていない"},{"s":"r8","p":90,"h":"サービス等利用計画「案」について※業務ガイドラインP.28～","t":"サービス等利用計画「案」について※業務ガイドラインP.28～アセスメントの結果を踏まえ、サービス等利用計画案を作成します。作成したサービス等利用計画案の内容について、利用者等に説明を行った上で、本人署名による同意を得ることが必要です。（自筆が難しい場合には、利用者本人の氏名を代筆の上で、代筆者の氏名と続柄や関係性、代筆理由を記載します。電子署名の場合は、「電子署名によるもの」と記載します。）そして、本人に写しを交付し区役所へ原本を提出します。このとき、区役所へはサービス利用希望開始月の前月20日まで（更新の場合は、更新月の20日まで）に提出してください。"},{"s":"r8","p":91,"h":"サービス等利用計画について※業務ガイドラインP.34～","t":"サービス等利用計画について※業務ガイドラインP.34～サービス等利用計画案を区役所へ提出した後、受給者証を確認し、計画案を確定させるためのサービス担当者会議等を開催し、計画を確定させます。確定したサービス等利用計画も計画案と同様に、内容について、利用者等に説明を行った上で、本人署名による同意を得ることが必要です。そして、本人やサービス提供事業所に写しを交付し、区役所へも提出を行います。なお、サービス等利用計画案と内容に変更がない場合には、その旨を区役所に電話等により報告することで提出を省略することができます。"},{"s":"r8","p":96,"h":"サービス等利用計画について","t":"サービス等利用計画について【運営指導での指摘】•確定したサービス等利用計画が作成されていない•サービス等利用計画案から変更がない場合で、確定した計画の交付が本人やサービス提供事業所に対して交付されていない（変更がない場合に提出を省略できるのは区役所のみ）•利用するサービス内容が不明確、精査せず前回と同じ内容になっている"},{"s":"r8","p":97,"h":"モニタリングの実施について※業務ガイドラインP.43～","t":"モニタリングの実施について※業務ガイドラインP.43～モニタリングとは、サービス等利用計画通りにサービスが提供されているか、利用者のめざす生活の実現に向けて解決すべき課題が解消されているか、利用者が満足しているか、新たなニーズが発生していないか等を確認し、必要であれば計画を修正し、利用者本人を含めたチームとしての取組を継続・更新していくためのものです。モニタリング実施月に、居宅、障害者支援施設等、精神科病院（現に日々の生活拠点としている場所）を訪問し、利用者に面接し、必要に応じてサービス担当者会議等を開催し、上記について確認を行います。その上で、モニタリング報告書を作成し、内容について、利用者等に説明を行った上で、本人署名による同意を得ることが必要です。そして、本人や求めがあったサービス提供事業所に写しを交付し、区役所へも提出を行います。"},{"s":"r8","p":98,"h":"【参考】国が示すモニタリング実施標準期間","t":"【参考】国が示すモニタリング実施標準期間対象者期間新規サービス利用者１か月毎※利用開始から３月のみ在宅の障害福祉サービス集中的に支援が必要な者１か月毎就労定着支援、自立生活援助、日中サービス支援型共同生活援助３か月毎居宅介護、行動援護、同行援護、重度訪問介護、短期入所、就労移行支援、自立訓練３か月毎生活介護、就労継続支援、共同生活援助（日中支援型を除く）、地域移行支援、地域定着支援６か月毎※65歳以上でケアマネを利用していない者は３か月毎障害者支援施設、のぞみの園、療養介護入所者、重度障害者等包括支援６ケ月毎"},{"s":"r8","p":99,"h":"モニタリング設定上の留意点※業務ガイドラインP.31、48","t":"モニタリング設定上の留意点※業務ガイドラインP.31、48•福祉サービスで１年更新のものと３年更新のサービスを併用している場合には、１年更新のサービスの終了月を必ずモニタリング実施月として設定する必要があります（地域生活支援事業は対象外）。•サービス終了月（更新月）におけるモニタリングでは、モニタリング報告書とともに、モニタリングの結果を踏まえた新しいサービス等利用計画案を区役所に提出することが必要です。"},{"s":"r8","p":100,"h":"サービス更新月における区役所への書類提出について","t":"サービス更新月における区役所への書類提出について※業務ガイドラインP.48～サービス更新月（サービス終了月）は、更新手続きが必要なため、区役所へのモニタリング報告書及びサービス等利用計画案の提出が更新月の20日までとなっています。提出期限繰り上げに伴い、サービス更新月のモニタリングのみ、モニタリング実施月の前月20日以降のモニタリングが可能です。なお、繰り上げに伴い前月20～月末までに実施した場合も、「サービス利用支援費（計画作成費）」の請求は更新月のサービス提供分となります。期限を過ぎての書類提出は、受給者証発行の遅れにつながりますので、提出期限の厳守にご協力をお願いします。"},{"s":"r8","p":101,"h":"【運営指導での指摘】計画作成及びモニタリング共通","t":"【運営指導での指摘】計画作成及びモニタリング共通•計画作成時及びモニタリング実施時の利用者との面接を居宅等（現に日々の生活拠点としている場所）で実施していない•電話での聞き取りしか実施していない•サービス等利用計画案等における同意署名に不備がある•同意署名欄が空欄になっている•代筆の場合に代筆者氏名など必要な事項が記載されていない•サービス等利用計画案やモニタリング報告書の内容について、前回と変わっていない"},{"s":"r8","p":102,"h":"サービス等利用計画及びモニタリング報告書の様式について","t":"サービス等利用計画及びモニタリング報告書の様式について横浜市では、計画相談における「サービス等利用計画（案）」及び「週間計画表」、「モニタリング報告書」について、独自の様式を策定しています。これまで原則、横浜市様式での提出をお願いしておりましたが、事務負担の軽減を目的として、今後は、横浜市独自様式に限らず、必要項目を網羅している場合は、国様式等で作成されたサービス等利用計画案等での提出を可能としています。ただし、国様式等の利用は、「サービス等利用計画案」、「週間計画表（案）」、「サービス等利用計画」、「週間計画表（確定）」、「モニタリング報告書」のみとし、基礎調査資料はこれまで通り、横浜市様式により作成し提出してください。※平成30年４月改訂版から「平成」を削除するとともに、基礎調査資料を入力しやすいフォーマットに修正し、令和８年６月版に更新しました。【掲載場所】https://www.city.yokohama.lg.jp/business/bunyabetsu/fukushi\u0002kaigo/fukushi/service/soudan.html#yousiki"},{"s":"r8","p":103,"h":"モニタリングの追加について※業務ガイドラインP.42～","t":"モニタリングの追加について※業務ガイドラインP.42～モニタリング実施月以外にモニタリングが必要となった場合には、モニタリング追加依頼書で原則、追加する前月に手続きを行います。ただし、モニタリングの追加は、サービス等利用計画における「総合的な援助の方針」「長期目標」「短期目標」が大きく変わることが想定される場合やこれまでサービス等利用計画に記載されていなかった新たな「解決すべき課題」が生じた場合にのみ対象となります。緊急対応や日ごろの状況等の変化への対応については、基本相談支援の中で対応することが原則であり、モニタリングの追加は認められません。"},{"s":"r8","p":105,"h":"計画相談支援の報酬算定構造について","t":"計画相談支援の報酬算定構造について基本報酬•サービス利用支援費（計画作成費）•継続サービス利用支援費（モニタリング費）加算•体制加算（行動障害、要医療児者、精神障害者支援体制加算など）•その他の加算（初回加算、サービス提供時モニタリング加算、集中支援加算など）"},{"s":"r8","p":106,"h":"基本報酬について※業務ガイドラインP.107～","t":"基本報酬について※業務ガイドラインP.107～計画相談支援給付費の基本報酬は、サービス利用支援費（計画作成費）と継続サービス利用支援費（モニタリング費）の２種類です。この２種類にそれぞれ、機能強化型と呼ばれる（Ⅰ）～（Ⅳ）の区分があり、それぞれ報酬単価が異なります。計画作成費単位/月モニタリング費単位/月サービス利用支援費（Ⅰ） 1,572単位継続サービス利用支援費（Ⅰ） 1,308単位サービス利用支援費（Ⅱ） 732単位継続サービス利用支援費（Ⅱ） 606単位機能強化型サービス利用支援費（Ⅰ） 2,014単位継続機能強化型サービス利用支援費（Ⅰ） 1,761単位機能強化型サービス利用支援費（Ⅱ） 1,914単位継続機能強化型サービス利用支援費（Ⅱ） 1,661単位機能強化型サービス利用支援費（Ⅲ） 1,822単位継続機能強化型サービス利用支援費（Ⅲ） 1,558単位機能強化型サービス利用支援費（Ⅳ） 1,672単位継続機能強化型サービス利用支援費（Ⅳ） 1,408単位"},{"s":"r8","p":107,"h":"基本報酬について※業務ガイドラインP.118～","t":"基本報酬について※業務ガイドラインP.118～計画相談支援と障害児相談支援の両方を一体的に実施している利用者については、報酬算定は障害児相談支援のみとなります。ひと月に計画作成とモニタリングを両方行った場合は、原則、計画作成費（サービス利用支援費）のみの請求となります。こちらのみ請求障害児相談＋計画相談計画作成＋モニタリングこちらのみ請求"},{"s":"r8","p":108,"h":"※業務ガイドラインP.118～","t":"※業務ガイドラインP.118～国QA（問69）障害児通所支援から障害福祉サービス等に利用するサービス等が切り替わる際に、障害児相談支援の支給期間の終期月に指定障害児相談支援事業者が障害児相談支援対象保護者に対して継続障害児支援利用援助を行い、同一の月に、指定特定相談支援事業者が計画相談支援対象障害者に対してサービス利用支援を行った場合、指定障害児相談支援事業者が継続障害児支援利用援助費を、指定特定相談支援事業者がサービス利用支援費を算定することは可能か。→報酬告示において「障害児相談支援対象保護者に対して、指定計画相談支援を行った場合には、所定単位数を算定しない。」とされているため、同一月に指定特定相談支援事業者がサービス利用支援費を算定することはできない。（報酬告示１の注４参照）したがって、サービス等利用計画を作成し、利用者から文書による同意を得る日を、障害児相談支援の支給期間の終期月の翌月に属する日とすること。なお、この取扱いについては、指定障害児相談支援事業者から指定特定相談支援事業者へケースを引き継ぐ場合も、指定障害児相談支援事業者と指定特定相談支援事業者の両方の指定を受けている事業者がケースを受け持つ場合も同じである。"},{"s":"r8","p":109,"h":"基本報酬について","t":"基本報酬について【運営指導での指摘】•計画作成費とモニタリング費がダブルで請求されている•更新月等、モニタリングと計画作成した際に、両方の給付費を請求している参考：国QA問59抜粋Q 計画相談支援給付費の算定に当たっての基本的な考え方如何。A 同一の月に継続サービス利用支援を行った後に、サービス利用支援を行った場合は、継続サービス利用支援費は算定せず、サービス利用支援費のみを算定する。例９月モニタリング実施モニタリング費を請求12月モニタリング実施モニタリング費を請求３月（更新月）モニタリング、計画作成実施計画作成費のみ請求"},{"s":"r8","p":110,"h":"基本報酬について","t":"基本報酬について【運営指導での指摘】・計画作成費の算定月（サービス提供月）の誤り例：４月に計画案の作成し５月に計画を確定させて場合に本来であれば４月サービス提供分として請求するところ、５月サービス提供分として請求している（請求作業を行うのは計画を確定させてからとなるがサービス提供月はあくまで計画案を作成した月となります。）・取扱件数（所定の計算をした上での請求件数）が40以上なのに（継続）サービス利用支援費（Ⅱ）で算定していない"},{"s":"r8","p":111,"h":"機能強化型サービス利用支援費について※業務ガイドラインP.109～","t":"機能強化型サービス利用支援費について※業務ガイドラインP.109～機能強化型（継続）サービス利用支援費とは、支援困難ケースへの積極的な対応を行うほか、専門性の高い人材を確保し、質の高いマネジメントを実施している事業所を評価し、地域全体のマネジメントの質の向上に資することを目的としています。算定するためには、各区分で定められている、人員配置要件並びに会議を定期的に開催していることや研修実施、困難ケースの受入、基幹相談支援センター等との連携などが求められています。なお、一事業所で要件を満たすことが難しい場合は、常勤かつ専従の相談支援専門員を１名以上配置した上で地域生活支援拠点等を構成する複数事業所による協働体制により要件を満たし算定することも可能です。"},{"s":"r8","p":112,"h":"機能強化型サービス利用支援費について","t":"機能強化型サービス利用支援費について機能強化型（継続）サービス利用支援費は、各区分によって人員配置要件と下記の体制要件の一部または全部を満たさなければなりません。【体制要件】①利用者等に係る伝達等を目的とした会議の定期的な実施② 24時間連絡体制の確保③協議会への参画④基幹相談支援センターによる取組への参画⑤現任研修修了相談支援専門員の同行による新採用相談員研修実施⑥積極的に支援困難ケースを受け入れるとともに、基幹相談支援センターや自立支援協議会と連携し、紹介されたケースの受入実施⑦基幹相談支援センター等が実施する事例検討会等への参加⑧取扱件数が40件未満であること"},{"s":"r8","p":113,"h":"機能強化型（Ⅰ）について","t":"機能強化型（Ⅰ）について体制要件①～⑧に加え、常勤・専従の相談支援専門員を４名以上配置し、そのうち１名以上が現任研修を修了した相談支援専門員であることが必要です。常勤・専従常勤・専従常勤・専従常勤・専従現任研修修了者同一敷地内の別事業兼務可能（要時間切分）同一敷地内の指定障害児、指定一般相談支援、指定自立生活援助事業所兼務可能A B C D"},{"s":"r8","p":114,"h":"機能強化型（Ⅱ）（Ⅲ）（Ⅳ）について※業務ガイドラインP.114","t":"機能強化型（Ⅱ）（Ⅲ）（Ⅳ）について※業務ガイドラインP.114※１：障害児相談支援、地域相談支援、自立生活援助事業※２：障害者総合支援法及び児童福祉法等に基づくサービスなど体制要件人員配置機能強化型（Ⅱ）①～⑧常勤・専従の相談支援専門員を３名以上配置、そのうち１名以上が現任研修修了者兼務については、現任研修修了者を含む２名は同一敷地内の相談事業（※１）について同時並行的な兼務が可能残りの１名は同一敷地内の別事業（※２）について時間を切り分けたうえで兼務が可能機能強化型（Ⅲ）①、③～⑧常勤・専従の相談支援専門員を２名以上配置、そのうち１名以上が現任研修修了者兼務については、現任研修修了者１名は同一敷地内の相談事業（※１）について同時並行的な兼務が可能残りの１名は同一敷地内の別事業（※２）について時間を切り分けたうえで兼務が可能機能強化型（Ⅳ）①、⑤～⑧専従の相談支援専門員を２名以上配置、そのうち１名以上が常勤の現任研修修了者"},{"s":"r8","p":115,"h":"機能強化型による基本報酬の増加金額について","t":"機能強化型による基本報酬の増加金額についてパターンサービス利用支援費継続サービス利用支援費なし（Ⅰ）→Ⅰ 442単位（4,844円増） 453単位（4,964円増）Ⅱ 342単位（3,748円増） 353単位（3,868円増）Ⅲ 250単位（2,740円増） 250単位（2,740円増）Ⅳ→Ⅰ 342単位（3,748円増） 353単位（3,868円増）Ⅱ 242単位（2,652円増） 253単位（2,772円増）Ⅲ１50単位（1,644円増）１50単位（1,644円増）Ⅲ→Ⅰ 192単位（2,104円増） 203単位（2,224円増）Ⅱ 92単位（1,008円増） 103単位（1,128円増）Ⅱ→Ⅰ 100単位（1,096円増） 100単位（1,096円増）※単位及び金額は一人当たりの１月分"},{"s":"r8","p":116,"h":"複数事業所の協働体制による機能強化型について","t":"複数事業所の協働体制による機能強化型について機能強化型（継続）サービス利用支援費（Ⅰ）～（Ⅲ）について、複数の指定特定相談支援事業所が協働して要件を満たすことでも算定することができます。Ａ相談支援事業所一人事業所では加算が取れない…Ａ相談事業所Ｂ相談事業所協働体制を組むことで…基本報酬アップ！ＡもＢ事業所も機能強化型を算定！"},{"s":"r8","p":117,"h":"複数事業所の協働体制による機能強化型について","t":"複数事業所の協働体制による機能強化型について機能強化型（Ⅰ）～（Ⅲ）については、地域生活支援拠点等を構成する複数の指定特定相談支援事業所と協働して、体制の確保や質の向上に向けた取組をし、人員配置要件や24時間の連絡体制確保要件（Ⅰ・Ⅱのみ）を満たす場合も算定することが可能です。（＝協働体制）協働体制により算定する場合は通常の機能強化型算定要件に加え、下記の体制要件を満たさなければなりません。【協働体制要件】①協働体制を確保する事業所間で、協定を締結②機能強化型算定要件を満たしていることを事業所間で定期的に確認③全職員が参加するケース共有会議や事例検討会等を月2回以上実施（テレビ電話等の活用可）④運営規程に地域生活支援拠点等として位置付けられていることを規定⑤各事業所において常勤・専従の相談支援専門員を1名以上配置"},{"s":"r8","p":118,"h":"協働体制による機能強化型（Ⅰ）イメージ","t":"協働体制による機能強化型（Ⅰ）イメージ要件①～⑧、人員配置要件に加え、協働体制要件①～⑤を満たす必要があります。常勤・専従Ａ※それぞれの事業所において常勤かつ専従の相談支援専門員を１名以上配置することが必要Ｂ常勤・専従相談支援事業所ＡＣＤ非常勤・専従Ｅ常勤・専従常勤・専従相談支援事業所Ｂ相談支援事業所Ｃ相談支援事業所Ｄ現任研修修了者協定締結"},{"s":"r8","p":119,"h":"複数事業所の協働体制による機能強化型について","t":"複数事業所の協働体制による機能強化型について協働体制を組むことができるのは、地域生活支援拠点を構成する指定特定相談支援事業所又は、「地域生活支援拠点等の拠点関係機関との連携体制を確保するとともに、協議会に定期的に参画していること」とされています。横浜市では、地域生活支援拠点について区ごとで面的に整備を行っているため、原則、区内の事業所同士で協働体制を組むことになります。また、協働体制を組む各事業所の運営規程には、それぞれ「地域生活支援拠点として位置づけられている」ことを規定する必要があります。※地域生活支援拠点とは、①相談、②緊急時の受入れ・対応、③体験の機会・場の提供、④専門的人材の確保・養成等の４つの機能で、障害のある方を地域全体で支えるサービス提供体制のことを指します。"},{"s":"r8","p":120,"h":"ポイント①：協定について","t":"ポイント①：協定について協働体制を確保する事業所間で締結する協定は、少なくとも下記の事項を含まなければなりません。①協定の締結年月日、有効期間②協定を締結する事業所名③協定の目的④協働により確保する体制の内容⑤協働体制が維持されていることの確認方法⑥協働する事業所の義務⑦協定が無効や解除となる場合の事由や措置⑧秘密保持※業務内容の分担等については、明確にするとともに、特定の事業所に対して過重な負担とならないよう十分に協議を行ってください。"},{"s":"r8","p":121,"h":"ポイント②：その他","t":"ポイント②：その他•体制届は事業所ごとに提出しなければなりません。（協働体制単位でまとめて一つではありません。）•日本相談支援専門員協会がホームページに協定書のひな形を掲載しているのでご参考ください。【ひな形掲載場所】日本相談支援専門員協会ホームページ資料＞「NSK版指定特定相談支援事業所間一体的運営のための協議書案」https://nsk2009.org/?p=604•協働体制の事業所間で相談支援専門員の融通はできません。"},{"s":"r8","p":122,"h":"協働体制による機能強化型のメリットとデメリット","t":"協働体制による機能強化型のメリットとデメリット機能強化型サービス利用支援費を協働体制により算定する場合に、事業所において想定されるメリットとデメリットは下記の通りです。【メリット】•基本報酬の金額アップ• 24時間連絡体制の確保を輪番等で行うことによる負担軽減•支援困難ケース等について、共有・相談先の確保•協働する事業所間で相互に苦情相談窓口を担うこと等が可能【デメリット】•協働する事業所間での会議等の増加•協働する他事業所の人員配置変更等に影響を受ける可能性がある"},{"s":"r8","p":123,"h":"従たる事業所を設置する場合における特例※業務ガイドラインP.82～","t":"従たる事業所を設置する場合における特例※業務ガイドラインP.82～指定特定相談支援事業者の指定は、原則として指定計画相談支援の提供を行う事業所ごとに行うものですが、次の①及び②の要件を満たす場合については、「主たる事業所」のほか、一体的かつ独立したサービス提供の場として、一又は複数の「従たる事業所」を設置することが可能であり、これらを一の事業所として指定することができます。①人員及び設備に関する要件ア「従たる事業所」において専従の従業者が１人以上確保されていること。イ「主たる事業所」と「従たる事業所」との間の距離がおおむね30分以内で移動可能な距離であって、相談支援専門員の業務の遂行上支障がないこと。ウ利用者の支援に支障がない場合には、基準に定める設備の全部又は一部を設けないこととしても差し支えないこと。"},{"s":"r8","p":124,"h":"従たる事業所を設置する場合における特例","t":"従たる事業所を設置する場合における特例②運営に関する要件ア利用申込みに係る調整、職員に対する技術指導等が一体的に行われること。イ職員の勤務体制、勤務内容等が一元的に管理されていること、必要な場合には随時、主たる事業所と従たる事業所との間で相互支援が行える体制（例えば、当該従たる事業所の従業者が急病の場合等に、主たる事業所から急遽代替要員を派遣できるような体制）にあること。ウ苦情処理や損害賠償等に際して、一体的な対応ができる体制にあること。エ事業の目的や運営方針、営業日や営業時間、利用料等を定める同一の運営規程が定められていること。オ人事・給与・福利厚生等の勤務条件等による職員管理が一元的に行われるとともに、主たる事業所と当該従たる事業所間の会計が一元的に管理されていること。"},{"s":"r8","p":125,"h":"加算について","t":"加算について体制加算•行動障害、要医療児者、精神障害者、高次脳機能障害者支援体制加算•ピアサポート体制加算、主任相談支援専門員配置加算その他の加算•初回加算、サービス提供時モニタリング加算、集中支援加算•サービス担当者会議実施加算、医療・保育・教育機関等連携加算など要件を満たし体制届の事前提出必須！（毎月15日まで）その上で算定可能！要件を満たした上で算定可能！"},{"s":"r8","p":126,"h":"体制加算について","t":"体制加算について体制加算を算定するためには、各加算で定められている研修を修了した相談支援専門員等の配置や各種要件を満たす必要があります。また、各障害特性を有する者から利用申込があった場合に、対応できないことを理由にサービスの提供を拒むことは認められません。加算名単位/月行動障害支援体制加算対象者あり：（Ⅰ）60単位対象者なし：（Ⅱ）30単位要医療児者支援体制加算精神障害者支援体制加算高次脳機能障害者支援体制加算ピアサポート体制加算 100単位主任相談支援専門員配置加算中核的な役割：（Ⅰ）300単位上記以外：（Ⅱ）100単位"},{"s":"r8","p":127,"h":"行動障害支援体制加算、要医療児者支援体制加算、","t":"行動障害支援体制加算、要医療児者支援体制加算、精神障害者支援体制加算、高次脳機能障害者支援体制加算（Ⅰ）60単位/月※業務ガイドラインP.125～研修を修了した相談支援専門員を配置し、対象者に対して現に指定計画相談支援を行っている場合に算定が可能です。なお、配置しているのみで、支援しているケースがいない場合は、（Ⅱ）を算定します。国QA（R6）VOL.1 問72行動障害者支援体制加算・要医療児者支援体制加算・精神障害者支援体制加算・高次脳機能障害支援体制加算（Ⅰ）を算定できるのは、各加算で対象者と規定する利用者のみか。また、研修修了者が計画相談支援を行った利用者に対してのみ、（Ⅰ）の区分での算定可能か。→各種支援体制加算（Ⅰ）の要件を満たす場合、全ての利用者の基本報酬について加算されるものである。また、要件を満たすためには、研修修了者が各種支援体制加算で対象者と規定する利用者に対して支援を行う必要がある。10名の基本報酬に対して60単位の加算可例：事業所内に行動障害支援体制加算の対象者が１名おり、支援を行っている。行動障害支援体制加算の対象でない利用者が９名いる場合。"},{"s":"r8","p":128,"h":"行動障害支援体制加算、要医療児者支援体制加算、","t":"行動障害支援体制加算、要医療児者支援体制加算、精神障害者支援体制加算、高次脳機能障害者支援体制加算（Ⅰ）60単位/月（Ⅱ）30単位/月※業務ガイドラインP.125～•（Ⅰ）を算定する場合は、対象者に対して現に指定計画相談支援を行っていることを要件としていますが、「現に指定計画相談支援を行っている」とは、前6月に、対象者に対して指定計画相談支援を行っていることであり、研修修了後すぐの算定は（Ⅱ）となります。•誤って（Ⅰ）を算定してしまった場合は、速やかに以下の通り対応をお願いします。例）８月１日に研修修了して、11月から（Ⅰ）を算定した場合1. 体制届を同時に２通提出する。2. １通目：11月～１月は「Ⅱ」であることを記載した体制届を提出する。3. ２通目：２月以降は「Ⅰ」であることを記載した体制届を提出する。4. 体制届の提出が完了した後、11月～１月分を過誤し、Ⅱで再請求する。"},{"s":"r8","p":129,"h":"行動障害支援体制加算、要医療児者支援体制加算、","t":"行動障害支援体制加算、要医療児者支援体制加算、精神障害者支援体制加算、高次脳機能障害者支援体制加算（Ⅰ）60単位/月（Ⅱ）30単位/月※業務ガイドラインP.125～"},{"s":"r8","p":130,"h":"常勤の相談支援専門員の配置が算定要件となっている","t":"常勤の相談支援専門員の配置が算定要件となっている体制加算の取扱いついて「常勤の相談支援専門員」の配置が算定要件となっている以下の加算について、計画相談支援に従事している時間が、事業所等において定められている常勤の従業者が勤務すべき時間数※に達しているか否かで判断することとします。※１週間に勤務すべき時間数が32時間を下回る場合は32時間とする加算名行動障害支援体制加算要医療児者支援体制加算精神障害者支援体制加算高次脳機能障害者支援体制加算"},{"s":"r8","p":131,"h":"ピアサポート体制加算について 100単位/月","t":"ピアサポート体制加算について 100単位/月※業務ガイドラインP.131～障害者ピアサポート研修の基礎研修及び専門研修を修了した次の者をそれぞれ常勤換算方法で0.5以上配置する事業所であって、当該者によりその他の従業者に対して障害者に対する配慮等に関する研修が年１回以上行われている場合に算定することができる。1. 障害者又は障害者であったと市町村長が認める者（以下、「障害者等」という。）であって、相談支援専門員又はその他指定計画相談支援に従事する者2. 管理者、相談支援専門員、相談支援員又はその他指定計画相談支援に従事する者国QA（R6）VOL.1 問８加算の算定に当たっては、障害者ピアサポート研修修了者である障害者等又は事業所の職員が、当該事業所の従業者に対し、障害者に対する配慮等に関する研修を年１回以上行うこととされているが、１つの事業所における従業者が障害者ピアサポート研修修了者である障害者等と事業所の従業者の２名のみである場合や、障害者ピアサポート研修修了者である障害者等が管理者及び相談支援専門員の業務を兼務し、他の従業者がいない場合においては、加算を算定できないのか。"},{"s":"r8","p":131,"h":"ピアサポート体制加算について 100単位/月","t":"→以下の形式による研修を実施した場合には算定可能である。・指定基準の規定により配置すべき従業者以外の従業者（事務職員等）への研修・従業者が２名のみである場合は、それぞれの従業者を互いに対象とした研修・従業者が１名のみである場合は、振り返りのための自習"},{"s":"r8","p":132,"h":"主任相談支援専門員配置加算（Ⅰ）について 300単位/月","t":"主任相談支援専門員配置加算（Ⅰ）について 300単位/月※業務ガイドラインP.132～主任相談支援専門員配置加算（Ⅰ）を取得する場合は、対象事業所の要件を事前に確認しますので、障害施策推進課相談支援推進係にご相談ください。①地域の相談支援の中核を担う機関として市町村長が認める指定特定（障害児）相談支援事業所である。【対象事業所の要件】主任相談支援専門員が、以下のいずれかの役割を担っている場合・市自立支援協議会や市の設置する検討会の委員を担っている。・相談支援従事者初任者研修又は現任研修の企画委員又は講師を担っている。・県域・市域の研修（相談支援研修Ⅰ、虐待防止研修等）の講師を担っている。・基幹の実施する事業所訪問や相談支援従事者向けの研修会の企画運営を実施していることを区自立支援協議会から認められている。②～⑤省略（相談支援専門員の資質の向上のための指導及び助言を行う体制の整備など）"},{"s":"r8","p":133,"h":"その他加算について","t":"その他加算について加算名単位初回加算 300単位/月退院・退所加算 300単位/月医療・保育・教育機関等連携加算面談・会議（計画作成）200単位/月（モニタリング）300単位/月通院同行 300単位/月情報提供 150単位/月サービス担当者会議実施加算 100単位/月入院時情報連携加算入院時情報連携加算（Ⅰ） 300単位/月入院時情報連携加算（Ⅱ） 150単位/月居宅介護支援事業所等連携加算情報提供以外 300単位/月情報提供 150単位/月"},{"s":"r8","p":134,"h":"その他加算について","t":"その他加算について加算名単位サービス提供時モニタリング加算 100単位/月集中支援加算訪問・会議開催・参加 300単位/月通院同行 300単位/月情報提供 150単位/月地域生活支援拠点等相談強化加算 700単位/回地域体制強化共同支援加算 2,000単位/回地域生活支援拠点等機能強化加算 500単位/回利用者負担上限額管理加算 150単位/回"},{"s":"r8","p":135,"h":"初回加算について 300単位/月（障害児は500単位/月）","t":"初回加算について 300単位/月（障害児は500単位/月）※業務ガイドラインP.136～初回加算は下記のような場合に算定が可能です。①新規にサービス等利用計画を作成する者に対して指定サービス利用支援を行った場合②サービス等利用計画を作成する月の前６月間において、障害福祉サービス又は地域相談支援を利用していない者に対して指定サービス利用支援を行った場合③計画相談に係る契約をした日からサービス等利用計画案を交付した日までの期間が３ヶ月を超える場合であって、３ヶ月が経過する日以後に月２回以上、利用者の居宅等に訪問し面接を行った場合（月１回訪問した場合、残り１回はテレビ電話装置等のオンライン可）"},{"s":"r8","p":136,"h":"初回加算について","t":"初回加算について•①と②の併給はできません。•③を算定する場合は、最大３回算定することが可能です。•①と③又は②と③の要件を満たす場合は、合算することができ、合計で最大１月に４回を限度として算定することが可能です。【運営指導での指摘】•別の計画相談支援事業所からの引継ぎの場合にも算定している•障害福祉サービス又は地域相談支援の利用が６か月以内にあるにもかかわらず算定している•①と②の要件を満たしているからといって２回分算定している"},{"s":"r8","p":137,"h":"入院時情報連携加算について","t":"入院時情報連携加算について（Ⅰ）300単位/月（Ⅱ）150単位/月※業務ガイドラインP.141～利用者が病院又は診療所に入院するに当たり、当該病院等の職員に対して、利用者の心身の状況や生活環境等の必要な情報（※）を提供した場合は、提供方法に応じて所定単位数を算定が可能です。※「必要な情報」とは、基本情報、利用者の状態、支援における留意点等、家族・世帯の状況、生活の状況、受診・服薬の状況等をいいます。種類内容単位入院時情報連携加算（Ⅰ）医療機関へ出向いて、当該医療機関の職員と面談し、必要な情報を提供した場合 300単位/月入院時情報連携加算（Ⅱ）（Ⅰ）以外の方法により、必要な情報を提供した場合 150単位/月"},{"s":"r8","p":138,"h":"入院時情報連携加算について","t":"入院時情報連携加算について情報提供の方法として、サービス等利用計画や国が示す「入院時情報提供書」等の活用が考えられます。【入院時情報提供書の掲載場所】厚生労働省ホームページ「令和６年度障害福祉サービス等報酬改定について」＞通知・事務連絡＞その他＞入院時情報提供書・様式https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000202214_00009.html【運営指導での指摘】・退院に向けた会議や病院等から状況を聞き取りした場合に算定している"},{"s":"r8","p":139,"h":"居宅介護支援事業所等連携加算について","t":"居宅介護支援事業所等連携加算について150単位/月又は300単位/月※業務ガイドラインP.142～利用者が介護保険へ移行する場合又は通常の事業所に新たに雇用される場合（※１）に、居宅等を訪問し面接（※２）した場合や、居宅介護支援事業所又は介護予防支援事業所、障害者就業・生活支援センター（※３）又は通常の事業所の事業主が開催する会議に参加した場合や、当該機関へ情報提供した場合に、それぞれ所定単位数を算定が可能です。※１利用を終了した日から起算して６月以内において加算可※２月１回訪問した場合、残り１回はテレビ電話装置等のオンライン可※３横浜市障害者就労支援センターを含む【運営指導での指摘】・障害者総合支援法における居宅介護事業所（ヘルパー事業所）と連携した場合に算定している当該加算で対象となるのは「居宅介護支援事業所（ケアマジャー）」であり、ヘルパー事業所への情報提供や会議参加は対象外"},{"s":"r8","p":140,"h":"サービス提供時モニタリング加算について","t":"サービス提供時モニタリング加算について100単位/月※業務ガイドラインP.145～サービス等利用計画に位置付けられた障害福祉サービス等（障害福祉サービス又は地域相談のみ）を提供する事業所又は提供場所を訪問し、サービス提供場面を直接確認することにより、サービスの提供状況について詳細に把握し、確認結果の記録を作成した場合に算定が可能です。１人の相談支援専門員がひと月に請求できる件数の上限は39件で、兼務先の事業所のサービス提供時は算定できません。【運営指導での指摘】・地域生活支援事業や市単事業のサービス提供を確認した場合に算定している"},{"s":"r8","p":141,"h":"集中支援加算について※業務ガイドラインP.146～","t":"集中支援加算について※業務ガイドラインP.146～基本報酬算定月以外で、下記のいずれか（①～⑤）に該当する場合に算定することができます。①利用者又は市町村等の求めに応じて月２回以上、居宅等を訪問し利用者及び家族に面談する場合 [300単位/月]②サービス担当者会議を開催し、サービス等利用計画の変更その他の事項について検討を行う場合（利用者参加必須）[300単位/月]③福祉サービス等を提供する機関等の求めに応じ、当該関係機関が開催する会議に参加し、連絡調整を行った場合[300単位/月]【運営指導での指摘】・①において居宅等ではなく、サービス提供事業所等で面談している"},{"s":"r8","p":142,"h":"集中支援加算について","t":"集中支援加算について④利用者が病院等に通院するに当たり、病院等を訪問し、当該病院等の職員に対して利用者の心身の状況、生活環境等の利用者に係る必要な情報を提供した場合[300単位/月]⑤福祉サービス等提供機関からの求めに応じて利用者に関する必要な情報を提供した場合[150単位/月]【留意事項】・④については、単に利用者の病院等への通院に同行するのでは不可"},{"s":"r8","p":143,"h":"医療・保育・教育機関等連携加算について","t":"医療・保育・教育機関等連携加算について※業務ガイドラインP.138～基本報酬算定月に、下記のいずれかに該当する場合に算定することができます。①障害福祉サービス等以外の福祉サービス等提供機関の職員との面談又は会議により、利用者に関する必要な情報の提供を受けた上で指定サービス利用支援又は指定継続サービス利用支援を行った場合[計画作成月：200単位/月][モニタリング月：300単位/月]②利用者が病院等に通院するに当たり、病院等を訪問し、当該病院等の職員に対して利用者に係る必要な情報を提供した場合 [300単位/月]③福祉サービス等提供機関からの求めに応じて利用者に関する必要な情報を提供した場合 [150単位/月]"},{"s":"r8","p":144,"h":"各種加算の算定に当たって","t":"各種加算の算定に当たって•各種加算には、要件や加算の趣旨があります。算定される際は必ず確認し、加算の趣旨をしっかりと理解した上で要件を満たす動きをしてください。•各種加算には挙証資料として、必要な事項を網羅した記録の作成が求められています。こちらも各加算においてどういった記録を残さなければならないかをしっかりと確認して記録を作成してください。なお、加算の記録については、基準省令第30条第２項に定める記録に必要事項の記載がある場合は、別途記録を作成する必要ありません。"},{"s":"r8","p":147,"h":"各種加算の算定に当たって","t":"各種加算の算定に当たって【運営指導での指摘】•各種加算の要件を満たしている記録が作成されていない（実際に支援を行った場合でも記録がない場合は過誤申立の対象となります。）•そもそも記録が何も作成されていない•各加算で定められている記録事項が網羅されていない•種類の異なる加算の記録が一緒になっており、見分けがつかない•加算の趣旨を理解していなかったり、要件を満たしていないのに算定されている"},{"s":
